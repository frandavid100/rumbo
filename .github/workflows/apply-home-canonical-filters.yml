name: Apply home canonical filters

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/carrefour-role-filters-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/carrefour-role-filters-ui
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply_home_canonical_filters.py
      - run: |
          rm tools/apply_home_canonical_filters.py .ci-role-filter-trigger
          rm .github/workflows/apply-home-canonical-filters.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unificar filtros de búsqueda por comercio y roles"
          git push origin HEAD:agent/carrefour-role-filters-ui
