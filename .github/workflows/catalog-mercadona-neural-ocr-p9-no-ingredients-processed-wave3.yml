name: Catalog Mercadona neural OCR p9 no-ingredients processed wave3

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-neural-ocr-p9-no-ingredients-processed-wave3.yml'
      - 'tools/catalog/audit_mercadona_p9_no_ingredients_processed_candidates.py'
      - 'tools/catalog/test_audit_mercadona_p9_no_ingredients_processed_candidates.py'
      - 'tools/catalog/mercadona_neural_ocr_wave.py'
      - 'tools/catalog/nutrition_label_reader.py'
      - 'tools/catalog/nutrition_ocr_ensemble.py'
      - 'tools/catalog/nutrition_visual_table_detector.py'
      - 'tools/catalog/mercadona_label_pipeline.py'
      - 'tools/catalog/mercadona_nutrition_reader.py'
      - 'tools/catalog/mercadona_nutrition_label_structural_repair.py'
      - 'tools/catalog/label_neural_extractor.py'
      - 'tools/catalog/label_easyocr_extractor.py'
      - 'tools/catalog/label_text_extractor.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-neural-ocr-p9-no-ingredients-processed-wave3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download current Mercadona first-party metadata snapshot
        uses: actions/download-artifact@v4
        with:
          name: mercadona-first-party-final
          path: tools/catalog/mercadona-first-party-current
          repository: frandavid100/rumbo
          github-token: ${{ github.token }}
          run-id: 34449270667

      - name: Install independent OCR engines and visual detector dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow

      - name: Run conservative routing and OCR regression tests
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_audit_mercadona_p9_no_ingredients_processed_candidates.py \
            test_label_easyocr_extractor.py \
            test_nutrition_label_reader.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_ocr_safety_regressions.py
          python -m py_compile \
            audit_mercadona_p9_no_ingredients_processed_candidates.py \
            mercadona_neural_ocr_wave.py \
            mercadona_nutrition_reader.py \
            mercadona_nutrition_label_structural_repair.py

      - name: Rebuild exact historical wave3 window from current first-party metadata
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from audit_mercadona_p9_no_ingredients_processed_candidates import candidate_payload

          source = Path('mercadona-first-party-current/products.jsonl')
          rows = [json.loads(line) for line in source.read_text(encoding='utf-8').splitlines() if line.strip()]
          if len(rows) != 4256:
              raise SystemExit(f'current first-party snapshot drifted: expected 4256, got {len(rows)}')

          prior_ids = [
              '10642', '11925', '13042', '13847', '14173', '14313', '14354', '14934',
              '14981', '15647', '15648', '15700', '17462', '18037', '18817', '19940',
              '19975', '21649', '21986', '22879', '23561', '24543', '31540', '51198',
              '5250', '52774', '5561', '58274', '58278', '58280', '59364', '60095',
              '60128', '60212', '60384', '60710', '61371', '62048', '65143', '67968',
              '7878', '7879', '80531', '86117', '86328', '86632', '8946', '9792',
          ]
          expected_ids = [
              '5546', '12960', '24708', '10414', '13250', '86168', '37417', '23410',
              '8687', '14239', '58298', '9891', '60093', '86631', '17578', '65138',
              '14474', '84638', '52921', '60127', '19817', '52859', '11740', '8915',
              '86840', '8804', '24541', '13846', '60226', '9571', '3362', '12846',
          ]
          if len(set(prior_ids)) != 48 or len(set(expected_ids)) != 32 or set(prior_ids) & set(expected_ids):
              raise SystemExit('embedded historical cohort IDs are internally inconsistent')

          by_id = {str(row.get('product_id') or ''): row for row in rows}
          if len(by_id) != len(rows):
              raise SystemExit('duplicate product_id in current first-party snapshot')

          selected = []
          missing = []
          no_longer_eligible = []
          for product_id in expected_ids:
              row = by_id.get(product_id)
              if row is None:
                  missing.append(product_id)
                  continue
              payload = candidate_payload(row)
              if payload is None:
                  no_longer_eligible.append(product_id)
                  continue
              selected.append(payload)

          if missing or no_longer_eligible or len(selected) != 32:
              raise SystemExit(
                  f'historical/current compatibility failed: missing={missing} '
                  f'no_longer_eligible={no_longer_eligible} selected={len(selected)}'
              )

          Path('mercadona-p9-no-ingredients-processed-wave3-candidates.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in selected),
              encoding='utf-8',
          )
          window = {
              'selection_policy': 'HISTORICAL_WAVE3_IDS_WITH_CURRENT_FIRST_PARTY_IMAGE_METADATA',
              'historical_inventory_products': 4280,
              'historical_candidate_universe': 89,
              'historical_source_run_id': 33046950149,
              'historical_source_artifact_expired': True,
              'historical_wave3_reference_run_id': 34415879488,
              'historical_wave3_reference_artifact_id': 10129873874,
              'prior_processed_count': 48,
              'remaining_before_wave3': 41,
              'wave3_selected': 32,
              'wave3_original_sorted_index_start': 48,
              'wave3_original_sorted_index_end': 79,
              'remaining_after_wave3': 9,
              'prior_ids': prior_ids,
              'expected_wave3_ids': expected_ids,
              'current_metadata_snapshot_run_id': 34449270667,
              'current_metadata_snapshot_products': 4256,
              'current_metadata_role': 'IMAGE_URL_AND_PRODUCT_METADATA_ONLY_DO_NOT_REBASE_CANONICAL_INVENTORY',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'redistribution_allowed': False,
              'images_persisted': False,
              'missing_values_inferred': False,
              'structured_api_macros_claimed': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          Path('mercadona-p9-no-ingredients-processed-wave3-window.json').write_text(
              json.dumps(window, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(window, ensure_ascii=False, indent=2))
          PY

      - name: OCR exact historical 32-product wave
        working-directory: tools/catalog
        run: |
          python mercadona_neural_ocr_wave.py \
            --products mercadona-p9-no-ingredients-processed-wave3-candidates.jsonl \
            --out mercadona-neural-ocr-p9-no-ingredients-processed-wave3 \
            --eligibility-mode p9-no-ingredients-all \
            --shard-index ${{ matrix.shard }} \
            --shard-count 8 \
            --limit 4 \
            --delay 0.5

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-neural-ocr-p9-no-ingredients-processed-wave3-${{ matrix.shard }}
          path: |
            tools/catalog/mercadona-neural-ocr-p9-no-ingredients-processed-wave3/
            tools/catalog/mercadona-p9-no-ingredients-processed-wave3-window.json
          retention-days: 30
          if-no-files-found: warn

  merge:
    runs-on: ubuntu-24.04
    needs: ocr
    if: ${{ always() && needs.ocr.result == 'success' }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mercadona-neural-ocr-p9-no-ingredients-processed-wave3-*
          path: input
          merge-multiple: true

      - name: Merge and enforce unchanged DECLARED contract
        run: |
          python - <<'PY'
          from collections import Counter
          import glob, json, sqlite3
          from pathlib import Path

          rows = []
          for path in sorted(glob.glob('input/**/results-*.jsonl', recursive=True)):
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  if line.strip():
                      rows.append(json.loads(line))

          window_paths = sorted(glob.glob('input/**/mercadona-p9-no-ingredients-processed-wave3-window.json', recursive=True))
          if not window_paths:
              raise SystemExit('missing deterministic wave3 window manifest')
          window = json.loads(Path(window_paths[0]).read_text(encoding='utf-8'))
          prior_ids = set(window['prior_ids'])
          expected_ids = set(window['expected_wave3_ids'])

          ids = [str(row.get('product_id') or '') for row in rows]
          id_set = set(ids)
          duplicate_ids = sorted(pid for pid, count in Counter(ids).items() if pid and count > 1)
          prior_overlap = sorted(id_set & prior_ids)
          missing_expected_ids = sorted(expected_ids - id_set)
          unexpected_ids = sorted(id_set - expected_ids)
          invalid_declared = []
          provenance_errors = []
          error_product_ids = []
          for row in rows:
              pid = str(row.get('product_id') or '')
              if row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE':
                  provenance_errors.append(pid)
              if row.get('source') != 'MERCADONA_FIRST_PARTY' or row.get('source_record_kind') != 'label image':
                  provenance_errors.append(pid)
              if row.get('redistribution_allowed') is not False:
                  provenance_errors.append(pid)
              if row.get('status') == 'ERROR':
                  error_product_ids.append(pid)
              if row.get('status') != 'DECLARED':
                  continue
              accepted = next(
                  (attempt for attempt in (row.get('attempts') or []) if (attempt.get('ensemble') or {}).get('status') == 'DECLARED'),
                  None,
              )
              ensemble = (accepted or {}).get('ensemble') or {}
              if (
                  int(ensemble.get('independent_engine_families') or 0) < 2
                  or int(ensemble.get('corroborated_fields') or 0) < 4
                  or ensemble.get('basis') not in {'100_g', '100_ml'}
              ):
                  invalid_declared.append(pid)

          counts = Counter(str(row.get('status') or 'UNKNOWN') for row in rows)
          validated = (
              len(rows) == 32
              and len(id_set) == 32
              and id_set == expected_ids
              and not invalid_declared
              and not duplicate_ids
              and not prior_overlap
              and not missing_expected_ids
              and not unexpected_ids
              and not provenance_errors
              and not error_product_ids
          )
          summary = {
              'selection_policy': window['selection_policy'],
              'historical_inventory_products': 4280,
              'historical_candidate_universe': 89,
              'historical_wave3_reference_run_id': window['historical_wave3_reference_run_id'],
              'current_metadata_snapshot_products': 4256,
              'current_metadata_snapshot_run_id': 34449270667,
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'redistribution_allowed': False,
              'prior_processed_count': 48,
              'selected': 32,
              'processed': len(rows),
              'distinct_products_processed': len(id_set),
              'status_counts': dict(sorted(counts.items())),
              'declared_rate': round(counts['DECLARED'] / len(rows), 4) if rows else 0.0,
              'unsafe_declared': invalid_declared,
              'duplicate_product_ids': duplicate_ids,
              'prior_overlap_product_ids': prior_overlap,
              'missing_expected_product_ids': missing_expected_ids,
              'unexpected_product_ids': unexpected_ids,
              'provenance_errors': sorted(set(provenance_errors)),
              'error_product_ids': sorted(set(error_product_ids)),
              'images_persisted': False,
              'missing_values_inferred': False,
              'structured_api_macros_claimed': False,
              'remaining_after_wave3': 9,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
              'safety_assessment': 'VALIDATED' if validated else 'FAILED',
          }

          out = Path('merged')
          out.mkdir(exist_ok=True)
          (out / 'results.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in rows),
              encoding='utf-8',
          )
          (out / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (out / 'window.json').write_text(json.dumps(window, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          db = sqlite3.connect(out / 'staging.sqlite')
          db.execute('CREATE TABLE ocr_results (product_id TEXT PRIMARY KEY, status TEXT NOT NULL, evidence_level TEXT NOT NULL, source TEXT NOT NULL, redistribution_allowed INTEGER NOT NULL, payload_json TEXT NOT NULL)')
          for row in rows:
              db.execute(
                  'INSERT INTO ocr_results VALUES (?, ?, ?, ?, ?, ?)',
                  (
                      str(row.get('product_id') or ''),
                      str(row.get('status') or 'UNKNOWN'),
                      str(row.get('evidence_level') or ''),
                      'MERCADONA_FIRST_PARTY/label image',
                      0,
                      json.dumps(row, ensure_ascii=False, sort_keys=True),
                  ),
              )
          db.commit()
          db.close()

          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if summary['safety_assessment'] != 'VALIDATED':
              raise SystemExit('wave3 safety/coverage checks failed')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-neural-ocr-p9-no-ingredients-processed-wave3-merged
          path: merged/
          retention-days: 30
          if-no-files-found: warn
