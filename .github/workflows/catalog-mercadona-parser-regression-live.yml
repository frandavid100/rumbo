name: Catalog Mercadona parser regression live

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-parser-regression-live.yml'
      - 'tools/catalog/nutrition_label_reader.py'
      - 'tools/catalog/mercadona_nutrition_label_reader.py'
      - 'tools/catalog/mercadona_nutrition_label_structural_repair.py'
      - 'tools/catalog/mercadona_nutrition_reader.py'
      - 'tools/catalog/mercadona_neural_ocr_wave.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-mercadona-parser-regression-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
      TARGET_PRODUCT_ID: '35649'
      EXPECTED_GENERIC_PARSER_VERSION: '1.4.17'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install first-party fetch and OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow

      - name: Run parser and OCR safety regression tests first
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_label_easyocr_extractor.py \
            test_nutrition_label_reader.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_ocr_safety_regressions.py

      - name: Fetch target product from official Mercadona API
        working-directory: tools/catalog
        run: |
          mkdir -p mercadona-parser-regression-live /tmp/mercadona-target-details
          python - <<'PY'
          import json, os
          from pathlib import Path
          pid = os.environ['TARGET_PRODUCT_ID']
          Path('/tmp/mercadona-target-inventory.jsonl').write_text(
              json.dumps({'product_id': pid, 'category_id': '', 'category_path': []}, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY
          python mercadona_first_party_details.py \
            --inventory /tmp/mercadona-target-inventory.jsonl \
            --out /tmp/mercadona-target-details \
            --shard-index 0 \
            --shard-count 1 \
            --timeout 20 \
            --delay 0
          python - <<'PY'
          import json, os
          from pathlib import Path
          pid = os.environ['TARGET_PRODUCT_ID']
          details_path = Path('/tmp/mercadona-target-details/details-00.jsonl')
          errors_path = Path('/tmp/mercadona-target-details/errors-00.jsonl')
          rows = [json.loads(line) for line in details_path.read_text(encoding='utf-8').splitlines() if line.strip()]
          errors = [json.loads(line) for line in errors_path.read_text(encoding='utf-8').splitlines() if line.strip()]
          if errors:
              raise SystemExit(f'first-party API fetch errors: {errors}')
          if len(rows) != 1:
              raise SystemExit(f'expected exactly one API result, got {len(rows)}')
          product = rows[0]
          if str(product.get('product_id')) != pid:
              raise SystemExit('product id mismatch')
          if product.get('source') != 'MERCADONA_FIRST_PARTY' or product.get('evidence_type') != 'OBSERVED_API' or product.get('detail_observed') is not True:
              raise SystemExit('invalid first-party API provenance')
          if not product.get('ean'):
              raise SystemExit('live first-party target is missing EAN')
          photos = product.get('photos') or []
          p9 = [p for p in photos if str(p.get('perspective')) == '9' and (p.get('zoom') or p.get('regular'))]
          if not p9:
              raise SystemExit('target no longer has a perspective=9 label candidate')
          p9_url = p9[0].get('zoom') or p9[0].get('regular')
          Path('mercadona-parser-regression-live/target.jsonl').write_text(json.dumps(product, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8')
          Path('mercadona-parser-regression-live/first-party-fetch.json').write_text(json.dumps({
              'product_id': pid,
              'ean': product.get('ean'),
              'name': product.get('name'),
              'source': product.get('source'),
              'evidence_type': product.get('evidence_type'),
              'source_url': product.get('source_url'),
              'observed_at': product.get('observed_at'),
              'p9_image_url': p9_url,
              'redistribution_allowed': False,
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Run live exact-product OCR with current parser
        working-directory: tools/catalog
        run: |
          python mercadona_neural_ocr_wave.py \
            --products mercadona-parser-regression-live/target.jsonl \
            --out mercadona-parser-regression-live/ocr \
            --eligibility-mode priority \
            --shard-index 0 \
            --shard-count 1 \
            --limit 1 \
            --delay 0

      - name: Validate provenance and summarize regression outcome
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from nutrition_label_reader import READER_VERSION as generic_parser_version
          from mercadona_nutrition_label_reader import READER_VERSION as mercadona_parser_version
          from mercadona_nutrition_label_structural_repair import READER_VERSION as structural_repair_version
          from mercadona_nutrition_reader import ADAPTER_VERSION as adapter_version

          pid = os.environ['TARGET_PRODUCT_ID']
          result_path = Path('mercadona-parser-regression-live/ocr/results-00.jsonl')
          fetch_path = Path('mercadona-parser-regression-live/first-party-fetch.json')
          rows = [json.loads(line) for line in result_path.read_text(encoding='utf-8').splitlines() if line.strip()]
          if len(rows) != 1 or str(rows[0].get('product_id')) != pid:
              raise SystemExit('unexpected OCR result set')
          row = rows[0]
          fetched = json.loads(fetch_path.read_text(encoding='utf-8'))
          evidence = row.get('evidence_level') or row.get('evidence_type')
          if row.get('source') != 'MERCADONA_FIRST_PARTY' or evidence != 'OCR_DERIVED_FROM_MERCADONA_IMAGE' or row.get('redistribution_allowed') is not False:
              raise SystemExit(f'invalid OCR provenance: source={row.get("source")} evidence={evidence} redistribution={row.get("redistribution_allowed")}')
          if str(row.get('ean') or '') != str(fetched.get('ean') or ''):
              raise SystemExit(f'live identity mismatch: OCR EAN={row.get("ean")} fetched EAN={fetched.get("ean")}')
          if row.get('image_url') != fetched.get('p9_image_url'):
              raise SystemExit('OCR did not use the exact live perspective=9 first-party image')
          expected_parser_version = os.environ['EXPECTED_GENERIC_PARSER_VERSION']
          if generic_parser_version != expected_parser_version:
              raise SystemExit(f'unexpected generic parser version: {generic_parser_version}; expected {expected_parser_version}')

          claim_value = row.get('claim')
          claim_meta = claim_value if isinstance(claim_value, dict) else {}
          attempts = row.get('attempts') or []
          if not isinstance(attempts, list):
              raise SystemExit(f'unexpected attempts schema: {type(attempts).__name__}')
          accepted = next((a for a in attempts if (a.get('ensemble') or {}).get('status') == 'DECLARED'), None)
          if row.get('status') == 'DECLARED':
              ens = (accepted or {}).get('ensemble') or {}
              nutrition = row.get('nutrition') or {}
              families = ens.get('independent_engine_families', claim_meta.get('independent_engine_families', 0))
              corroborated = ens.get('corroborated_fields', claim_meta.get('corroborated_fields', 0))
              if families < 2 or corroborated < 4:
                  raise SystemExit(f'unsafe DECLARED corroboration: families={families} fields={corroborated}')
              if any(nutrition.get(k) is None for k in ('calories', 'protein_g', 'carbohydrate_g', 'fat_g')):
                  raise SystemExit('unsafe DECLARED missing macro')

          carbohydrate_observations = []
          for attempt in attempts:
              for engine_name, engine in (attempt.get('engines') or {}).items():
                  parsed = engine.get('parsed') or {}
                  nutrition = engine.get('nutrition') or parsed.get('nutrition') or {}
                  if nutrition.get('carbohydrate_g') is not None:
                      carbohydrate_observations.append({
                          'target_kind': attempt.get('target_kind'),
                          'engine': engine_name,
                          'status': engine.get('status') or parsed.get('status'),
                          'carbohydrate_g': nutrition.get('carbohydrate_g'),
                      })
          report = {
              'product_id': pid,
              'ean': fetched.get('ean'),
              'name': fetched.get('name'),
              'status': row.get('status'),
              'nutrition': row.get('nutrition'),
              'claim': claim_value,
              'parser_versions': {
                  'nutrition_label_reader': generic_parser_version,
                  'mercadona_nutrition_label_reader': mercadona_parser_version,
                  'mercadona_nutrition_label_structural_repair': structural_repair_version,
                  'mercadona_nutrition_reader_adapter': adapter_version,
              },
              'carbohydrate_observations': carbohydrate_observations,
              'visual_regions_detected': row.get('visual_regions_detected'),
              'evidence_level': evidence,
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'image_url': fetched.get('p9_image_url'),
              'redistribution_allowed': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          Path('mercadona-parser-regression-live/report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-parser-regression-live-${{ env.TARGET_PRODUCT_ID }}
          path: |
            tools/catalog/mercadona-parser-regression-live/first-party-fetch.json
            tools/catalog/mercadona-parser-regression-live/target.jsonl
            tools/catalog/mercadona-parser-regression-live/ocr/results-00.jsonl
            tools/catalog/mercadona-parser-regression-live/ocr/summary-00.json
            tools/catalog/mercadona-parser-regression-live/report.json
          retention-days: 30
          if-no-files-found: warn
