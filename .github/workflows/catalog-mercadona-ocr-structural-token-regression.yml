name: Catalog Mercadona OCR structural token regression

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-ocr-structural-token-regression.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: catalog-mercadona-ocr-structural-token-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Mercadona first-party inventory
        uses: actions/download-artifact@v4
        with:
          name: mercadona-first-party-final
          path: tools/catalog/mercadona-first-party-final
          repository: frandavid100/rumbo
          github-token: ${{ github.token }}
          run-id: 33046950149

      - name: Apply candidate parser patch in workspace only
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('nutrition_label_reader.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('READER_VERSION = "1.4.10"', 'READER_VERSION = "1.4.11"'),
              (
                  'r"(?:^|\\n)\\s*[\\[|]?\\s*grasas?(?:\\s*/\\s*(?:lipidos?|fat|graisses?))?\\b",',
                  'r"(?:^|\\n)\\s*[\\[|]?\\s*grasas?(?:\\s*/?\\s*(?:lipidos?|ilipidos?|lapidos?|ipidos?|fat|graisses?))?\\b",',
              ),
              (
                  'r"(?:^|\\n)\\s*[\\[|]?\\s*proteinas?(?:\\s*/\\s*(?:protein|proteines?))?\\b",',
                  'r"(?:^|\\n)\\s*[\\[|]?\\s*(?:proteinas?|prote_nas?)(?:\\s*/\\s*(?:protein|proteines?))?(?=[\\s._:;|]|$)",',
              ),
              (
                  'r"\\s*[:;|]?\\s*([<>]?)\\s*0\\s*9(?:\\s*\\(\\s*\\d{1,3}(?:\\.\\d+)?\\s*%\\s*\\))?\\s*(?:\\n|$)",',
                  'r"\\s*[:;|]?\\s*([<>]?)\\s*(?:0\\s*9|o\\s*g)(?:\\s*\\(\\s*\\d{1,3}(?:\\.\\d+)?\\s*%\\s*\\))?\\s*(?:\\n|$)",',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'patch anchor drift: expected one occurrence of {old!r}, got {text.count(old)}')
              text = text.replace(old, new)

          old_before = '''            number = re.search(
                r"(?:^|\\n)\\s*([<>]?)\\s*(\\d{1,3}(?:\\.\\d{1,2})?)\\s*(?:g|9|q|yg|y)\\s*$",
                head,
                flags=re.I,
            )
            if not number or number.group(1) in ("<", ">"):
                continue
'''
          new_before = '''            number = re.search(
                r"(?:^|\\n)\\s*([<>]?)\\s*(\\d{1,3}(?:\\.\\d{1,2})?)\\s*(?:g|9|q|yg|y)\\s*$",
                head,
                flags=re.I,
            )
            # PP-OCR/EasyOCR can move the numeric cell to the line immediately
            # before a row whose own label carries the printed `(g)` unit. In
            # that exact layout the previous line need not repeat the unit.
            # Keep this fallback narrow: the row label itself must expose a
            # parenthesized gram-like glyph. Callers still require complete
            # tuple energy coherence before a reversed value can be promoted.
            if not number:
                label_tail = folded[label_match.end():label_match.end() + 14]
                if re.match(r"\\s*\\(\\s*(?:g|9|q|o|0|y)\\s*\\)", label_tail, flags=re.I):
                    number = re.search(
                        r"(?:^|\\n)\\s*([<>]?)\\s*(\\d{1,3}(?:\\.\\d{1,2})?)\\s*$",
                        head,
                        flags=re.I,
                    )
            if not number or number.group(1) in ("<", ">"):
                continue
'''
          if text.count(old_before) != 1:
              raise SystemExit(f'_number_immediately_before anchor drift: {text.count(old_before)}')
          text = text.replace(old_before, new_before)

          old_energy = '''def _energy_kcal(text: str) -> float | None:
    folded = _fold(text)
    # Some labels put the units in the heading and the values on the next line:
'''
          new_energy = '''def _energy_kcal(text: str) -> float | None:
    folded = _fold(text)
    # Observed EasyOCR failure on a Mercadona energy cell: decorative/blurred
    # glyphs between the numeric value and the explicit kcal unit become only
    # `u`/`v` letters (for example `326 ÚÚ kCal`). Accept one to three of those
    # glyphs only when the kcal token itself remains explicit; do not repair
    # arbitrary alphabetic text or digit substitutions.
    junk_glyph_kcal = re.search(
        r"(\\d{2,4}(?:\\.\\d{1,2})?)\\s*[uv]{1,3}\\s*kcal\\b",
        folded,
        flags=re.I,
    )
    if junk_glyph_kcal:
        return float(junk_glyph_kcal.group(1))

    # Some labels put the units in the heading and the values on the next line:
'''
          if text.count(old_energy) != 1:
              raise SystemExit(f'_energy_kcal anchor drift: {text.count(old_energy)}')
          text = text.replace(old_energy, new_energy)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Write regression tests before live OCR
        working-directory: tools/catalog
        run: |
          cat > test_nutrition_label_reader_structural_ocr_tokens.py <<'PY'
          import unittest

          from nutrition_label_reader import read_nutrition_label


          def label(*, fat='10 g', carbs='16 g', protein='7 g', energy='186 kcal', basis='100 g'):
              return f'''INFORMACIÓN NUTRICIONAL
          Por {basis}
          Valor energético 775 kJ / {energy}
          Grasas
          {fat}
          de las cuales saturadas 2 g
          Hidratos de carbono
          {carbs}
          de los cuales azúcares 1 g
          Proteínas
          {protein}
          Sal 0.7 g
          '''


          class StructuralOCRTokenRegressionTest(unittest.TestCase):
              def test_exact_observed_fat_translation_variants_are_rows(self):
                  for row in ('Grasas Lipidos', 'GRASASILíPIDOS', 'GRASAS/LÁPIDOS', 'Grasas/ípidos'):
                      with self.subTest(row=row):
                          text = f'''INFORMACIÓN NUTRICIONAL
          por 100 ml
          VALOR ENERGÉTICO 1382 kJ/335 kcal
          {row}
          35 g
          de las cuales saturadas 24 g
          HIDRATOS DE CARBONO
          3.1 g
          PROTEINAS
          2.0 g
          SAL 0.10 g
          '''
                          r = read_nutrition_label(text, extraction_confidence=.96)
                          self.assertEqual(r.status, 'DECLARED', (row, r))
                          self.assertEqual(r.nutrition['fat_g'], 35.0)

              def test_exact_observed_protein_underscore_rows_are_rows(self):
                  for row in ('PROTEINAS_', 'PROTE_NAS .'):
                      with self.subTest(row=row):
                          text = f'''INFORMACIÓN NUTRICIONAL
          por 100 g
          Valor energético 110 kJ / 26 kcal
          Grasas 0.6 g
          Hidratos de carbono 2.4 g
          {row}
          2.1 g
          Sal 0.08 g
          '''
                          r = read_nutrition_label(text, extraction_confidence=.96)
                          self.assertEqual(r.status, 'DECLARED', (row, r))
                          self.assertEqual(r.nutrition['protein_g'], 2.1)

              def test_letter_o_plus_g_is_zero_only_as_complete_macro_cell(self):
                  text = '''INFORMACIÓN NUTRICIONAL
          por 100 g
          Valor energético 878 kJ / 211 kcal
          Grasas 15 g
          Hidratos de carbono
          Og
          Proteínas 19 g
          Sal 0.18 g
          '''
                  r = read_nutrition_label(text, extraction_confidence=.96)
                  self.assertEqual(r.status, 'DECLARED', r)
                  self.assertEqual(r.nutrition['carbohydrate_g'], 0.0)

                  bounded = text.replace('Og\nProteínas', '<Og\nProteínas')
                  rb = read_nutrition_label(bounded, extraction_confidence=.96)
                  self.assertEqual(rb.status, 'REVIEW', rb)
                  self.assertIn('MISSING_CORE:carbohydrate_g', rb.reasons)

              def test_numeric_previous_line_uses_unit_from_row_label_but_stays_review_evidence(self):
                  text = '''Información Nutricional por 100g de Producto
          Valor energético (kJ/kcal)
          660/158
          Grasas (g)
          8.7
          Hidratos de carbono (g)
          0
          20
          Proteínas (g)
          Sal (g)
          0.18
          '''
                  r = read_nutrition_label(text, extraction_confidence=.96)
                  self.assertEqual(r.status, 'REVIEW', r)
                  self.assertEqual(r.nutrition['protein_g'], 20.0)
                  self.assertIn('SINGLE_REVERSED_MACRO_CANDIDATE:protein_g', r.reasons)

              def test_observed_uv_junk_before_explicit_kcal_is_energy(self):
                  text = '''VALORES NUTRICIONALES
          por 100 g
          VALOR ENERGETICO
          1 356 kJ
          326 ÚÚ kCal
          GRASAS 19 g
          HIDRATOS DE CARBONO 29 g
          PROTEINAS 8.9 g
          SAL 1.4 g
          '''
                  r = read_nutrition_label(text, extraction_confidence=.96)
                  self.assertEqual(r.status, 'DECLARED', r)
                  self.assertEqual(r.nutrition['calories'], 326.0)

              def test_alphabetic_prose_does_not_become_energy(self):
                  text = label(energy='valor kcal')
                  r = read_nutrition_label(text, extraction_confidence=.96)
                  self.assertEqual(r.status, 'REVIEW', r)
                  self.assertIn('MISSING_CORE:calories', r.reasons)


          if __name__ == '__main__':
              unittest.main()
          PY

      - name: Run parser safety tests first
        run: |
          python -m pip install --disable-pip-version-check Pillow opencv-python-headless
          cd tools/catalog
          python -m unittest -v \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_structural_ocr_tokens.py \
            test_nutrition_label_reader_single_reversed_candidate.py \
            test_nutrition_row_order_ambiguity.py \
            test_nutrition_label_reader_easyocr_zero_glyph.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_nutrition_label_reader.py \
            test_mercadona_ocr_safety_regressions.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tools/catalog')
          import nutrition_label_reader
          assert nutrition_label_reader.READER_VERSION == '1.4.11'
          PY

      - name: Install OCR engines after tests pass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8'

      - name: Build exact live validation cohort
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          target_ids = {
              '10276','14221','2779','2817','60652',
              '69670','69697','69741','69757','84597',
          }
          control_ids = {'18615','21988'}
          wanted = target_ids | control_ids
          products = [json.loads(x) for x in Path('mercadona-first-party-final/products.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          by_id = {str(r.get('product_id') or ''): r for r in products}
          missing = sorted(wanted - set(by_id))
          if missing:
              raise SystemExit(f'missing inventory products: {missing}')

          selected = [by_id[pid] for pid in sorted(wanted)]
          def has_p9(row):
              return any(isinstance(p, dict) and str(p.get('perspective')) == '9' and p.get('zoom') for p in (row.get('photos') or []))
          without_p9 = [str(r.get('product_id')) for r in selected if not has_p9(r)]
          if without_p9:
              raise SystemExit(f'validation cohort unexpectedly lacks p9: {without_p9}')

          priority = [r for r in selected if r.get('ingredients')]
          no_ingredients = [r for r in selected if not r.get('ingredients')]
          def dump(path, data):
              Path(path).write_text(''.join(json.dumps(r, ensure_ascii=False, sort_keys=True)+'\n' for r in data), encoding='utf-8')
          dump('structural-token-priority.jsonl', priority)
          dump('structural-token-no-ingredients.jsonl', no_ingredients)
          Path('structural-token-selection.json').write_text(json.dumps({
              'target_product_ids': sorted(target_ids),
              'safety_control_product_ids': sorted(control_ids),
              'priority_count': len(priority),
              'no_ingredients_count': len(no_ingredients),
              'total': len(selected),
              'perspective': '9',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'redistribution_allowed': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(f'validation cohort priority={len(priority)} no_ingredients={len(no_ingredients)} total={len(selected)}')
          PY

      - name: Reprocess structured-ingredients validation slice
        working-directory: tools/catalog
        shell: bash
        run: |
          set +e
          python mercadona_neural_ocr_tesseract_preprocess_rescue.py \
            --products structural-token-priority.jsonl \
            --out mercadona-structural-token-priority \
            --shard-index 0 --shard-count 1 --limit 0 --delay 0.25 \
            --eligibility-mode priority
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi

      - name: Reprocess no-ingredients validation slice
        working-directory: tools/catalog
        shell: bash
        run: |
          set +e
          python mercadona_neural_ocr_tesseract_preprocess_rescue.py \
            --products structural-token-no-ingredients.jsonl \
            --out mercadona-structural-token-no-ingredients \
            --shard-index 0 --shard-count 1 --limit 0 --delay 0.25 \
            --eligibility-mode p9-no-ingredients-all
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi

      - name: Audit live outcomes conservatively
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          paths = [
              Path('mercadona-structural-token-priority/results-00.jsonl'),
              Path('mercadona-structural-token-no-ingredients/results-00.jsonl'),
          ]
          rows = [json.loads(x) for p in paths if p.is_file() for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
          by_id = {str(r.get('product_id') or ''): r for r in rows}
          target_ids = {'10276','14221','2779','2817','60652','69670','69697','69741','69757','84597'}
          control_ids = {'18615','21988'}
          if set(by_id) != target_ids | control_ids or len(rows) != 12:
              raise SystemExit(f'cohort drift: rows={len(rows)} ids={sorted(by_id)}')

          expected = {
              '10276': {'calories':335.0,'fat_g':35.0,'carbohydrate_g':3.1,'protein_g':2.0},
              '14221': {'calories':560.0,'fat_g':39.0,'carbohydrate_g':40.0,'protein_g':7.0},
              '2779': {'calories':158.0,'fat_g':8.7,'carbohydrate_g':0.0,'protein_g':20.0},
              '2817': {'calories':211.0,'fat_g':15.0,'carbohydrate_g':0.0,'protein_g':19.0},
              '60652': {'calories':186.0,'fat_g':10.0,'carbohydrate_g':16.0,'protein_g':7.0},
              '69670': {'calories':19.0,'fat_g':0.1,'carbohydrate_g':3.0,'protein_g':0.9},
              '69697': {'calories':26.0,'fat_g':0.6,'carbohydrate_g':2.4,'protein_g':2.1},
              '69741': {'calories':26.0,'fat_g':0.3,'carbohydrate_g':3.1,'protein_g':1.4},
              '69757': {'calories':24.0,'fat_g':0.3,'carbohydrate_g':2.8,'protein_g':1.8},
              '84597': {'calories':325.0,'fat_g':19.0,'carbohydrate_g':29.0,'protein_g':8.9},
          }
          def close(field, a, b):
              tol = max(5.0, 0.04*max(abs(a),abs(b),1.0)) if field == 'calories' else max(0.6, 0.10*max(abs(a),abs(b),1.0))
              return abs(a-b) <= tol

          provenance_errors=[]; unsafe=[]; drift=[]
          for pid,row in by_id.items():
              if not (
                  row.get('evidence_level') == 'OCR_DERIVED_FROM_MERCADONA_IMAGE'
                  and row.get('source') == 'MERCADONA_FIRST_PARTY'
                  and row.get('source_record_kind') == 'label image'
                  and row.get('redistribution_allowed') is False
                  and str(row.get('perspective')) == '9'
              ):
                  provenance_errors.append(pid)
              if row.get('status') == 'DECLARED':
                  n=row.get('nutrition') or {}
                  ens=next((a.get('ensemble') for a in (row.get('attempts') or []) if isinstance(a.get('ensemble'),dict) and a['ensemble'].get('status')=='DECLARED'),{})
                  if row.get('basis') not in {'100_g','100_ml'} or any(n.get(f) is None for f in ('calories','fat_g','carbohydrate_g','protein_g')):
                      unsafe.append(f'{pid}:incomplete')
                  if int(ens.get('independent_engine_families') or 0)<2 or int(ens.get('corroborated_fields') or 0)<4:
                      unsafe.append(f'{pid}:corroboration')
                  if pid in expected:
                      for field,want in expected[pid].items():
                          if not close(field,float(n[field]),want):
                              drift.append(f'{pid}:{field}:{n[field]}!~{want}')

          control_promotions=sorted(pid for pid in control_ids if by_id[pid].get('status')=='DECLARED')
          target_declared=sorted(pid for pid in target_ids if by_id[pid].get('status')=='DECLARED')
          counts=Counter(str(r.get('status') or 'UNKNOWN') for r in rows)
          image_ext={'.jpg','.jpeg','.png','.webp','.bmp','.tif','.tiff'}
          persisted_images=[str(p) for root in ('mercadona-structural-token-priority','mercadona-structural-token-no-ingredients') for p in Path(root).rglob('*') if p.is_file() and p.suffix.lower() in image_ext]
          ok=(
              len(target_declared) >= 5
              and not control_promotions and not provenance_errors and not unsafe and not drift and not persisted_images
              and set(counts) <= {'DECLARED','REVIEW','NO_VISUAL_REGION','ERROR'}
          )
          summary={
              'cohort':'exact current 3-of-4 REVIEW structural-token regression plus two REVIEW safety controls',
              'processed':len(rows),
              'status_counts':dict(sorted(counts.items())),
              'target_declared_product_ids':target_declared,
              'target_declared_count':len(target_declared),
              'safety_control_promotions':control_promotions,
              'provenance_errors':provenance_errors,
              'unsafe_declared':unsafe,
              'value_drift':drift,
              'images_persisted':False if not persisted_images else persisted_images,
              'missing_values_inferred':False,
              'REVIEW_promoted_without_new_live_OCR':0,
              'nutrition_reader_version':'1.4.11',
              'source':'MERCADONA_FIRST_PARTY/label image',
              'evidence_level':'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'redistribution_allowed':False,
              'CLASSIFIED':0,
              'MENU_ELIGIBLE':0,
              'safety_assessment':'VALIDATED' if ok else 'FAILED',
          }
          out=Path('structural-token-validation'); out.mkdir(exist_ok=True)
          (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (out/'results.jsonl').write_text(''.join(json.dumps(r,ensure_ascii=False,sort_keys=True)+'\n' for r in sorted(rows,key=lambda x:str(x.get('product_id') or ''))),encoding='utf-8')
          (out/'nutrition_label_reader.py').write_text(Path('nutrition_label_reader.py').read_text(encoding='utf-8'),encoding='utf-8')
          (out/'test_nutrition_label_reader_structural_ocr_tokens.py').write_text(Path('test_nutrition_label_reader_structural_ocr_tokens.py').read_text(encoding='utf-8'),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          if not ok:
              raise SystemExit('structural token validation did not meet conservative acceptance contract')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-ocr-structural-token-regression
          path: tools/catalog/structural-token-validation/
          retention-days: 30
          if-no-files-found: error
