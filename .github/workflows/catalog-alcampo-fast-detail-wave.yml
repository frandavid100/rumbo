name: Catalog Alcampo fast first-party detail wave
on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-alcampo-fast-detail-wave.yml'
      - 'tools/catalog/alcampo_detail_fast_wave.py'
      - 'tools/catalog/alcampo_split_detail_batches.py'
      - 'tools/catalog/alcampo_merge_detail_batches.py'
      - 'tools/catalog/alcampo_union_enumeration_artifacts.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: catalog-alcampo-fast-detail-wave-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
      retry_products: ${{ steps.split.outputs.retry_products }}
      previous_successes: ${{ steps.split.outputs.previous_successes }}
      baseline_run: ${{ steps.baseline.outputs.run_id }}
      baseline_products: ${{ steps.baseline.outputs.product_count }}
      previous_run: ${{ steps.previous.outputs.run_id }}
      previous_rows: ${{ steps.previous.outputs.row_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: baseline
        name: Rebuild cumulative first-party Alcampo enumeration baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline enumeration-artifacts snapshot-candidate
          # Enumeration jobs are intentionally partial/recovery-oriented and older
          # complete artifacts can expire. Rebuild the widest safe inventory as the
          # union of every still-downloadable official Alcampo enumeration artifact.
          mapfile -t run_ids < <(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow catalog-alcampo-sharded-enumeration.yml \
              --branch agent/catalog-phase1 \
              --limit 50 \
              --json databaseId,createdAt \
              --jq 'sort_by(.createdAt) | reverse | .[].databaseId'
          )
          downloaded=0
          for run_id in "${run_ids[@]}"; do
            target="enumeration-artifacts/enumeration-$run_id"
            mkdir -p "$target"
            if gh run download "$run_id" \
                --repo "$GITHUB_REPOSITORY" \
                -n alcampo-food-catalog-sharded-enumeration \
                -D "$target" >/tmp/alcampo-baseline-download.log 2>&1; then
              if test -s "$target/products.jsonl"; then
                downloaded=$((downloaded + 1))
              else
                rm -rf "$target"
              fi
            else
              rm -rf "$target"
            fi
          done

          # Every successful fast-detail snapshot also preserves the exact
          # first-party enumeration used to build it as source_products.jsonl.
          # These snapshots outlive some original enumeration artifacts, so use
          # their preserved source inventory as another first-party baseline input.
          mapfile -t detail_run_ids < <(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow catalog-alcampo-fast-detail-wave.yml \
              --branch agent/catalog-phase1 \
              --status success \
              --limit 40 \
              --json databaseId,createdAt \
              --jq 'sort_by(.createdAt) | reverse | .[].databaseId'
          )
          for run_id in "${detail_run_ids[@]}"; do
            rm -rf snapshot-candidate/*
            if gh run download "$run_id" \
                --repo "$GITHUB_REPOSITORY" \
                -n alcampo-fast-detail-classified-snapshot \
                -D snapshot-candidate >/tmp/alcampo-snapshot-download.log 2>&1; then
              if test -s snapshot-candidate/source_products.jsonl; then
                target="enumeration-artifacts/detail-snapshot-$run_id"
                mkdir -p "$target"
                cp snapshot-candidate/source_products.jsonl "$target/products.jsonl"
                if test -s snapshot-candidate/enumeration_report.json; then
                  cp snapshot-candidate/enumeration_report.json "$target/enumeration_report.json"
                fi
                downloaded=$((downloaded + 1))
                count=$(jq -r '.sku // .retailer_sku // empty' "$target/products.jsonl" | sed '/^$/d' | sort -u | wc -l | tr -d ' ')
                echo "preserved detail snapshot run=$run_id source_products=$count"
              fi
            fi
          done

          if (( downloaded == 0 )); then
            echo "::error::No downloadable first-party Alcampo enumeration evidence remains."
            exit 1
          fi
          python tools/catalog/alcampo_union_enumeration_artifacts.py \
            --root enumeration-artifacts \
            --products baseline/products.jsonl \
            --report baseline/enumeration_report.json \
            --minimum 13877
          count=$(jq -r '.sku // .retailer_sku // empty' baseline/products.jsonl | sed '/^$/d' | sort -u | wc -l | tr -d ' ')
          echo 'run_id=cumulative-union' >> "$GITHUB_OUTPUT"
          echo "product_count=$count" >> "$GITHUB_OUTPUT"
          echo "Using cumulative Alcampo enumeration union with $count unique SKUs from $downloaded downloadable first-party artifacts"
      - id: previous
        name: Select largest successful detail snapshot for monotonic recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous candidate-previous
          best_run=''
          best_count=0
          # A recent successful wave may itself have been built from a partial
          # enumeration. Search backwards and keep the widest snapshot.
          mapfile -t run_ids < <(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow catalog-alcampo-fast-detail-wave.yml \
              --branch agent/catalog-phase1 \
              --status success \
              --limit 40 \
              --json databaseId,createdAt \
              --jq 'sort_by(.createdAt) | reverse | .[].databaseId'
          )
          for run_id in "${run_ids[@]}"; do
            rm -rf candidate-previous/*
            if gh run download "$run_id" \
                --repo "$GITHUB_REPOSITORY" \
                -n alcampo-fast-detail-classified-snapshot \
                -D candidate-previous >/tmp/alcampo-previous-download.log 2>&1; then
              if test -s candidate-previous/details.jsonl; then
                count=$(jq -r '.sku // .retailer_sku // empty' candidate-previous/details.jsonl | sed '/^$/d' | sort -u | wc -l | tr -d ' ')
                echo "candidate detail run=$run_id unique_skus=$count"
                if (( count > best_count )); then
                  rm -rf previous/*
                  cp -a candidate-previous/. previous/
                  best_count="$count"
                  best_run="$run_id"
                fi
              fi
            fi
          done
          if [[ -n "$best_run" ]]; then
            echo "run_id=$best_run" >> "$GITHUB_OUTPUT"
            echo "row_count=$best_count" >> "$GITHUB_OUTPUT"
            echo "Using widest previous detail snapshot from run $best_run with $best_count unique SKUs"
            wc -l previous/details.jsonl
          else
            echo 'run_id=' >> "$GITHUB_OUTPUT"
            echo 'row_count=0' >> "$GITHUB_OUTPUT"
            touch previous/.none
            echo 'No previous non-expired successful detail snapshot is available; this wave will start from first-party baseline only.'
          fi
      - id: split
        name: Split only unresolved products into fresh-runner microbatches
        working-directory: tools/catalog
        run: |
          args=(
            --input ../../baseline/products.jsonl
            --out ../../inputs
            --batches 256
            --github-output "$GITHUB_OUTPUT"
          )
          if test -s ../../previous/details.jsonl; then
            args+=(--previous-details ../../previous/details.jsonl)
          fi
          python alcampo_split_detail_batches.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: alcampo-fast-wave-baseline
          path: baseline/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: alcampo-fast-wave-previous
          path: previous/
          retention-days: 7
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: alcampo-fast-wave-inputs
          path: inputs/
          retention-days: 7

  detail:
    needs: prepare
    strategy:
      fail-fast: false
      # Tail-recovery is dominated by Alcampo's transient 202/WAF window. Keep
      # fresh runners sparse enough to reduce correlated throttling while every
      # unresolved microbatch remains well inside the observed 6-request window.
      max-parallel: 6
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: alcampo-fast-wave-inputs
          path: inputs
      - name: Fetch each product once per observed canonical route and checkpoint immediately
        working-directory: tools/catalog
        run: |
          python alcampo_detail_fast_wave.py \
            --input "../../inputs/batch-${{ matrix.batch }}.jsonl" \
            --workers 1 \
            --out "alcampo-fast-detail-${{ matrix.batch }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alcampo-fast-detail-result-${{ matrix.batch }}
          path: tools/catalog/alcampo-fast-detail-${{ matrix.batch }}/
          retention-days: 7
          if-no-files-found: warn

  merge:
    needs: [prepare, detail]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: alcampo-fast-wave-baseline
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          name: alcampo-fast-wave-previous
          path: previous
      - uses: actions/download-artifact@v4
        with:
          pattern: alcampo-fast-detail-result-*
          path: downloaded-details
      - name: Merge all completed rows without pretending failures are evidence
        working-directory: tools/catalog
        run: |
          mkdir -p ../../alcampo-fast-final
          args=(
            --downloaded ../../downloaded-details
            --out ../../alcampo-fast-final/details.jsonl
            --expected-products ../../baseline/products.jsonl
          )
          if test -s ../../previous/details.jsonl; then
            args+=(--previous-details ../../previous/details.jsonl)
          fi
          set +e
          python alcampo_merge_detail_batches.py "${args[@]}"
          code=$?
          set -e
          echo "$code" > ../../alcampo-fast-final/detail_merge_exit_code.txt
          touch ../../alcampo-fast-final/details.jsonl
      - name: Guard stable inventory before canonical build
        run: |
          count=$(jq -r '.sku // .retailer_sku // empty' baseline/products.jsonl | sed '/^$/d' | sort -u | wc -l | tr -d ' ')
          if (( count < 13877 )); then
            echo "::error::Refusing canonical build from partial Alcampo inventory ($count < 13877)."
            exit 1
          fi
      - name: Build canonical SQLite and proposal-only classification
        working-directory: tools/catalog
        run: |
          python alcampo_build_final_catalog.py \
            --products ../../baseline/products.jsonl \
            --details ../../alcampo-fast-final/details.jsonl \
            --output ../../alcampo-fast-final/alcampo_catalog.sqlite
          python finalize_alcampo_classification.py \
            ../../alcampo-fast-final/alcampo_catalog.sqlite \
            ../../baseline/products.jsonl
          python alcampo_semantic_gate.py \
            ../../alcampo-fast-final/alcampo_catalog.sqlite \
            --reviews manual/alcampo_semantic_reviews.jsonl
      - name: Prepare actual model semantic review queue for recovered usable products
        working-directory: tools/catalog
        run: |
          python alcampo_prepare_semantic_review_v2.py \
            ../../alcampo-fast-final/alcampo_catalog.sqlite \
            --observations ../../baseline/products.jsonl \
            --reviews manual/alcampo_semantic_reviews.jsonl \
            --output ../../alcampo-fast-final/semantic_review_next.jsonl \
            --progress ../../alcampo-fast-final/semantic_review_progress.json \
            --limit 3000
      - name: Export and preserve evidence
        working-directory: tools/catalog
        run: |
          python alcampo_export_final.py \
            ../../alcampo-fast-final/alcampo_catalog.sqlite \
            --jsonl ../../alcampo-fast-final/alcampo_catalog.jsonl \
            --summary ../../alcampo-fast-final/summary.json \
            --detail-summary ../../alcampo-fast-final/detail_merge_summary.json \
            --enumeration-report ../../baseline/enumeration_report.json
          cp ../../baseline/products.jsonl ../../alcampo-fast-final/source_products.jsonl
          cp ../../baseline/enumeration_report.json ../../alcampo-fast-final/enumeration_report.json
      - name: Persist coverage and semantic queue
        run: |
          cp alcampo-fast-final/summary.json tools/catalog/fixtures/alcampo_fast_detail_summary_latest.json
          cp alcampo-fast-final/detail_merge_summary.json tools/catalog/fixtures/alcampo_fast_detail_merge_latest.json
          cp alcampo-fast-final/semantic_review_next.jsonl tools/catalog/fixtures/alcampo_fast_semantic_review_next.jsonl
          cp alcampo-fast-final/semantic_review_progress.json tools/catalog/fixtures/alcampo_fast_semantic_review_progress_latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/catalog/fixtures/alcampo_fast_*
          if ! git diff --cached --quiet; then
            git commit -m "catalog: persist fast Alcampo detail wave"
            git pull --rebase origin agent/catalog-phase1
            git push origin HEAD:agent/catalog-phase1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: alcampo-fast-detail-classified-snapshot
          path: alcampo-fast-final/
          retention-days: 14
