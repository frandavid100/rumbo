name: Catalog Mercadona interleaved marker replay pilot

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-interleaved-marker-replay-pilot.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-interleaved-marker-replay-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - name: Download validated one-missing-core pilot evidence
        uses: actions/download-artifact@v4
        with:
          name: mercadona-two-family-one-missing-core-pilot
          path: tools/catalog/mercadona-interleaved-marker-source
          repository: frandavid100/rumbo
          github-token: ${{ github.token }}
          run-id: 33835522371
      - name: Run conservative parser tests first
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_nutrition_label_reader.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_nutrition_interleaved_marker_replay.py
          python -m py_compile mercadona_nutrition_interleaved_marker_replay.py
      - name: Replay persisted OCR text without touching images
        working-directory: tools/catalog
        run: |
          python mercadona_nutrition_interleaved_marker_replay.py \
            --pilot-results mercadona-interleaved-marker-source/mercadona-tesseract-two-family-one-missing-core-pilot-audited/results.jsonl \
            --baseline-candidates mercadona-interleaved-marker-source/mercadona-p9-two-family-one-missing-core-audit/two-family-one-missing-core-candidates.jsonl \
            --out mercadona-interleaved-marker-replay
      - name: Audit replay and build staging
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          from collections import Counter
          import json
          from pathlib import Path
          import sqlite3

          FIELDS = ('calories', 'protein_g', 'carbohydrate_g', 'fat_g')
          expected_ids = {
              '4491', '50967', '11687', '21256', '3556', '27487', '50589', '21628',
              '26775', '21717', '21725', '51212', '34114', '50971', '18729', '20908'
          }

          def close(field, a, b):
              a, b = float(a), float(b)
              tolerance = (
                  max(5.0, .04 * max(abs(a), abs(b), 1.0))
                  if field == 'calories'
                  else max(.6, .10 * max(abs(a), abs(b), 1.0))
              )
              return abs(a - b) <= tolerance

          source = Path('mercadona-interleaved-marker-source')
          baseline_rows = [
              json.loads(line)
              for line in (source / 'mercadona-p9-two-family-one-missing-core-audit/two-family-one-missing-core-candidates.jsonl')
              .read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          baseline = {
              str(row['product_id']): row
              for row in baseline_rows
              if str(row['product_id']) in expected_ids
          }
          rows = [
              json.loads(line)
              for line in Path('mercadona-interleaved-marker-replay/results.jsonl')
              .read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          ids = [str(row.get('product_id') or '') for row in rows]
          observed = set(ids)
          duplicates = sorted(pid for pid, count in Counter(ids).items() if count > 1)
          missing = sorted(expected_ids - observed)
          unexpected = sorted(observed - expected_ids)
          counts = Counter(str(row.get('status') or 'UNKNOWN') for row in rows)
          safe, unsafe, conflicts, provenance = [], [], [], []

          for row in rows:
              pid = str(row.get('product_id') or '')
              prior = baseline.get(pid)
              if prior is None:
                  provenance.append(f'{pid}:not_in_baseline')
                  continue
              if (
                  row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE'
                  or row.get('source') != 'MERCADONA_FIRST_PARTY'
                  or row.get('source_record_kind') != 'label image'
                  or row.get('redistribution_allowed') is not False
                  or str(row.get('perspective')) != '9'
              ):
                  provenance.append(f'{pid}:provenance')
              if row.get('status') != 'DECLARED':
                  continue

              accepted = next(
                  (
                      attempt for attempt in row.get('attempts') or []
                      if (attempt.get('ensemble') or {}).get('status') == 'DECLARED'
                  ), None,
              )
              ensemble = (accepted or {}).get('ensemble') or {}
              reasons = [str(reason) for reason in ensemble.get('reasons') or []]
              nutrition = row.get('nutrition') or {}
              fields = {
                  str(field.get('name')): field
                  for field in ensemble.get('fields') or []
                  if field.get('name') in FIELDS
              }
              missing_field = str(prior.get('missing_core_field') or '')
              recovered = fields.get(missing_field) or {}
              hard = any(
                  reason.startswith('OCR_FIELD_CONFLICT')
                  or reason.startswith('OCR_SAME_ENGINE_CONFLICT')
                  or reason == 'OCR_BASIS_CONFLICT'
                  or reason.startswith('ENERGY_MACRO_MISMATCH')
                  for reason in reasons
              )
              if (
                  int(ensemble.get('independent_engine_families') or 0) < 2
                  or int(ensemble.get('corroborated_fields') or 0) != 4
                  or set(fields) != set(FIELDS)
                  or any(nutrition.get(field) is None for field in FIELDS)
                  or not recovered.get('corroborated')
                  or len(recovered.get('engine_families') or []) < 2
                  or hard
              ):
                  unsafe.append(pid)
                  continue

              bad = []
              if row.get('basis') != prior.get('basis'):
                  bad.append(f"basis:{prior.get('basis')}!={row.get('basis')}")
              prior_nutrition = prior.get('nutrition') or {}
              for field in FIELDS:
                  if field == missing_field:
                      if prior_nutrition.get(field) is not None:
                          bad.append(f'{field}:expected_prior_missing')
                      continue
                  if prior_nutrition.get(field) is None or not close(field, nutrition[field], prior_nutrition[field]):
                      bad.append(f"{field}:{prior_nutrition.get(field)}!~{nutrition[field]}")
              if bad:
                  conflicts.append({'product_id': pid, 'conflicts': bad})
                  continue

              safe.append({
                  'product_id': pid,
                  'ean': row.get('ean'),
                  'name': row.get('name'),
                  'basis': row.get('basis'),
                  'nutrition': {field: nutrition[field] for field in FIELDS},
                  'recovered_core_field': missing_field,
                  'independent_engine_families': ensemble.get('independent_engine_families'),
                  'corroborated_fields': ensemble.get('corroborated_fields'),
                  'source': 'MERCADONA_FIRST_PARTY/label image',
                  'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
                  'redistribution_allowed': False,
                  'CLASSIFIED': 0,
                  'MENU_ELIGIBLE': 0,
              })

          persisted_images = sorted(
              str(path) for path in Path('mercadona-interleaved-marker-replay').rglob('*')
              if path.is_file() and path.suffix.lower() in {'.png', '.jpg', '.jpeg', '.webp', '.bmp', '.tif', '.tiff'}
          )
          ok = (
              len(rows) == 16 and len(observed) == 16
              and not duplicates and not missing and not unexpected
              and not unsafe and not conflicts and not provenance and not persisted_images
          )
          declared = len(safe)
          cumulative_declared = 261 + declared
          cumulative_review = 2682 - declared
          out = Path('mercadona-interleaved-marker-replay-audited')
          out.mkdir(parents=True, exist_ok=True)
          summary = {
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'redistribution_allowed': False,
              'replay_policy_version': '1.1.0',
              'input_pilot_run': 33835522371,
              'processed': len(rows),
              'status_counts': dict(sorted(counts.items())),
              'safe_promotion_products': declared,
              'safe_promotion_product_ids': sorted(item['product_id'] for item in safe),
              'unsafe_declared': unsafe,
              'value_conflicts': conflicts,
              'provenance_errors': provenance,
              'duplicate_product_ids': duplicates,
              'missing_product_ids': missing,
              'unexpected_product_ids': unexpected,
              'persisted_images': persisted_images,
              'images_persisted': bool(persisted_images),
              'numeric_tokens_modified': False,
              'missing_values_inferred': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
              'cumulative_after_replay': {
                  'catalog_total': 4280,
                  'processed': 2943,
                  'DECLARED_complete': cumulative_declared,
                  'REVIEW': cumulative_review,
                  'complete_usable_coverage_pct': round(100.0 * cumulative_declared / 4280, 4),
                  'processed_coverage_pct': round(100.0 * 2943 / 4280, 4),
              },
              'safety_assessment': 'VALIDATED' if ok else 'FAILED',
          }
          (out / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (out / 'safe-promotions.json').write_text(json.dumps(safe, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (out / 'results.jsonl').write_text(
              Path('mercadona-interleaved-marker-replay/results.jsonl').read_text(encoding='utf-8'),
              encoding='utf-8',
          )

          db = sqlite3.connect(out / 'staging.sqlite')
          db.execute('''CREATE TABLE promotions (
              product_id TEXT PRIMARY KEY, ean TEXT, name TEXT, basis TEXT,
              calories REAL, protein_g REAL, carbohydrate_g REAL, fat_g REAL,
              recovered_core_field TEXT, evidence_level TEXT, source TEXT,
              redistribution_allowed INTEGER, classified INTEGER, menu_eligible INTEGER
          )''')
          for item in safe:
              n = item['nutrition']
              db.execute(
                  'INSERT INTO promotions VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?)',
                  (item['product_id'], item.get('ean'), item.get('name'), item.get('basis'),
                   n['calories'], n['protein_g'], n['carbohydrate_g'], n['fat_g'],
                   item['recovered_core_field'], item['evidence_level'], item['source'],
                   0, 0, 0),
              )
          db.commit()
          db.close()

          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if not ok:
              raise SystemExit('interleaved-marker replay audit failed')
          PY
      - name: Upload audited replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: mercadona-interleaved-marker-replay-pilot
          path: |
            tools/catalog/mercadona-interleaved-marker-replay-audited
          retention-days: 30
          if-no-files-found: error
