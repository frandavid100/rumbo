name: Catalog Mercadona apply serving-column guard

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-apply-serving-column-guard.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply narrow parallel serving-column guard
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('nutrition_label_reader.py')
          text = path.read_text(encoding='utf-8')
          marker = '''    return len(explicit) + len(standalone)\n\n\ndef _plausible(n: dict[str, float]) -> tuple[bool, list[str]]:\n'''
          replacement = '''    return len(explicit) + len(standalone)\n\n\ndef _parallel_per100_serving_energy_columns(text: str) -> bool:\n    \"\"\"Reject an OCR-linearized per-100 plus per-serving energy table.\n\n    A Mercadona beverage label exposed adjacent standalone `100 ml` and\n    `250 ml` headings followed by two printed kJ/kcal values. The row-oriented\n    parser must not choose one column or combine cells. Require both adjacent\n    quantity headings *and* duplicated printed energy values, so an ordinary\n    package quantity elsewhere on the label cannot trigger this guard.\n    \"\"\"\n    folded = _fold(text)\n    lines = folded.splitlines()\n    heading_re = re.compile(\n        r\"^\\s*(\\d{1,4}(?:\\.\\d{1,2})?)\\s*(g|9|q|yg|y|m(?:l|i|1))\\s*$\",\n        flags=re.I,\n    )\n    headings: list[tuple[int, float, str]] = []\n    for index, line in enumerate(lines):\n        match = heading_re.match(line)\n        if not match:\n            continue\n        quantity = float(match.group(1))\n        raw_unit = match.group(2).lower()\n        unit = \"ml\" if raw_unit.startswith(\"m\") else \"g\"\n        headings.append((index, quantity, unit))\n\n    for left_pos, left_quantity, left_unit in headings:\n        for right_pos, right_quantity, right_unit in headings:\n            if right_pos <= left_pos or right_pos - left_pos > 2:\n                continue\n            if left_unit != right_unit:\n                continue\n            quantities = {left_quantity, right_quantity}\n            if 100.0 not in quantities or len(quantities) != 2:\n                continue\n            window = \"\\n\".join(lines[left_pos:min(len(lines), right_pos + 10)])\n            kcal_values = re.findall(\n                r\"(?<![\\d.])\\d{1,4}(?:\\.\\d{1,2})?\\s*kcal\\b\", window, flags=re.I\n            )\n            kj_values = re.findall(\n                r\"(?<![\\d.])\\d{1,5}(?:\\.\\d{1,2})?\\s*k\\s*j\\b\", window, flags=re.I\n            )\n            if len(kcal_values) >= 2 or len(kj_values) >= 2:\n                return True\n    return False\n\n\ndef _plausible(n: dict[str, float]) -> tuple[bool, list[str]]:\n'''
          if marker not in text:
              raise SystemExit('expected basis-heading insertion marker not found')
          updated = text.replace(marker, replacement, 1)
          old_guard = '    if _basis_heading_count(block) > 1:\n'
          new_guard = '    if _basis_heading_count(block) > 1 or _parallel_per100_serving_energy_columns(block):\n'
          if old_guard not in updated:
              raise SystemExit('expected multiple-column guard not found')
          updated = updated.replace(old_guard, new_guard, 1)
          if 'READER_VERSION = "1.4.29"' not in updated:
              raise SystemExit('unexpected reader version')
          updated = updated.replace('READER_VERSION = "1.4.29"', 'READER_VERSION = "1.4.30"', 1)
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Run conservative parser regressions
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_label_reader_row_tokens.py \
            test_nutrition_label_reader_low_kcal_pair.py
      - name: Commit tested guard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/catalog/nutrition_label_reader.py
          git commit -m 'Catalog: block per-100 plus serving OCR columns'
          git push origin HEAD:agent/catalog-phase1
