name: Catalog Mercadona 24541 protein salt rerun

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-24541-protein-salt-rerun.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build exact historical anchor inventory
        working-directory: tools/catalog
        run: |
          printf '%s\n' '{"product_id":"24541"}' > mercadona-24541-inventory.jsonl

      - name: Rehydrate current official first-party detail
        working-directory: tools/catalog
        run: |
          rm -rf mercadona-first-party-24541-live
          python mercadona_first_party_details.py \
            --inventory mercadona-24541-inventory.jsonl \
            --out mercadona-first-party-24541-live \
            --shard-index 0 --shard-count 1 --timeout 20 --delay 0.2
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('mercadona-first-party-24541-live')
          summary = json.loads((root/'summary-00.json').read_text(encoding='utf-8'))
          errors = [json.loads(x) for x in (root/'errors-00.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          if errors or summary.get('fetched') != 1 or summary.get('requested') != 1:
              raise SystemExit(f'incomplete first-party rehydration: summary={summary} errors={errors}')
          PY

      - name: Require exact EAN and exact same first-party perspective=9 image
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected_ean = '8402001050428'
          expected_url = 'https://prod-mercadona.imgix.net/images/778d340daab64031f191ec5cac1b87ab.jpg?fit=crop&h=3600&w=3600'
          rows = [json.loads(x) for x in Path('mercadona-first-party-24541-live/details-00.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          if len(rows) != 1 or str(rows[0].get('product_id')) != '24541':
              raise SystemExit(f'unexpected live product rows: {rows}')
          product = rows[0]
          if str(product.get('ean') or '') != expected_ean:
              raise SystemExit(f'EAN reassignment: {product.get("ean")} != {expected_ean}')
          photos = product.get('photos') if isinstance(product.get('photos'), list) else []
          matches = [p for p in photos if isinstance(p, dict) and str(p.get('perspective') or '') == '9' and str(p.get('zoom') or '') == expected_url]
          if len(matches) != 1:
              raise SystemExit(f'exact historical P9 image not present exactly once: matches={len(matches)}')
          product['photos'] = [dict(matches[0])]
          product['_protein_salt_rerun'] = {
              'anchor_ean': expected_ean,
              'image_url': expected_url,
              'perspective': 9,
              'historical_inventory_products': 4280,
              'cross_run_value_fusion': False,
              'acceptance_policy_changed': False,
          }
          Path('mercadona-24541-input.jsonl').write_text(json.dumps(product, ensure_ascii=False, sort_keys=True)+'\n', encoding='utf-8')
          PY

      - name: Install OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check \
            'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' 'python-doctr==1.1.0' \
            opencv-python-headless Pillow

      - name: Run conservative parser and ensemble regressions
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_nutrition_label_reader_single_reversed_candidate.py \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_row_order_ambiguity.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_ocr_safety_regressions.py

      - name: Rerun exact label under unchanged acceptance contract
        working-directory: tools/catalog
        run: |
          set -euo pipefail
          rm -rf mercadona-24541-protein-salt-rerun
          set +e
          python mercadona_bounded_doctr_rescue.py \
            --products mercadona-24541-input.jsonl \
            --out mercadona-24541-protein-salt-rerun \
            --shard-index 0 --shard-count 1 --limit 0 \
            --eligibility-mode p9-no-ingredients-all
          rc=$?
          set -e
          [[ $rc -eq 0 || $rc -eq 2 ]] || exit "$rc"

      - name: Require salt not to leak into protein and persist audit
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import glob, json, sqlite3
          from pathlib import Path

          paths = sorted(glob.glob('mercadona-24541-protein-salt-rerun/results-*.jsonl'))
          rows = []
          for path in paths:
              rows.extend(json.loads(x) for x in Path(path).read_text(encoding='utf-8').splitlines() if x.strip())
          if len(rows) != 1 or str(rows[0].get('product_id')) != '24541':
              raise SystemExit(f'unexpected OCR result rows: {len(rows)}')
          row = rows[0]
          if row.get('status') not in {'REVIEW', 'DECLARED'}:
              raise SystemExit(f'24541 must remain auditable OCR evidence, got {row.get("status")}')
          if row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE' or row.get('source') != 'MERCADONA_FIRST_PARTY' or row.get('source_record_kind') != 'label image' or row.get('redistribution_allowed') is not False:
              raise SystemExit('provenance contract mismatch')

          guarded = []
          for attempt in row.get('attempts', []):
              for engine_name, engine in (attempt.get('engines') or {}).items():
                  reasons = engine.get('reasons') or []
                  if 'SINGLE_REVERSED_MACRO_CANDIDATE:protein_g' not in reasons:
                      continue
                  protein = (engine.get('nutrition') or {}).get('protein_g')
                  guarded.append({'engine': engine_name, 'protein_g': protein})
                  if protein != 2.1:
                      raise SystemExit(f'reversed protein candidate must be 2.1 g, got {protein} in {engine_name}')
          if not guarded:
              raise SystemExit('current exact label did not exercise the protein/salt reversal guard')

          declared_attempts = [
              attempt.get('ensemble') or {}
              for attempt in row.get('attempts', [])
              if (attempt.get('ensemble') or {}).get('status') == 'DECLARED'
          ]
          if row.get('status') == 'DECLARED' and not any(int(x.get('corroborated_fields') or 0) == 4 for x in declared_attempts):
              raise SystemExit('DECLARED row lacks an independently corroborated 4/4 ensemble')

          out = Path('mercadona-24541-protein-salt-rerun/audit')
          out.mkdir(parents=True, exist_ok=True)
          (out/'result.jsonl').write_text(json.dumps(row, ensure_ascii=False, sort_keys=True)+'\n', encoding='utf-8')
          summary = {
              'historical_inventory_products': 4280,
              'product_id': '24541',
              'ean': '8402001050428',
              'status': row.get('status'),
              'guarded_engine_readings': guarded,
              'salt_value_0_02_not_used_as_guarded_protein': True,
              'cross_run_value_fusion': False,
              'acceptance_policy_changed': False,
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'redistribution_allowed': False,
              'images_persisted': False,
              'missing_values_inferred': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          (out/'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          db = sqlite3.connect(out/'staging.sqlite')
          db.execute('CREATE TABLE result (product_id TEXT PRIMARY KEY, status TEXT, evidence_level TEXT, source TEXT, redistribution_allowed INTEGER, raw_json TEXT)')
          db.execute('INSERT INTO result VALUES (?,?,?,?,?,?)', ('24541', row.get('status'), 'OCR_DERIVED_FROM_MERCADONA_IMAGE', 'MERCADONA_FIRST_PARTY/label image', 0, json.dumps(row, ensure_ascii=False, sort_keys=True)))
          db.commit(); db.close()
          forbidden = [str(p) for p in out.rglob('*') if p.is_file() and p.suffix.lower() in {'.jpg','.jpeg','.png','.webp','.avif','.gif'}]
          if forbidden:
              raise SystemExit(f'image files must not be persisted: {forbidden}')
          print(json.dumps(summary, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: mercadona-24541-protein-salt-rerun
          path: tools/catalog/mercadona-24541-protein-salt-rerun/audit/
          retention-days: 90
          if-no-files-found: error
