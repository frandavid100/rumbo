name: Apply Carrefour role filters UI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/carrefour-role-filters-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/carrefour-role-filters-ui
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar transformación
        run: python tools/apply_carrefour_role_filters_ui.py
      - name: Guardar resultado
        run: |
          rm tools/apply_carrefour_role_filters_ui.py
          rm .github/workflows/apply-carrefour-role-filters-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mostrar y filtrar roles del catálogo Carrefour"
          git push origin HEAD:agent/carrefour-role-filters-ui
