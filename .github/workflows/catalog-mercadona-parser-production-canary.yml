name: Catalog Mercadona parser production canary

# Production raw-live OCR canary for parser changes already covered by unit and
# diagnostic live regressions. Unlike catalog-mercadona-parser-regression-live,
# artifacts from this workflow are canonical reconciliation inputs.
on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-parser-production-canary.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: catalog-mercadona-parser-production-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - product_id: '21649'
            expected_ean: '8402001054686'
          - product_id: '24541'
            expected_ean: '8402001050428'
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
      TARGET_PRODUCT_ID: ${{ matrix.product_id }}
      EXPECTED_EAN: ${{ matrix.expected_ean }}
      ELIGIBILITY_MODE: 'p9-no-ingredients-all'
      EXPECTED_GENERIC_PARSER_VERSION: '1.4.31'
      EXPECTED_ADAPTER_VERSION: '1.0.7'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install first-party fetch and OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow

      - name: Run parser and OCR safety regressions first
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_nutrition_unit_glyph_repair.py \
            test_label_easyocr_extractor.py \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_ocr_safety_regressions.py \
            test_mercadona_nutrition_label_conservation_interleave.py \
            test_mercadona_nutrition_label_manufacturer_interleave.py

      - name: Fetch exact target from official Mercadona API
        working-directory: tools/catalog
        run: |
          set -euo pipefail
          mkdir -p mercadona-parser-production-canary /tmp/mercadona-target-details
          python - <<'PY'
          import json, os
          from pathlib import Path
          pid = os.environ['TARGET_PRODUCT_ID']
          Path('/tmp/mercadona-target-inventory.jsonl').write_text(
              json.dumps({'product_id': pid, 'category_id': '', 'category_path': []}, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY
          python mercadona_first_party_details.py \
            --inventory /tmp/mercadona-target-inventory.jsonl \
            --out /tmp/mercadona-target-details \
            --shard-index 0 --shard-count 1 --timeout 20 --delay 0
          python - <<'PY'
          import json, os
          from pathlib import Path

          pid = os.environ['TARGET_PRODUCT_ID']
          expected_ean = os.environ['EXPECTED_EAN']
          rows = [json.loads(line) for line in Path('/tmp/mercadona-target-details/details-00.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          errors = [json.loads(line) for line in Path('/tmp/mercadona-target-details/errors-00.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          if errors:
              raise SystemExit(f'first-party API fetch errors: {errors}')
          if len(rows) != 1:
              raise SystemExit(f'expected exactly one API result, got {len(rows)}')
          product = rows[0]
          if str(product.get('product_id')) != pid:
              raise SystemExit('product id mismatch')
          if product.get('source') != 'MERCADONA_FIRST_PARTY' or product.get('evidence_type') != 'OBSERVED_API' or product.get('detail_observed') is not True:
              raise SystemExit('invalid first-party API provenance')
          if str(product.get('ean') or '') != expected_ean:
              raise SystemExit(f'live first-party identity mismatch for {pid}: EAN={product.get("ean")}; expected={expected_ean}')
          photos = product.get('photos') or []
          p9 = [p for p in photos if str(p.get('perspective')) == '9' and (p.get('zoom') or p.get('regular'))]
          if len(p9) != 1:
              raise SystemExit(f'expected exactly one current perspective=9 label candidate, got {len(p9)}')
          p9_url = p9[0].get('zoom') or p9[0].get('regular')
          Path('mercadona-parser-production-canary/target.jsonl').write_text(
              json.dumps(product, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8'
          )
          Path('mercadona-parser-production-canary/first-party-fetch.json').write_text(json.dumps({
              'product_id': pid,
              'ean': product.get('ean'),
              'name': product.get('name'),
              'source': product.get('source'),
              'evidence_type': product.get('evidence_type'),
              'source_url': product.get('source_url'),
              'observed_at': product.get('observed_at'),
              'p9_image_url': p9_url,
              'redistribution_allowed': False,
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Run fresh production OCR on exact current P9 image
        working-directory: tools/catalog
        run: |
          python mercadona_neural_ocr_wave.py \
            --products mercadona-parser-production-canary/target.jsonl \
            --out mercadona-parser-production-canary/ocr \
            --eligibility-mode "$ELIGIBILITY_MODE" \
            --shard-index 0 --shard-count 1 --limit 1 --delay 0

      - name: Validate canonical-input provenance
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from nutrition_label_reader import READER_VERSION as generic_parser_version
          from mercadona_nutrition_reader import ADAPTER_VERSION as adapter_version

          pid = os.environ['TARGET_PRODUCT_ID']
          if generic_parser_version != os.environ['EXPECTED_GENERIC_PARSER_VERSION']:
              raise SystemExit(f'unexpected generic parser version: {generic_parser_version}')
          if adapter_version != os.environ['EXPECTED_ADAPTER_VERSION']:
              raise SystemExit(f'unexpected Mercadona adapter version: {adapter_version}')

          rows = [json.loads(line) for line in Path('mercadona-parser-production-canary/ocr/results-00.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          fetched = json.loads(Path('mercadona-parser-production-canary/first-party-fetch.json').read_text(encoding='utf-8'))
          if len(rows) != 1 or str(rows[0].get('product_id')) != pid:
              raise SystemExit('unexpected OCR result set')
          row = rows[0]
          if row.get('source') != 'MERCADONA_FIRST_PARTY' or row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE' or row.get('redistribution_allowed') is not False:
              raise SystemExit('invalid OCR provenance')
          if str(row.get('ean') or '') != str(fetched.get('ean') or ''):
              raise SystemExit('OCR/live EAN mismatch')
          if row.get('image_url') != fetched.get('p9_image_url'):
              raise SystemExit('OCR did not use the exact current P9 first-party image')
          if row.get('status') not in {'DECLARED', 'REVIEW', 'NO_VISUAL_REGION', 'ERROR'}:
              raise SystemExit(f'unexpected production OCR status: {row.get("status")}')

          attempts = row.get('attempts') or []
          accepted = next((a for a in attempts if (a.get('ensemble') or {}).get('status') == 'DECLARED'), None)
          if row.get('status') == 'DECLARED':
              ensemble = (accepted or {}).get('ensemble') or {}
              nutrition = row.get('nutrition') or {}
              if int(ensemble.get('independent_engine_families') or 0) < 2:
                  raise SystemExit('unsafe DECLARED: <2 independent OCR families')
              if int(ensemble.get('corroborated_fields') or 0) < 4:
                  raise SystemExit('unsafe DECLARED: <4 corroborated core fields')
              if any(nutrition.get(k) is None for k in ('calories', 'fat_g', 'carbohydrate_g', 'protein_g')):
                  raise SystemExit('unsafe DECLARED: missing core macro')

          report = {
              'product_id': pid,
              'ean': fetched.get('ean'),
              'name': fetched.get('name'),
              'status': row.get('status'),
              'nutrition': row.get('nutrition'),
              'accepted_ensemble': (accepted or {}).get('ensemble'),
              'generic_parser_version': generic_parser_version,
              'adapter_version': adapter_version,
              'visual_regions_detected': row.get('visual_regions_detected'),
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'image_url': fetched.get('p9_image_url'),
              'redistribution_allowed': False,
              'missing_values_inferred': False,
              'canonical_input': True,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          Path('mercadona-parser-production-canary/report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-parser-production-canary-${{ env.TARGET_PRODUCT_ID }}
          path: |
            tools/catalog/mercadona-parser-production-canary/first-party-fetch.json
            tools/catalog/mercadona-parser-production-canary/target.jsonl
            tools/catalog/mercadona-parser-production-canary/ocr/results-00.jsonl
            tools/catalog/mercadona-parser-production-canary/ocr/summary-00.json
            tools/catalog/mercadona-parser-production-canary/report.json
          retention-days: 90
          if-no-files-found: error

  reconcile:
    runs-on: ubuntu-24.04
    needs: ocr
    if: ${{ needs.ocr.result == 'success' }}
    steps:
      - name: Trigger efficient strict canonical reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run catalog-mercadona-current-ocr-residual-audit-efficient.yml \
            --repo frandavid100/rumbo \
            --ref agent/catalog-phase1
