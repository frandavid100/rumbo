name: Catalog Alcampo bootstrap 13.9k detail enrichment (retired)
on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-alcampo-bootstrap-13877.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Keep the historical concurrency key so this lightweight replacement cancels
  # the multi-hour legacy run and frees runners for the checkpointed fast wave.
  group: catalog-alcampo-bootstrap-13877-${{ github.ref }}
  cancel-in-progress: true
jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'Retired: alcampo_detail_enricher retry loops spend hours polling WAF 202 and lose partial progress on timeout.'
          echo 'Use catalog-alcampo-fast-detail-wave.yml plus the recovery/semantic-review pipeline instead.'
