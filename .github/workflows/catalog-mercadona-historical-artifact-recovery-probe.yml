name: Catalog Mercadona historical artifact recovery probe

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-historical-artifact-recovery-probe.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  recover-historical-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch original merge job log
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/98436943320/logs" \
            --output original-merge-job.log
          test -s original-merge-job.log

      - name: Recover exact historical artifacts without live API substitution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import shutil
          import subprocess
          import urllib.error
          import urllib.request
          import zipfile
          from pathlib import Path

          ROOT = Path('.')
          WORK = ROOT / 'historical-recovery'
          DOWNLOADS = WORK / 'downloads'
          DETAILS = WORK / 'details'
          INVENTORY = WORK / 'inventory'
          EXACT = WORK / 'exact-snapshot'
          for path in (DOWNLOADS, DETAILS, INVENTORY, EXACT):
              path.mkdir(parents=True, exist_ok=True)

          inventory_sha = '7e7a24bc5e8b468f3bf0fd620ad744b7050ab115be4e89e539bef5b757eaf88c'
          detail_shas = {
              '2947ce5bd60d77bbd1a053b96a0ca649d767b7540bdc24b763d594ed70cf3a6e',
              '7603237d64d359ef82bbf06578eaf8649202079d9f24c7729f9fa8b3db556469',
              'cd88464d55d3e226b126619648cdebf7827be114dca37ce95f937f00b9edbdcc',
              '93d2310e651c3a2e2e0772c9771694e7c77b1c00d910f665c8414336ce8d0cd3',
              'd7453b007f1992e8f303f12d5cfd2037a46cc3178004f7391b5109d9959005db',
              'a007856432038fcc67e5c1e43e39c443c57c314a58ba4f15a8c63a541cd2f482',
              '2269c16b2920f9c6bcbb3a5831669a68ef94a2737a0fc36700cf4a7d0fc37425',
              '461dd1018c9c2b07978e44d20affe0faadf857aeb6a8b403570d5e08d36b2673',
              '1c7952b5d8f7d405a2ed01b64b60256f49386b81efb076fac28bde71b6dee17b',
              'd572a4bdc6ba2e605c0f275915f3934c82f3f437aa074f130276828c2856ba96',
              '8a9cb9951e476d41fb47878f311968d97bcee500ead71417527dbbd78f81bd10',
              'f2a24f9abc2588326031b58178d553c8fdc22a40575af474f02d294afe074ad7',
              'e8a5b1480659846bf890a3a696fe0a6f26b99ee8df3a90879eea8a59fc999295',
              '466715d9e798502d976b1431ce17fdb6975282ee577efcbe98f3c20a8949bead',
              '21f2f3f49398b38f3a54c62bfc4491e916edd0e1ef9ab3717d184b81a6c80c63',
              'b9fee1eef12c264dbf01a902fe0d91f761bec4e22997c7ab87fd1d7b6060ed18',
          }
          expected = detail_shas | {inventory_sha}

          log_text = Path('original-merge-job.log').read_text(encoding='utf-8', errors='replace')
          urls = list(dict.fromkeys(re.findall(r'Redirecting to blob download url:\s*(https://\S+?\.zip)', log_text)))
          if len(urls) < 17:
              raise SystemExit(f'Expected at least 17 historical blob URLs in original merge log, found {len(urls)}')

          attempts = []
          recovered_detail_shas = set()
          inventory_recovered = False

          for index, url in enumerate(urls):
              target = DOWNLOADS / f'blob-{index:02d}.zip'
              record = {'index': index, 'url': url, 'http_status': None, 'sha256': None, 'kind': None}
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'rumbo-historical-recovery/1.0'})
                  with urllib.request.urlopen(request, timeout=90) as response, target.open('wb') as out:
                      record['http_status'] = int(response.status)
                      shutil.copyfileobj(response, out)
              except urllib.error.HTTPError as exc:
                  record['http_status'] = int(exc.code)
                  record['error'] = exc.read(2048).decode('utf-8', errors='replace')
                  attempts.append(record)
                  continue
              except Exception as exc:
                  record['error'] = f'{type(exc).__name__}: {exc}'
                  attempts.append(record)
                  continue

              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              record['sha256'] = digest
              if digest not in expected:
                  record['kind'] = 'UNEXPECTED_DIGEST'
                  attempts.append(record)
                  continue

              if digest == inventory_sha:
                  record['kind'] = 'inventory'
                  with zipfile.ZipFile(target) as archive:
                      archive.extractall(INVENTORY)
                  inventory_recovered = True
              else:
                  record['kind'] = 'detail_shard'
                  with zipfile.ZipFile(target) as archive:
                      archive.extractall(DETAILS)
                  recovered_detail_shas.add(digest)
              attempts.append(record)

          def read_jsonl(path: Path):
              if not path.exists():
                  return []
              return [json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]

          inventory_rows = read_jsonl(INVENTORY / 'products.jsonl') if inventory_recovered else []
          inventory_valid = (
              len(inventory_rows) == 4280
              and len({str(row.get('product_id') or '') for row in inventory_rows}) == 4280
              and all(str(row.get('product_id') or '') for row in inventory_rows)
          )

          detail_files = sorted(DETAILS.glob('details-*.jsonl'))
          error_files = sorted(DETAILS.glob('errors-*.jsonl'))
          detail_rows = [row for path in detail_files for row in read_jsonl(path)]
          error_rows = [row for path in error_files for row in read_jsonl(path)]
          detail_ids = [str(row.get('product_id') or '') for row in detail_rows]
          details_valid = (
              recovered_detail_shas == detail_shas
              and len(detail_files) == 16
              and len(detail_rows) == 4280
              and len(set(detail_ids)) == 4280
              and all(detail_ids)
              and len(error_rows) == 0
          )

          known_coverage = {
              'ean': 4280,
              'name': 4280,
              'brand': 3783,
              'packaging': 3713,
              'price': 4280,
              'unit_size': 4242,
              'category_id': 4280,
              'category_name': 4280,
              'photos': 4280,
              'legal_name': 2854,
              'suppliers': 3158,
              'ingredients': 2719,
              'allergens': 2758,
              'storage_instructions': 2589,
          }

          def present(value):
              return value not in (None, '', [], {})

          detail_coverage = {
              field: sum(1 for row in detail_rows if present(row.get(field)))
              for field in known_coverage
          }
          details_match_known_final = details_valid and detail_coverage == known_coverage

          reconstructed_final = False
          if details_match_known_final:
              # The exact shard records already carry the complete first-party rows.
              # Use them as the inventory baseline and re-run the original merge code;
              # this is deterministic and never consults the current Mercadona API.
              ordered = sorted(detail_rows, key=lambda row: (len(str(row.get('product_id') or '')), str(row.get('product_id') or '')))
              baseline = WORK / 'reconstructed-inventory.jsonl'
              baseline.write_text(''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in ordered), encoding='utf-8')
              subprocess.run([
                  'python', 'tools/catalog/mercadona_first_party_merge.py',
                  '--inventory', str(baseline),
                  '--details-glob', str(DETAILS / 'details-*.jsonl'),
                  '--errors-glob', str(DETAILS / 'errors-*.jsonl'),
                  '--out', str(EXACT),
              ], check=True)
              summary = json.loads((EXACT / 'summary.json').read_text(encoding='utf-8'))
              reconstructed_final = (
                  summary.get('products') == 4280
                  and summary.get('detail_records') == 4280
                  and summary.get('errors') == 0
                  and all(summary.get('coverage', {}).get(field, {}).get('present') == count for field, count in known_coverage.items())
              )
              if not reconstructed_final:
                  raise SystemExit('Reconstructed snapshot failed exact known-coverage verification')

          status = (
              'EXACT_FINAL_RECONSTRUCTED' if reconstructed_final
              else 'EXACT_INVENTORY_RECOVERED' if inventory_valid
              else 'EXACT_DETAIL_SHARDS_RECOVERED' if details_valid
              else 'REHYDRATING_OR_UNAVAILABLE'
          )
          report = {
              'source_run_id': 33046950149,
              'source_merge_job_id': 98436943320,
              'status': status,
              'live_api_used': False,
              'inventory_expected_sha256': inventory_sha,
              'inventory_recovered': inventory_recovered,
              'inventory_valid_4280': inventory_valid,
              'detail_shards_expected': 16,
              'detail_shards_recovered': len(recovered_detail_shas),
              'detail_shards_complete': recovered_detail_shas == detail_shas,
              'detail_records': len(detail_rows),
              'detail_unique_product_ids': len(set(detail_ids)),
              'detail_errors': len(error_rows),
              'detail_coverage': detail_coverage,
              'detail_rows_match_known_final_coverage': details_match_known_final,
              'exact_final_reconstructed': reconstructed_final,
              'attempts': attempts,
          }
          (WORK / 'recovery-report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({key: value for key, value in report.items() if key != 'attempts'}, ensure_ascii=False, indent=2))
          PY

      - name: Upload recovery audit
        uses: actions/upload-artifact@v4
        with:
          name: mercadona-historical-recovery-audit
          path: historical-recovery/recovery-report.json
          retention-days: 90
          if-no-files-found: error

      - name: Upload exact reconstructed first-party snapshot
        if: ${{ hashFiles('historical-recovery/exact-snapshot/products.jsonl') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mercadona-first-party-final-recovered-2026-08-27
          path: historical-recovery/exact-snapshot/
          retention-days: 90
          if-no-files-found: error

      - name: Upload exact recovered inventory
        if: ${{ hashFiles('historical-recovery/inventory/products.jsonl') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mercadona-first-party-inventory-recovered-2026-08-27
          path: historical-recovery/inventory/
          retention-days: 90
          if-no-files-found: error
