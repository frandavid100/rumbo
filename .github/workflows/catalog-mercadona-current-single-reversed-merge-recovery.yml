name: Catalog Mercadona current single-reversed merge recovery

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-current-single-reversed-merge-recovery.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-current-single-reversed-merge-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - name: Download successful OCR shards from failed merge run
        uses: actions/download-artifact@v4
        with:
          pattern: mercadona-current-single-reversed-rerun-v2-*
          path: input
          merge-multiple: false
          repository: frandavid100/rumbo
          github-token: ${{ github.token }}
          run-id: 34173272187

      - name: Merge, validate and materialize auditable staging
        run: |
          python - <<'PY'
          import glob, json, sqlite3
          from collections import Counter
          from pathlib import Path

          source_run_id = 34173272187
          paths = sorted(glob.glob('input/**/combined-results-*.jsonl', recursive=True))
          if len(paths) != 4:
              raise SystemExit(f'expected 4 combined shard result files, got {len(paths)}: {paths}')

          rows = [
              json.loads(line)
              for path in paths
              for line in Path(path).read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          ids = [str(r.get('product_id') or '') for r in rows]
          duplicates = sorted(pid for pid, n in Counter(ids).items() if n > 1)
          if len(rows) != 46 or len(set(ids)) != 46 or duplicates:
              raise SystemExit(f'cohort drift: rows={len(rows)} distinct={len(set(ids))} duplicates={duplicates}')

          allowed = {'DECLARED', 'REVIEW', 'NO_VISUAL_REGION', 'ERROR'}
          counts = Counter(str(r.get('status') or 'UNKNOWN') for r in rows)
          bad_statuses = sorted(set(counts) - allowed)
          fields = ('calories', 'protein_g', 'carbohydrate_g', 'fat_g')
          provenance_errors = []
          unsafe_declared = []
          audited = []

          for row in sorted(rows, key=lambda r: str(r.get('product_id') or '')):
              pid = str(row.get('product_id') or '')
              if not (
                  row.get('evidence_level') == 'OCR_DERIVED_FROM_MERCADONA_IMAGE'
                  and row.get('source') == 'MERCADONA_FIRST_PARTY'
                  and row.get('source_record_kind') == 'label image'
                  and row.get('redistribution_allowed') is False
                  and str(row.get('perspective')) == '9'
              ):
                  provenance_errors.append(pid)

              status = str(row.get('status') or '')
              nutrition = row.get('nutrition')
              basis = row.get('basis')
              if status == 'DECLARED':
                  if basis not in {'100_g', '100_ml'} or not isinstance(nutrition, dict) or any(nutrition.get(f) is None for f in fields):
                      unsafe_declared.append(f'{pid}:incomplete_declared')
                  accepted = next((
                      a for a in row.get('attempts') or []
                      if isinstance(a.get('ensemble'), dict) and a['ensemble'].get('status') == 'DECLARED'
                  ), None)
                  ensemble = (accepted or {}).get('ensemble') or {}
                  if int(ensemble.get('independent_engine_families') or 0) < 2 or int(ensemble.get('corroborated_fields') or 0) < 4:
                      unsafe_declared.append(f'{pid}:insufficient_corroboration')
              elif nutrition is not None:
                  unsafe_declared.append(f'{pid}:non_declared_carries_nutrition')

              audited.append({
                  'product_id': pid,
                  'ean': row.get('ean'),
                  'name': row.get('name'),
                  'status': status,
                  'basis': basis if status == 'DECLARED' else None,
                  'nutrition': nutrition if status == 'DECLARED' else None,
                  'image_url': row.get('image_url'),
                  'image_perspective': str(row.get('perspective') or ''),
                  'source': 'MERCADONA_FIRST_PARTY/label image',
                  'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
                  'redistribution_allowed': False,
                  'image_persisted': False,
                  'missing_values_inferred': False,
                  'CLASSIFIED': 0,
                  'MENU_ELIGIBLE': 0,
              })

          image_ext = {'.jpg', '.jpeg', '.png', '.webp', '.bmp', '.tif', '.tiff'}
          persisted_images = [str(p) for p in Path('input').rglob('*') if p.is_file() and p.suffix.lower() in image_ext]
          ok = not bad_statuses and not provenance_errors and not unsafe_declared and not persisted_images
          declared_ids = sorted(a['product_id'] for a in audited if a['status'] == 'DECLARED')

          summary = {
              'source_run_id': source_run_id,
              'source_review_cohort': 48,
              'processed_p9': len(rows),
              'distinct_products_processed': len(set(ids)),
              'deferred_non_p9_product_ids': ['25353', '54053'],
              'status_counts': dict(sorted(counts.items())),
              'new_live_declared_product_ids': declared_ids,
              'new_live_declared_count': len(declared_ids),
              'unsafe_declared': unsafe_declared,
              'provenance_errors': provenance_errors,
              'unexpected_statuses': bad_statuses,
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'redistribution_allowed': False,
              'images_persisted': False,
              'missing_values_inferred': False,
              'REVIEW_promoted_without_new_live_OCR': 0,
              'nutrition_reader_version': '1.4.10',
              'mercadona_reader_version': '1.0.6',
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
              'safety_assessment': 'VALIDATED' if ok else 'FAILED',
              'recovery_reason': 'Original merge job failed after OCR succeeded because SQLite INSERT supplied 16 values for a 15-column table.',
          }

          out = Path('merged')
          out.mkdir(exist_ok=True)
          sorted_rows = sorted(rows, key=lambda r: str(r.get('product_id') or ''))
          (out / 'results.jsonl').write_text(
              ''.join(json.dumps(r, ensure_ascii=False, sort_keys=True) + '\n' for r in sorted_rows),
              encoding='utf-8',
          )
          (out / 'audited-products.json').write_text(json.dumps(audited, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (out / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          db = sqlite3.connect(out / 'staging.sqlite')
          db.execute('CREATE TABLE nutrition_ocr (product_id TEXT PRIMARY KEY, ean TEXT, name TEXT, status TEXT NOT NULL, basis TEXT, calories REAL, protein_g REAL, carbohydrate_g REAL, fat_g REAL, image_url TEXT, evidence_level TEXT NOT NULL, source TEXT NOT NULL, redistribution_allowed INTEGER NOT NULL, classified INTEGER NOT NULL, menu_eligible INTEGER NOT NULL)')
          sql = 'INSERT INTO nutrition_ocr (product_id, ean, name, status, basis, calories, protein_g, carbohydrate_g, fat_g, image_url, evidence_level, source, redistribution_allowed, classified, menu_eligible) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)'
          for a in audited:
              n = a['nutrition'] or {}
              db.execute(sql, (
                  a['product_id'], a['ean'], a['name'], a['status'], a['basis'],
                  n.get('calories'), n.get('protein_g'), n.get('carbohydrate_g'), n.get('fat_g'),
                  a['image_url'], a['evidence_level'], a['source'], 0, 0, 0,
              ))
          db.commit()
          if db.execute('SELECT COUNT(*) FROM nutrition_ocr').fetchone()[0] != 46:
              raise SystemExit('staging row-count mismatch')
          db.close()

          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if not ok:
              raise SystemExit('safety contract failed')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: mercadona-current-single-reversed-rerun-v2-merged
          path: merged/
          retention-days: 30
          if-no-files-found: error
