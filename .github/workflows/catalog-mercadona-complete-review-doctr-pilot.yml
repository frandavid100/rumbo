name: Catalog Mercadona complete REVIEW docTR pilot

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-complete-review-doctr-pilot.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: catalog-mercadona-complete-review-doctr-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve latest successful strict historical OCR audit
        id: canonical-audit
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            '/repos/frandavid100/rumbo/actions/workflows/catalog-mercadona-current-ocr-residual-audit.yml/runs?branch=agent%2Fcatalog-phase1&per_page=20' \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id')
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo "No successful canonical OCR audit run found" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using strict historical canonical audit run $run_id"

      - name: Download strict historical canonical audit
        uses: actions/download-artifact@v4
        with:
          name: mercadona-current-ocr-residual-audit
          path: tools/catalog/mercadona-current-ocr-residual-audit
          github-token: ${{ github.token }}
          run-id: ${{ steps.canonical-audit.outputs.run_id }}

      - name: Build bounded complete-REVIEW inventory
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          src = Path(
              'mercadona-current-ocr-residual-audit/current-review-failure-modes/near-safe-complete-review.jsonl'
          )
          core = ('calories', 'fat_g', 'carbohydrate_g', 'protein_g')
          rows = []
          diagnostics = {}
          for line in src.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              row = json.loads(line)
              values = row.get('diagnostic_candidate_values') or {}
              pid = str(row.get('product_id') or '').strip()
              if not (
                  row.get('canonical_status') == 'REVIEW'
                  and row.get('basis') in {'100_g', '100_ml'}
                  and int(row.get('independent_engine_families') or 0) >= 2
                  and 0 <= int(row.get('corroborated_fields') or 0) < 4
                  and all(values.get(field) is not None for field in core)
                  and not (row.get('safety_blockers') or [])
                  and pid
                  and str(row.get('ean') or '').strip()
                  and str(row.get('image_url') or '').strip()
              ):
                  continue
              rows.append({'product_id': pid})
              diagnostics[pid] = {
                  'ean': str(row.get('ean')).strip(),
                  'image_url': str(row.get('image_url')).strip(),
                  'basis': row.get('basis'),
                  'corroborated_fields': int(row.get('corroborated_fields') or 0),
                  'independent_engine_families': int(row.get('independent_engine_families') or 0),
                  'latest_raw_run_id': row.get('latest_raw_run_id'),
                  'confidence': row.get('confidence'),
              }

          rows.sort(key=lambda row: (len(row['product_id']), row['product_id']))
          if not rows:
              raise SystemExit('No strict-historical clean complete REVIEW targets remain')
          Path('complete-review-live-target-inventory.jsonl').write_text(
              ''.join(json.dumps(row, sort_keys=True) + '\n' for row in rows),
              encoding='utf-8',
          )
          Path('complete-review-diagnostics.json').write_text(
              json.dumps(diagnostics, ensure_ascii=False, indent=2, sort_keys=True),
              encoding='utf-8',
          )
          print(json.dumps({
              'target_count': len(rows),
              'product_ids': [row['product_id'] for row in rows],
              'selection': 'STRICT_HISTORICAL_NEAR_SAFE_COMPLETE_REVIEW',
          }, sort_keys=True))
          PY

      - name: Rehydrate current official first-party details
        working-directory: tools/catalog
        run: |
          set -euo pipefail
          rm -rf mercadona-first-party-complete-review-live
          python mercadona_first_party_details.py \
            --inventory complete-review-live-target-inventory.jsonl \
            --out mercadona-first-party-complete-review-live \
            --shard-index 0 \
            --shard-count 1 \
            --timeout 20 \
            --delay 0.2

          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(
              Path('mercadona-first-party-complete-review-live/summary-00.json').read_text(encoding='utf-8')
          )
          errors = [
              json.loads(line)
              for line in Path('mercadona-first-party-complete-review-live/errors-00.jsonl').read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          if errors or summary.get('fetched') != summary.get('requested'):
              raise SystemExit(f'Targeted first-party rehydration incomplete: summary={summary} errors={errors}')
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY

      - name: Require exact EAN and exact current first-party perspective=9 image
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mercadona-complete-review-doctr-input-src
          mkdir -p mercadona-complete-review-doctr-input-src
          python - <<'PY'
          import json
          from pathlib import Path

          diagnostics = json.loads(Path('complete-review-diagnostics.json').read_text(encoding='utf-8'))
          product_path = Path('mercadona-first-party-complete-review-live/details-00.jsonl')
          out = Path('mercadona-complete-review-doctr-input-src')

          selected = []
          missing_current_ean = []
          reassigned = []
          unmatched_p9 = []

          for line in product_path.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              product = json.loads(line)
              pid = str(product.get('product_id') or '').strip()
              diag = diagnostics.get(pid)
              if diag is None:
                  continue

              anchor_ean = diag['ean']
              current_ean = str(product.get('ean') or '').strip()
              if not current_ean:
                  missing_current_ean.append(pid)
                  continue
              if current_ean != anchor_ean:
                  reassigned.append(pid)
                  continue

              image_url = diag['image_url']
              photos = product.get('photos') if isinstance(product.get('photos'), list) else []
              matches = [
                  (idx, photo)
                  for idx, photo in enumerate(photos)
                  if isinstance(photo, dict)
                  and str(photo.get('perspective') or '') == '9'
                  and str(photo.get('zoom') or '') == image_url
              ]
              if len(matches) != 1:
                  unmatched_p9.append(pid)
                  continue

              image_index, photo = matches[0]
              candidate = dict(product)
              candidate['photos'] = [dict(photo)]
              candidate['_near_safe_image_meta'] = {
                  'image_url': image_url,
                  'image_index': image_index,
                  'perspective': 9,
                  'canonical_ean': anchor_ean,
                  'current_ean': current_ean,
                  'identity_basis': 'EXACT_CURRENT_EAN_MATCH',
                  'canonical_latest_raw_run_id': diag.get('latest_raw_run_id'),
                  'canonical_corroborated_fields': diag.get('corroborated_fields'),
                  'canonical_engine_families': diag.get('independent_engine_families'),
                  'canonical_confidence': diag.get('confidence'),
              }
              selected.append(candidate)

          selected.sort(key=lambda row: (0 if row.get('ingredients') else 1, str(row.get('product_id') or '')))
          if not selected:
              raise SystemExit(
                  'No exact-EAN exact-current-p9 target remains; '
                  f'missing_ean={missing_current_ean} reassigned={reassigned} unmatched_p9={unmatched_p9}'
              )

          with_ingredients = [row for row in selected if row.get('ingredients')]
          without_ingredients = [row for row in selected if not row.get('ingredients')]

          for name, data in (
              ('with-ingredients.jsonl', with_ingredients),
              ('without-ingredients.jsonl', without_ingredients),
          ):
              (out / name).write_text(
                  ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in data),
                  encoding='utf-8',
              )

          summary = {
              'inventory_products': 4280,
              'strict_historical_complete_review_targets': len(diagnostics),
              'selected': len(selected),
              'selected_product_ids': [str(row.get('product_id')) for row in selected],
              'selected_with_structured_ingredients': len(with_ingredients),
              'selected_without_structured_ingredients': len(without_ingredients),
              'missing_current_ean': sorted(set(missing_current_ean)),
              'reassigned_current_product_ids': sorted(set(reassigned)),
              'unmatched_current_first_party_p9': sorted(set(unmatched_p9)),
              'selection_policy': 'STRICT_HISTORICAL_COMPLETE_REVIEW; EXACT_NONEMPTY_EAN_IDENTITY; EXACT_CURRENT_FIRST_PARTY_PERSPECTIVE_9_IMAGE; DOCTR_MAY_ADD_AN_INDEPENDENT_FAMILY',
              'cross_run_value_fusion': False,
              'current_observation_must_satisfy_declared_contract_independently': True,
              'acceptance_policy_changed': False,
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'redistribution_allowed': False,
              'images_persisted': False,
              'missing_values_inferred': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          (out / 'selection-summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: mercadona-complete-review-doctr-input
          path: tools/catalog/mercadona-complete-review-doctr-input-src/
          retention-days: 30
          if-no-files-found: error

  ocr:
    runs-on: ubuntu-24.04
    needs: prepare
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1]
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v4
        with:
          name: mercadona-complete-review-doctr-input
          path: tools/catalog/retry-input

      - name: Install OCR and detector dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check \
            'paddleocr>=3.7,<3.8' \
            'easyocr>=1.7,<1.8' \
            'python-doctr==1.1.0' \
            opencv-python-headless Pillow

      - name: Run conservative OCR safety regressions
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_label_doctr_extractor.py \
            test_mercadona_near_safe_doctr_retry.py \
            test_mercadona_ocr_safety_regressions.py \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_label_reader_row_tokens.py \
            test_nutrition_ocr_ensemble.py \
            test_label_image_preprocess.py

      - name: OCR bounded complete REVIEW retry
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mercadona-complete-review-doctr-pilot/with-ingredients
          mkdir -p mercadona-complete-review-doctr-pilot/without-ingredients

          run_group() {
            local products="$1"
            local out="$2"
            local mode="$3"
            if [[ ! -s "$products" ]]; then
              return 0
            fi
            set +e
            python mercadona_near_safe_doctr_retry.py \
              --products "$products" \
              --out "$out" \
              --shard-index ${{ matrix.shard }} \
              --shard-count 2 \
              --limit 0 \
              --eligibility-mode "$mode"
            rc=$?
            set -e
            if [[ $rc -ne 0 && $rc -ne 2 ]]; then
              return "$rc"
            fi
          }

          cp retry-input/with-ingredients.jsonl .
          cp retry-input/without-ingredients.jsonl .
          cp retry-input/selection-summary.json mercadona-complete-review-doctr-pilot/selection-summary.json

          run_group with-ingredients.jsonl mercadona-complete-review-doctr-pilot/with-ingredients priority
          run_group without-ingredients.jsonl mercadona-complete-review-doctr-pilot/without-ingredients p9-no-ingredients-all

          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('mercadona-complete-review-doctr-pilot')
          summary = json.loads((root / 'selection-summary.json').read_text(encoding='utf-8'))
          summary.update({
              'shard_index': int('${{ matrix.shard }}'),
              'shard_count': 2,
              'parser_version_contract': 'nutrition_label_reader current branch version',
              'new_independent_ocr_family': 'doctr',
          })
          (root / 'pilot-metadata.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-complete-review-doctr-pilot-${{ matrix.shard }}
          path: tools/catalog/mercadona-complete-review-doctr-pilot/
          retention-days: 90
          if-no-files-found: error

  reconcile:
    runs-on: ubuntu-24.04
    needs: ocr
    if: ${{ needs.ocr.result == 'success' }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Trigger strict historical canonical reconciliation
        run: |
          gh workflow run catalog-mercadona-current-ocr-residual-audit.yml \
            --repo frandavid100/rumbo \
            --ref agent/catalog-phase1
