name: Catalog Tesseract screen

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - 'tools/catalog/tesseract_screen.py'
      - 'tools/catalog/fixtures/tesseract_screen_batch.json'
      - '.github/workflows/catalog-tesseract-screen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Tesseract y visión
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check opencv-python-headless Pillow
      - name: Cribar candidatos OCR
        working-directory: tools/catalog
        run: python tesseract_screen.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-tesseract-screen-report
          path: |
            tools/catalog/tesseract-screen-output/summary.json
            tools/catalog/tesseract-screen-output/report.json
          if-no-files-found: warn
          retention-days: 7
