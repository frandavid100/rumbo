name: Apply canonical culinary roles

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/remove-legacy-catalog-canonical-policy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-legacy-catalog-canonical-policy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar núcleo canónico
        run: python tools/apply_canonical_culinary_roles.py
      - name: Guardar primera fase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java
          git commit -m "Migrar núcleo a roles culinarios canónicos"
          git push origin HEAD:agent/remove-legacy-catalog-canonical-policy
