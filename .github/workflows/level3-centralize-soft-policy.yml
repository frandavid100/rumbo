name: Level 3 centralize soft policy
on:
  push:
    branches: [agent/level3-culinary-satisfaction-v2]
    paths: [.github/workflows/level3-centralize-soft-policy.yml]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/level3-culinary-satisfaction-v2
      - run: python scripts/level3_centralize_soft_policy.py
      - run: |
          rm scripts/level3_centralize_soft_policy.py
          rm .github/workflows/level3-centralize-soft-policy.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Centralizar preferencias culinarias de nivel 3"
          git push origin HEAD:agent/level3-culinary-satisfaction-v2
