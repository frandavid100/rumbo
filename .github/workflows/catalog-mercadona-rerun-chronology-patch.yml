name: Catalog Mercadona rerun chronology patch

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-rerun-chronology-patch.yml'
      - 'tools/catalog/apply_mercadona_rerun_chronology_patch.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply patch and run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python tools/catalog/apply_mercadona_rerun_chronology_patch.py
          cd tools/catalog
          python -m unittest -v test_summarize_mercadona_ocr_run_union.py
          python -m py_compile summarize_mercadona_ocr_run_union.py

      - name: Commit chronology fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/catalog/summarize_mercadona_ocr_run_union.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Reconcile Mercadona OCR by artifact creation time'
          git push origin HEAD:agent/catalog-phase1
