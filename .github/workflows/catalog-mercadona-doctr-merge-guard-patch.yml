name: Catalog Mercadona docTR merge guard patch

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-doctr-merge-guard-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
          fetch-depth: 1

      - name: Patch merge input guard and remove one-shot repair workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          target = Path('.github/workflows/catalog-mercadona-near-safe-three-of-four-doctr-pilot.yml')
          text = target.read_text(encoding='utf-8')
          guard = """      - name: Exclude stale merged artifact from prior rerun attempts\n        shell: bash\n        run: rm -rf input/mercadona-near-safe-three-of-four-doctr-pilot-merged\n\n"""
          needle = """      - name: Merge, validate, and stage auditable pilot results\n        run: |\n"""
          if guard not in text:
              if text.count(needle) != 1:
                  raise SystemExit(f'expected exactly one merge step anchor, got {text.count(needle)}')
              text = text.replace(needle, guard + needle, 1)
              target.write_text(text, encoding='utf-8')

          for obsolete in (
              '.github/workflows/catalog-mercadona-doctr-merge-repair.yml',
              '.github/workflows/catalog-mercadona-doctr-merge-guard-patch.yml',
          ):
              Path(obsolete).unlink(missing_ok=True)
          PY

          grep -A4 -B2 'Exclude stale merged artifact' .github/workflows/catalog-mercadona-near-safe-three-of-four-doctr-pilot.yml

      - name: Commit permanent guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/catalog-mercadona-near-safe-three-of-four-doctr-pilot.yml \
                  .github/workflows/catalog-mercadona-doctr-merge-repair.yml \
                  .github/workflows/catalog-mercadona-doctr-merge-guard-patch.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Guard Mercadona docTR merge against stale rerun artifacts'
          git push origin HEAD:agent/catalog-phase1
