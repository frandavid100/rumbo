name: Fix catalog scroll state type

on:
  push:
    branches: [agent/certified-day-witness-level1]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/certified-day-witness-level1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ajustar estado
        run: |
          python tools/fix_catalog_scroll_state_type.py
          git diff --check
      - name: Guardar corrección
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/es/david/rumbo/ui/App.kt
          git commit -m "Ajustar estado del scroll del buscador"
          git push origin HEAD:agent/certified-day-witness-level1
