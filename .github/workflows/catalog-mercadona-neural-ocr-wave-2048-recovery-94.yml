name: Catalog Mercadona neural OCR wave 2048 recovery shard 94

# Targeted recovery for the only missing deterministic shard of the 2048 wave.
# The matrix re-run left shard 94 queued without a runner while the merge already
# executed, so retry only these 16 rows rather than duplicating the full wave.
on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-neural-ocr-wave-2048-recovery-94.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-neural-ocr-wave-2048-recovery-94-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download consolidated Mercadona first-party cut
        uses: actions/download-artifact@v4
        with:
          name: mercadona-first-party-final
          path: tools/catalog/mercadona-first-party-final
          github-token: ${{ github.token }}
          run-id: 33046950149
      - name: Install independent OCR engines and visual detector dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow
      - name: Run conservative OCR regression tests
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_label_easyocr_extractor.py \
            test_nutrition_label_reader.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_ocr_safety_regressions.py
      - name: Recover deterministic shard 94
        working-directory: tools/catalog
        run: |
          python mercadona_neural_ocr_wave.py \
            --products mercadona-first-party-final/products.jsonl \
            --out mercadona-neural-ocr-wave-2048-recovery-94 \
            --shard-index 94 \
            --shard-count 128 \
            --limit 16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-neural-ocr-wave-2048-recovery-94
          path: tools/catalog/mercadona-neural-ocr-wave-2048-recovery-94/
          retention-days: 30
          if-no-files-found: warn
