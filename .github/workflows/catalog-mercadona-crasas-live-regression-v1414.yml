name: Catalog Mercadona Crasas live regression v1.4.14

on:
  push:
    branches: [agent/catalog-phase1]
    paths: ['.github/workflows/catalog-mercadona-crasas-live-regression-v1414.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: catalog-mercadona-crasas-live-regression-v1414-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: mercadona-first-party-final
          path: tools/catalog/mercadona-first-party-final
          repository: frandavid100/rumbo
          github-token: ${{ github.token }}
          run-id: 33046950149

      - name: Validate focused parser safety suite
        run: |
          python -m pip install --disable-pip-version-check Pillow opencv-python-headless
          cd tools/catalog
          python -m unittest -v test_nutrition_label_reader_easyocr_zero_glyph.py test_nutrition_label_reader_row_tokens.py
          python -c "import nutrition_label_reader as n; assert n.READER_VERSION == '1.4.14'"

      - name: Install OCR engines
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8'

      - name: Build exact first-party input
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('mercadona-first-party-final/products.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          row=next((r for r in rows if str(r.get('product_id') or '')=='27321'),None)
          if row is None or not row.get('ingredients'): raise SystemExit('product 27321 inventory drift')
          p9=[p for p in (row.get('photos') or []) if isinstance(p,dict) and str(p.get('perspective'))=='9' and p.get('zoom')]
          if len(p9)!=1: raise SystemExit(f'p9 drift: {len(p9)}')
          Path('crasas-v1414-input.jsonl').write_text(json.dumps(row,ensure_ascii=False,sort_keys=True)+'\n',encoding='utf-8')
          Path('crasas-v1414-selection.json').write_text(json.dumps({
            'product_id':'27321','name':row.get('name'),'ean':row.get('ean'),'perspective':'9','image_url':p9[0]['zoom'],
            'reader_version':'1.4.14','expected':{'basis':'100_ml','calories':42.0,'fat_g':0.0,'carbohydrate_g':10.6,'protein_g':0.0},
            'evidence_level':'OCR_DERIVED_FROM_MERCADONA_IMAGE','source':'MERCADONA_FIRST_PARTY/label image',
            'redistribution_allowed':False,'CLASSIFIED':0,'MENU_ELIGIBLE':0
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Reprocess exact product
        working-directory: tools/catalog
        shell: bash
        run: |
          set +e
          python mercadona_neural_ocr_tesseract_preprocess_rescue.py \
            --products crasas-v1414-input.jsonl --out mercadona-crasas-live-v1414 \
            --shard-index 0 --shard-count 1 --limit 0 --delay 0.25 --eligibility-mode priority
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi

      - name: Audit exact live evidence
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('mercadona-crasas-live-v1414/results-00.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          if len(rows)!=1 or str(rows[0].get('product_id') or '')!='27321': raise SystemExit('cohort drift')
          r=rows[0]; n=r.get('nutrition') or {}
          expected={'calories':42.0,'fat_g':0.0,'carbohydrate_g':10.6,'protein_g':0.0}
          accepted=next((a for a in (r.get('attempts') or []) if isinstance(a.get('ensemble'),dict) and a['ensemble'].get('status')=='DECLARED'),None)
          ens=(accepted or {}).get('ensemble') or {}
          prov=(r.get('evidence_level')=='OCR_DERIVED_FROM_MERCADONA_IMAGE' and r.get('source')=='MERCADONA_FIRST_PARTY' and r.get('source_record_kind')=='label image' and r.get('redistribution_allowed') is False and str(r.get('perspective'))=='9')
          image_ext={'.jpg','.jpeg','.png','.webp','.bmp','.tif','.tiff'}
          persisted=[str(x) for x in Path('mercadona-crasas-live-v1414').rglob('*') if x.is_file() and x.suffix.lower() in image_ext]
          exact=all(n.get(k)==v for k,v in expected.items())
          summary={
            'processed':1,'product_id':'27321','name':'Refresco Coca-Cola','status':r.get('status'),'basis':r.get('basis'),
            'nutrition':n if r.get('status')=='DECLARED' else None,'diagnostic_nutrition':n,
            'corroborated_fields':int(ens.get('corroborated_fields') or 0),'independent_engine_families':int(ens.get('independent_engine_families') or 0),
            'expected_values_match':exact,'provenance_ok':prov,'images_persisted':False if not persisted else persisted,
            'reader_version':'1.4.14','missing_values_inferred':False,'evidence_level':'OCR_DERIVED_FROM_MERCADONA_IMAGE',
            'source':'MERCADONA_FIRST_PARTY/label image','redistribution_allowed':False,'CLASSIFIED':0,'MENU_ELIGIBLE':0
          }
          ok=(r.get('status')=='DECLARED' and r.get('basis')=='100_ml' and exact and prov and summary['corroborated_fields']>=4 and summary['independent_engine_families']>=2 and not persisted)
          summary['safety_assessment']='VALIDATED' if ok else 'REVIEW_REMAINS'
          out=Path('mercadona-crasas-live-regression-v1414'); out.mkdir(exist_ok=True)
          (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (out/'results.jsonl').write_text(json.dumps(r,ensure_ascii=False,sort_keys=True)+'\n',encoding='utf-8')
          (out/'selection.json').write_text(Path('crasas-v1414-selection.json').read_text(encoding='utf-8'),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          if not prov or persisted: raise SystemExit('provenance/image persistence safety failure')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-crasas-live-regression-v1414
          path: tools/catalog/mercadona-crasas-live-regression-v1414/
          retention-days: 30
          if-no-files-found: warn
