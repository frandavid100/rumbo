name: Prueba regression APK

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Reconstruir interfaz y catálogo Carrefour
        run: |
          cat .build-input/app/part-* > app/src/main/java/es/david/rumbo/ui/App.kt
          mkdir -p app/src/main/assets
          cat .build-input/catalog/part-* | gzip -dc > app/src/main/assets/catalog.sqlite
          test -s app/src/main/assets/catalog.sqlite
          test "$(sqlite3 app/src/main/assets/catalog.sqlite 'SELECT COUNT(*) FROM products;')" -eq 8449
      - uses: gradle/actions/setup-gradle@v4
      - name: Probar y compilar
        run: ./gradlew test assembleRelease
      - name: Preparar herramientas de firma
        run: |
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p build/signing-tools/lib build/signing-tools/lib64 build/signed
          cp "$BUILD_TOOLS/apksigner" "$BUILD_TOOLS/zipalign" build/signing-tools/
          cp "$BUILD_TOOLS/lib/apksigner.jar" build/signing-tools/lib/
          cp "$BUILD_TOOLS/lib64/libc++.so" build/signing-tools/lib64/
      - name: Firmar APK
        env:
          RUMBO_SIGNING_KEY_BASE64: ${{ secrets.RUMBO_SIGNING_KEY_BASE64 }}
          RUMBO_SIGNING_PASSWORD: ${{ secrets.RUMBO_SIGNING_PASSWORD }}
        run: |
          printf '%s' "$RUMBO_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/rumbo-release.jks"
          build/signing-tools/zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/Rumbo-0.77.5-carrefour-aligned.apk"
          build/signing-tools/apksigner sign --ks "$RUNNER_TEMP/rumbo-release.jks" --ks-key-alias rumbo --ks-pass "pass:$RUMBO_SIGNING_PASSWORD" --key-pass "pass:$RUMBO_SIGNING_PASSWORD" --out build/signed/Rumbo-0.77.5-carrefour.apk "$RUNNER_TEMP/Rumbo-0.77.5-carrefour-aligned.apk"
          build/signing-tools/apksigner verify --verbose --print-certs build/signed/Rumbo-0.77.5-carrefour.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rumbo-0.77.5-carrefour-complete-short-circuit
          path: build/signed/Rumbo-0.77.5-carrefour.apk
          if-no-files-found: error
          retention-days: 7
