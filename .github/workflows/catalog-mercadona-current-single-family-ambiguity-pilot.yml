name: Catalog Mercadona current single-family ambiguity pilot

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-current-single-family-ambiguity-pilot.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: catalog-mercadona-current-single-family-ambiguity-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve latest successful strict OCR audit
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            '/repos/frandavid100/rumbo/actions/workflows/catalog-mercadona-current-ocr-residual-audit.yml/runs?branch=agent%2Fcatalog-phase1&per_page=30' \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id')
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo 'No successful strict OCR audit found' >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using strict OCR audit run $run_id"

      - name: Download strict canonical audit
        uses: actions/download-artifact@v4
        with:
          name: mercadona-current-ocr-residual-audit
          path: /tmp/mercadona-audit
          github-token: ${{ github.token }}
          run-id: ${{ steps.audit.outputs.run_id }}

      - name: Select current ambiguity-only single-family cohort and rehydrate live first-party detail
        working-directory: tools/catalog
        env:
          AUDIT_RUN_ID: ${{ steps.audit.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from mercadona_first_party_details import _get_json, normalize, _now

          CORE = ('calories', 'fat_g', 'carbohydrate_g', 'protein_g')
          source = Path('/tmp/mercadona-audit/current-review-failure-modes/complete-but-safety-blocked.jsonl')
          rows = [json.loads(line) for line in source.read_text(encoding='utf-8').splitlines() if line.strip()]
          eligible = []
          for row in rows:
              values = row.get('diagnostic_candidate_values') or {}
              if not (
                  row.get('canonical_status') == 'REVIEW'
                  and int(row.get('independent_engine_families') or 0) == 1
                  and int(row.get('corroborated_fields') or 0) == 0
                  and row.get('basis') in {'100_g', '100_ml'}
                  and set(row.get('safety_blockers') or []) == {'AMBIGUOUS_TABLE'}
                  and 'MULTIPLE_NUTRITION_COLUMNS' in set(row.get('reason_prefixes') or [])
                  and all(values.get(field) is not None for field in CORE)
                  and str(row.get('product_id') or '').strip()
                  and str(row.get('ean') or '').strip()
                  and str(row.get('image_url') or '').strip()
              ):
                  continue
              eligible.append(row)
          eligible.sort(key=lambda row: (len(str(row.get('product_id') or '')), str(row.get('product_id') or '')))
          selected = eligible[:4]
          if not selected:
              raise SystemExit('No current ambiguity-only single-family candidates remain')

          live_rows = []
          skipped = []
          anchors = {}
          for old in selected:
              pid = str(old['product_id'])
              anchor_ean = str(old['ean']).strip()
              anchor_url = str(old['image_url']).strip()
              try:
                  observed_at = _now()
                  payload, source_url = _get_json(pid, timeout=20.0)
                  current = normalize(payload, source_url=source_url, observed_at=observed_at)
              except Exception as exc:
                  skipped.append({'product_id': pid, 'reason': f'LIVE_DETAIL_ERROR:{type(exc).__name__}:{exc}'})
                  continue
              current_ean = str(current.get('ean') or '').strip()
              if current_ean != anchor_ean:
                  skipped.append({'product_id': pid, 'reason': 'CURRENT_EAN_MISMATCH', 'anchor_ean': anchor_ean, 'current_ean': current_ean})
                  continue
              photos = current.get('photos') if isinstance(current.get('photos'), list) else []
              matches = [
                  (index, photo) for index, photo in enumerate(photos)
                  if isinstance(photo, dict)
                  and str(photo.get('perspective') or '') == '9'
                  and str(photo.get('zoom') or '') == anchor_url
              ]
              if len(matches) != 1:
                  skipped.append({'product_id': pid, 'reason': 'CURRENT_EXACT_P9_IMAGE_NOT_UNIQUE', 'matches': len(matches)})
                  continue
              image_index, photo = matches[0]
              routed = dict(photo)
              routed['perspective'] = 9
              current['photos'] = [routed]
              current['_current_single_family_ambiguity_meta'] = {
                  'canonical_audit_run_id': int(os.environ['AUDIT_RUN_ID']),
                  'canonical_latest_raw_run_id': old.get('latest_raw_run_id'),
                  'canonical_ean': anchor_ean,
                  'current_ean': current_ean,
                  'image_url': anchor_url,
                  'image_index': image_index,
                  'canonical_basis': old.get('basis'),
                  'canonical_engine_families': int(old.get('independent_engine_families') or 0),
                  'canonical_corroborated_fields': int(old.get('corroborated_fields') or 0),
                  'canonical_safety_blockers': list(old.get('safety_blockers') or []),
                  'canonical_reason_prefixes': list(old.get('reason_prefixes') or []),
                  'live_detail_source_url': source_url,
                  'live_detail_observed_at': observed_at,
              }
              anchors[pid] = current['_current_single_family_ambiguity_meta']
              live_rows.append(current)

          if not live_rows:
              raise SystemExit('No selected candidate retained exact current EAN + exact current first-party p9 image')

          with_ingredients = [row for row in live_rows if row.get('ingredients')]
          without_ingredients = [row for row in live_rows if not row.get('ingredients')]
          def write_jsonl(path, data):
              Path(path).write_text(''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in data), encoding='utf-8')
          write_jsonl('current-single-family-ambiguity-with-ingredients.jsonl', with_ingredients)
          write_jsonl('current-single-family-ambiguity-without-ingredients.jsonl', without_ingredients)
          Path('current-single-family-ambiguity-anchors.json').write_text(json.dumps(anchors, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          Path('current-single-family-ambiguity-selection.json').write_text(json.dumps({
              'canonical_audit_run_id': int(os.environ['AUDIT_RUN_ID']),
              'eligible_current_canonical_rows': len(eligible),
              'selected': len(selected),
              'selected_product_ids': [str(row['product_id']) for row in selected],
              'live_exact_identity_and_image': len(live_rows),
              'live_product_ids': [str(row['product_id']) for row in live_rows],
              'with_structured_ingredients': len(with_ingredients),
              'without_structured_ingredients': len(without_ingredients),
              'skipped': skipped,
              'selection_policy': 'CURRENT CANONICAL REVIEW; COMPLETE DIAGNOSTIC TUPLE; EXACTLY ONE HISTORICAL OCR FAMILY; 0 CORROBORATED FIELDS; SOLE AMBIGUOUS_TABLE BLOCKER; MULTIPLE_NUTRITION_COLUMNS; EXPLICIT PER-100 BASIS; EXACT LIVE EAN + SAME FIRST-PARTY P9 IMAGE',
              'historical_values_promotion_allowed': False,
              'cross_run_value_fusion': False,
              'cross_crop_value_fusion': False,
              'acceptance_policy_changed': False,
              'images_persisted': False,
          }, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({'selected': len(selected), 'live': len(live_rows), 'ids': [str(row['product_id']) for row in live_rows], 'skipped': skipped}, ensure_ascii=False, sort_keys=True))
          PY

      - name: Install OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check \
            'paddleocr>=3.7,<3.8' \
            'easyocr>=1.7,<1.8' \
            'python-doctr==1.1.0' \
            opencv-python-headless Pillow

      - name: Run conservative regression suite before fresh OCR
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_mercadona_ambiguous_primary_column_rescue.py \
            test_mercadona_bounded_doctr_rescue.py \
            test_mercadona_near_safe_doctr_retry.py \
            test_label_doctr_extractor.py \
            test_mercadona_ocr_safety_regressions.py \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_label_reader_row_tokens.py \
            test_nutrition_ocr_ensemble.py \
            test_label_image_preprocess.py
          python -m py_compile mercadona_ambiguous_primary_column_rescue.py mercadona_bounded_doctr_rescue.py mercadona_near_safe_doctr_retry.py

      - name: Run fresh independent ambiguity rescue for products with structured ingredients
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current-single-family-ambiguity/raw-with-ingredients
          if [[ -s current-single-family-ambiguity-with-ingredients.jsonl ]]; then
            set +e
            python mercadona_ambiguous_primary_column_rescue.py \
              --products current-single-family-ambiguity-with-ingredients.jsonl \
              --out current-single-family-ambiguity/raw-with-ingredients \
              --shard-index 0 --shard-count 1 --limit 0 --delay 0.35 \
              --eligibility-mode priority
            rc=$?
            set -e
            [[ $rc -eq 0 || $rc -eq 2 ]]
          fi

      - name: Run fresh independent ambiguity rescue for products without structured ingredients
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current-single-family-ambiguity/raw-without-ingredients
          if [[ -s current-single-family-ambiguity-without-ingredients.jsonl ]]; then
            set +e
            python mercadona_ambiguous_primary_column_rescue.py \
              --products current-single-family-ambiguity-without-ingredients.jsonl \
              --out current-single-family-ambiguity/raw-without-ingredients \
              --shard-index 0 --shard-count 1 --limit 0 --delay 0.35 \
              --eligibility-mode p9-no-ingredients-all
            rc=$?
            set -e
            [[ $rc -eq 0 || $rc -eq 2 ]]
          fi

      - name: Validate fresh evidence and materialize auditable JSONL + SQLite
        working-directory: tools/catalog
        env:
          AUDIT_RUN_ID: ${{ steps.audit.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import json
          from pathlib import Path
          import sqlite3

          CORE = ('calories', 'fat_g', 'carbohydrate_g', 'protein_g')
          root = Path('current-single-family-ambiguity')
          root.mkdir(exist_ok=True)
          selection = json.loads(Path('current-single-family-ambiguity-selection.json').read_text(encoding='utf-8'))
          anchors = json.loads(Path('current-single-family-ambiguity-anchors.json').read_text(encoding='utf-8'))
          result_paths = sorted(glob.glob(str(root / 'raw-*' / 'results-*.jsonl')))
          rows = []
          for path in result_paths:
              rows.extend(json.loads(line) for line in Path(path).read_text(encoding='utf-8').splitlines() if line.strip())
          expected_ids = set(selection['live_product_ids'])
          observed_ids = [str(row.get('product_id') or '') for row in rows]
          if len(rows) != len(expected_ids) or set(observed_ids) != expected_ids or len(observed_ids) != len(set(observed_ids)):
              raise SystemExit(f'Fresh OCR coverage mismatch expected={sorted(expected_ids)} observed={observed_ids}')

          invalid = []
          declared = []
          for row in rows:
              pid = str(row.get('product_id') or '')
              anchor = anchors[pid]
              if (
                  str(row.get('ean') or '') != str(anchor.get('canonical_ean') or '')
                  or str(row.get('image_url') or '') != str(anchor.get('image_url') or '')
                  or row.get('source') != 'MERCADONA_FIRST_PARTY'
                  or row.get('source_record_kind') != 'label image'
                  or row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE'
                  or row.get('redistribution_allowed') is not False
                  or str(row.get('perspective')) != '9'
              ):
                  invalid.append(f'{pid}:provenance_or_identity')
              row['pilot_canonical_audit_run_id'] = int(anchor['canonical_audit_run_id'])
              row['pilot_canonical_latest_raw_run_id'] = anchor.get('canonical_latest_raw_run_id')
              row['pilot_historical_engine_families'] = anchor.get('canonical_engine_families')
              row['pilot_historical_corroborated_fields'] = anchor.get('canonical_corroborated_fields')
              row['pilot_historical_safety_blockers'] = anchor.get('canonical_safety_blockers')
              row['live_detail_source_url'] = anchor.get('live_detail_source_url')
              row['live_detail_observed_at'] = anchor.get('live_detail_observed_at')
              row['historical_values_promotion_allowed'] = False
              row['cross_run_value_fusion'] = False
              row['cross_crop_value_fusion'] = False
              row['current_crop_must_satisfy_declared_contract_independently'] = True
              row['acceptance_policy_changed'] = False
              if row.get('status') == 'DECLARED':
                  nutrition = row.get('nutrition') or {}
                  valid_attempts = []
                  for attempt in row.get('attempts') or []:
                      ensemble = attempt.get('ensemble') or {}
                      if (
                          ensemble.get('status') == 'DECLARED'
                          and ensemble.get('basis') in {'100_g', '100_ml'}
                          and int(ensemble.get('independent_engine_families') or 0) >= 2
                          and int(ensemble.get('corroborated_fields') or 0) >= 4
                          and not (ensemble.get('reasons') or [])
                          and all((ensemble.get('nutrition') or {}).get(field) is not None for field in CORE)
                      ):
                          valid_attempts.append(ensemble)
                  if not valid_attempts or any(nutrition.get(field) is None for field in CORE):
                      invalid.append(f'{pid}:fresh_declared_does_not_meet_unchanged_contract')
                  else:
                      declared.append(pid)
          if invalid:
              raise SystemExit('Unsafe fresh OCR evidence: ' + ','.join(invalid))

          rows.sort(key=lambda row: (len(str(row.get('product_id') or '')), str(row.get('product_id') or '')))
          (root / 'results-merged.jsonl').write_text(''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in rows), encoding='utf-8')
          status_counts = {}
          for row in rows:
              status = str(row.get('status') or 'UNKNOWN')
              status_counts[status] = status_counts.get(status, 0) + 1
          summary = {
              'inventory_products': 4280,
              'canonical_audit_run_id': int(selection['canonical_audit_run_id']),
              'eligible_current_canonical_rows': selection['eligible_current_canonical_rows'],
              'selected': selection['selected'],
              'processed': len(rows),
              'status_counts': dict(sorted(status_counts.items())),
              'fresh_safe_declared': len(declared),
              'fresh_safe_declared_product_ids': sorted(declared),
              'selection_policy': selection['selection_policy'],
              'rescue_policy': 'FRESH TEMPORARY PRIMARY-COLUMN OBSERVATION MUST INDEPENDENTLY SATISFY UNCHANGED DECLARED CONTRACT; HISTORICAL VALUES ARE DIAGNOSTIC ONLY; NO CROSS-RUN OR CROSS-CROP VALUE FUSION',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'redistribution_allowed': False,
              'historical_values_promotion_allowed': False,
              'cross_run_value_fusion': False,
              'cross_crop_value_fusion': False,
              'acceptance_policy_changed': False,
              'images_persisted': False,
              'missing_values_inferred': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          (root / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          db = root / 'results.sqlite3'
          if db.exists():
              db.unlink()
          conn = sqlite3.connect(db)
          conn.execute('CREATE TABLE ocr_results (product_id TEXT PRIMARY KEY, ean TEXT, status TEXT NOT NULL, evidence_level TEXT NOT NULL, source TEXT NOT NULL, redistribution_allowed INTEGER NOT NULL, basis TEXT, calories REAL, fat_g REAL, carbohydrate_g REAL, protein_g REAL, payload_json TEXT NOT NULL)')
          for row in rows:
              n = row.get('nutrition') or {}
              conn.execute('INSERT INTO ocr_results VALUES (?,?,?,?,?,?,?,?,?,?,?,?)', (
                  str(row.get('product_id') or ''), str(row.get('ean') or ''), str(row.get('status') or ''),
                  str(row.get('evidence_level') or ''), 'MERCADONA_FIRST_PARTY/label image', 0,
                  row.get('basis'), n.get('calories'), n.get('fat_g'), n.get('carbohydrate_g'), n.get('protein_g'),
                  json.dumps(row, ensure_ascii=False, sort_keys=True),
              ))
          conn.commit(); conn.close()
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: mercadona-current-single-family-ambiguity-pilot-merged
          path: |
            tools/catalog/current-single-family-ambiguity/results-merged.jsonl
            tools/catalog/current-single-family-ambiguity/results.sqlite3
            tools/catalog/current-single-family-ambiguity/summary.json
            tools/catalog/current-single-family-ambiguity-selection.json
          retention-days: 30
          if-no-files-found: error

      - name: Reconcile strict canonical OCR union
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run catalog-mercadona-current-ocr-residual-audit.yml --ref agent/catalog-phase1
