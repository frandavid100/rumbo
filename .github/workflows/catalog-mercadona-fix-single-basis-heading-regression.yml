name: Catalog Mercadona fix single-basis OCR column guard

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-fix-single-basis-heading-regression.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight safety-test dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless Pillow

      - name: Reproduce regression, patch parser, and validate
        run: python tools/catalog/mercadona_fix_single_basis_heading_regression.py

      - name: Upload parser validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: mercadona-single-basis-parser-validation
          path: /tmp/parser-validation/summary.json
          retention-days: 90

      - name: Commit fix and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/catalog-mercadona-fix-single-basis-heading-regression.yml
          rm tools/catalog/mercadona_fix_single_basis_heading_regression.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/catalog/nutrition_label_reader.py tools/catalog/test_nutrition_label_reader.py .github/workflows/catalog-mercadona-fix-single-basis-heading-regression.yml tools/catalog/mercadona_fix_single_basis_heading_regression.py
          git commit -m 'catalog: fix Mercadona single-basis OCR column guard'
          git push origin HEAD:agent/catalog-phase1
