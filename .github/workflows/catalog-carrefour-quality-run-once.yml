name: Catalog Carrefour quality run once

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-carrefour-quality-run-once.yml'
      - 'tools/catalog/export_carrefour_candidate_urls.py'

permissions:
  contents: write

concurrency:
  group: carrefour-quality-run-once
  cancel-in-progress: false

jobs:
  rebuild-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regression tests
        working-directory: tools/catalog
        run: python -m unittest -v test_classifier_quality.py test_carrefour_parser_v2.py

      - name: Smoke import
        working-directory: tools/catalog
        run: python carrefour_radar_catalog_importer_v2.py --out carrefour-quality-smoke --max-pages 1 --max-products 180 --workers 16

      - name: Audit smoke catalog
        working-directory: tools/catalog
        run: python audit_carrefour_quality.py carrefour-quality-smoke/carrefour_food_catalog.sqlite --out carrefour-quality-smoke/audit.json

      - name: Full food import
        working-directory: tools/catalog
        run: python carrefour_radar_catalog_importer_v2.py --out carrefour-quality-full --workers 24

      - name: Audit full catalog
        working-directory: tools/catalog
        run: python audit_carrefour_quality.py carrefour-quality-full/carrefour_food_catalog.sqlite --out carrefour-quality-full/audit.json

      - name: Export Carrefour URL candidates for direct first-party verification
        working-directory: tools/catalog
        run: |
          python export_carrefour_candidate_urls.py \
            carrefour-quality-full/carrefour_food_catalog.sqlite \
            --out fixtures/carrefour_candidate_urls_radarsuper.jsonl

      - name: Persist compact quality report and candidate URLs
        run: |
          mkdir -p tools/catalog/fixtures
          cp tools/catalog/carrefour-quality-full/summary.json tools/catalog/fixtures/carrefour_quality_latest_summary.json
          cp tools/catalog/carrefour-quality-full/audit.json tools/catalog/fixtures/carrefour_quality_latest_audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/catalog/fixtures/carrefour_quality_latest_summary.json \
            tools/catalog/fixtures/carrefour_quality_latest_audit.json \
            tools/catalog/fixtures/carrefour_candidate_urls_radarsuper.jsonl \
            tools/catalog/fixtures/carrefour_candidate_urls_radarsuper.summary.json
          git diff --cached --quiet || git commit -m "catalog: persist Carrefour quality audit and candidate URLs"
          git pull --rebase origin agent/catalog-phase1
          git push origin HEAD:agent/catalog-phase1

      - name: Upload quality catalog
        uses: actions/upload-artifact@v4
        with:
          name: carrefour-food-catalog-quality-final
          path: tools/catalog/carrefour-quality-full/
          retention-days: 7
          if-no-files-found: error
