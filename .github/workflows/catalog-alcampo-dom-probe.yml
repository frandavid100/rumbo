name: Catalog Alcampo DOM probe

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - 'tools/catalog/alcampo_dom_probe.py'
      - '.github/workflows/catalog-alcampo-dom-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - name: Probe Alcampo DOM
        working-directory: tools/catalog
        run: python alcampo_dom_probe.py
      - name: Persist DOM summary
        run: |
          cp tools/catalog/alcampo-dom-probe/summary.json tools/catalog/fixtures/alcampo_dom_probe_latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/catalog/fixtures/alcampo_dom_probe_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "catalog: persist Alcampo DOM probe"
            git fetch origin agent/catalog-phase1
            git rebase origin/agent/catalog-phase1 || { git rebase --abort; exit 1; }
            git push origin HEAD:agent/catalog-phase1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alcampo-dom-probe
          path: tools/catalog/alcampo-dom-probe/
          retention-days: 7
