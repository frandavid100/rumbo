name: Catalog Mercadona 84736 ingredient-fat percentage revalidation

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-84736-fat-percentage-revalidation.yml'
      - 'tools/catalog/mercadona_nutrition_label_percentage_guard.py'
      - 'tools/catalog/mercadona_nutrition_reader.py'
      - 'tools/catalog/test_mercadona_nutrition_label_percentage_guard.py'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: catalog-mercadona-84736-fat-percentage-revalidation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revalidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PADDLE_PDX_MODEL_SOURCE: BOS
      PRODUCT_ID: '84736'
      ANCHOR_EAN: '2105900847361'
      ANCHOR_IMAGE_URL: 'https://prod-mercadona.imgix.net/images/dae013fffc303defe96c020ab27d1d67.jpg?fit=crop&h=3600&w=3600'
      PRIOR_RUN_ID: '33843219714'
      PRIOR_ARTIFACT_ID: '9926134894'
      PRIOR_ARTIFACT_SHA256: 'b448ead0a8a56e5e2cfa69bda42b43a5ab79041296de2a12ce06fe880bf0eba6'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rehydrate official first-party detail and require exact historical identity/image
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from mercadona_first_party_details import _get_json, normalize, _now

          pid = os.environ['PRODUCT_ID']
          anchor_ean = os.environ['ANCHOR_EAN']
          anchor_url = os.environ['ANCHOR_IMAGE_URL']
          observed_at = _now()
          payload, source_url = _get_json(pid, timeout=20.0)
          current = normalize(payload, source_url=source_url, observed_at=observed_at)
          current_ean = str(current.get('ean') or '').strip()
          if current_ean != anchor_ean:
              raise SystemExit(f'Current EAN mismatch for {pid}: current={current_ean!r} anchor={anchor_ean!r}')
          photos = current.get('photos') if isinstance(current.get('photos'), list) else []
          matches = [
              (index, photo)
              for index, photo in enumerate(photos)
              if isinstance(photo, dict)
              and str(photo.get('perspective') or '') == '9'
              and str(photo.get('zoom') or '') == anchor_url
          ]
          if len(matches) != 1:
              raise SystemExit(f'Exact historical first-party perspective=9 image is not uniquely current for {pid}: {len(matches)} matches')
          image_index, photo = matches[0]
          routed = dict(photo)
          routed['perspective'] = 9
          current['photos'] = [routed]
          current['_revalidation_meta'] = {
              'canonical_ean': anchor_ean,
              'current_ean': current_ean,
              'image_url': anchor_url,
              'image_index': image_index,
              'prior_run_id': int(os.environ['PRIOR_RUN_ID']),
              'prior_artifact_id': int(os.environ['PRIOR_ARTIFACT_ID']),
              'prior_artifact_sha256': os.environ['PRIOR_ARTIFACT_SHA256'],
              'live_detail_source_url': source_url,
              'live_detail_observed_at': observed_at,
          }
          Path('fat-percentage-revalidation-product.jsonl').write_text(
              json.dumps(current, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'product_id': pid,
              'ean_exact': True,
              'image_exact_unique_p9': True,
              'image_index': image_index,
              'source_url': source_url,
              'images_persisted': False,
              'redistribution_allowed': False,
          }, sort_keys=True))
          PY

      - name: Install OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check \
            'paddleocr>=3.7,<3.8' \
            'easyocr>=1.7,<1.8' \
            'python-doctr==1.1.0' \
            opencv-python-headless Pillow

      - name: Run conservative regressions before OCR
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_mercadona_nutrition_label_percentage_guard.py \
            test_mercadona_ambiguous_primary_column_rescue.py \
            test_mercadona_bounded_doctr_rescue.py \
            test_mercadona_near_safe_doctr_retry.py \
            test_label_doctr_extractor.py \
            test_mercadona_ocr_safety_regressions.py \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_label_reader_row_tokens.py \
            test_nutrition_ocr_ensemble.py \
            test_label_image_preprocess.py

      - name: Re-run exact-image OCR with parser guard and independent docTR rescue
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mercadona-84736-fat-percentage-revalidation/raw
          mode=$(python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('fat-percentage-revalidation-product.jsonl').read_text(encoding='utf-8'))
          print('priority' if row.get('ingredients') else 'p9-no-ingredients-all')
          PY
          )
          set +e
          python mercadona_near_safe_doctr_retry.py \
            --products fat-percentage-revalidation-product.jsonl \
            --out mercadona-84736-fat-percentage-revalidation/raw \
            --shard-index 0 \
            --shard-count 1 \
            --limit 0 \
            --eligibility-mode "$mode"
          rc=$?
          set -e
          [[ $rc -eq 0 || $rc -eq 2 ]]

      - name: Validate fresh observation and materialize auditable bundle
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, json, os, sqlite3
          from pathlib import Path

          CORE = ('calories', 'fat_g', 'carbohydrate_g', 'protein_g')
          BLOCKERS = ('OCR_FIELD_CONFLICT', 'OCR_SAME_ENGINE_CONFLICT', 'OCR_BASIS_CONFLICT',
                      'ENERGY_MACRO_MISMATCH', 'MULTIPLE_NUTRITION_COLUMNS',
                      'UNCORROBORATED_CORE_FIELDS', 'UNCORROBORATED_BASIS')
          root = Path('mercadona-84736-fat-percentage-revalidation')
          current = json.loads(Path('fat-percentage-revalidation-product.jsonl').read_text(encoding='utf-8'))
          meta = current.get('_revalidation_meta') or {}
          rows = []
          for path in sorted(glob.glob(str(root / 'raw/results-*.jsonl'))):
              rows.extend(json.loads(line) for line in Path(path).read_text(encoding='utf-8').splitlines() if line.strip())
          if len(rows) != 1 or str(rows[0].get('product_id') or '') != os.environ['PRODUCT_ID']:
              raise SystemExit(f'Unexpected result coverage: {[(row.get("product_id"), row.get("status")) for row in rows]}')
          row = rows[0]
          if str(row.get('ean') or '') != os.environ['ANCHOR_EAN']:
              raise SystemExit('OCR result EAN does not match exact historical/current anchor')
          if str(row.get('image_url') or '') != os.environ['ANCHOR_IMAGE_URL']:
              raise SystemExit('OCR used an unexpected image')
          if row.get('source') != 'MERCADONA_FIRST_PARTY' or row.get('source_record_kind') != 'label image':
              raise SystemExit('Source provenance changed unexpectedly')
          if row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE' or row.get('redistribution_allowed') is not False:
              raise SystemExit('Evidence/redistribution contract changed unexpectedly')

          status = str(row.get('status') or '')
          promotion_allowed = False
          usable = None
          accepted_ensemble = None
          if status == 'DECLARED':
              if row.get('basis') not in {'100_g', '100_ml'}:
                  raise SystemExit(f'DECLARED row lacks explicit per-100 basis: {row.get("basis")!r}')
              nutrition = row.get('nutrition') or {}
              if any(not isinstance(nutrition.get(field), (int, float)) for field in CORE):
                  raise SystemExit(f'DECLARED row lacks a complete four-field tuple: {nutrition!r}')
              candidates = []
              for attempt in row.get('attempts', []):
                  ensemble = attempt.get('ensemble') or {}
                  reasons = tuple(str(x) for x in ensemble.get('reasons') or [])
                  hard = [r for r in reasons if r.startswith(BLOCKERS)]
                  if (
                      ensemble.get('status') == 'DECLARED'
                      and ensemble.get('basis') in {'100_g', '100_ml'}
                      and int(ensemble.get('independent_engine_families') or 0) >= 2
                      and int(ensemble.get('corroborated_fields') or 0) >= 4
                      and (ensemble.get('nutrition') or {}) == nutrition
                      and not hard
                  ):
                      candidates.append(ensemble)
              if not candidates:
                  raise SystemExit('Fresh DECLARED row does not independently satisfy unchanged corroboration/safety contract')
              accepted_ensemble = candidates[0]
              promotion_allowed = True
              usable = {field: float(nutrition[field]) for field in CORE}
          elif status != 'REVIEW':
              raise SystemExit(f'Unexpected OCR status for bounded pilot: {status!r}')

          row['image_index'] = meta.get('image_index')
          row['perspective'] = 9
          row['live_detail_source_url'] = meta.get('live_detail_source_url')
          row['live_detail_observed_at'] = meta.get('live_detail_observed_at')
          row['ingredient_fat_percentage_revalidation'] = {
              'prior_run_id': meta.get('prior_run_id'),
              'prior_artifact_id': meta.get('prior_artifact_id'),
              'prior_artifact_sha256': meta.get('prior_artifact_sha256'),
              'observed_historical_false_fat_candidate_g': 16.0,
              'guard_changes_numeric_text': False,
              'acceptance_policy_changed': False,
              'historical_values_promotion_allowed': False,
              'cross_run_value_fusion': False,
              'cross_crop_value_fusion': False,
              'promotion_allowed': promotion_allowed,
          }
          out = root / 'results-merged.jsonl'
          out.write_text(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8')
          summary = {
              'inventory_products': 4280,
              'processed': 1,
              'product_id': os.environ['PRODUCT_ID'],
              'status': status,
              'basis': row.get('basis'),
              'usable_nutrition': usable,
              'corroborated_fields': int((accepted_ensemble or {}).get('corroborated_fields') or 0),
              'independent_engine_families': int((accepted_ensemble or {}).get('independent_engine_families') or 0),
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'redistribution_allowed': False,
              'images_persisted': False,
              'missing_values_inferred': False,
              'structured_api_macros_claimed': False,
              'acceptance_policy_changed': False,
              'historical_values_promotion_allowed': False,
              'cross_run_value_fusion': False,
              'cross_crop_value_fusion': False,
              'promotion_allowed': promotion_allowed,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          (root / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          db = sqlite3.connect(root / 'staging.sqlite')
          db.execute('CREATE TABLE IF NOT EXISTS ocr_rows (product_id TEXT PRIMARY KEY, ean TEXT, status TEXT, basis TEXT, calories REAL, fat_g REAL, carbohydrate_g REAL, protein_g REAL, evidence_level TEXT, source TEXT, source_record_kind TEXT, image_url TEXT, redistribution_allowed INTEGER, raw_json TEXT NOT NULL)')
          values = usable or {field: None for field in CORE}
          db.execute('INSERT OR REPLACE INTO ocr_rows VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?)', (
              row.get('product_id'), row.get('ean'), status, row.get('basis') if promotion_allowed else None,
              values['calories'], values['fat_g'], values['carbohydrate_g'], values['protein_g'],
              row.get('evidence_level'), row.get('source'), row.get('source_record_kind'), row.get('image_url'), 0,
              json.dumps(row, ensure_ascii=False, sort_keys=True),
          ))
          db.commit(); db.close()
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Upload auditable revalidation
        uses: actions/upload-artifact@v4
        with:
          name: mercadona-84736-fat-percentage-revalidation
          path: |
            tools/catalog/mercadona-84736-fat-percentage-revalidation/results-merged.jsonl
            tools/catalog/mercadona-84736-fat-percentage-revalidation/summary.json
            tools/catalog/mercadona-84736-fat-percentage-revalidation/staging.sqlite
            tools/catalog/mercadona-84736-fat-percentage-revalidation/raw/*.jsonl
            tools/catalog/mercadona-84736-fat-percentage-revalidation/raw/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Trigger strict residual reconciliation
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run catalog-mercadona-current-ocr-residual-audit.yml --ref agent/catalog-phase1
