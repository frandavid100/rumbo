name: Catalog Mercadona exact-current-image canary 86288

# Bounded canary for the strongest remaining current 3/4 REVIEW row.
# Candidate selection is strict; acceptance remains the existing fresh same-image
# two-family 4/4 contract. Historical values are diagnostic only and never fused.
on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-current-exact-image-canary-86288.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: catalog-mercadona-current-exact-image-canary-86288-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rescue:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve latest successful canonical audit
        id: canonical
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api \
            '/repos/frandavid100/rumbo/actions/workflows/catalog-mercadona-current-ocr-residual-audit.yml/runs?branch=agent%2Fcatalog-phase1&per_page=20' \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id')
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/audit
          gh run download "$run_id" -n mercadona-current-ocr-residual-audit -D /tmp/audit

      - name: Build exact-current-image canary cohort
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from mercadona_first_party_details import _get_json, normalize, _now

          pid = '86288'
          core = ('calories', 'fat_g', 'carbohydrate_g', 'protein_g')
          diagnostic = Path('/tmp/audit/current-review-failure-modes/three-of-four-explicit-basis-unblocked-review.jsonl')
          rows = [json.loads(line) for line in diagnostic.read_text(encoding='utf-8').splitlines() if line.strip()]
          old = next((row for row in rows if str(row.get('product_id') or '') == pid), None)
          if old is None:
              raise SystemExit('86288 is no longer a current 3/4 explicit-basis unblocked REVIEW')

          values = old.get('diagnostic_candidate_values') or {}
          missing = [field for field in core if values.get(field) is None]
          if not (
              old.get('canonical_status') == 'REVIEW'
              and old.get('basis') in {'100_g', '100_ml'}
              and not (old.get('safety_blockers') or [])
              and missing == ['fat_g']
              and old.get('missing_core_fields') == missing
              and int(old.get('independent_engine_families') or 0) >= 3
              and int(old.get('corroborated_fields') or 0) >= 3
              and str(old.get('ean') or '').strip()
              and str(old.get('image_url') or '').strip()
          ):
              raise SystemExit('86288 current safety shape changed; refusing retry')

          canonical_ean = str(old['ean']).strip()
          observed_image_url = str(old['image_url']).strip()
          observed_at = _now()
          payload, source_url = _get_json(pid, timeout=20.0)
          live = normalize(payload, source_url=source_url, observed_at=observed_at)
          current_ean = str(live.get('ean') or '').strip()
          if not current_ean or current_ean != canonical_ean:
              raise SystemExit(f'EAN mismatch: canonical={canonical_ean!r} current={current_ean!r}')

          photos = live.get('photos') if isinstance(live.get('photos'), list) else []
          exact = [
              (index, photo) for index, photo in enumerate(photos)
              if isinstance(photo, dict)
              and str(photo.get('zoom') or '').strip() == observed_image_url
          ]
          if len(exact) != 1:
              raise SystemExit(f'observed image URL occurs {len(exact)} times in current first-party photos; refusing image guess')

          image_index, photo = exact[0]
          routed = dict(photo)
          routed['_preselected_current_first_party_label_image'] = True
          live = dict(live)
          live['photos'] = [routed]
          live['_exact_current_image_meta'] = {
              'image_url': observed_image_url,
              'current_photo_index': image_index,
              'current_photo_perspective': photo.get('perspective'),
              'canonical_ean': canonical_ean,
              'current_ean': current_ean,
              'identity_basis': 'EXACT_NONEMPTY_CANONICAL_EAN_EQUALS_CURRENT_FIRST_PARTY_EAN',
              'image_selection_basis': 'EXACT_LATEST_OBSERVED_IMAGE_URL_OCCURS_ONCE_IN_CURRENT_MERCADONA_FIRST_PARTY_PHOTOS_AFTER_EAN_REVALIDATION',
              'live_detail_source_url': source_url,
              'live_detail_observed_at': observed_at,
              'canonical_missing_core_fields': missing,
              'canonical_corroborated_fields': old.get('corroborated_fields'),
              'canonical_engine_families': old.get('independent_engine_families'),
              'canonical_partial_values_diagnostic_only': values,
              'previous_latest_raw_run_id': old.get('latest_raw_run_id'),
          }

          root = Path('mercadona-current-exact-image-canary-86288')
          root.mkdir(exist_ok=True)
          (root / 'products.jsonl').write_text(json.dumps(live, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8')
          summary = {
              'canonical_audit_run_id': int('${{ steps.canonical.outputs.run_id }}'),
              'target_product_id': pid,
              'name': old.get('name'),
              'historical_missing_core_fields': missing,
              'historical_engine_families': old.get('independent_engine_families'),
              'historical_corroborated_fields': old.get('corroborated_fields'),
              'selection_policy': 'CURRENT_REVIEW_EXACTLY_3_OBSERVED_CORE; MISSING_FAT_G; EXPLICIT_100G_100ML; NO_SAFETY_BLOCKER; >=3_HISTORICAL_FAMILIES; >=3_CORROBORATED; EXACT_EAN_REVALIDATION; EXACT_LATEST_OBSERVED_IMAGE_URL_PRESENT_ONCE_IN_CURRENT_FIRST_PARTY_PHOTOS',
              'historical_partial_values_usable': False,
              'cross_run_value_fusion': False,
              'cross_image_value_fusion': False,
              'fresh_observation_must_recover_all_four': True,
              'acceptance_policy_changed': False,
              'images_persisted': False,
              'missing_values_inferred': False,
              'image_guessing': False,
          }
          (root / 'selection-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Install OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check \
            'paddleocr>=3.7,<3.8' \
            'easyocr>=1.7,<1.8' \
            opencv-python-headless Pillow

      - name: Run conservative rescue tests first
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_mercadona_preselected_current_image_routing.py \
            test_mercadona_preselected_three_of_four_variant_rescue.py \
            test_mercadona_near_safe_variant_rescue.py \
            test_mercadona_ocr_safety_regressions.py \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_label_reader_row_tokens.py \
            test_nutrition_ocr_ensemble.py \
            test_label_image_preprocess.py

      - name: OCR exact current first-party image
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          root=mercadona-current-exact-image-canary-86288
          set +e
          python mercadona_preselected_current_image_variant_rescue.py \
            --products "$root/products.jsonl" \
            --out "$root/ocr" \
            --shard-index 0 \
            --shard-count 1 \
            --limit 0
          rc=$?
          set -e
          [[ $rc -eq 0 || $rc -eq 2 ]]

          python - <<'PY'
          import glob
          import json
          import sqlite3
          from collections import Counter
          from pathlib import Path

          core = ('calories', 'fat_g', 'carbohydrate_g', 'protein_g')
          root = Path('mercadona-current-exact-image-canary-86288')
          source_product = json.loads((root / 'products.jsonl').read_text(encoding='utf-8').strip())
          meta = source_product['_exact_current_image_meta']

          rows = []
          for result_path in glob.glob(str(root / 'ocr/results-*.jsonl')):
              patched = []
              for line in Path(result_path).read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  if str(row.get('product_id') or '') != '86288' or str(row.get('image_url') or '') != str(meta['image_url']):
                      raise SystemExit('unexpected result routing')
                  row.update({
                      'image_index': meta.get('current_photo_index'),
                      'perspective': meta.get('current_photo_perspective'),
                      'image_selection_basis': meta.get('image_selection_basis'),
                      'identity_basis': meta.get('identity_basis'),
                      'canonical_ean': meta.get('canonical_ean'),
                      'current_ean': meta.get('current_ean'),
                      'live_detail_source_url': meta.get('live_detail_source_url'),
                      'live_detail_observed_at': meta.get('live_detail_observed_at'),
                      'pilot_historical_missing_core_fields': meta.get('canonical_missing_core_fields'),
                      'pilot_historical_corroborated_fields': meta.get('canonical_corroborated_fields'),
                      'pilot_historical_engine_families': meta.get('canonical_engine_families'),
                      'previous_latest_raw_run_id': meta.get('previous_latest_raw_run_id'),
                      'cross_run_value_fusion': False,
                      'cross_image_value_fusion': False,
                      'historical_partial_values_usable': False,
                      'current_observation_must_satisfy_declared_contract_independently': True,
                      'acceptance_policy_changed': False,
                      'missing_values_inferred': False,
                      'image_guessing': False,
                  })
                  patched.append(row)
                  rows.append(row)
              Path(result_path).write_text(''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in patched), encoding='utf-8')

          if len(rows) != 1:
              raise SystemExit(f'expected exactly one OCR result row, got {len(rows)}')

          row = rows[0]
          invalid = []
          if (
              row.get('source') != 'MERCADONA_FIRST_PARTY'
              or row.get('source_record_kind') != 'label image'
              or row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE'
              or row.get('redistribution_allowed') is not False
              or row.get('identity_basis') != 'EXACT_NONEMPTY_CANONICAL_EAN_EQUALS_CURRENT_FIRST_PARTY_EAN'
              or not row.get('canonical_ean')
              or row.get('canonical_ean') != row.get('current_ean')
              or row.get('cross_run_value_fusion') is not False
              or row.get('cross_image_value_fusion') is not False
              or row.get('historical_partial_values_usable') is not False
              or row.get('missing_values_inferred') is not False
              or row.get('image_guessing') is not False
          ):
              invalid.append('provenance_or_identity')

          if row.get('status') == 'DECLARED':
              nutrition = row.get('nutrition') or {}
              if any(nutrition.get(field) is None for field in core) or row.get('basis') not in {'100_g', '100_ml'}:
                  invalid.append('declared_missing_core_or_basis')
              ensemble = next(((attempt.get('ensemble') or {}) for attempt in row.get('attempts', []) if (attempt.get('ensemble') or {}).get('status') == 'DECLARED'), {})
              if int(ensemble.get('independent_engine_families') or 0) < 2 or int(ensemble.get('corroborated_fields') or 0) < 4:
                  invalid.append('declared_not_independently_corroborated_4of4')
          if invalid:
              raise SystemExit('unsafe row: ' + ','.join(invalid))

          status_counts = dict(Counter([str(row.get('status') or 'UNKNOWN')]))
          summary = {
              'inventory_products': 4280,
              'processed': 1,
              'status_counts': status_counts,
              'declared_product_ids': ['86288'] if row.get('status') == 'DECLARED' else [],
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'redistribution_allowed': False,
              'acceptance_policy_changed': False,
              'cross_run_value_fusion': False,
              'cross_image_value_fusion': False,
              'historical_partial_values_usable': False,
              'fresh_observation_must_recover_all_four': True,
              'images_persisted': False,
              'missing_values_inferred': False,
              'image_guessing': False,
              'classified': 0,
              'menu_eligible': 0,
          }
          (root / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (root / 'results-merged.jsonl').write_text(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8')

          db = sqlite3.connect(root / 'staging.sqlite')
          db.execute('CREATE TABLE ocr_results (product_id TEXT PRIMARY KEY, status TEXT NOT NULL, basis TEXT, calories REAL, fat_g REAL, carbohydrate_g REAL, protein_g REAL, evidence_level TEXT NOT NULL, source TEXT NOT NULL, image_url TEXT NOT NULL, canonical_ean TEXT NOT NULL, redistribution_allowed INTEGER NOT NULL, raw_json TEXT NOT NULL)')
          nutrition = row.get('nutrition') or {}
          db.execute('INSERT INTO ocr_results VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?)', (
              '86288', str(row.get('status') or ''), row.get('basis'),
              nutrition.get('calories'), nutrition.get('fat_g'), nutrition.get('carbohydrate_g'), nutrition.get('protein_g'),
              str(row.get('evidence_level') or ''), 'MERCADONA_FIRST_PARTY/label image', str(row.get('image_url') or ''),
              str(row.get('canonical_ean') or ''), 0, json.dumps(row, ensure_ascii=False, sort_keys=True),
          ))
          db.commit()
          db.close()
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-current-exact-image-canary-86288
          path: tools/catalog/mercadona-current-exact-image-canary-86288/
          retention-days: 90
          if-no-files-found: error

      - name: Reconcile canonical OCR after successful canary
        if: success()
        run: gh workflow run catalog-mercadona-current-ocr-residual-audit.yml --ref agent/catalog-phase1
