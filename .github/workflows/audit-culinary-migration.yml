name: Audit culinary migration

on:
  pull_request:
    branches: [main]

jobs:
  audit:
    if: github.head_ref == 'agent/remove-legacy-catalog-canonical-policy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-legacy-catalog-canonical-policy
      - name: Inventario CulinaryType y pantalla FOODS
        run: |
          echo '=== CulinaryType ==='
          grep -RIn --exclude-dir=build --exclude='*.xml' 'CulinaryType\|culinaryType' app/src || true
          echo '=== Screen.FOODS / FoodDishCatalogScreen ==='
          grep -RIn --exclude-dir=build 'Screen\.FOODS\|FoodDishCatalogScreen' app/src || true
          echo '=== preferred/min/max classification ==='
          grep -RIn --exclude-dir=build 'preferredGrams\|minimumGrams\|maximumGrams' app/src/main/java/es/david/rumbo/data/catalog app/src/main/java/es/david/rumbo/logic || true
