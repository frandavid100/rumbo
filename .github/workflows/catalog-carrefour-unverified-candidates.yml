name: Catalog Carrefour unverified candidate queue

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-carrefour-unverified-candidates.yml'
      - 'tools/catalog/select_carrefour_unverified_candidates.py'
      - 'tools/catalog/fixtures/carrefour_candidate_urls_radarsuper.jsonl'
      - 'tools/catalog/fixtures/carrefour_first_party_products_cumulative.jsonl'
      - 'tools/catalog/fixtures/carrefour_first_party_agent_web_products*.jsonl'
      - 'catalog/fixtures/carrefour_first_party_agent_web_products*.jsonl'
      - 'tools/catalog/fixtures/carrefour_first_party_candidate_route_outcomes.jsonl'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: carrefour-unverified-candidate-queue
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build discovery-only verification queue
        working-directory: tools/catalog
        run: |
          VERIFIED=(fixtures/carrefour_first_party_products_cumulative.jsonl)
          for f in fixtures/carrefour_first_party_agent_web_products*.jsonl; do
            if [ -s "$f" ]; then VERIFIED+=("$f"); fi
          done
          for f in ../../catalog/fixtures/carrefour_first_party_agent_web_products*.jsonl; do
            if [ -s "$f" ]; then VERIFIED+=("$f"); fi
          done
          python select_carrefour_unverified_candidates.py \
            --candidates fixtures/carrefour_candidate_urls_radarsuper.jsonl \
            --verified "${VERIFIED[@]}" \
            --terminal-outcomes fixtures/carrefour_first_party_candidate_route_outcomes.jsonl \
            --output fixtures/carrefour_unverified_candidates_head.jsonl \
            --summary fixtures/carrefour_unverified_candidates_summary.json \
            --limit 250
      - name: Validate source boundary
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          queue = Path('fixtures/carrefour_unverified_candidates_head.jsonl')
          for line_no, line in enumerate(queue.read_text(encoding='utf-8').splitlines(), 1):
              row = json.loads(line)
              assert row['evidence_status'] == 'DISCOVERY_ONLY_NOT_CARREFOUR_EVIDENCE', (line_no, row)
              assert row['canonical_url_verified'] is False, (line_no, row)
              assert row.get('source') != 'CARREFOUR_FIRST_PARTY', (line_no, row)
          summary = json.loads(Path('fixtures/carrefour_unverified_candidates_summary.json').read_text(encoding='utf-8'))
          assert summary['source_boundary']['output_is_first_party_evidence'] is False
          print(summary['counts'])
          PY
      - name: Persist compact queue and audit summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/catalog/fixtures/carrefour_unverified_candidates_head.jsonl \
            tools/catalog/fixtures/carrefour_unverified_candidates_summary.json
          if ! git diff --cached --quiet; then
            git commit -m "catalog: refresh Carrefour unverified candidate queue"
            git pull --rebase origin agent/catalog-phase1
            git push origin HEAD:agent/catalog-phase1
          fi
      - name: Upload discovery-only queue
        uses: actions/upload-artifact@v4
        with:
          name: carrefour-unverified-candidate-queue
          path: |
            tools/catalog/fixtures/carrefour_unverified_candidates_head.jsonl
            tools/catalog/fixtures/carrefour_unverified_candidates_summary.json
          retention-days: 7
          if-no-files-found: error
