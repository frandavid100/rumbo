name: Direct Carrefour then Alcampo full catalogs

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-direct-carrefour-then-alcampo.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: direct-retailer-full-catalogs
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Direct Carrefour smoke
        working-directory: tools/catalog
        run: python direct_retailer_catalog.py carrefour --out direct-carrefour-smoke --workers 2 --max-products 12
      - name: Direct Alcampo smoke
        working-directory: tools/catalog
        run: python direct_retailer_catalog.py alcampo --out direct-alcampo-smoke --workers 2 --max-products 12
      - name: Persist smoke summaries
        run: |
          mkdir -p tools/catalog/fixtures
          cp tools/catalog/direct-carrefour-smoke/summary.json tools/catalog/fixtures/carrefour_direct_smoke_summary.json
          cp tools/catalog/direct-alcampo-smoke/summary.json tools/catalog/fixtures/alcampo_direct_smoke_summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/catalog/fixtures/carrefour_direct_smoke_summary.json tools/catalog/fixtures/alcampo_direct_smoke_summary.json
          git diff --cached --quiet || git commit -m "catalog: persist direct retailer smoke summaries"
          git push origin HEAD:agent/catalog-phase1

  carrefour_full:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Build Carrefour direct catalog
        working-directory: tools/catalog
        run: python direct_retailer_catalog.py carrefour --out carrefour-direct-full --workers 8
      - name: Validate Carrefour coverage
        run: |
          python - <<'PY'
          import json
          p='tools/catalog/carrefour-direct-full/summary.json'
          d=json.load(open(p))
          n=d['counts']['discovered']
          print('Carrefour discovered',n)
          if n < 7000:
              raise SystemExit(f'Coverage too low: {n}')
          PY
      - name: Persist Carrefour summary
        run: |
          cp tools/catalog/carrefour-direct-full/summary.json tools/catalog/fixtures/carrefour_direct_latest_summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/catalog/fixtures/carrefour_direct_latest_summary.json
          git diff --cached --quiet || git commit -m "catalog: persist direct Carrefour summary"
          git pull --rebase origin agent/catalog-phase1
          git push origin HEAD:agent/catalog-phase1
      - name: Upload Carrefour direct catalog
        uses: actions/upload-artifact@v4
        with:
          name: carrefour-direct-food-catalog
          path: tools/catalog/carrefour-direct-full/
          retention-days: 14
          if-no-files-found: error

  alcampo_full:
    needs: carrefour_full
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Build Alcampo direct catalog
        working-directory: tools/catalog
        run: python direct_retailer_catalog.py alcampo --out alcampo-direct-full --workers 8
      - name: Validate Alcampo discovery
        run: |
          python - <<'PY'
          import json
          p='tools/catalog/alcampo-direct-full/summary.json'
          d=json.load(open(p))
          n=d['counts']['discovered']
          print('Alcampo discovered',n)
          if n < 500:
              raise SystemExit(f'Coverage too low: {n}')
          PY
      - name: Persist Alcampo summary
        run: |
          cp tools/catalog/alcampo-direct-full/summary.json tools/catalog/fixtures/alcampo_direct_latest_summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/catalog/fixtures/alcampo_direct_latest_summary.json
          git diff --cached --quiet || git commit -m "catalog: persist direct Alcampo summary"
          git pull --rebase origin agent/catalog-phase1
          git push origin HEAD:agent/catalog-phase1
      - name: Upload Alcampo direct catalog
        uses: actions/upload-artifact@v4
        with:
          name: alcampo-direct-food-catalog
          path: tools/catalog/alcampo-direct-full/
          retention-days: 14
          if-no-files-found: error
