name: Catalog Mercadona neural OCR wave 1024 recovery shard 57

# Targeted recovery for shard 57 of validation wave 1024.
# The original 45-minute matrix job was cancelled after a pathological set of
# large rear-label images; this retries only the missing deterministic 16-row
# shard with a larger time budget. It does not duplicate any shard still running.
on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-neural-ocr-wave-1024-recovery-57.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-neural-ocr-wave-1024-recovery-57-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download consolidated Mercadona first-party cut
        uses: actions/download-artifact@v4
        with:
          name: mercadona-first-party-final
          path: tools/catalog/mercadona-first-party-final
          github-token: ${{ github.token }}
          run-id: 33046950149
      - name: Install independent OCR engines and visual detector dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow
      - name: Run conservative OCR regression tests
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_label_easyocr_extractor.py \
            test_nutrition_label_reader.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_ocr_safety_regressions.py
      - name: Recover deterministic shard 57
        working-directory: tools/catalog
        run: |
          python mercadona_neural_ocr_wave.py \
            --products mercadona-first-party-final/products.jsonl \
            --out mercadona-neural-ocr-wave-1024-recovery-57 \
            --shard-index 57 \
            --shard-count 64 \
            --limit 16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-neural-ocr-wave-1024-recovery-57
          path: tools/catalog/mercadona-neural-ocr-wave-1024-recovery-57/
          retention-days: 30
          if-no-files-found: warn
