name: Catalog apply single reversed macro REVIEW fix

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-apply-single-reversed-macro-review-fix.yml'
      - 'tools/catalog/apply_single_reversed_macro_review_fix.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact parser patch
        run: python tools/catalog/apply_single_reversed_macro_review_fix.py
      - name: Run focused and safety regressions
        working-directory: tools/catalog
        run: >-
          python -m unittest -v
          test_nutrition_label_reader_single_reversed_candidate.py
          test_nutrition_label_reader.py
          test_nutrition_row_order_ambiguity.py
          test_nutrition_ocr_ensemble.py
          test_mercadona_ocr_safety_regressions.py
      - name: Commit validated parser patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/catalog/nutrition_label_reader.py
          git diff --cached --check
          git commit -m 'fix(catalog): expose coherent reversed macro as REVIEW evidence'
          git push origin HEAD:agent/catalog-phase1
