name: Catalog

on:
  push:
    branches: [agent/catalog-phase1]
  pull_request:
    branches: [main]
    paths:
      - 'tools/catalog/**'
      - '.github/workflows/catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias de pruebas de imagen
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Probar clasificador dorado
        working-directory: tools/catalog
        run: python -m unittest -v test_classifier.py
      - name: Probar cobertura de tipos
        working-directory: tools/catalog
        run: python -m unittest -v test_coverage_probe.py
      - name: Evaluar corpus amplio
        working-directory: tools/catalog
        shell: bash
        run: |
          set -o pipefail
          python evaluate_classifier_probe.py | tee full-classification-report.json
      - name: Probar resolver nutricional 1.x
        working-directory: tools/catalog
        run: python -m unittest -v test_nutrition_resolver.py
      - name: Evaluar cobertura del resolver
        working-directory: tools/catalog
        shell: bash
        run: |
          set -o pipefail
          python evaluate_nutrition_resolver.py | tee nutrition-resolver-report.json
      - name: Probar adaptadores de fuentes
        working-directory: tools/catalog
        run: python -m unittest -v test_source_adapters.py
      - name: Probar lector de etiquetas nutricionales
        working-directory: tools/catalog
        run: python -m unittest -v test_nutrition_label_reader.py
      - name: Probar extractor OCR de etiquetas
        working-directory: tools/catalog
        run: python -m unittest -v test_label_text_extractor.py
      - name: Probar fusión OCR nutricional
        working-directory: tools/catalog
        run: python -m unittest -v test_nutrition_ocr_ensemble.py
      - name: Probar preprocesado visual de etiquetas
        working-directory: tools/catalog
        run: python -m unittest -v test_label_image_preprocess.py
      - name: Probar pipeline Mercadona etiqueta a DECLARED
        working-directory: tools/catalog
        run: python -m unittest -v test_mercadona_label_pipeline.py
      - name: Probar muestra vertical del catálogo
        run: python -c "import sys; sys.path.insert(0,'tools/catalog'); import test_catalog_v1 as t; t.test_vertical_sample(); t.test_ids_are_stable()"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-validation-report
          path: |
            tools/catalog/full-classification-report.json
            tools/catalog/nutrition-resolver-report.json
          if-no-files-found: warn
          retention-days: 7
