name: Catalog Mercadona reversed zero-glyph v1.4.9 sample

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-reversed-zero-glyph-v149-sample.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-reversed-zero-glyph-v149-sample-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download consolidated Mercadona first-party cut
        uses: actions/download-artifact@v4
        with:
          name: mercadona-first-party-final
          path: tools/catalog/mercadona-first-party-final
          repository: frandavid100/rumbo
          github-token: ${{ github.token }}
          run-id: 33046950149
      - name: Build exact three-product validation sample
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          targets = {'16314', '39191', '4740'}
          rows = [json.loads(x) for x in Path('mercadona-first-party-final/products.jsonl').read_text().splitlines() if x.strip()]
          selected = [row for row in rows if str(row.get('product_id') or '') in targets]
          found = {str(row.get('product_id') or '') for row in selected}
          if found != targets or len(selected) != 3:
              raise SystemExit(f'exact sample mismatch: expected={sorted(targets)} found={sorted(found)} rows={len(selected)}')
          for row in selected:
              photos = row.get('photos') if isinstance(row.get('photos'), list) else []
              if not any(isinstance(photo, dict) and str(photo.get('perspective')) == '9' and photo.get('zoom') for photo in photos):
                  raise SystemExit(f"{row.get('product_id')} has no usable perspective=9 zoom label image")
          selected.sort(key=lambda row: str(row.get('product_id') or ''))
          Path('reversed-zero-glyph-v149-sample-products.jsonl').write_text(''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in selected))
          PY
      - name: Verify parser and regression tests
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import nutrition_label_reader
          if nutrition_label_reader.READER_VERSION != '1.4.9':
              raise SystemExit(f'expected reader 1.4.9, got {nutrition_label_reader.READER_VERSION}')
          PY
          python -m unittest -v test_nutrition_label_reader_easyocr_zero_glyph.py test_nutrition_label_reader_easyocr_reversed_zero_glyph.py
      - name: Install OCR engines
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow
      - name: Reprocess exact validation sample
        working-directory: tools/catalog
        run: |
          python mercadona_neural_ocr_tesseract_preprocess_rescue.py \
            --products reversed-zero-glyph-v149-sample-products.jsonl \
            --out mercadona-reversed-zero-glyph-v149-sample \
            --shard-index 0 --shard-count 1 --limit 0 --delay 0.25
      - name: Enforce expected conservative outcomes
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          out = Path('mercadona-reversed-zero-glyph-v149-sample')
          result_files = sorted(out.glob('results-*.jsonl'))
          if len(result_files) != 1:
              raise SystemExit(f'expected one result jsonl, got {len(result_files)}')
          rows = [json.loads(x) for x in result_files[0].read_text().splitlines() if x.strip()]
          by_id = {str(row.get('product_id') or ''): row for row in rows}
          expected = {'16314': 'DECLARED', '39191': 'REVIEW', '4740': 'DECLARED'}
          observed = {pid: str(by_id.get(pid, {}).get('status') or 'MISSING') for pid in expected}

          provenance_errors = []
          unsafe_declared = []
          fields = ('calories', 'protein_g', 'carbohydrate_g', 'fat_g')
          audited = []
          for pid in sorted(expected):
              row = by_id.get(pid)
              if row is None:
                  continue
              status = str(row.get('status') or '')
              if (
                  row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE'
                  or row.get('source') != 'MERCADONA_FIRST_PARTY'
                  or row.get('source_record_kind') != 'label image'
                  or row.get('redistribution_allowed') is not False
                  or str(row.get('perspective')) != '9'
              ):
                  provenance_errors.append(pid)
              nutrition = row.get('nutrition')
              if status == 'DECLARED':
                  if not isinstance(nutrition, dict) or any(nutrition.get(field) is None for field in fields):
                      unsafe_declared.append(f'{pid}:incomplete')
                  accepted = next((a for a in row.get('attempts') or [] if isinstance(a.get('ensemble'), dict) and a['ensemble'].get('status') == 'DECLARED'), None)
                  ensemble = (accepted or {}).get('ensemble') or {}
                  if int(ensemble.get('independent_engine_families') or 0) < 2 or int(ensemble.get('corroborated_fields') or 0) < 4:
                      unsafe_declared.append(f'{pid}:insufficient_corroboration')
              elif nutrition is not None:
                  unsafe_declared.append(f'{pid}:non_declared_carries_nutrition')
              audited.append({
                  'product_id': pid,
                  'name': row.get('name'),
                  'status': status,
                  'basis': row.get('basis'),
                  'nutrition': nutrition if status == 'DECLARED' else None,
                  'image_url': row.get('image_url'),
                  'source': 'MERCADONA_FIRST_PARTY/label image',
                  'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
                  'redistribution_allowed': False,
              })

          image_ext = {'.jpg', '.jpeg', '.png', '.webp', '.bmp', '.tif', '.tiff'}
          persisted_images = [str(path) for path in out.rglob('*') if path.is_file() and path.suffix.lower() in image_ext]
          ok = len(rows) == 3 and set(by_id) == set(expected) and observed == expected and not provenance_errors and not unsafe_declared and not persisted_images
          summary = {
              'sample': 'reversed EasyOCR zero-glyph parser v1.4.9 real-image validation',
              'processed': len(rows),
              'expected_statuses': expected,
              'observed_statuses': observed,
              'parser_version': '1.4.9',
              'provenance_errors': provenance_errors,
              'unsafe_declared': unsafe_declared,
              'images_persisted': False,
              'missing_values_inferred': False,
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'redistribution_allowed': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
              'safety_assessment': 'VALIDATED' if ok else 'FAILED',
          }
          audit = Path('mercadona-reversed-zero-glyph-v149-sample-audit')
          audit.mkdir(exist_ok=True)
          (audit / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n')
          (audit / 'audited-products.json').write_text(json.dumps(audited, ensure_ascii=False, indent=2) + '\n')
          (audit / 'results.jsonl').write_text(''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in rows))
          con = sqlite3.connect(audit / 'results.sqlite')
          con.execute('create table results(product_id text primary key,status text not null,payload_json text not null)')
          for row in rows:
              con.execute('insert into results values(?,?,?)', (str(row.get('product_id') or ''), str(row.get('status') or ''), json.dumps(row, ensure_ascii=False, sort_keys=True)))
          con.commit()
          con.close()
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if not ok:
              raise SystemExit('v1.4.9 real-image sample failed conservative validation')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-reversed-zero-glyph-v149-sample-audit
          path: tools/catalog/mercadona-reversed-zero-glyph-v149-sample-audit/
          retention-days: 30
          if-no-files-found: error
