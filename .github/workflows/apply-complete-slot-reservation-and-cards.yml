name: Apply complete slot reservation and cards

on:
  push:
    branches: [agent/certified-day-witness-level1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/certified-day-witness-level1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar correcciones
        run: |
          python tools/fix_complete_slot_reservation_and_cards.py
          git diff --check
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/es/david/rumbo/logic/WeeklyMenuGenerator.kt app/src/main/java/es/david/rumbo/ui/Theme.kt
          git commit -m "Reservar fruta y verdura al certificar COMPLETE y oscurecer tarjetas"
          git pull --rebase origin agent/certified-day-witness-level1
          git push origin HEAD:agent/certified-day-witness-level1
