name: Catalog Mercadona EasyOCR single-corroboration patch

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-easyocr-single-corroboration-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install unit-test dependencies
        run: python -m pip install --disable-pip-version-check opencv-python-headless Pillow
      - name: Add regression first and prove it fails on old routing
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('test_mercadona_ocr_safety_regressions.py')
          text = path.read_text(encoding='utf-8')
          marker = '\n    def test_easyocr_rescue_rejects_cross_engine_field_conflict(self):\n'
          if marker not in text:
              raise SystemExit('regression insertion marker not found')
          test = '''\n    def test_easyocr_rescue_routes_one_corroborated_field_when_union_is_complete_and_coherent(self):\n        # Real wave candidate 18037 shape: Paddle and Tesseract agree on energy,\n        # while their complementary partial rows recover the remaining core tuple.\n        # This only routes EasyOCR as a third observation; it does not relax final\n        # four-field/two-family corroboration or any parser safety gate.\n        paddle = read_nutrition_label(\"\"\"Información nutricional por 100 g\nValor energético 820 kJ / 196 kcal\nGrasas\nHidratos de carbono\nProteínas 13 g\nSal 0.7 g\n\"\"\", extraction_confidence=.98)\n        tesseract = read_nutrition_label(\"\"\"Información nutricional por 100 g\nValor energético 820 kJ / 196 kcal\nGrasas 15 g\nHidratos de carbono 2.29 g\nProteínas\nSal 0.7 g\n\"\"\", extraction_confidence=.94)\n        self.assertEqual(paddle.status, \"REVIEW\")\n        self.assertEqual(tesseract.status, \"REVIEW\")\n        readings = (\n            (\"paddleocr\", \"paddleocr\", _observed_reading(paddle, .98)),\n            (\"tesseract-psm11\", \"tesseract\", _observed_reading(tesseract, .94)),\n        )\n        self.assertTrue(_should_run_easyocr_rescue(readings, \"visual_region\"))\n\n'''
          if 'test_easyocr_rescue_routes_one_corroborated_field_when_union_is_complete_and_coherent' in text:
              raise SystemExit('regression already present')
          path.write_text(text.replace(marker, test + marker, 1), encoding='utf-8')
          PY
          set +e
          python -m unittest -v test_mercadona_ocr_safety_regressions.MercadonaOCRSafetyRegressionsTest.test_easyocr_rescue_routes_one_corroborated_field_when_union_is_complete_and_coherent 2>&1 | tee /tmp/prepatch-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'New regression unexpectedly passes before routing patch' >&2
            exit 1
          fi
          grep -q 'AssertionError: False is not true' /tmp/prepatch-test.log || {
            echo 'Regression failed for an unexpected reason' >&2
            cat /tmp/prepatch-test.log >&2
            exit 1
          }
      - name: Apply narrow routing-only change
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('mercadona_neural_ocr_wave.py')
          text = path.read_text(encoding='utf-8')
          old = '''    # Keep this expansion narrow: at least half of the complete tuple must already\n    # be independently corroborated before paying for a third family.\n    if not (2 <= ensemble.corroborated_fields < len(CORE_NUTRITION_FIELDS)):\n        return False\n'''
          new = '''    # Routing a third OCR family is not acceptance. One independently corroborated\n    # core field is enough to justify the bounded rescue when the complementary\n    # two-family union is already complete, explicit-basis, conflict-free and\n    # energy/macro coherent. Final DECLARED still requires the ordinary four-field\n    # corroboration gate after EasyOCR runs.\n    if not (1 <= ensemble.corroborated_fields < len(CORE_NUTRITION_FIELDS)):\n        return False\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one routing block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run conservative regression suite
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_label_reader_row_tokens.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_ocr_safety_regressions.py
      - name: Commit tested patch and remove dispatcher
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/catalog-mercadona-easyocr-single-corroboration-patch.yml
          git config user.name 'Rumbo catalog agent'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/catalog/mercadona_neural_ocr_wave.py tools/catalog/test_mercadona_ocr_safety_regressions.py .github/workflows/catalog-mercadona-easyocr-single-corroboration-patch.yml
          git diff --cached --check
          git commit -m 'fix(catalog): route coherent one-field OCR rescue'
          git push origin HEAD:agent/catalog-phase1
