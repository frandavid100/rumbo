name: Catalog Mercadona rerun canary 5546

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-rerun-canary-5546.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch exact-current-image canary
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run catalog-mercadona-current-exact-image-canary-5546.yml --repo frandavid100/rumbo --ref agent/catalog-phase1
