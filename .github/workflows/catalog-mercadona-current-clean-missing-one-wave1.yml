name: Catalog Mercadona current clean missing-one wave 1

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-current-clean-missing-one-wave1.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-current-clean-missing-one-wave1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rescue:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
      GH_TOKEN: ${{ github.token }}
      PER_MISSING_FIELD: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve latest successful strict canonical audit
        id: canonical
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api '/repos/frandavid100/rumbo/actions/workflows/catalog-mercadona-current-ocr-residual-audit.yml/runs?branch=agent%2Fcatalog-phase1&per_page=20' --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id')
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/audit
          gh run download "$run_id" -n mercadona-current-ocr-residual-audit -D /tmp/audit

      - name: Resolve latest completed clean missing-one canary
        id: canary
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api '/repos/frandavid100/rumbo/actions/workflows/catalog-mercadona-current-clean-missing-one-canary.yml/runs?branch=agent%2Fcatalog-phase1&per_page=20' --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id')
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/canary
          gh run download "$run_id" -n mercadona-current-clean-missing-one-canary -D /tmp/canary

      - name: Build balanced exact live-verified single-family missing-one wave
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from collections import Counter, defaultdict
          from pathlib import Path

          from mercadona_first_party_details import _get_json, normalize, _now

          core = ('calories', 'fat_g', 'carbohydrate_g', 'protein_g')
          per_field = int(os.environ.get('PER_MISSING_FIELD', '2'))
          diagnostic = Path('/tmp/audit/current-review-failure-modes/three-of-four-explicit-basis-unblocked-review.jsonl')
          canary_summary = Path('/tmp/canary/selection-summary.json')
          if not diagnostic.exists() or not canary_summary.exists():
              raise SystemExit('Required strict-audit/canary routing evidence missing')

          canary = json.loads(canary_summary.read_text(encoding='utf-8'))
          attempted_before = {
              str(pid) for pid in (canary.get('expected_candidate_ids') or []) if str(pid)
          }
          attempted_before.update(
              str(row.get('product_id') or '')
              for row in (canary.get('selected_after_live_verification') or [])
              if str(row.get('product_id') or '')
          )

          rows = [
              json.loads(line)
              for line in diagnostic.read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          candidates = []
          rejected_shape = []
          for row in rows:
              pid = str(row.get('product_id') or '').strip()
              if not pid or pid in attempted_before:
                  continue
              values = row.get('diagnostic_candidate_values') or {}
              missing_core = [field for field in core if values.get(field) is None]
              present_core = [field for field in core if values.get(field) is not None]
              valid = (
                  row.get('canonical_status') == 'REVIEW'
                  and row.get('basis') in {'100_g', '100_ml'}
                  and not (row.get('safety_blockers') or [])
                  and len(missing_core) == 1
                  and len(present_core) == 3
                  and list(row.get('missing_core_fields') or []) == missing_core
                  and int(row.get('independent_engine_families') or 0) == 1
                  and list(row.get('reason_prefixes') or []) == ['MISSING_CORE']
                  and str(row.get('ean') or '').strip()
                  and str(row.get('image_url') or '').strip()
              )
              if valid:
                  candidates.append(row)
              else:
                  rejected_shape.append(pid)

          if not candidates:
              raise SystemExit('No strict single-family missing-one REVIEW candidate remains after prior-canary exclusion')

          verified = []
          exclusions = []
          for old in sorted(candidates, key=lambda row: str(row.get('product_id') or '')):
              pid = str(old.get('product_id') or '').strip()
              canonical_ean = str(old.get('ean') or '').strip()
              observed_image_url = str(old.get('image_url') or '').strip()
              observed_at = _now()
              try:
                  payload, source_url = _get_json(pid, timeout=20.0)
                  live = normalize(payload, source_url=source_url, observed_at=observed_at)
              except Exception as exc:
                  exclusions.append({'product_id': pid, 'reason': f'LIVE_DETAIL_ERROR:{type(exc).__name__}:{exc}'})
                  continue

              current_ean = str(live.get('ean') or '').strip()
              if not current_ean or current_ean != canonical_ean:
                  exclusions.append({
                      'product_id': pid,
                      'reason': 'EAN_MISMATCH',
                      'canonical_ean': canonical_ean,
                      'current_ean': current_ean,
                  })
                  continue

              photos = live.get('photos') if isinstance(live.get('photos'), list) else []
              exact = [
                  (index, photo) for index, photo in enumerate(photos)
                  if isinstance(photo, dict)
                  and str(photo.get('zoom') or '').strip() == observed_image_url
                  and str(photo.get('perspective') or '') == '9'
              ]
              if len(exact) != 1:
                  exclusions.append({
                      'product_id': pid,
                      'reason': 'EXACT_P9_IMAGE_NOT_UNIQUE_CURRENT',
                      'matches': len(exact),
                  })
                  continue

              image_index, photo = exact[0]
              routed = dict(photo)
              routed['_preselected_current_first_party_label_image'] = True
              live = dict(live)
              live['photos'] = [routed]
              live['_exact_current_image_meta'] = {
                  'image_url': observed_image_url,
                  'current_photo_index': image_index,
                  'current_photo_perspective': photo.get('perspective'),
                  'canonical_ean': canonical_ean,
                  'current_ean': current_ean,
                  'identity_basis': 'EXACT_NONEMPTY_CANONICAL_EAN_EQUALS_CURRENT_FIRST_PARTY_EAN',
                  'image_selection_basis': 'EXACT_LATEST_OBSERVED_PERSPECTIVE_9_IMAGE_URL_OCCURS_ONCE_IN_CURRENT_MERCADONA_FIRST_PARTY_PHOTOS_AFTER_EAN_REVALIDATION',
                  'live_detail_source_url': source_url,
                  'live_detail_observed_at': observed_at,
                  'previous_latest_raw_run_id': old.get('latest_raw_run_id'),
                  'historical_missing_core_fields': old.get('missing_core_fields'),
                  'historical_engine_families': old.get('independent_engine_families'),
                  'historical_corroborated_fields': old.get('corroborated_fields'),
                  'historical_diagnostic_values_are_usable': False,
              }
              verified.append({
                  'live': live,
                  'old': old,
                  'has_structured_ingredients': bool(live.get('ingredients')),
              })

          by_missing = defaultdict(list)
          for item in verified:
              missing = list(item['old'].get('missing_core_fields') or [])
              if len(missing) == 1:
                  by_missing[missing[0]].append(item)

          selected_items = []
          for field in core:
              group = sorted(
                  by_missing.get(field, []),
                  key=lambda item: (
                      0 if item['has_structured_ingredients'] else 1,
                      str(item['old'].get('product_id') or ''),
                  ),
              )
              selected_items.extend(group[:per_field])
          selected_items.sort(key=lambda item: str(item['old'].get('product_id') or ''))

          if not selected_items:
              raise SystemExit('No exact-EAN exact-current-p9 single-family missing-one candidate survived live verification')

          selected_products = [item['live'] for item in selected_items]
          selection_rows = []
          for item in selected_items:
              old = item['old']
              meta = item['live']['_exact_current_image_meta']
              selection_rows.append({
                  'product_id': str(old.get('product_id') or ''),
                  'name': old.get('name'),
                  'historical_missing_core_fields': old.get('missing_core_fields'),
                  'historical_engine_families': old.get('independent_engine_families'),
                  'historical_corroborated_fields': old.get('corroborated_fields'),
                  'previous_latest_raw_run_id': old.get('latest_raw_run_id'),
                  'ean': meta.get('canonical_ean'),
                  'image_url': meta.get('image_url'),
                  'perspective': meta.get('current_photo_perspective'),
                  'has_structured_ingredients': item['has_structured_ingredients'],
              })

          root = Path('mercadona-current-clean-missing-one-wave1')
          root.mkdir(exist_ok=True)
          (root / 'products.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in selected_products),
              encoding='utf-8',
          )
          summary = {
              'canonical_audit_run_id': int('${{ steps.canonical.outputs.run_id }}'),
              'prior_canary_run_id': int('${{ steps.canary.outputs.run_id }}'),
              'prior_canary_excluded_ids': sorted(attempted_before),
              'strict_diagnostic_rows': len(rows),
              'strict_single_family_candidates_after_prior_exclusion': len(candidates),
              'rejected_shape_product_ids': sorted(rejected_shape),
              'live_verified_exact_ean_exact_p9': len(verified),
              'live_exclusions': exclusions,
              'per_missing_field': per_field,
              'selected': len(selected_items),
              'selected_product_ids': [str(item['old'].get('product_id') or '') for item in selected_items],
              'selected_missing_field_counts': dict(sorted(Counter(
                  item['old']['missing_core_fields'][0] for item in selected_items
              ).items())),
              'selected_with_structured_ingredients': sum(1 for item in selected_items if item['has_structured_ingredients']),
              'selection_policy': 'CURRENT_REVIEW_EXACTLY_3_OBSERVED_CORE; EXPLICIT_100G_100ML; NO_HARD_BLOCKER; EXACTLY_1_HISTORICAL_OCR_FAMILY; MISSING_CORE_ONLY; EXACT_EAN; EXACT_CURRENT_FIRST_PARTY_P9_IMAGE; PRIOR_CANARY_EXCLUDED; BALANCED_2_PER_MISSING_FIELD; STRUCTURED_INGREDIENTS_FIRST',
              'selected_rows': selection_rows,
              'historical_partial_values_usable': False,
              'cross_run_value_fusion': False,
              'cross_image_value_fusion': False,
              'fresh_observation_must_recover_all_four': True,
              'fresh_observation_must_corroborate_all_four': True,
              'acceptance_policy_changed': False,
              'images_persisted': False,
              'missing_values_inferred': False,
              'image_guessing': False,
          }
          (root / 'selection-summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Install OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow

      - name: Run conservative rescue and safety tests first
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_mercadona_preselected_current_image_routing.py \
            test_mercadona_preselected_three_of_four_variant_rescue.py \
            test_mercadona_near_safe_variant_rescue.py \
            test_mercadona_ocr_safety_regressions.py \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_label_reader_row_tokens.py \
            test_nutrition_label_reader_low_kcal_pair.py \
            test_nutrition_ocr_ensemble.py \
            test_label_image_preprocess.py

      - name: OCR exact current first-party images
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          root=mercadona-current-clean-missing-one-wave1
          set +e
          python mercadona_preselected_current_image_variant_rescue.py \
            --products "$root/products.jsonl" \
            --out "$root/ocr" \
            --shard-index 0 \
            --shard-count 1 \
            --limit 0
          rc=$?
          set -e
          [[ $rc -eq 0 || $rc -eq 2 ]]

          python - <<'PY'
          import glob
          import json
          import sqlite3
          from collections import Counter
          from pathlib import Path

          core = ('calories', 'fat_g', 'carbohydrate_g', 'protein_g')
          root = Path('mercadona-current-clean-missing-one-wave1')
          source_products = {
              str(row.get('product_id') or ''): row
              for row in (
                  json.loads(line)
                  for line in (root / 'products.jsonl').read_text(encoding='utf-8').splitlines()
                  if line.strip()
              )
          }
          rows = []
          for result_path in glob.glob(str(root / 'ocr/results-*.jsonl')):
              patched = []
              for line in Path(result_path).read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  pid = str(row.get('product_id') or '')
                  source_product = source_products.get(pid)
                  if source_product is None:
                      raise SystemExit(f'unexpected result product {pid}')
                  meta = source_product['_exact_current_image_meta']
                  if str(row.get('image_url') or '') != str(meta['image_url']):
                      raise SystemExit(f'unexpected result routing for {pid}')
                  row.update({
                      'image_index': meta.get('current_photo_index'),
                      'perspective': meta.get('current_photo_perspective'),
                      'image_selection_basis': meta.get('image_selection_basis'),
                      'identity_basis': meta.get('identity_basis'),
                      'canonical_ean': meta.get('canonical_ean'),
                      'current_ean': meta.get('current_ean'),
                      'live_detail_source_url': meta.get('live_detail_source_url'),
                      'live_detail_observed_at': meta.get('live_detail_observed_at'),
                      'previous_latest_raw_run_id': meta.get('previous_latest_raw_run_id'),
                      'historical_missing_core_fields': meta.get('historical_missing_core_fields'),
                      'historical_engine_families': meta.get('historical_engine_families'),
                      'historical_corroborated_fields': meta.get('historical_corroborated_fields'),
                      'cross_run_value_fusion': False,
                      'cross_image_value_fusion': False,
                      'historical_partial_values_usable': False,
                      'current_observation_must_satisfy_declared_contract_independently': True,
                      'acceptance_policy_changed': False,
                      'missing_values_inferred': False,
                      'image_guessing': False,
                  })
                  patched.append(row)
                  rows.append(row)
              Path(result_path).write_text(
                  ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in patched),
                  encoding='utf-8',
              )

          if len(rows) != len(source_products) or {str(row.get('product_id') or '') for row in rows} != set(source_products):
              raise SystemExit(f'expected one result per verified product ({len(source_products)}), got {len(rows)}')

          for row in rows:
              pid = str(row.get('product_id') or '')
              if (
                  row.get('source') != 'MERCADONA_FIRST_PARTY'
                  or row.get('source_record_kind') != 'label image'
                  or row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE'
                  or row.get('redistribution_allowed') is not False
                  or not row.get('canonical_ean')
                  or row.get('canonical_ean') != row.get('current_ean')
                  or str(row.get('perspective') or '') != '9'
                  or row.get('cross_run_value_fusion') is not False
                  or row.get('cross_image_value_fusion') is not False
                  or row.get('historical_partial_values_usable') is not False
                  or row.get('missing_values_inferred') is not False
                  or row.get('image_guessing') is not False
              ):
                  raise SystemExit(f'unsafe provenance/identity for {pid}')
              if row.get('status') == 'DECLARED':
                  nutrition = row.get('nutrition') or {}
                  if any(nutrition.get(field) is None for field in core) or row.get('basis') not in {'100_g', '100_ml'}:
                      raise SystemExit(f'DECLARED without 4/4 + explicit basis for {pid}')
                  ensembles = [
                      attempt.get('ensemble') or {}
                      for attempt in row.get('attempts', [])
                      if (attempt.get('ensemble') or {}).get('status') == 'DECLARED'
                  ]
                  if not ensembles:
                      raise SystemExit(f'DECLARED without declared ensemble for {pid}')
                  if max(int(e.get('independent_engine_families') or 0) for e in ensembles) < 2:
                      raise SystemExit(f'DECLARED without >=2 independent OCR families for {pid}')
                  if max(int(e.get('corroborated_fields') or 0) for e in ensembles) < 4:
                      raise SystemExit(f'DECLARED without 4/4 corroboration for {pid}')
                  reasons = [str(reason) for e in ensembles for reason in (e.get('reasons') or [])]
                  if any(
                      reason.startswith('MULTIPLE_NUTRITION_COLUMNS')
                      or reason.startswith('OCR_BOUNDED_CORE_VALUE')
                      or reason.startswith('OCR_FIELD_CONFLICT')
                      or reason.startswith('OCR_BASIS_CONFLICT')
                      for reason in reasons
                  ):
                      raise SystemExit(f'DECLARED despite hard safety signal for {pid}')

          rows.sort(key=lambda row: str(row.get('product_id') or ''))
          (root / 'results-merged.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in rows),
              encoding='utf-8',
          )
          counts = Counter(str(row.get('status') or 'UNKNOWN') for row in rows)
          declared_ids = [str(row.get('product_id') or '') for row in rows if row.get('status') == 'DECLARED']
          summary = {
              'inventory_products': 4280,
              'processed': len(rows),
              'status_counts': dict(sorted(counts.items())),
              'declared_product_ids': declared_ids,
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'redistribution_allowed': False,
              'images_persisted': False,
              'missing_values_inferred': False,
              'historical_partial_values_usable': False,
              'cross_run_value_fusion': False,
              'cross_image_value_fusion': False,
              'fresh_observation_must_recover_all_four': True,
              'fresh_observation_must_corroborate_all_four': True,
              'acceptance_policy_changed': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          (root / 'summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          db = sqlite3.connect(root / 'staging.sqlite')
          db.execute(
              'CREATE TABLE ocr_results ('
              'product_id TEXT PRIMARY KEY, status TEXT NOT NULL, evidence_level TEXT NOT NULL, '
              'source TEXT NOT NULL, redistribution_allowed INTEGER NOT NULL, payload_json TEXT NOT NULL)'
          )
          for row in rows:
              db.execute(
                  'INSERT INTO ocr_results VALUES (?, ?, ?, ?, ?, ?)',
                  (
                      str(row.get('product_id') or ''),
                      str(row.get('status') or 'UNKNOWN'),
                      str(row.get('evidence_level') or ''),
                      'MERCADONA_FIRST_PARTY/label image',
                      0,
                      json.dumps(row, ensure_ascii=False, sort_keys=True),
                  ),
              )
          db.commit()
          db.close()
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-current-clean-missing-one-wave1
          path: |
            tools/catalog/mercadona-current-clean-missing-one-wave1/results-merged.jsonl
            tools/catalog/mercadona-current-clean-missing-one-wave1/summary.json
            tools/catalog/mercadona-current-clean-missing-one-wave1/selection-summary.json
            tools/catalog/mercadona-current-clean-missing-one-wave1/staging.sqlite
          retention-days: 30
          if-no-files-found: warn
