name: Catalog integration APK

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build-catalog-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Restaurar catálogo nutricional legacy
        run: |
          mkdir -p app/src/main/assets
          base64 --decode tools/aesan_foods.dat.b64 > app/src/main/assets/aesan_foods.dat
      - name: Descargar último SQLite provisional de Carrefour
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow catalog-carrefour-manual-build-once.yml --branch agent/catalog-phase1 --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          mkdir -p "$RUNNER_TEMP/carrefour"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name carrefour-food-catalog-manual --dir "$RUNNER_TEMP/carrefour"
          SQLITE="$(find "$RUNNER_TEMP/carrefour" -name carrefour_food_catalog.sqlite -print -quit)"
          test -n "$SQLITE"
          cp "$SQLITE" app/src/main/assets/catalog.sqlite
          echo "CARREFOUR_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
      - name: Verificar contrato y volumen del SQLite
        run: |
          sqlite3 app/src/main/assets/catalog.sqlite ".tables"
          for table in metadata products retailer_listings nutrition classifications classification_roles; do
            sqlite3 app/src/main/assets/catalog.sqlite "SELECT 1 FROM $table LIMIT 1;" >/dev/null
          done
          echo "PRODUCTS=$(sqlite3 app/src/main/assets/catalog.sqlite 'SELECT COUNT(*) FROM products;')" >> "$GITHUB_ENV"
          echo "LISTINGS=$(sqlite3 app/src/main/assets/catalog.sqlite 'SELECT COUNT(*) FROM retailer_listings;')" >> "$GITHUB_ENV"
          echo "ELIGIBLE=$(sqlite3 app/src/main/assets/catalog.sqlite \"SELECT COUNT(*) FROM classifications c JOIN nutrition n ON n.product_id=c.product_id WHERE c.status='MENU_ELIGIBLE' AND c.classified=1 AND n.calories IS NOT NULL AND n.protein_g IS NOT NULL AND n.carbohydrate_g IS NOT NULL AND n.fat_g IS NOT NULL;\")" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Probar y compilar con catálogo real
        run: ./gradlew test assembleRelease
      - name: Leer versión de Rumbo
        run: echo "RUMBO_VERSION=$(sed -n 's/.*versionName = \"\(.*\)\"/\1/p' app/build.gradle)" >> "$GITHUB_ENV"
      - name: Preparar herramientas de firma
        run: |
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p build/signing-tools/lib build/signing-tools/lib64
          cp "$BUILD_TOOLS/apksigner" "$BUILD_TOOLS/zipalign" build/signing-tools/
          cp "$BUILD_TOOLS/lib/apksigner.jar" build/signing-tools/lib/
          cp "$BUILD_TOOLS/lib64/libc++.so" build/signing-tools/lib64/
      - name: Firmar APK
        env:
          RUMBO_SIGNING_KEY_BASE64: ${{ secrets.RUMBO_SIGNING_KEY_BASE64 }}
          RUMBO_SIGNING_PASSWORD: ${{ secrets.RUMBO_SIGNING_PASSWORD }}
        run: |
          mkdir -p build/signed
          printf '%s' "$RUMBO_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/rumbo-release.jks"
          build/signing-tools/zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/Rumbo-$RUMBO_VERSION-catalog-aligned.apk"
          build/signing-tools/apksigner sign --ks "$RUNNER_TEMP/rumbo-release.jks" --ks-key-alias rumbo --ks-pass "pass:$RUMBO_SIGNING_PASSWORD" --key-pass "pass:$RUMBO_SIGNING_PASSWORD" --out "build/signed/Rumbo-$RUMBO_VERSION-catalog.apk" "$RUNNER_TEMP/Rumbo-$RUMBO_VERSION-catalog-aligned.apk"
          build/signing-tools/apksigner verify --verbose --print-certs "build/signed/Rumbo-$RUMBO_VERSION-catalog.apk"
      - name: Resumen
        run: |
          echo "### Carrefour provisional" >> "$GITHUB_STEP_SUMMARY"
          echo "- workflow run: $CARREFOUR_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- products: $PRODUCTS" >> "$GITHUB_STEP_SUMMARY"
          echo "- listings: $LISTINGS" >> "$GITHUB_STEP_SUMMARY"
          echo "- menu eligible with complete core nutrition: $ELIGIBLE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: rumbo-${{ env.RUMBO_VERSION }}-catalog-integration
          path: build/signed/Rumbo-${{ env.RUMBO_VERSION }}-catalog.apk
          if-no-files-found: error
          retention-days: 1
