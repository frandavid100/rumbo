name: Catalog Alcampo direct v8
on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - 'tools/catalog/alcampo_direct_catalog_v8.py'
      - '.github/workflows/catalog-alcampo-direct-v8.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pagination beyond async 202 boundary
        working-directory: tools/catalog
        run: python alcampo_direct_catalog_v8.py --out alcampo-direct-v8-smoke --only-root OC2112 --max-pages 5 --workers 1 --min-products 1201
      - name: Persist smoke
        if: always()
        run: |
          if [ -f tools/catalog/alcampo-direct-v8-smoke/summary.json ]; then
            cp tools/catalog/alcampo-direct-v8-smoke/summary.json tools/catalog/fixtures/alcampo_direct_v8_smoke_summary.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/catalog/fixtures/alcampo_direct_v8_smoke_summary.json
            if ! git diff --cached --quiet; then
              git commit -m "catalog: persist Alcampo direct v8 smoke"
              git pull --rebase origin agent/catalog-phase1
              git push origin HEAD:agent/catalog-phase1
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alcampo-direct-v8-smoke
          path: tools/catalog/alcampo-direct-v8-smoke/
          retention-days: 7
  full:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enumerate complete Alcampo food catalogue sequentially
        working-directory: tools/catalog
        run: python alcampo_direct_catalog_v8.py --out alcampo-direct-v8-full --workers 1 --min-products 5000
      - name: Persist full summary
        if: always()
        run: |
          if [ -f tools/catalog/alcampo-direct-v8-full/summary.json ]; then
            cp tools/catalog/alcampo-direct-v8-full/summary.json tools/catalog/fixtures/alcampo_direct_v8_latest_summary.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/catalog/fixtures/alcampo_direct_v8_latest_summary.json
            if ! git diff --cached --quiet; then
              git commit -m "catalog: persist Alcampo direct v8 full summary"
              git pull --rebase origin agent/catalog-phase1
              git push origin HEAD:agent/catalog-phase1
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alcampo-food-catalog-direct-v8
          path: tools/catalog/alcampo-direct-v8-full/
          retention-days: 7
