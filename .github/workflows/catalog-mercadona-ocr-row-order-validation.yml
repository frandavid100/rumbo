name: Catalog Mercadona OCR row-order validation

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-ocr-row-order-validation.yml'
      - 'tools/catalog/mercadona_nutrition_label_reader.py'
      - 'tools/catalog/mercadona_nutrition_reader.py'
      - 'tools/catalog/test_nutrition_row_order_ambiguity.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-ocr-row-order-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download consolidated Mercadona first-party cut
        uses: actions/download-artifact@v4
        with:
          name: mercadona-first-party-final
          path: tools/catalog/mercadona-first-party-final
          github-token: ${{ github.token }}
          run-id: 33046950149
      - name: Install OCR engines and detector dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow
      - name: Run conservative OCR regression tests
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_nutrition_label_reader.py \
            test_nutrition_row_order_ambiguity.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_ocr_safety_regressions.py
      - name: Build deterministic four-product validation slice
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          wanted = {'29130', '51198', '4949', '25243'}
          src = Path('mercadona-first-party-final/products.jsonl')
          rows = []
          for line in src.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              row = json.loads(line)
              if str(row.get('product_id') or '') in wanted:
                  rows.append(row)
          found = {str(row.get('product_id') or '') for row in rows}
          if found != wanted:
              raise SystemExit(f'missing target ids: {sorted(wanted - found)}')
          Path('row-order-validation-products.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in rows),
              encoding='utf-8',
          )
          PY
      - name: Re-run OCR end to end on affected and control products
        working-directory: tools/catalog
        run: |
          python mercadona_neural_ocr_wave.py \
            --products row-order-validation-products.jsonl \
            --out mercadona-row-order-validation \
            --eligibility-mode p9-no-ingredients-food-signal \
            --shard-index 0 \
            --shard-count 1 \
            --limit 0 \
            --delay 0
      - name: Validate no unsafe promotion and no control regressions
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows = [json.loads(line) for line in Path('mercadona-row-order-validation/results-00.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          by_id = {str(row.get('product_id') or ''): row for row in rows}
          expected_ids = {'29130', '51198', '4949', '25243'}
          if set(by_id) != expected_ids:
              raise SystemExit(f'unexpected result ids: {sorted(by_id)}')
          if any(row.get('status') == 'ERROR' for row in rows):
              raise SystemExit('OCR error in bounded validation slice')

          rice = by_id['29130']
          rice_n = rice.get('nutrition') or {}
          if rice.get('status') == 'DECLARED' and abs(float(rice_n.get('protein_g', -999)) - 7.0) > 0.05:
              raise SystemExit(f'unsafe rice-flour promotion survived: {rice_n}')

          controls = {
              '51198': {'calories': 240.0, 'fat_g': 15.7, 'carbohydrate_g': 12.2, 'protein_g': 12.4},
              '4949': {'calories': 152.0, 'fat_g': 8.9, 'carbohydrate_g': 0.0, 'protein_g': 18.0},
              '25243': {'calories': 176.0, 'fat_g': 11.0, 'carbohydrate_g': 0.6, 'protein_g': 19.0},
          }
          for pid, expected in controls.items():
              row = by_id[pid]
              if row.get('status') != 'DECLARED':
                  raise SystemExit(f'control {pid} regressed to {row.get("status")}')
              actual = row.get('nutrition') or {}
              for key, value in expected.items():
                  if abs(float(actual.get(key, -999)) - value) > 0.05:
                      raise SystemExit(f'control {pid} changed {key}: {actual.get(key)} != {value}')

          ambiguity_hits = []
          for attempt in rice.get('attempts') or []:
              for strategy, engine in (attempt.get('engines') or {}).items():
                  if 'AMBIGUOUS_VALUE_BEFORE_LABEL:protein_g' in (engine.get('reasons') or []):
                      ambiguity_hits.append(strategy)

          summary = {
              'validation_products': len(rows),
              'status_counts': {},
              'rice_flour_29130_status': rice.get('status'),
              'rice_flour_29130_nutrition': rice.get('nutrition'),
              'row_order_guard_engine_hits': sorted(set(ambiguity_hits)),
              'control_declared': 3,
              'unsafe_promotions': 0,
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'redistribution_allowed': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          for row in rows:
              summary['status_counts'][row.get('status')] = summary['status_counts'].get(row.get('status'), 0) + 1
          Path('mercadona-row-order-validation/validation-summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-ocr-row-order-validation
          path: tools/catalog/mercadona-row-order-validation/
          retention-days: 30
          if-no-files-found: warn
