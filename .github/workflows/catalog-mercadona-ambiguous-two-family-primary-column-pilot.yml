name: Catalog Mercadona ambiguous two-family primary-column pilot

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-ambiguous-two-family-primary-column-pilot.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: catalog-mercadona-ambiguous-two-family-primary-column-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve latest successful strict OCR audit
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            '/repos/frandavid100/rumbo/actions/workflows/catalog-mercadona-current-ocr-residual-audit.yml/runs?branch=agent%2Fcatalog-phase1&per_page=30' \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id')
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo 'No successful strict OCR audit found' >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using strict OCR audit run $run_id"

      - name: Download strict canonical audit
        uses: actions/download-artifact@v4
        with:
          name: mercadona-current-ocr-residual-audit
          path: /tmp/mercadona-audit
          github-token: ${{ github.token }}
          run-id: ${{ steps.audit.outputs.run_id }}

      - name: Select the sole second-wave ambiguity candidate
        id: target
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          CORE = ('calories', 'fat_g', 'carbohydrate_g', 'protein_g')
          src = Path('/tmp/mercadona-audit/current-review-failure-modes/complete-but-safety-blocked.jsonl')
          rows = [json.loads(line) for line in src.read_text(encoding='utf-8').splitlines() if line.strip()]
          matches = [row for row in rows if str(row.get('product_id') or '') == '39191']
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one canonical row for 39191, got {len(matches)}')
          row = matches[0]
          values = row.get('diagnostic_candidate_values') or {}
          blockers = set(row.get('safety_blockers') or [])
          reasons = set(row.get('reason_prefixes') or [])
          checks = {
              'canonical_review': row.get('canonical_status') == 'REVIEW',
              'three_of_four': int(row.get('corroborated_fields') or 0) == 3,
              'exactly_two_historical_families': int(row.get('independent_engine_families') or 0) == 2,
              'explicit_basis': row.get('basis') in {'100_g', '100_ml'},
              'complete_diagnostic_tuple': all(values.get(field) is not None for field in CORE),
              'sole_ambiguity_blocker': blockers == {'AMBIGUOUS_TABLE'},
              'multiple_columns_signal': 'MULTIPLE_NUTRITION_COLUMNS' in reasons,
              'identity_anchor_present': bool(str(row.get('ean') or '').strip()),
              'image_anchor_present': bool(str(row.get('image_url') or '').strip()),
          }
          if not all(checks.values()):
              raise SystemExit('39191 no longer matches the bounded second-wave cohort: ' + json.dumps(checks, sort_keys=True))
          Path('two-family-ambiguity-anchor.json').write_text(json.dumps(row, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({
              'canonical_audit_run_id': int('${{ steps.audit.outputs.run_id }}'),
              'product_id': '39191',
              'checks': checks,
              'historical_values_promotion_allowed': False,
              'current_crop_must_satisfy_declared_contract_independently': True,
              'cross_run_value_fusion': False,
              'cross_crop_value_fusion': False,
              'acceptance_policy_changed': False,
          }, sort_keys=True))
          PY
          echo 'selected=1' >> "$GITHUB_OUTPUT"

      - name: Rehydrate official first-party detail and require exact historical identity/image
        id: live
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from mercadona_first_party_details import _get_json, normalize, _now

          old = json.loads(Path('two-family-ambiguity-anchor.json').read_text(encoding='utf-8'))
          pid = '39191'
          anchor_ean = str(old.get('ean') or '').strip()
          anchor_url = str(old.get('image_url') or '').strip()
          observed_at = _now()
          payload, source_url = _get_json(pid, timeout=20.0)
          current = normalize(payload, source_url=source_url, observed_at=observed_at)
          current_ean = str(current.get('ean') or '').strip()
          if current_ean != anchor_ean:
              raise SystemExit(f'Current EAN mismatch for {pid}: current={current_ean!r} anchor={anchor_ean!r}')
          photos = current.get('photos') if isinstance(current.get('photos'), list) else []
          matches = [
              (index, photo)
              for index, photo in enumerate(photos)
              if isinstance(photo, dict)
              and str(photo.get('perspective') or '') == '9'
              and str(photo.get('zoom') or '') == anchor_url
          ]
          if len(matches) != 1:
              raise SystemExit(f'Exact historical first-party perspective=9 image is not uniquely current for {pid}: {len(matches)} matches')
          image_index, photo = matches[0]
          routed = dict(photo)
          routed['perspective'] = 9
          current['photos'] = [routed]
          current['_two_family_ambiguity_meta'] = {
              'canonical_ean': anchor_ean,
              'current_ean': current_ean,
              'image_url': anchor_url,
              'image_index': image_index,
              'canonical_latest_raw_run_id': old.get('latest_raw_run_id'),
              'canonical_corroborated_fields': int(old.get('corroborated_fields') or 0),
              'canonical_engine_families': int(old.get('independent_engine_families') or 0),
              'canonical_safety_blockers': list(old.get('safety_blockers') or []),
              'canonical_reason_prefixes': list(old.get('reason_prefixes') or []),
              'live_detail_source_url': source_url,
              'live_detail_observed_at': observed_at,
          }
          Path('two-family-ambiguity-product.jsonl').write_text(json.dumps(current, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({
              'product_id': pid,
              'ean_exact': True,
              'image_exact_unique_p9': True,
              'image_index': image_index,
              'has_structured_ingredients': bool(current.get('ingredients')),
              'source_url': source_url,
              'images_persisted': False,
              'redistribution_allowed': False,
          }, sort_keys=True))
          PY

      - name: Install OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check \
            'paddleocr>=3.7,<3.8' \
            'easyocr>=1.7,<1.8' \
            'python-doctr==1.1.0' \
            opencv-python-headless Pillow

      - name: Run conservative regressions before OCR
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_mercadona_ambiguous_primary_column_rescue.py \
            test_mercadona_bounded_doctr_rescue.py \
            test_mercadona_near_safe_doctr_retry.py \
            test_label_doctr_extractor.py \
            test_mercadona_ocr_safety_regressions.py \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_label_reader_row_tokens.py \
            test_nutrition_ocr_ensemble.py \
            test_label_image_preprocess.py

      - name: Run one-product independent primary-column rescue
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mercadona-ambiguous-two-family-primary-column-pilot/raw
          mode=$(python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('two-family-ambiguity-product.jsonl').read_text(encoding='utf-8'))
          print('priority' if row.get('ingredients') else 'p9-no-ingredients-all')
          PY
          )
          set +e
          python mercadona_ambiguous_primary_column_rescue.py \
            --products two-family-ambiguity-product.jsonl \
            --out mercadona-ambiguous-two-family-primary-column-pilot/raw \
            --shard-index 0 \
            --shard-count 1 \
            --limit 0 \
            --eligibility-mode "$mode"
          rc=$?
          set -e
          [[ $rc -eq 0 || $rc -eq 2 ]]

      - name: Validate and materialize auditable output
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import json
          from pathlib import Path
          import sqlite3

          CORE = ('calories', 'fat_g', 'carbohydrate_g', 'protein_g')
          root = Path('mercadona-ambiguous-two-family-primary-column-pilot')
          old = json.loads(Path('two-family-ambiguity-anchor.json').read_text(encoding='utf-8'))
          current = json.loads(Path('two-family-ambiguity-product.jsonl').read_text(encoding='utf-8'))
          meta = current.get('_two_family_ambiguity_meta') or {}
          result_paths = sorted(glob.glob(str(root / 'raw/results-*.jsonl')))
          rows = []
          for path in result_paths:
              rows.extend(json.loads(line) for line in Path(path).read_text(encoding='utf-8').splitlines() if line.strip())
          if len(rows) != 1 or str(rows[0].get('product_id') or '') != '39191':
              raise SystemExit(f'Unexpected result coverage: {[(row.get("product_id"), row.get("status")) for row in rows]}')
          row = rows[0]
          if str(row.get('ean') or '') != str(meta.get('canonical_ean') or ''):
              raise SystemExit('OCR result EAN does not match historical/current anchor')
          if str(row.get('image_url') or '') != str(meta.get('image_url') or ''):
              raise SystemExit('OCR used an unexpected image')
          row['image_index'] = meta.get('image_index')
          row['perspective'] = 9
          row['live_detail_source_url'] = meta.get('live_detail_source_url')
          row['live_detail_observed_at'] = meta.get('live_detail_observed_at')
          row['pilot_canonical_latest_raw_run_id'] = meta.get('canonical_latest_raw_run_id')
          row['pilot_canonical_corroborated_fields'] = meta.get('canonical_corroborated_fields')
          row['pilot_canonical_engine_families'] = meta.get('canonical_engine_families')
          row['pilot_canonical_safety_blockers'] = meta.get('canonical_safety_blockers')
          row['historical_values_promotion_allowed'] = False
          row['cross_run_value_fusion'] = False
          row['cross_crop_value_fusion'] = False
          row['current_crop_must_satisfy_declared_contract_independently'] = True
          row['acceptance_policy_changed'] = False

          invalid = []
          if (
              row.get('source') != 'MERCADONA_FIRST_PARTY'
              or row.get('source_record_kind') != 'label image'
              or row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE'
              or row.get('redistribution_allowed') is not False
              or row.get('perspective') != 9
              or row.get('pilot_canonical_corroborated_fields') != 3
              or row.get('pilot_canonical_engine_families') != 2
              or set(row.get('pilot_canonical_safety_blockers') or []) != {'AMBIGUOUS_TABLE'}
              or not str(row.get('live_detail_source_url') or '').startswith('https://tienda.mercadona.es/api/v1_1/products/')
          ):
              invalid.append('provenance_or_anchor_contract')

          if row.get('status') == 'DECLARED':
              nutrition = row.get('nutrition') or {}
              if any(nutrition.get(field) is None for field in CORE):
                  invalid.append('missing_declared_core')
              declared_attempts = [
                  attempt for attempt in row.get('attempts', [])
                  if (attempt.get('ensemble') or {}).get('status') == 'DECLARED'
              ]
              if not declared_attempts:
                  invalid.append('no_independently_declared_attempt')
              else:
                  ensemble = declared_attempts[0].get('ensemble') or {}
                  if (
                      ensemble.get('basis') not in {'100_g', '100_ml'}
                      or int(ensemble.get('independent_engine_families') or 0) < 2
                      or int(ensemble.get('corroborated_fields') or 0) < 4
                      or ensemble.get('reasons')
                  ):
                      invalid.append('fresh_crop_does_not_meet_unchanged_declared_contract')
          if invalid:
              raise SystemExit('Unsafe two-family ambiguity pilot row: ' + ','.join(invalid))

          summary = {
              'inventory_products': 4280,
              'canonical_audit_run_id': int('${{ steps.audit.outputs.run_id }}'),
              'processed': 1,
              'product_id': '39191',
              'status': row.get('status'),
              'nutrition': row.get('nutrition') if row.get('status') == 'DECLARED' else None,
              'historical_corroborated_fields': 3,
              'historical_engine_families': 2,
              'historical_safety_blockers': ['AMBIGUOUS_TABLE'],
              'selection_policy': 'ONE-PRODUCT SECOND-WAVE PILOT; COMPLETE 3_OF_4 HISTORICAL REVIEW; EXACTLY 2 HISTORICAL OCR FAMILIES; SOLE AMBIGUOUS_TABLE BLOCKER; MULTIPLE_NUTRITION_COLUMNS; EXACT LIVE EAN + SAME FIRST-PARTY P9 IMAGE',
              'rescue_policy': 'TEMPORARY PRIMARY-COLUMN CROP MUST INDEPENDENTLY SATISFY UNCHANGED DECLARED CONTRACT; HISTORICAL VALUES ARE DIAGNOSTIC ONLY; NO CROSS-CROP OR CROSS-RUN VALUE FUSION',
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'redistribution_allowed': False,
              'acceptance_policy_changed': False,
              'historical_values_promotion_allowed': False,
              'cross_run_value_fusion': False,
              'cross_crop_value_fusion': False,
              'images_persisted': False,
              'missing_values_inferred': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          (root / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          (root / 'results-merged.jsonl').write_text(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8')
          (root / 'historical-anchor.json').write_text(json.dumps(old, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))

          db = sqlite3.connect(root / 'staging.sqlite')
          db.execute(
              'CREATE TABLE ocr_results ('
              'product_id TEXT PRIMARY KEY, status TEXT NOT NULL, basis TEXT, '
              'calories REAL, fat_g REAL, carbohydrate_g REAL, protein_g REAL, '
              'evidence_level TEXT NOT NULL, source TEXT NOT NULL, image_url TEXT NOT NULL, '
              'redistribution_allowed INTEGER NOT NULL, raw_json TEXT NOT NULL)'
          )
          nutrition = row.get('nutrition') or {}
          db.execute('INSERT INTO ocr_results VALUES (?,?,?,?,?,?,?,?,?,?,?,?)', (
              '39191', str(row.get('status') or ''), row.get('basis'),
              nutrition.get('calories'), nutrition.get('fat_g'), nutrition.get('carbohydrate_g'), nutrition.get('protein_g'),
              'OCR_DERIVED_FROM_MERCADONA_IMAGE', 'MERCADONA_FIRST_PARTY/label image', str(row.get('image_url') or ''), 0,
              json.dumps(row, ensure_ascii=False, sort_keys=True),
          ))
          db.commit()
          db.close()
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-ambiguous-two-family-primary-column-pilot
          path: tools/catalog/mercadona-ambiguous-two-family-primary-column-pilot/
          retention-days: 30
          if-no-files-found: error

      - name: Trigger strict canonical reconciliation after pilot
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run catalog-mercadona-current-ocr-residual-audit.yml \
            --repo frandavid100/rumbo \
            --ref agent/catalog-phase1
