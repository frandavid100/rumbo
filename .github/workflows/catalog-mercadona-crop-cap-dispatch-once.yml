name: Catalog Mercadona crop-cap dispatch once

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-crop-cap-dispatch-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch current crop-cap canary
        run: gh workflow run catalog-mercadona-current-crop-cap-canary.yml --ref agent/catalog-phase1
