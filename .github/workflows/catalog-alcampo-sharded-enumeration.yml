name: Catalog Alcampo complete first-party pipeline
on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - 'tools/catalog/alcampo_child_enumerate.py'
      - 'tools/catalog/alcampo_merge_children.py'
      - 'tools/catalog/alcampo_direct_catalog_v6.py'
      - 'tools/catalog/alcampo_direct_catalog_v8.py'
      - 'tools/catalog/alcampo_split_detail_batches.py'
      - 'tools/catalog/alcampo_merge_detail_batches.py'
      - 'tools/catalog/alcampo_detail_enricher.py'
      - 'tools/catalog/alcampo_build_final_catalog.py'
      - 'tools/catalog/finalize_alcampo_classification.py'
      - 'tools/catalog/alcampo_semantic_gate.py'
      - 'tools/catalog/alcampo_prepare_semantic_review_v2.py'
      - 'tools/catalog/alcampo_export_final.py'
      - '.github/workflows/catalog-alcampo-sharded-enumeration.yml'
      - 'tools/catalog/fixtures/alcampo_root_children_latest.json'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: catalog-alcampo-complete-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      expected_children: ${{ steps.matrix.outputs.expected_children }}
      detail_matrix: ${{ steps.matrix.outputs.detail_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,re
          d=json.load(open('tools/catalog/fixtures/alcampo_root_children_latest.json',encoding='utf-8'))
          deny=re.compile(r'\b(vino|vinos|cerveza|cervezas|licor|licores|whisky|whiskey|ron|ginebra|vodka|brandy|cognac|champagne|cava|sidra|vermut|vermouth|sangr[ií]a|espirituosas?|bebidas?\s+alcoh[oó]licas?|perfumer[ií]a|droguer[ií]a|herbolario|control\s+de\s+peso)\b',re.I)
          def denied(name):
              name=str(name or '')
              if re.search(r'\bsin\s+alcohol\b',name,re.I):
                  return False
              return bool(deny.search(name))
          rows=[];seen=set()
          for root in d.get('roots',[]):
              root_name=str(root.get('root_label') or '').strip()
              root_rid=str(root.get('root_retailer_category_id') or '').strip()
              # Audit the direct listing of every food root, but do not recurse from it;
              # each first-level child is a separate recursive shard below. This keeps
              # large trees parallel and prevents a single root from timing out.
              if root_rid and root_rid not in seen and not denied(root_name):
                  seen.add(root_rid)
                  rows.append({'label':root_name or root_rid,'rid':root_rid,'expected':0,'max_depth':0})
              for child in root.get('children') or []:
                  label=str(child.get('name') or '').strip()
                  rid=str(child.get('retailerCategoryId') or '').strip()
                  if not rid or rid in seen or denied(label):
                      continue
                  seen.add(rid)
                  rows.append({'label':label or rid,'rid':rid,'expected':int(child.get('productCount') or 0),'max_depth':64})
          print('matrix='+json.dumps({'include':rows},ensure_ascii=False,separators=(',',':')))
          print('expected_children='+str(len(rows)))
          print('detail_matrix='+json.dumps({'include':[{'batch':f'{i:03d}'} for i in range(128)]},separators=(',',':')))
          PY

  enumerate:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enumerate one complete first-party Alcampo taxonomy shard
        working-directory: tools/catalog
        run: python alcampo_child_enumerate.py --label "${{ matrix.label }}" --rid "${{ matrix.rid }}" --expected "${{ matrix.expected }}" --max-depth "${{ matrix.max_depth }}" --out "alcampo-child-${{ matrix.rid }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alcampo-child-${{ matrix.rid }}
          path: tools/catalog/alcampo-child-${{ matrix.rid }}/
          retention-days: 7

  merge:
    needs: [prepare, enumerate]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: alcampo-child-*
          path: downloaded
      - name: Merge and audit recursive enumeration
        working-directory: tools/catalog
        run: |
          set +e
          python alcampo_merge_children.py --downloaded ../../downloaded --out alcampo-sharded-full --min-products 5000 --expected-shards "${{ needs.prepare.outputs.expected_children }}"
          code=$?
          set -e
          echo "$code" > alcampo-sharded-full/enumeration_exit_code.txt
          test -s alcampo-sharded-full/products.jsonl
      - name: Split first-party product manifest for detail enrichment
        working-directory: tools/catalog
        run: python alcampo_split_detail_batches.py --input alcampo-sharded-full/products.jsonl --out alcampo-detail-inputs --batches 128
      - uses: actions/upload-artifact@v4
        with:
          name: alcampo-detail-inputs
          path: tools/catalog/alcampo-detail-inputs/
          retention-days: 7
      - name: Persist enumeration result
        if: always()
        run: |
          if [ -f tools/catalog/alcampo-sharded-full/enumeration_report.json ]; then
            cp tools/catalog/alcampo-sharded-full/enumeration_report.json tools/catalog/fixtures/alcampo_sharded_enumeration_latest.json
            cp tools/catalog/alcampo-sharded-full/summary.json tools/catalog/fixtures/alcampo_sharded_catalog_summary_latest.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/catalog/fixtures/alcampo_sharded_enumeration_latest.json tools/catalog/fixtures/alcampo_sharded_catalog_summary_latest.json
            if ! git diff --cached --quiet; then
              git commit -m "catalog: persist recursive Alcampo enumeration summary"
              git pull --rebase origin agent/catalog-phase1
              git push origin HEAD:agent/catalog-phase1
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alcampo-food-catalog-sharded-enumeration
          path: tools/catalog/alcampo-sharded-full/
          retention-days: 7

  detail:
    needs: [prepare, merge]
    if: needs.merge.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.detail_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: alcampo-detail-inputs
          path: detail-inputs
      - name: Fetch declared Alcampo product detail and nutrition
        working-directory: tools/catalog
        run: python alcampo_detail_enricher.py --input "../../detail-inputs/batch-${{ matrix.batch }}.jsonl" --workers 1 --retry-rounds 3 --out "alcampo-detail-${{ matrix.batch }}" --min-valid 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alcampo-detail-result-${{ matrix.batch }}
          path: tools/catalog/alcampo-detail-${{ matrix.batch }}/
          retention-days: 7

  final:
    needs: [merge, detail]
    if: always() && needs.merge.result == 'success' && needs.detail.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: alcampo-food-catalog-sharded-enumeration
          path: enumeration
      - uses: actions/download-artifact@v4
        with:
          pattern: alcampo-detail-result-*
          path: downloaded-details
      - name: Merge detail batches
        working-directory: tools/catalog
        run: python alcampo_merge_detail_batches.py --downloaded ../../downloaded-details --out ../../alcampo-final/details.jsonl --expected-products ../../enumeration/products.jsonl
      - name: Build canonical first-party SQLite
        working-directory: tools/catalog
        run: python alcampo_build_final_catalog.py --products ../../enumeration/products.jsonl --details ../../alcampo-final/details.jsonl --output ../../alcampo-final/alcampo_catalog.sqlite
      - name: Build deterministic Rumbo classification proposals
        working-directory: tools/catalog
        run: python finalize_alcampo_classification.py ../../alcampo-final/alcampo_catalog.sqlite ../../enumeration/products.jsonl
      - name: Gate CLASSIFIED and MENU_ELIGIBLE on persisted semantic model review
        working-directory: tools/catalog
        run: python alcampo_semantic_gate.py ../../alcampo-final/alcampo_catalog.sqlite --reviews manual/alcampo_semantic_reviews.jsonl
      - name: Prepare next semantic review batch
        working-directory: tools/catalog
        run: |
          python alcampo_prepare_semantic_review_v2.py ../../alcampo-final/alcampo_catalog.sqlite \
            --observations ../../enumeration/products.jsonl \
            --reviews manual/alcampo_semantic_reviews.jsonl \
            --output ../../alcampo-final/semantic_review_next.jsonl \
            --progress ../../alcampo-final/semantic_review_progress.json \
            --limit 500
      - name: Export classified JSONL and coverage report
        working-directory: tools/catalog
        run: python alcampo_export_final.py ../../alcampo-final/alcampo_catalog.sqlite --jsonl ../../alcampo-final/alcampo_catalog.jsonl --summary ../../alcampo-final/summary.json --detail-summary ../../alcampo-final/detail_merge_summary.json --enumeration-report ../../enumeration/enumeration_report.json
      - name: Preserve first-party evidence streams
        run: |
          cp enumeration/products.jsonl alcampo-final/source_products.jsonl
          cp enumeration/enumeration_report.json alcampo-final/enumeration_report.json
          cp enumeration/enumeration_exit_code.txt alcampo-final/enumeration_exit_code.txt || true
      - name: Persist final coverage and semantic review queue
        run: |
          cp alcampo-final/summary.json tools/catalog/fixtures/alcampo_final_summary_latest.json
          cp alcampo-final/semantic_review_next.jsonl tools/catalog/fixtures/alcampo_semantic_review_next.jsonl
          cp alcampo-final/semantic_review_progress.json tools/catalog/fixtures/alcampo_semantic_review_progress_latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/catalog/fixtures/alcampo_final_summary_latest.json \
                  tools/catalog/fixtures/alcampo_semantic_review_next.jsonl \
                  tools/catalog/fixtures/alcampo_semantic_review_progress_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "catalog: persist Alcampo final and semantic review queue"
            git pull --rebase origin agent/catalog-phase1
            git push origin HEAD:agent/catalog-phase1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: alcampo-food-catalog-classified-snapshot
          path: alcampo-final/
          retention-days: 14
