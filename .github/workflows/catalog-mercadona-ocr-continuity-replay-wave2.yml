name: Catalog Mercadona OCR continuity replay wave2

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-ocr-continuity-replay-wave2.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-ocr-continuity-replay-wave2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - name: Download persisted p9 replay evidence
        uses: actions/download-artifact@v4
        with:
          name: mercadona-ocr-replay-2630
          path: tools/catalog/mercadona-ocr-replay-2630
          repository: frandavid100/rumbo
          github-token: ${{ github.token }}
          run-id: 33331091953
      - name: Download two-missing pilot audit and selection
        uses: actions/download-artifact@v4
        with:
          name: mercadona-tesseract-two-family-two-missing-core-pilot
          path: tools/catalog/mercadona-two-missing-pilot
          repository: frandavid100/rumbo
          github-token: ${{ github.token }}
          run-id: 33855949504
      - name: Run continuity rescue regression tests
        working-directory: tools/catalog
        run: |
          python -m unittest -v test_mercadona_ocr_continuity_rescue.py
          python -m py_compile mercadona_ocr_continuity_rescue.py
      - name: Build exact remaining two-candidate input
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('mercadona-two-missing-pilot')
          baseline_path = root / 'mercadona-p9-two-family-two-missing-core-audit/two-family-two-missing-core-candidates.jsonl'
          selection_path = root / 'two-family-two-missing-core-pilot-selection.json'
          replay_path = Path('mercadona-ocr-replay-2630/results-replayed.jsonl')

          baseline = [json.loads(line) for line in baseline_path.read_text(encoding='utf-8').splitlines() if line.strip()]
          selection = json.loads(selection_path.read_text(encoding='utf-8'))
          selected = set(str(pid) for pid in selection.get('product_ids') or [])
          remaining = sorted(str(row['product_id']) for row in baseline if str(row['product_id']) not in selected)
          if len(baseline) != 18 or len(selected) != 16 or len(remaining) != 2:
              raise SystemExit(f'unexpected partition baseline={len(baseline)} selected={len(selected)} remaining={remaining}')

          wanted = set(remaining)
          rows = []
          for line in replay_path.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              row = json.loads(line)
              if str(row.get('product_id') or '') in wanted:
                  rows.append(row)
          ids = [str(row.get('product_id') or '') for row in rows]
          if len(rows) != 2 or set(ids) != wanted or len(set(ids)) != 2:
              raise SystemExit(f'replay join mismatch wanted={remaining} observed={ids}')

          Path('continuity-wave2-results.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in rows),
              encoding='utf-8',
          )
          Path('continuity-wave2-selection.json').write_text(
              json.dumps({
                  'candidate_universe': 18,
                  'pilot_selected': 16,
                  'remaining': 2,
                  'product_ids': remaining,
                  'source': 'MERCADONA_FIRST_PARTY/label image',
                  'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
                  'redistribution_allowed': False,
                  'images_persisted': False,
                  'CLASSIFIED': 0,
                  'MENU_ELIGIBLE': 0,
              }, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({'remaining_product_ids': remaining}, ensure_ascii=False))
          PY
      - name: Replay conservative continuity parser on remaining evidence
        working-directory: tools/catalog
        run: |
          python mercadona_ocr_continuity_rescue.py \
            --results continuity-wave2-results.jsonl \
            --baseline mercadona-two-missing-pilot/mercadona-p9-two-family-two-missing-core-audit/two-family-two-missing-core-candidates.jsonl \
            --out mercadona-ocr-continuity-replay-wave2
      - name: Build closed-stratum audit summary
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from mercadona_ocr_continuity_rescue import rescue_read

          out = Path('mercadona-ocr-continuity-replay-wave2')
          wave = json.loads((out / 'summary.json').read_text(encoding='utf-8'))
          promotions = json.loads((out / 'safe-promotions.json').read_text(encoding='utf-8'))
          rows = [json.loads(line) for line in Path('continuity-wave2-results.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          if wave.get('processed') != 2 or wave.get('safe_promotion_products') != len(promotions):
              raise SystemExit('wave2 count mismatch')

          diagnostics = []
          for row in rows:
              signals = set()
              missing = []
              for attempt in row.get('attempts') or []:
                  for engine in (attempt.get('engines') or {}).values():
                      text = engine.get('normalized_ocr_text') or ''
                      read = rescue_read(text)
                      signals.update(read.reasons)
                      if '<0.5' in text.lower() or '<0,5' in text.lower():
                          signals.add('BOUNDED_VALUE_PRESENT')
              diagnostics.append({
                  'product_id': str(row.get('product_id') or ''),
                  'name': row.get('name'),
                  'final_status': 'DECLARED' if any(str(p.get('product_id')) == str(row.get('product_id')) for p in promotions) else 'REVIEW',
                  'conservative_signals': sorted(signals),
              })

          promoted = len(promotions)
          closed = {
              'parser': 'mercadona_ocr_continuity_rescue/1.0.2',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'redistribution_allowed': False,
              'candidate_universe': 18,
              'pilot_processed': 16,
              'pilot_safe_promotions': 3,
              'wave2_processed': 2,
              'wave2_safe_promotions': promoted,
              'closed_stratum_safe_promotions': 3 + promoted,
              'closed_stratum_review': 15 - promoted,
              'images_persisted': False,
              'missing_values_inferred': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
              'wave2_diagnostics': diagnostics,
              'cumulative_after_closed_stratum': {
                  'catalog_total': 4280,
                  'processed': 2943,
                  'DECLARED_complete': 265 + promoted,
                  'REVIEW': 2678 - promoted,
                  'complete_usable_coverage_pct': round(100.0 * (265 + promoted) / 4280, 4),
                  'processed_coverage_pct': round(100.0 * 2943 / 4280, 4),
              },
          }
          (out / 'closed-stratum-summary.json').write_text(json.dumps(closed, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(closed, ensure_ascii=False, indent=2))
          PY
      - name: Upload auditable wave2 closure
        uses: actions/upload-artifact@v4
        with:
          name: mercadona-ocr-continuity-replay-wave2
          path: |
            tools/catalog/mercadona-ocr-continuity-replay-wave2
            tools/catalog/continuity-wave2-selection.json
          if-no-files-found: error
          retention-days: 30
