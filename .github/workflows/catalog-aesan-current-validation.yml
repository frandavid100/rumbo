name: Catalog AESAN 2022 vs current evidence

on:
  workflow_dispatch:
  push:
    branches:
      - agent/catalog-phase1
    paths:
      - '.github/workflows/catalog-aesan-current-validation.yml'
      - 'tools/catalog/compare_aesan_2022_current_evidence.py'
      - 'tools/catalog/fixtures/pilot_300_structured_resolved.json'
      - 'tools/catalog/fixtures/pilot_300_declared_label_evidence*.json'
      - 'tools/catalog/fixtures/generic_fdc_accepted_mappings.json'

jobs:
  validate-aesan-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests opencv-python-headless

      - name: Compare historical and current evidence
        working-directory: tools/catalog
        env:
          AESAN_2022_EXCEL_URL: https://web.archive.org/web/20250814194053id_/https://www.aesan.gob.es/AECOSAN/docs/documentos/seguridad_alimentaria/bases_datos/BasedatosWeb.xlsx
        run: python compare_aesan_2022_current_evidence.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: catalog-aesan-current-validation-report
          path: tools/catalog/aesan-2022-current-evidence-output/
          if-no-files-found: error
