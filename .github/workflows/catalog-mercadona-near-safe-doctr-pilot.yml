name: Catalog Mercadona near-safe docTR pilot

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-near-safe-doctr-pilot.yml'
      - 'tools/catalog/mercadona_near_safe_doctr_input.py'
      - 'tools/catalog/test_mercadona_near_safe_doctr_input.py'
      - 'tools/catalog/mercadona_bounded_doctr_rescue.py'
      - 'tools/catalog/test_mercadona_bounded_primary_column_variants.py'
      - 'tools/catalog/mercadona_near_safe_doctr_retry.py'
      - 'tools/catalog/test_mercadona_near_safe_doctr_retry.py'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: catalog-mercadona-near-safe-doctr-pilot-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_AUDIT_RUN_ID: '35154862990'
  SOURCE_AUDIT_ARTIFACT: mercadona-current-ocr-residual-audit
  TARGET_LIMIT: '8'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download immutable current REVIEW audit
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_AUDIT_ARTIFACT }}
          path: tools/catalog/near-safe-audit
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_AUDIT_RUN_ID }}

      - name: Test and select clean 3-of-4 then 2-of-4 then 1-of-4 REVIEW targets
        working-directory: tools/catalog
        run: |
          set -euo pipefail
          python -m unittest -v test_mercadona_near_safe_doctr_input.py
          rm -rf near-safe-selection
          python mercadona_near_safe_doctr_input.py select \
            --diagnostic near-safe-audit/current-review-failure-modes/near-safe-complete-review.jsonl \
            --out near-safe-selection \
            --limit "$TARGET_LIMIT"

      - name: Rehydrate only selected products from official first-party API
        working-directory: tools/catalog
        run: |
          set -euo pipefail
          rm -rf mercadona-first-party-near-safe-live
          python mercadona_first_party_details.py \
            --inventory near-safe-selection/inventory.jsonl \
            --out mercadona-first-party-near-safe-live \
            --shard-index 0 \
            --shard-count 1 \
            --timeout 20 \
            --delay 0.2
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('mercadona-first-party-near-safe-live')
          summary = json.loads((root / 'summary-00.json').read_text(encoding='utf-8'))
          errors = [json.loads(line) for line in (root / 'errors-00.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          if errors or summary.get('fetched') != summary.get('requested'):
              raise SystemExit(f'Targeted first-party rehydration incomplete: summary={summary} errors={errors}')
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY

      - name: Require exact current EAN and exact first-party image URL
        working-directory: tools/catalog
        run: |
          set -euo pipefail
          rm -rf near-safe-doctr-input
          python mercadona_near_safe_doctr_input.py live \
            --selected near-safe-selection/selected.jsonl \
            --details mercadona-first-party-near-safe-live/details-00.jsonl \
            --out near-safe-doctr-input
          cp near-safe-selection/selection-summary.json near-safe-doctr-input/selection-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('near-safe-doctr-input')
          selection = json.loads((root / 'selection-summary.json').read_text(encoding='utf-8'))
          live = json.loads((root / 'live-summary.json').read_text(encoding='utf-8'))
          metadata = {
              'source_audit_run_id': int('${{ env.SOURCE_AUDIT_RUN_ID }}'),
              'source_audit_artifact': 'mercadona-current-ocr-residual-audit',
              'source_branch_sha': '${{ github.sha }}',
              'selection': selection,
              'live_validation': live,
              'new_independent_ocr_family': 'doctr',
              'acceptance_policy_changed': False,
              'images_persisted': False,
              'redistribution_allowed': False,
          }
          (root / 'pilot-metadata.json').write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: mercadona-near-safe-doctr-input
          path: tools/catalog/near-safe-doctr-input/
          retention-days: 30
          if-no-files-found: error

  ocr:
    runs-on: ubuntu-24.04
    needs: prepare
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1]
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v4
        with:
          name: mercadona-near-safe-doctr-input
          path: tools/catalog/retry-input

      - name: Install OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check \
            'paddleocr>=3.7,<3.8' \
            'easyocr>=1.7,<1.8' \
            'python-doctr==1.1.0' \
            opencv-python-headless Pillow

      - name: Run conservative OCR and routing regressions before images
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_mercadona_near_safe_doctr_input.py \
            test_mercadona_bounded_doctr_rescue.py \
            test_mercadona_bounded_primary_column_variants.py \
            test_label_doctr_extractor.py \
            test_mercadona_near_safe_doctr_retry.py \
            test_mercadona_ocr_safety_regressions.py \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_label_reader_row_tokens.py \
            test_nutrition_ocr_ensemble.py \
            test_label_image_preprocess.py

      - name: Run bounded docTR rescue with unchanged acceptance contract
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mercadona-near-safe-doctr-pilot/with-ingredients
          mkdir -p mercadona-near-safe-doctr-pilot/without-ingredients

          run_group() {
            local products="$1"
            local out="$2"
            local mode="$3"
            [[ -s "$products" ]] || return 0
            set +e
            python mercadona_bounded_doctr_rescue.py \
              --products "$products" \
              --out "$out" \
              --shard-index ${{ matrix.shard }} \
              --shard-count 2 \
              --limit 0 \
              --eligibility-mode "$mode"
            rc=$?
            set -e
            [[ $rc -eq 0 || $rc -eq 2 ]] || return "$rc"
          }

          cp retry-input/with-ingredients.jsonl .
          cp retry-input/without-ingredients.jsonl .
          cp retry-input/pilot-metadata.json mercadona-near-safe-doctr-pilot/pilot-metadata.json
          cp retry-input/selection-summary.json mercadona-near-safe-doctr-pilot/selection-summary.json
          cp retry-input/live-summary.json mercadona-near-safe-doctr-pilot/live-summary.json
          run_group with-ingredients.jsonl mercadona-near-safe-doctr-pilot/with-ingredients priority
          run_group without-ingredients.jsonl mercadona-near-safe-doctr-pilot/without-ingredients p9-no-ingredients-all

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-near-safe-doctr-pilot-${{ matrix.shard }}
          path: tools/catalog/mercadona-near-safe-doctr-pilot/
          retention-days: 90
          if-no-files-found: error

  reconcile:
    runs-on: ubuntu-24.04
    needs: ocr
    if: ${{ needs.ocr.result == 'success' }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Trigger strict canonical reconciliation after pilot
        run: |
          gh workflow run catalog-mercadona-current-ocr-residual-audit.yml \
            --repo frandavid100/rumbo \
            --ref agent/catalog-phase1
