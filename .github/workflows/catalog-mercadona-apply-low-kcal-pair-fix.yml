name: Catalog Mercadona apply low-kcal pair fix

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-apply-low-kcal-pair-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact guarded parser edit
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/catalog/nutrition_label_reader.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def _energy_kcal(text: str) -> float | None:\n')
          end = text.index('\ndef _basis(text: str) -> str | None:\n', start)
          replacement = '''def _energy_kcal(text: str) -> float | None:
              folded = _fold(text)
              # A printed single-digit decimal kcal value is normally too fragile to
              # trust on its own. Accept it only when the same OCR text contains an
              # explicit kJ/kcal pair whose printed units are physically coherent.
              # For ordinary >=10 kcal labels, preserve the established parser path:
              # kJ is corroborating text, while macro-energy coherence remains the
              # safety gate. This avoids changing legacy mismatch diagnostics.
              inline_pair = re.search(
                  r"(?P<kj>\\d{1,5}(?:\\.\\d{1,2})?)\\s*k\\s*j\\s*(?:[/\\\\|]\\s*)?"
                  r"(?P<kcal>\\d{1,4}(?:\\.\\d{1,2})?)\\s*kcal\\b",
                  folded,
                  flags=re.I,
              )
              if inline_pair:
                  kj = float(inline_pair.group("kj"))
                  kcal = float(inline_pair.group("kcal"))
                  if kcal < 10:
                      return kcal if _coherent_kj_kcal_pair(kj, kcal) else None

              reverse_inline_pair = re.search(
                  r"(?P<kcal>\\d{1,4}(?:\\.\\d{1,2})?)\\s*kcal\\s*(?:[/\\\\|]\\s*)?"
                  r"(?P<kj>\\d{1,5}(?:\\.\\d{1,2})?)\\s*k\\s*j\\b",
                  folded,
                  flags=re.I,
              )
              if reverse_inline_pair:
                  kj = float(reverse_inline_pair.group("kj"))
                  kcal = float(reverse_inline_pair.group("kcal"))
                  if kcal < 10:
                      return kcal if _coherent_kj_kcal_pair(kj, kcal) else None

              # Some labels put the units in the heading and the values on the next line:
              # `Valor energético (kJ/kcal) 442/106`. Preserve the established
              # interpretation for that exact layout; the second printed value is kcal.
              header_pair = re.search(
                  r"(?:valor energetico|energia)[\\s\\S]{0,70}?k\\s*j\\s*/\\s*kcal"
                  r"[\\s\\S]{0,35}?(\\d{2,4}(?:\\.\\d{1,2})?)\\s*[/\\\\|]\\s*(\\d{1,4}(?:\\.\\d{1,2})?)",
                  folded,
                  flags=re.I,
              )
              if header_pair:
                  return float(header_pair.group(2))

              patterns = [
                  r"valor energetico[\\s\\S]{0,90}?(\\d{2,4}(?:\\.\\d{1,2})?)\\s*kcal",
                  r"energia[\\s\\S]{0,90}?(\\d{2,4}(?:\\.\\d{1,2})?)\\s*kcal",
                  r"(\\d{2,4}(?:\\.\\d{1,2})?)\\s*kcal",
              ]
              for pattern in patterns:
                  m = re.search(pattern, folded, flags=re.I)
                  if m:
                      return float(m.group(1))
              return None

          '''
          # Dedent the source block without importing extra helpers into production.
          import textwrap
          replacement = textwrap.dedent(replacement)
          updated = text[:start] + replacement + text[end + 1:]
          updated = updated.replace('READER_VERSION = "1.4.28"', 'READER_VERSION = "1.4.29"', 1)
          if updated == text:
              raise SystemExit('parser patch made no change')
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Run parser regressions including low-kcal pair
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_label_reader_row_tokens.py \
            test_nutrition_label_reader_low_kcal_pair.py
      - name: Commit tested parser fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/catalog/nutrition_label_reader.py
          git commit -m 'Catalog: preserve legacy energy guard for low-kcal parser'
          git push origin HEAD:agent/catalog-phase1
