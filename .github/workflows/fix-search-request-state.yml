name: Fix search request state
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.head_ref == 'agent/remove-legacy-catalog-canonical-policy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-legacy-catalog-canonical-policy
          fetch-depth: 0
      - name: Sustituir una única línea
        run: |
          test "$(grep -c 'var catalogSearchRequest by remember { mutableIntStateOf(0) }' app/src/main/java/es/david/rumbo/ui/App.kt)" -eq 1
          sed -i 's/var catalogSearchRequest by remember { mutableIntStateOf(0) }/var catalogSearchRequest by remember { mutableStateOf(0) }/' app/src/main/java/es/david/rumbo/ui/App.kt
          git diff --check
          test "$(grep -c 'var catalogSearchRequest by remember { mutableStateOf(0) }' app/src/main/java/es/david/rumbo/ui/App.kt)" -eq 1
      - name: Guardar corrección
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/es/david/rumbo/ui/App.kt
          git commit -m "Corregir estado del request de búsqueda"
          git push origin HEAD:agent/remove-legacy-catalog-canonical-policy
