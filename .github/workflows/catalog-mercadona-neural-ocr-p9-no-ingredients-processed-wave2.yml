name: Catalog Mercadona neural OCR p9 no-ingredients processed wave2

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-neural-ocr-p9-no-ingredients-processed-wave2.yml'
      - 'tools/catalog/audit_mercadona_p9_no_ingredients_processed_candidates.py'
      - 'tools/catalog/test_audit_mercadona_p9_no_ingredients_processed_candidates.py'
      - 'tools/catalog/mercadona_neural_ocr_wave.py'
      - 'tools/catalog/nutrition_label_reader.py'
      - 'tools/catalog/nutrition_ocr_ensemble.py'
      - 'tools/catalog/nutrition_visual_table_detector.py'
      - 'tools/catalog/mercadona_label_pipeline.py'
      - 'tools/catalog/mercadona_nutrition_reader.py'
      - 'tools/catalog/label_neural_extractor.py'
      - 'tools/catalog/label_easyocr_extractor.py'
      - 'tools/catalog/label_text_extractor.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-neural-ocr-p9-no-ingredients-processed-wave2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download consolidated Mercadona first-party cut
        uses: actions/download-artifact@v4
        with:
          name: mercadona-first-party-final
          path: tools/catalog/mercadona-first-party-final
          repository: frandavid100/rumbo
          github-token: ${{ github.token }}
          run-id: 33046950149

      - name: Install independent OCR engines and visual detector dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow

      - name: Run conservative routing and OCR regression tests
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_audit_mercadona_p9_no_ingredients_processed_candidates.py \
            test_label_easyocr_extractor.py \
            test_nutrition_label_reader.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_ocr_safety_regressions.py
          python -m py_compile \
            audit_mercadona_p9_no_ingredients_processed_candidates.py \
            mercadona_neural_ocr_wave.py

      - name: Audit refined p9 no-ingredients processed cohort
        working-directory: tools/catalog
        run: |
          python audit_mercadona_p9_no_ingredients_processed_candidates.py \
            --products mercadona-first-party-final/products.jsonl \
            --out mercadona-p9-no-ingredients-processed-audit

      - name: Prepare deterministic post-pilot window
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          path = Path('mercadona-p9-no-ingredients-processed-audit/candidates.jsonl')
          rows = [json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]

          def stable_key(row):
              product_id = str(row.get('product_id') or '')
              ean = str(row.get('ean') or '')
              seed = f'{product_id}\0{ean}'.encode('utf-8')
              return hashlib.sha256(seed).hexdigest(), product_id

          rows.sort(key=stable_key)
          pilot_ids = {
              '60212', '86632', '13847', '58280', '14173', '19975', '14981', '11925',
              '58274', '15647', '51198', '65143', '61371', '7879', '10642', '60384',
          }
          observed_pilot_ids = {str(row.get('product_id') or '') for row in rows[:16]}
          if observed_pilot_ids != pilot_ids:
              raise SystemExit(f'deterministic pilot window drifted: {sorted(observed_pilot_ids)}')

          remaining = rows[16:]
          if len(rows) != 89 or len(remaining) != 73:
              raise SystemExit(f'unexpected cohort/window sizes: total={len(rows)} remaining={len(remaining)}')

          out = Path('mercadona-p9-no-ingredients-processed-wave2-candidates.jsonl')
          out.write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in remaining),
              encoding='utf-8',
          )
          expected_wave2_ids = [str(row.get('product_id') or '') for row in remaining[:32]]
          Path('mercadona-p9-no-ingredients-processed-wave2-window.json').write_text(
              json.dumps({
                  'candidate_universe': 89,
                  'pilot_count': 16,
                  'remaining_after_pilot': 73,
                  'wave2_selected': 32,
                  'wave2_original_sorted_index_start': 16,
                  'wave2_original_sorted_index_end': 47,
                  'pilot_ids': sorted(pilot_ids),
                  'expected_wave2_ids': expected_wave2_ids,
              }, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: OCR next deterministic 32-product wave
        working-directory: tools/catalog
        run: |
          python mercadona_neural_ocr_wave.py \
            --products mercadona-p9-no-ingredients-processed-wave2-candidates.jsonl \
            --out mercadona-neural-ocr-p9-no-ingredients-processed-wave2 \
            --eligibility-mode p9-no-ingredients-all \
            --shard-index ${{ matrix.shard }} \
            --shard-count 8 \
            --limit 4 \
            --delay 0.5

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-neural-ocr-p9-no-ingredients-processed-wave2-${{ matrix.shard }}
          path: |
            tools/catalog/mercadona-neural-ocr-p9-no-ingredients-processed-wave2/
            tools/catalog/mercadona-p9-no-ingredients-processed-audit/summary.json
            tools/catalog/mercadona-p9-no-ingredients-processed-wave2-window.json
          retention-days: 30
          if-no-files-found: warn

  merge:
    runs-on: ubuntu-24.04
    needs: ocr
    if: ${{ always() && needs.ocr.result == 'success' }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mercadona-neural-ocr-p9-no-ingredients-processed-wave2-*
          path: input
          merge-multiple: true

      - name: Merge and enforce unchanged DECLARED contract
        run: |
          python - <<'PY'
          from collections import Counter
          import glob, json, sqlite3
          from pathlib import Path

          rows = []
          for path in sorted(glob.glob('input/**/results-*.jsonl', recursive=True)):
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  if line.strip():
                      rows.append(json.loads(line))

          window_paths = sorted(glob.glob('input/**/mercadona-p9-no-ingredients-processed-wave2-window.json', recursive=True))
          if not window_paths:
              raise SystemExit('missing deterministic wave2 window manifest')
          window = json.loads(Path(window_paths[0]).read_text(encoding='utf-8'))
          pilot_ids = set(window['pilot_ids'])
          expected_ids = set(window['expected_wave2_ids'])

          ids = [str(row.get('product_id') or '') for row in rows]
          id_set = set(ids)
          duplicate_ids = sorted(pid for pid, count in Counter(ids).items() if pid and count > 1)
          pilot_overlap = sorted(id_set & pilot_ids)
          missing_expected_ids = sorted(expected_ids - id_set)
          unexpected_ids = sorted(id_set - expected_ids)
          invalid_declared = []
          provenance_errors = []
          error_product_ids = []
          for row in rows:
              pid = str(row.get('product_id') or '')
              if row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE':
                  provenance_errors.append(pid)
              if row.get('source') != 'MERCADONA_FIRST_PARTY' or row.get('source_record_kind') != 'label image':
                  provenance_errors.append(pid)
              if row.get('redistribution_allowed') is not False:
                  provenance_errors.append(pid)
              if row.get('status') == 'ERROR':
                  error_product_ids.append(pid)
              if row.get('status') != 'DECLARED':
                  continue
              accepted = next(
                  (attempt for attempt in (row.get('attempts') or []) if (attempt.get('ensemble') or {}).get('status') == 'DECLARED'),
                  None,
              )
              ensemble = (accepted or {}).get('ensemble') or {}
              if (
                  int(ensemble.get('independent_engine_families') or 0) < 2
                  or int(ensemble.get('corroborated_fields') or 0) < 4
                  or ensemble.get('basis') not in {'100_g', '100_ml'}
              ):
                  invalid_declared.append(pid)

          counts = Counter(str(row.get('status') or 'UNKNOWN') for row in rows)
          validated = (
              len(rows) == 32
              and len(id_set) == 32
              and id_set == expected_ids
              and not invalid_declared
              and not duplicate_ids
              and not pilot_overlap
              and not missing_expected_ids
              and not unexpected_ids
              and not provenance_errors
              and not error_product_ids
          )
          summary = {
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'redistribution_allowed': False,
              'candidate_universe': 89,
              'prior_pilot_count': 16,
              'selected': 32,
              'processed': len(rows),
              'distinct_products_processed': len(id_set),
              'status_counts': dict(sorted(counts.items())),
              'declared_rate': round(counts['DECLARED'] / len(rows), 4) if rows else 0.0,
              'unsafe_declared': invalid_declared,
              'duplicate_product_ids': duplicate_ids,
              'pilot_overlap_product_ids': pilot_overlap,
              'missing_expected_product_ids': missing_expected_ids,
              'unexpected_product_ids': unexpected_ids,
              'provenance_errors': sorted(set(provenance_errors)),
              'error_product_ids': sorted(set(error_product_ids)),
              'images_persisted': False,
              'missing_values_inferred': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
              'safety_assessment': 'VALIDATED' if validated else 'FAILED',
          }

          out = Path('merged')
          out.mkdir(exist_ok=True)
          (out / 'results.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in rows),
              encoding='utf-8',
          )
          (out / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (out / 'window.json').write_text(json.dumps(window, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          db = sqlite3.connect(out / 'staging.sqlite')
          db.execute('CREATE TABLE ocr_results (product_id TEXT PRIMARY KEY, status TEXT NOT NULL, evidence_level TEXT NOT NULL, source TEXT NOT NULL, redistribution_allowed INTEGER NOT NULL, payload_json TEXT NOT NULL)')
          for row in rows:
              db.execute(
                  'INSERT INTO ocr_results VALUES (?, ?, ?, ?, ?, ?)',
                  (
                      str(row.get('product_id') or ''),
                      str(row.get('status') or 'UNKNOWN'),
                      str(row.get('evidence_level') or ''),
                      'MERCADONA_FIRST_PARTY/label image',
                      0,
                      json.dumps(row, ensure_ascii=False, sort_keys=True),
                  ),
              )
          db.commit()
          db.close()

          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if summary['safety_assessment'] != 'VALIDATED':
              raise SystemExit('wave2 safety/coverage checks failed')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-neural-ocr-p9-no-ingredients-processed-wave2-merged
          path: merged/
          retention-days: 30
          if-no-files-found: warn
