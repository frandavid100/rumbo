name: Catalog patch E-number OCR guard

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-patch-e-number-ocr-guard.yml'

permissions:
  contents: write

jobs:
  test-patch-test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: tools/catalog
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
          fetch-depth: 0

      - name: Confirm new regression fails before patch
        shell: bash
        run: |
          set +e
          python -m unittest tools/catalog/test_nutrition_label_reader_e_number_guard.py
          rc=$?
          set -e
          if [[ $rc -eq 0 ]]; then
            echo 'Regression unexpectedly already passes; refusing unnecessary parser change.' >&2
            exit 1
          fi
          echo 'Expected pre-fix regression failure reproduced.'

      - name: Apply narrow E-number noise guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/catalog/nutrition_label_reader.py')
          text = path.read_text(encoding='utf-8')
          old = '''            number = re.search(r"([<>]?)\\s*(\\d{1,4}(?:\\.\\d{1,2})?)(?![\\d.])\\s*(?:g\\b|gramos?\\b)?", tail)
            if not number:
                continue
'''
          new = '''            number = re.search(
                r"(?<![a-z0-9])([<>]?)\\s*(\\d{1,4}(?:\\.\\d{1,2})?)(?![\\d.])\\s*(?:(g\\b|gramos?\\b))?",
                tail,
                flags=re.I,
            )
            # Whole-package OCR can interleave additive codes into a nutrition
            # row. A bare token such as `129 E129:` after `Grasas` is an E-number,
            # not an OCR-damaged `12 g`. Preserve explicit gram values, but if a
            # unitless numeric token is immediately mirrored as an E-code, reject
            # the row rather than applying terminal-9 gram repair.
            if number and not number.group(3) and re.match(r"\\s*E\\s*\\d", tail[number.end():], flags=re.I):
                number = None
            if not number:
                continue
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected parser block exactly once, found {text.count(old)}')
          text = text.replace(old, new, 1)
          if 'READER_VERSION = "1.4.26"' not in text:
              raise SystemExit('unexpected reader version')
          text = text.replace('READER_VERSION = "1.4.26"', 'READER_VERSION = "1.4.27"', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run parser regressions after patch
        run: |
          python -m unittest tools/catalog/test_nutrition_label_reader.py tools/catalog/test_nutrition_label_reader_e_number_guard.py

      - name: Commit tested parser fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/catalog/nutrition_label_reader.py
          git commit -m 'catalog: reject mirrored E-number OCR tokens'
          git push origin HEAD:agent/catalog-phase1
