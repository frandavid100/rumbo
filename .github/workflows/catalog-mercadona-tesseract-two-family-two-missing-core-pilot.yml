name: Catalog Mercadona Tesseract two-family two-missing-core pilot

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-tesseract-two-family-two-missing-core-pilot.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-tesseract-two-family-two-missing-core-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download consolidated Mercadona first-party cut
        uses: actions/download-artifact@v4
        with:
          name: mercadona-first-party-final
          path: tools/catalog/mercadona-first-party-final
          repository: frandavid100/rumbo
          github-token: ${{ github.token }}
          run-id: 33046950149

      - name: Download persisted p9 replay evidence
        uses: actions/download-artifact@v4
        with:
          name: mercadona-ocr-replay-2630
          path: tools/catalog/mercadona-ocr-replay-2630
          repository: frandavid100/rumbo
          github-token: ${{ github.token }}
          run-id: 33331091953

      - name: Audit and build unresolved deterministic pilot input
        working-directory: tools/catalog
        run: |
          python audit_mercadona_p9_two_family_two_missing_core_candidates.py \
            --replay-results mercadona-ocr-replay-2630/results-replayed.jsonl \
            --out mercadona-p9-two-family-two-missing-core-audit
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          def key(row):
              pid = str(row.get('product_id') or '')
              ean = str(row.get('ean') or '')
              return hashlib.sha256(f'{pid}\0{ean}'.encode('utf-8')).hexdigest(), pid

          audit_dir = Path('mercadona-p9-two-family-two-missing-core-audit')
          candidates = [
              json.loads(line)
              for line in (audit_dir / 'two-family-two-missing-core-candidates.jsonl')
              .read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          if len(candidates) != 18:
              raise SystemExit(f'expected 18 audited candidates, got {len(candidates)}')

          accounting_path = Path('mercadona-ocr-continuity-replay-closed-cut-2026-09-04.json')
          accounting = json.loads(accounting_path.read_text(encoding='utf-8'))
          cumulative = accounting.get('cumulative_after_closed_stratum') or {}
          if (
              int(cumulative.get('catalog_total') or 0) != 4280
              or int(cumulative.get('processed') or 0) != 2943
              or int(cumulative.get('DECLARED_complete') or 0) != 265
              or int(cumulative.get('REVIEW') or 0) != 2678
          ):
              raise SystemExit('persisted accounting baseline is not the expected 265/2678 cut')
          already_counted_ids = {
              str(item.get('product_id') or '')
              for item in (accounting.get('promotions') or [])
          }
          if len(already_counted_ids) != 3 or '' in already_counted_ids:
              raise SystemExit('expected exactly three already-counted continuity promotions')

          unresolved = [
              row for row in sorted(candidates, key=key)
              if str(row.get('product_id') or '') not in already_counted_ids
          ]
          if len(unresolved) != 15:
              raise SystemExit(f'expected 15 unresolved candidates after dedupe, got {len(unresolved)}')
          selected_ids = [str(row['product_id']) for row in unresolved]
          if len(set(selected_ids)) != len(selected_ids):
              raise SystemExit('selected product IDs are not unique')

          products = [
              json.loads(line)
              for line in Path('mercadona-first-party-final/products.jsonl')
              .read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          selected_set = set(selected_ids)
          by_id = {
              str(row.get('product_id') or ''): row
              for row in products
              if str(row.get('product_id') or '') in selected_set
          }
          output = [by_id[pid] for pid in selected_ids if pid in by_id]
          if len(output) != len(selected_ids):
              raise SystemExit(
                  f'pilot join mismatch selected={len(selected_ids)} products={len(output)}'
              )

          Path('two-family-two-missing-core-pilot-products.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in output),
              encoding='utf-8',
          )
          Path('two-family-two-missing-core-pilot-selection.json').write_text(
              json.dumps({
                  'candidate_universe': 18,
                  'candidate_policy': (
                      'stable p9 original+replay REVIEW + exactly 2 of 4 core values observed and '
                      'corroborated + exactly 2 core values missing + explicit 100g/100ml basis + '
                      'exactly 2 independent OCR families + no hard conflict, values_conflict, or '
                      'energy/macro mismatch; exclude promotions already counted by persisted cut'
                  ),
                  'sample_order': 'SHA256_PRODUCT_ID_EAN',
                  'selected': len(selected_ids),
                  'remaining_after_pilot': 0,
                  'product_ids': selected_ids,
                  'already_counted_excluded_product_ids': sorted(already_counted_ids),
                  'accounting_baseline_cut': accounting_path.name,
                  'missing_core_fields': {
                      str(row['product_id']): row['missing_core_fields'] for row in unresolved
                  },
                  'source': 'MERCADONA_FIRST_PARTY/label image',
                  'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
                  'redistribution_allowed': False,
                  'images_persisted': False,
                  'CLASSIFIED': 0,
                  'MENU_ELIGIBLE': 0,
              }, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Install OCR engines
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow

      - name: Run routing, accounting, and conservative OCR tests
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_audit_mercadona_p9_two_family_two_missing_core_candidates.py \
            test_audit_mercadona_two_missing_pilot_results.py \
            test_label_easyocr_extractor.py \
            test_nutrition_label_reader.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_ocr_safety_regressions.py \
            test_mercadona_neural_ocr_tesseract_preprocess_rescue.py
          python -m py_compile \
            audit_mercadona_p9_two_family_two_missing_core_candidates.py \
            audit_mercadona_two_missing_pilot_results.py \
            mercadona_neural_ocr_tesseract_preprocess_rescue.py

      - name: Run bounded rescue over unresolved candidates only
        working-directory: tools/catalog
        run: |
          python mercadona_neural_ocr_tesseract_preprocess_rescue.py \
            --products two-family-two-missing-core-pilot-products.jsonl \
            --out mercadona-tesseract-two-family-two-missing-core-pilot \
            --shard-index 0 \
            --shard-count 1 \
            --limit 0 \
            --delay 0.5

      - name: Audit results with idempotent cumulative accounting
        working-directory: tools/catalog
        run: |
          python audit_mercadona_two_missing_pilot_results.py \
            --baseline mercadona-p9-two-family-two-missing-core-audit/two-family-two-missing-core-candidates.jsonl \
            --selection two-family-two-missing-core-pilot-selection.json \
            --results mercadona-tesseract-two-family-two-missing-core-pilot/results-00.jsonl \
            --accounting-cut mercadona-ocr-continuity-replay-closed-cut-2026-09-04.json \
            --out mercadona-tesseract-two-family-two-missing-core-pilot-audited
          python - <<'PY'
          from pathlib import Path
          image_suffixes = {'.png', '.jpg', '.jpeg', '.webp', '.bmp', '.tif', '.tiff'}
          persisted = sorted(
              str(path)
              for path in Path('mercadona-tesseract-two-family-two-missing-core-pilot').rglob('*')
              if path.is_file() and path.suffix.lower() in image_suffixes
          )
          if persisted:
              raise SystemExit(f'images unexpectedly persisted: {persisted}')
          PY

      - name: Upload auditable pilot
        uses: actions/upload-artifact@v4
        with:
          name: mercadona-tesseract-two-family-two-missing-core-pilot
          path: |
            tools/catalog/mercadona-p9-two-family-two-missing-core-audit/summary.json
            tools/catalog/mercadona-p9-two-family-two-missing-core-audit/two-family-two-missing-core-candidates.jsonl
            tools/catalog/two-family-two-missing-core-pilot-selection.json
            tools/catalog/mercadona-tesseract-two-family-two-missing-core-pilot/results-00.jsonl
            tools/catalog/mercadona-tesseract-two-family-two-missing-core-pilot-audited/summary.json
            tools/catalog/mercadona-tesseract-two-family-two-missing-core-pilot-audited/safe-promotions.json
            tools/catalog/mercadona-tesseract-two-family-two-missing-core-pilot-audited/novel-safe-promotions.json
            tools/catalog/mercadona-tesseract-two-family-two-missing-core-pilot-audited/results-audited.jsonl
            tools/catalog/mercadona-tesseract-two-family-two-missing-core-pilot-audited/staging.sqlite
          if-no-files-found: error
          retention-days: 30
