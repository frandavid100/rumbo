name: Catalog Mercadona center crop production canary

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-center-crop-production-canary.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: catalog-mercadona-center-crop-production-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rescue:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - product_id: '21649'
            expected_ean: '8402001054686'
            expected_status: 'DECLARED'
          - product_id: '24541'
            expected_ean: '8402001050428'
            expected_status: 'REVIEW'
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
      TARGET_PRODUCT_ID: ${{ matrix.product_id }}
      EXPECTED_EAN: ${{ matrix.expected_ean }}
      EXPECTED_STATUS: ${{ matrix.expected_status }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bounded OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' opencv-python-headless Pillow

      - name: Run parser and center-crop safety regressions first
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_nutrition_unit_glyph_repair.py \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_ocr_safety_regressions.py \
            test_mercadona_nutrition_label_manufacturer_interleave.py \
            test_mercadona_tesseract_center_crop_rescue.py

      - name: Fetch exact target from official Mercadona API
        working-directory: tools/catalog
        run: |
          set -euo pipefail
          mkdir -p mercadona-center-crop-production-canary /tmp/mercadona-center-target-details
          python - <<'PY'
          import json, os
          from pathlib import Path
          pid = os.environ['TARGET_PRODUCT_ID']
          Path('/tmp/mercadona-center-target-inventory.jsonl').write_text(
              json.dumps({'product_id': pid, 'category_id': '', 'category_path': []}, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY
          python mercadona_first_party_details.py \
            --inventory /tmp/mercadona-center-target-inventory.jsonl \
            --out /tmp/mercadona-center-target-details \
            --shard-index 0 --shard-count 1 --timeout 20 --delay 0
          python - <<'PY'
          import json, os
          from pathlib import Path
          pid = os.environ['TARGET_PRODUCT_ID']
          expected_ean = os.environ['EXPECTED_EAN']
          rows = [json.loads(line) for line in Path('/tmp/mercadona-center-target-details/details-00.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          errors = [json.loads(line) for line in Path('/tmp/mercadona-center-target-details/errors-00.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          if errors:
              raise SystemExit(f'first-party API fetch errors: {errors}')
          if len(rows) != 1:
              raise SystemExit(f'expected exactly one API result, got {len(rows)}')
          product = rows[0]
          if str(product.get('product_id')) != pid:
              raise SystemExit('product id mismatch')
          if product.get('source') != 'MERCADONA_FIRST_PARTY' or product.get('evidence_type') != 'OBSERVED_API' or product.get('detail_observed') is not True:
              raise SystemExit('invalid first-party API provenance')
          if str(product.get('ean') or '') != expected_ean:
              raise SystemExit(f'live first-party identity mismatch for {pid}: EAN={product.get("ean")}; expected={expected_ean}')
          photos = product.get('photos') or []
          p9 = [p for p in photos if str(p.get('perspective')) == '9' and (p.get('zoom') or p.get('regular'))]
          if len(p9) != 1:
              raise SystemExit(f'expected exactly one current perspective=9 image, got {len(p9)}')
          Path('mercadona-center-crop-production-canary/target.jsonl').write_text(
              json.dumps(product, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8'
          )
          Path('mercadona-center-crop-production-canary/first-party-fetch.json').write_text(json.dumps({
              'product_id': pid,
              'ean': product.get('ean'),
              'name': product.get('name'),
              'observed_at': product.get('observed_at'),
              'p9_image_url': p9[0].get('zoom') or p9[0].get('regular'),
              'source': 'MERCADONA_FIRST_PARTY',
              'redistribution_allowed': False,
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Run deterministic center-crop rescue
        working-directory: tools/catalog
        run: |
          python mercadona_tesseract_center_crop_rescue.py \
            --product mercadona-center-crop-production-canary/target.jsonl \
            --out mercadona-center-crop-production-canary/ocr

      - name: Enforce canary expectations and canonical provenance
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          pid = os.environ['TARGET_PRODUCT_ID']
          expected = os.environ['EXPECTED_STATUS']
          fetched = json.loads(Path('mercadona-center-crop-production-canary/first-party-fetch.json').read_text(encoding='utf-8'))
          rows = [json.loads(line) for line in Path('mercadona-center-crop-production-canary/ocr/results-00.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          if len(rows) != 1:
              raise SystemExit('unexpected rescue result count')
          row = rows[0]
          if str(row.get('product_id')) != pid or str(row.get('ean') or '') != str(fetched.get('ean') or ''):
              raise SystemExit('rescue/live identity mismatch')
          if row.get('image_url') != fetched.get('p9_image_url'):
              raise SystemExit('rescue did not use exact current P9 image')
          if row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE' or row.get('source') != 'MERCADONA_FIRST_PARTY' or row.get('redistribution_allowed') is not False:
              raise SystemExit('invalid OCR provenance')
          if row.get('status') != expected:
              raise SystemExit(f'canary status mismatch for {pid}: got {row.get("status")}, expected {expected}')
          attempts = row.get('attempts') or []
          if len(attempts) != 1 or attempts[0].get('preprocess_variant') != 'crop_center' or attempts[0].get('variant_selection_policy') != 'FIXED_SINGLE_VARIANT_NO_RANKING':
              raise SystemExit('unsafe or ambiguous preprocessing path')
          if expected == 'DECLARED':
              nutrition = row.get('nutrition') or {}
              expected_nutrition = {'calories': 240.0, 'fat_g': 12.0, 'carbohydrate_g': 26.0, 'protein_g': 6.7}
              if nutrition != expected_nutrition:
                  raise SystemExit(f'unexpected 21649 nutrition: {nutrition}')
              ensemble = attempts[0].get('ensemble') or {}
              if attempts[0].get('exact_independent_profile_match') is not True:
                  raise SystemExit('DECLARED without exact independent profile match')
              if int(ensemble.get('independent_engine_families') or 0) < 2 or int(ensemble.get('corroborated_fields') or 0) < 4:
                  raise SystemExit('DECLARED without 2-family four-field corroboration')
          report = {
              'product_id': pid,
              'ean': fetched.get('ean'),
              'name': fetched.get('name'),
              'status': row.get('status'),
              'nutrition': row.get('nutrition'),
              'image_url': row.get('image_url'),
              'preprocess_variant': 'crop_center',
              'variant_selection_policy': 'FIXED_SINGLE_VARIANT_NO_RANKING',
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'redistribution_allowed': False,
              'missing_values_inferred': False,
              'canonical_input': True,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          Path('mercadona-center-crop-production-canary/report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-center-crop-production-canary-${{ env.TARGET_PRODUCT_ID }}
          path: |
            tools/catalog/mercadona-center-crop-production-canary/first-party-fetch.json
            tools/catalog/mercadona-center-crop-production-canary/target.jsonl
            tools/catalog/mercadona-center-crop-production-canary/ocr/results-00.jsonl
            tools/catalog/mercadona-center-crop-production-canary/ocr/summary-00.json
            tools/catalog/mercadona-center-crop-production-canary/report.json
          retention-days: 90
          if-no-files-found: error

  reconcile:
    runs-on: ubuntu-24.04
    needs: rescue
    if: ${{ needs.rescue.result == 'success' }}
    steps:
      - name: Trigger strict canonical reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run catalog-mercadona-current-ocr-residual-audit-efficient.yml \
            --repo frandavid100/rumbo \
            --ref agent/catalog-phase1
