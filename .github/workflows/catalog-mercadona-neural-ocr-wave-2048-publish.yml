name: Catalog Mercadona neural OCR wave 2048 publish

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-neural-ocr-wave-2048-publish.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download validated 2032-row partial merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p partial
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9709214992/zip \
            -o partial.zip
          unzip -q partial.zip -d partial

      - name: Download recovered deterministic shard 94
        uses: actions/download-artifact@v4
        with:
          name: mercadona-neural-ocr-wave-2048-recovery-94
          path: recovery-94
          github-token: ${{ github.token }}
          run-id: 33233618283

      - name: Download validated 1024-wave baseline
        uses: actions/download-artifact@v4
        with:
          name: mercadona-neural-ocr-wave-1024-final
          path: prior-1024
          github-token: ${{ github.token }}
          run-id: 33189633845

      - name: Enforce provenance, safety and exact reproducibility contract
        run: |
          python tools/catalog/mercadona_finalize_ocr_2048.py \
            --partial partial/results.jsonl \
            --recovery recovery-94/results-94.jsonl \
            --baseline prior-1024/results.jsonl \
            --out final

      - name: Upload auditable JSONL and SQLite cut
        uses: actions/upload-artifact@v4
        with:
          name: mercadona-neural-ocr-wave-2048-final
          path: final/
          retention-days: 30
          if-no-files-found: error
