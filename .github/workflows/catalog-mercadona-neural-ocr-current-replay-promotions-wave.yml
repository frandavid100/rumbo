name: Catalog Mercadona neural OCR current replay promotions wave

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-neural-ocr-current-replay-promotions-wave.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-neural-ocr-current-replay-promotions-wave-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download consolidated Mercadona first-party cut
        uses: actions/download-artifact@v4
        with:
          name: mercadona-first-party-final
          path: tools/catalog/mercadona-first-party-final
          github-token: ${{ github.token }}
          run-id: 33046950149

      - name: Download current persisted-text replay
        uses: actions/download-artifact@v4
        with:
          name: mercadona-ocr-replay-2630
          path: tools/catalog/mercadona-ocr-replay-2630-current
          github-token: ${{ github.token }}
          run-id: 34424613508

      - name: Download current canonical OCR audit
        uses: actions/download-artifact@v4
        with:
          name: mercadona-current-ocr-residual-audit
          path: tools/catalog/mercadona-current-ocr-residual-audit-current
          github-token: ${{ github.token }}
          run-id: 34392376136

      - name: Install independent OCR engines and detector dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow

      - name: Run parser and ensemble safety regressions first
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_ocr_safety_regressions.py

      - name: Select replay promotions that are still canonically REVIEW
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          canonical_path = Path('mercadona-current-ocr-residual-audit-current/canonical-ocr.jsonl')
          canonical = {}
          for line in canonical_path.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              row = json.loads(line)
              pid = str(row.get('product_id') or '')
              if not pid or pid in canonical:
                  raise SystemExit(f'Duplicate or empty canonical product id: {pid!r}')
              canonical[pid] = row

          canonical_declared = {pid for pid, row in canonical.items() if row.get('status') == 'DECLARED'}
          canonical_review = {pid for pid, row in canonical.items() if row.get('status') == 'REVIEW'}
          if len(canonical) != 2969 or len(canonical_declared) != 286 or len(canonical_review) != 2683:
              raise SystemExit(
                  'Unexpected pinned canonical cut: '
                  f'total={len(canonical)} declared={len(canonical_declared)} review={len(canonical_review)}'
              )

          replay_rows = []
          seen = set()
          for line in Path('mercadona-ocr-replay-2630-current/results-replayed.jsonl').read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              row = json.loads(line)
              pid = str(row.get('product_id') or '')
              replay = row.get('replay') or {}
              if pid not in canonical_review:
                  continue
              if replay.get('prior_status') != 'REVIEW' or replay.get('status') != 'DECLARED':
                  continue
              declared = [a for a in replay.get('attempt_ensembles', []) if a.get('status') == 'DECLARED']
              if not declared:
                  continue
              best = max(
                  declared,
                  key=lambda a: (
                      int(a.get('independent_engine_families') or 0),
                      int(a.get('corroborated_fields') or 0),
                      float(a.get('confidence') or 0.0),
                  ),
              )
              if int(best.get('independent_engine_families') or 0) < 3:
                  continue
              if int(best.get('corroborated_fields') or 0) != 4:
                  continue
              nutrition = best.get('nutrition') or {}
              required = ('calories', 'protein_g', 'carbohydrate_g', 'fat_g')
              if any(nutrition.get(field) is None for field in required):
                  continue
              if pid in seen:
                  raise SystemExit(f'Duplicate replay promotion id: {pid}')
              seen.add(pid)
              replay_rows.append({
                  'product_id': pid,
                  'name': row.get('name'),
                  'basis': best.get('basis'),
                  'nutrition': {field: nutrition[field] for field in required},
                  'confidence': float(best.get('confidence') or 0.0),
                  'independent_engine_families': int(best.get('independent_engine_families') or 0),
                  'corroborated_fields': int(best.get('corroborated_fields') or 0),
              })

          # This is an audit anchor for the present 286-DECLARED cut. The successful current
          # replay contains 127 diagnostic REVIEW->DECLARED promotions; 63 are already canonical
          # DECLARED, leaving 64 unresolved in total. Of those, 30 meet this wave's stronger
          # >=3-engine-family and 4-field gate; the other 34 are two-family diagnostics and stay
          # outside this bounded validation wave. Fail closed if the strong source set differs.
          if len(replay_rows) != 30:
              raise SystemExit(f'Expected 30 strong unresolved current replay promotions, found {len(replay_rows)}')

          replay_rows.sort(key=lambda r: (-r['confidence'], r['product_id']))
          selected = replay_rows[:16]
          wanted = {row['product_id'] for row in selected}
          if len(wanted) != len(selected):
              raise SystemExit('Duplicate product ids in selected replay wave')
          if wanted & canonical_declared:
              raise SystemExit(f'Canonical DECLARED ids leaked into wave: {sorted(wanted & canonical_declared)}')

          inventory = [
              json.loads(line)
              for line in Path('mercadona-first-party-final/products.jsonl').read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          products = [row for row in inventory if str(row.get('product_id') or '') in wanted]
          found = {str(row.get('product_id') or '') for row in products}
          if found != wanted or len(products) != len(wanted):
              raise SystemExit(f'Missing/duplicate product ids from first-party cut: wanted={sorted(wanted)} found={sorted(found)}')

          Path('mercadona-current-replay-promotion-wave-selection.json').write_text(
              json.dumps({
                  'kind': 'CURRENT_CANONICAL_REVIEW_BOUNDED_REPLAY_PROMOTION_E2E_SELECTION',
                  'canonical_audit_run_id': 34392376136,
                  'replay_run_id': 34424613508,
                  'current_canonical_declared_before': len(canonical_declared),
                  'current_canonical_review_before': len(canonical_review),
                  'eligible_unresolved_replay_promotions': len(replay_rows),
                  'selection_count': len(selected),
                  'selection': selected,
              }, ensure_ascii=False, indent=2, sort_keys=True),
              encoding='utf-8',
          )
          Path('mercadona-current-replay-promotion-wave-products.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in products),
              encoding='utf-8',
          )
          print(json.dumps(selected, ensure_ascii=False, indent=2))
          PY

      - name: Re-run neural OCR end to end on bounded current-REVIEW wave
        working-directory: tools/catalog
        run: |
          python mercadona_neural_ocr_wave.py \
            --products mercadona-current-replay-promotion-wave-products.jsonl \
            --out mercadona-neural-ocr-current-replay-promotions-wave \
            --shard-index 0 \
            --shard-count 1 \
            --limit 0

      - name: Verify exact replay agreement, corroboration and provenance
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          from collections import Counter
          import json
          from pathlib import Path

          selection_doc = json.loads(Path('mercadona-current-replay-promotion-wave-selection.json').read_text(encoding='utf-8'))
          expected = {row['product_id']: row for row in selection_doc['selection']}
          rows = []
          out = Path('mercadona-neural-ocr-current-replay-promotions-wave')
          for path in sorted(out.glob('results-*.jsonl')):
              rows.extend(json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip())

          actual_ids = {str(row.get('product_id') or '') for row in rows}
          if actual_ids != set(expected) or len(rows) != len(expected):
              raise SystemExit(f'Unexpected processed universe: expected={sorted(expected)} actual={sorted(actual_ids)} rows={len(rows)}')

          reproduced = []
          review = []
          conflicts = []
          unsafe = []
          provenance_errors = []
          nutrition = {}
          for row in rows:
              pid = str(row.get('product_id') or '')
              if row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE':
                  provenance_errors.append(f'{pid}:evidence_level')
              if row.get('source') != 'MERCADONA_FIRST_PARTY' or row.get('source_record_kind') != 'label image':
                  provenance_errors.append(f'{pid}:source')
              if row.get('redistribution_allowed') is not False:
                  provenance_errors.append(f'{pid}:redistribution')
              if any(key in row for key in ('classified', 'menu_eligible', 'CLASSIFIED', 'MENU_ELIGIBLE')):
                  provenance_errors.append(f'{pid}:classification')

              if row.get('status') != 'DECLARED':
                  review.append(pid)
                  continue

              accepted = next(
                  (a for a in (row.get('attempts') or []) if (a.get('ensemble') or {}).get('status') == 'DECLARED'),
                  None,
              )
              ensemble = (accepted or {}).get('ensemble') or {}
              observed = row.get('nutrition') or {}
              required = ('calories', 'protein_g', 'carbohydrate_g', 'fat_g')
              if int(ensemble.get('independent_engine_families') or 0) < 2 or int(ensemble.get('corroborated_fields') or 0) != 4:
                  unsafe.append(pid)
                  continue
              if any(observed.get(field) is None for field in required):
                  unsafe.append(pid)
                  continue
              replay_nutrition = expected[pid]['nutrition']
              if any(float(observed[field]) != float(replay_nutrition[field]) for field in required):
                  conflicts.append({'product_id': pid, 'replay': replay_nutrition, 'end_to_end': observed})
                  continue
              if row.get('basis') != expected[pid]['basis']:
                  conflicts.append({'product_id': pid, 'replay_basis': expected[pid]['basis'], 'end_to_end_basis': row.get('basis')})
                  continue
              reproduced.append(pid)
              nutrition[pid] = observed

          if provenance_errors:
              raise SystemExit('Provenance contract violated: ' + ','.join(provenance_errors))
          if unsafe:
              raise SystemExit('Unsafe DECLARED rows: ' + ','.join(unsafe))
          if conflicts:
              raise SystemExit('Replay conflicts: ' + json.dumps(conflicts, ensure_ascii=False))

          summary = {
              'mode': 'BOUNDED_E2E_VALIDATION_OF_CURRENT_CANONICAL_REVIEW_REPLAY_PROMOTIONS',
              'processed': len(rows),
              'status_counts': dict(sorted(Counter(row.get('status', 'UNKNOWN') for row in rows).items())),
              'selected_ids': sorted(expected),
              'reproduced_ids': sorted(reproduced),
              'review_ids': sorted(review),
              'declared_nutrition': nutrition,
              'conflicts': conflicts,
              'unsafe_declared': unsafe,
              'provenance_errors': provenance_errors,
              'canonical_additions_applied': 0,
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'redistribution_allowed': False,
              'images_persisted': False,
              'missing_values_inferred': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          Path('mercadona-current-replay-promotions-wave-e2e-summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True),
              encoding='utf-8',
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-neural-ocr-current-replay-promotions-wave
          path: |
            tools/catalog/mercadona-neural-ocr-current-replay-promotions-wave/
            tools/catalog/mercadona-current-replay-promotion-wave-selection.json
            tools/catalog/mercadona-current-replay-promotions-wave-e2e-summary.json
          retention-days: 30
          if-no-files-found: warn
