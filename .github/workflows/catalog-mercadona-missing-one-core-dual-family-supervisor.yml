name: Catalog Mercadona missing-one dual-family supervisor

# Keep the bounded missing-one rescue aligned with implementation changes.
# If the latest REVIEW came from an older retry implementation, patch the worker
# so that the same exact EAN/image may be re-read once under the newer code.
on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - 'tools/catalog/mercadona_near_safe_doctr_retry.py'
      - 'tools/catalog/test_mercadona_near_safe_doctr_retry.py'
      - '.github/workflows/catalog-mercadona-missing-one-core-dual-family-supervisor.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: catalog-mercadona-missing-one-dual-family-supervisor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-and-dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - name: Make worker retry policy implementation-aware
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/catalog-mercadona-missing-one-core-doctr-rescue.yml')
          text = path.read_text(encoding='utf-8')
          marker = "previous_retry_impl_blob"
          if marker in text:
              print('Worker already uses implementation-aware retry provenance')
              raise SystemExit(0)

          old = '''              if 'doctr' in run_path.lower() or run_path == THIS_WORKFLOW:
                  excluded_prior_doctr.append({'product_id': pid, 'run_id': latest_run_id, 'run_path': run_path})
                  continue
              row['_latest_raw_run_path'] = run_path
              candidates.append(row)
          '''
          new = '''              if 'doctr' in run_path.lower() or run_path == THIS_WORKFLOW:
                  # A prior docTR observation blocks an identical retry, but not a
                  # materially newer retry implementation. Compare the exact blob
                  # used by that run with the current blob. Lookup failures are
                  # fail-closed: they never make a product eligible.
                  retry_impl = 'tools/catalog/mercadona_near_safe_doctr_retry.py'
                  try:
                      run_head_sha = subprocess.check_output(
                          ['gh', 'api', f'/repos/frandavid100/rumbo/actions/runs/{latest_run_id}', '--jq', '.head_sha'],
                          text=True,
                      ).strip()
                      previous_retry_impl_blob = subprocess.check_output(
                          [
                              'gh', 'api', '--method', 'GET',
                              f'/repos/frandavid100/rumbo/contents/{retry_impl}',
                              '-f', f'ref={run_head_sha}', '--jq', '.sha',
                          ],
                          text=True,
                      ).strip()
                      current_retry_impl_blob = subprocess.check_output(
                          ['git', 'rev-parse', f'HEAD:{retry_impl}'],
                          text=True,
                      ).strip()
                  except Exception as exc:
                      excluded_prior_doctr.append({
                          'product_id': pid,
                          'run_id': latest_run_id,
                          'run_path': run_path,
                          'reason': 'RETRY_IMPLEMENTATION_PROVENANCE_LOOKUP_FAILED',
                          'error': f'{type(exc).__name__}:{exc}',
                      })
                      continue
                  if previous_retry_impl_blob == current_retry_impl_blob:
                      excluded_prior_doctr.append({
                          'product_id': pid,
                          'run_id': latest_run_id,
                          'run_path': run_path,
                          'reason': 'SAME_RETRY_IMPLEMENTATION_BLOB',
                          'retry_impl_blob': current_retry_impl_blob,
                      })
                      continue
                  row['_previous_retry_impl_blob'] = previous_retry_impl_blob
                  row['_current_retry_impl_blob'] = current_retry_impl_blob
              row['_latest_raw_run_path'] = run_path
              candidates.append(row)
          '''
          if old not in text:
              raise SystemExit('Expected worker retry-policy block not found; refusing unsafe patch')
          text = text.replace(old, new, 1)
          text = text.replace(
              "LATEST_OBSERVATION_NOT_DOCTR; EXACT_EAN; EXACT_CURRENT_FIRST_PARTY_P9_IMAGE",
              "PRIOR_DOCTR_ONLY_IF_RETRY_IMPLEMENTATION_BLOB_CHANGED; EXACT_EAN; EXACT_CURRENT_FIRST_PARTY_P9_IMAGE",
          )
          text = text.replace(
              "'new_independent_ocr_family': 'doctr',",
              "'new_independent_ocr_family': 'doctr',\n              'additional_retry_ocr_families': ['easyocr', 'doctr'],",
          )
          text = text.replace(
              "row['retry_independent_ocr_family'] = 'doctr'",
              "row['retry_independent_ocr_family'] = 'doctr'\n              row['additional_retry_ocr_families'] = ['easyocr', 'doctr']",
          )
          path.write_text(text, encoding='utf-8')
          PY

          if git diff --quiet -- .github/workflows/catalog-mercadona-missing-one-core-doctr-rescue.yml; then
            echo 'No worker patch needed; dispatching current bounded worker.'
            gh workflow run catalog-mercadona-missing-one-core-doctr-rescue.yml \
              --repo frandavid100/rumbo \
              --ref agent/catalog-phase1
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/catalog-mercadona-missing-one-core-doctr-rescue.yml
          git commit -m 'Catalog: make missing-one retries implementation-aware'
          git push origin HEAD:agent/catalog-phase1
