name: Level 3 relocate modifier
on:
  push:
    branches: [agent/level3-culinary-satisfaction-v2]
    paths: [.github/workflows/level3-relocate-modifier.yml]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/level3-culinary-satisfaction-v2
      - run: python scripts/level3_relocate_modifier.py
      - run: |
          rm scripts/level3_relocate_modifier.py
          rm .github/workflows/level3-relocate-modifier.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Reubicar auxiliares culinarios en reparación de nivel 3"
          git push origin HEAD:agent/level3-culinary-satisfaction-v2
