name: Catalog Alcampo bootstrap supervisor
on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-alcampo-bootstrap-supervisor.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: catalog-alcampo-bootstrap-supervisor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 230
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find latest 13.9k bootstrap run and wait for its detail jobs
        id: bootstrap
        run: |
          run_id=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/catalog-alcampo-bootstrap-13877.yml/runs?branch=agent%2Fcatalog-phase1&per_page=20" --jq '.workflow_runs[0].id // empty')
          if [ -z "$run_id" ]; then
            echo 'No bootstrap run found' >&2
            exit 2
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 100); do
            status=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')
            conclusion=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // ""')
            echo "bootstrap_run=$run_id status=$status conclusion=$conclusion poll=$i"
            if [ "$status" = 'completed' ]; then
              break
            fi
            sleep 120
          done
      - name: Download baseline and every completed detail artifact
        run: |
          mkdir -p recovered/enumeration recovered/details
          gh run download "${{ steps.bootstrap.outputs.run_id }}" -n alcampo-bootstrap-enumeration -D recovered/enumeration
          gh run download "${{ steps.bootstrap.outputs.run_id }}" -p 'alcampo-bootstrap-detail-result-*' -D recovered/details || true
          test -s recovered/enumeration/products.jsonl
      - name: Merge all available detail rows without discarding a partial overnight result
        working-directory: tools/catalog
        run: |
          mkdir -p ../../alcampo-bootstrap-salvage
          set +e
          python alcampo_merge_detail_batches.py \
            --downloaded ../../recovered/details \
            --out ../../alcampo-bootstrap-salvage/details.jsonl \
            --expected-products ../../recovered/enumeration/products.jsonl
          echo $? > ../../alcampo-bootstrap-salvage/detail_merge_exit_code.txt
          set -e
      - name: Build canonical SQLite from the complete listing baseline and available first-party detail
        working-directory: tools/catalog
        run: |
          python alcampo_build_final_catalog.py \
            --products ../../recovered/enumeration/products.jsonl \
            --details ../../alcampo-bootstrap-salvage/details.jsonl \
            --output ../../alcampo-bootstrap-salvage/alcampo_catalog.sqlite
          python finalize_alcampo_classification.py \
            ../../alcampo-bootstrap-salvage/alcampo_catalog.sqlite \
            ../../recovered/enumeration/products.jsonl
          python alcampo_semantic_gate.py \
            ../../alcampo-bootstrap-salvage/alcampo_catalog.sqlite \
            --reviews manual/alcampo_semantic_reviews.jsonl
      - name: Prepare a large semantic-review queue for later model review
        working-directory: tools/catalog
        run: |
          python alcampo_prepare_semantic_review_v2.py \
            ../../alcampo-bootstrap-salvage/alcampo_catalog.sqlite \
            --observations ../../recovered/enumeration/products.jsonl \
            --reviews manual/alcampo_semantic_reviews.jsonl \
            --output ../../alcampo-bootstrap-salvage/semantic_review_next.jsonl \
            --progress ../../alcampo-bootstrap-salvage/semantic_review_progress.json \
            --limit 2000
      - name: Export auditable partial/final snapshot
        working-directory: tools/catalog
        run: |
          python alcampo_export_final.py \
            ../../alcampo-bootstrap-salvage/alcampo_catalog.sqlite \
            --jsonl ../../alcampo-bootstrap-salvage/alcampo_catalog.jsonl \
            --summary ../../alcampo-bootstrap-salvage/summary.json \
            --detail-summary ../../alcampo-bootstrap-salvage/detail_merge_summary.json \
            --enumeration-report ../../recovered/enumeration/enumeration_report.json
          cp ../../recovered/enumeration/products.jsonl ../../alcampo-bootstrap-salvage/source_products.jsonl
          cp ../../recovered/enumeration/enumeration_report.json ../../alcampo-bootstrap-salvage/enumeration_report.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('../../alcampo-bootstrap-salvage/summary.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['bootstrap_source_run']=os.environ.get('BOOTSTRAP_RUN_ID','')
          d['salvage_policy']='KEEP_COMPLETE_13877_LISTING_BASELINE_EVEN_WHEN_DETAIL_BATCHES_ARE_PARTIAL'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
        env:
          BOOTSTRAP_RUN_ID: ${{ steps.bootstrap.outputs.run_id }}
      - name: Persist salvage coverage and semantic queue
        run: |
          cp alcampo-bootstrap-salvage/summary.json tools/catalog/fixtures/alcampo_bootstrap_salvage_summary_latest.json
          cp alcampo-bootstrap-salvage/detail_merge_summary.json tools/catalog/fixtures/alcampo_bootstrap_salvage_detail_latest.json
          cp alcampo-bootstrap-salvage/semantic_review_next.jsonl tools/catalog/fixtures/alcampo_bootstrap_salvage_semantic_review_next.jsonl
          cp alcampo-bootstrap-salvage/semantic_review_progress.json tools/catalog/fixtures/alcampo_bootstrap_salvage_semantic_review_progress_latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/catalog/fixtures/alcampo_bootstrap_salvage_*.json tools/catalog/fixtures/alcampo_bootstrap_salvage_semantic_review_next.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "catalog: persist salvage of Alcampo 13.9k bootstrap"
            git pull --rebase origin agent/catalog-phase1
            git push origin HEAD:agent/catalog-phase1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: alcampo-bootstrap-salvage-snapshot
          path: alcampo-bootstrap-salvage/
          retention-days: 14
