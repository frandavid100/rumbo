name: Fix legacy role semantics

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/remove-legacy-catalog-canonical-policy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-legacy-catalog-canonical-policy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/fix_legacy_role_semantics.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java app/src/test/java
          git commit -m "Ajustar semántica legacy a roles canónicos"
          git push origin HEAD:agent/remove-legacy-catalog-canonical-policy
