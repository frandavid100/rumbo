name: Catalog Mercadona zero-macro under-corroborated regression

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-zero-macro-undercorroborated-regression.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-zero-macro-undercorroborated-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download consolidated Mercadona first-party cut
        uses: actions/download-artifact@v4
        with:
          name: mercadona-first-party-final
          path: tools/catalog/mercadona-first-party-final
          repository: frandavid100/rumbo
          github-token: ${{ github.token }}
          run-id: 33046950149
      - name: Build exact zero-macro under-corroborated cohort
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          targets = {
              '16314', '27321', '2781', '2817', '28575', '39191', '39394',
              '4640', '4740', '50483', '67938', '67939', '8309',
          }
          rows = [
              json.loads(x)
              for x in Path('mercadona-first-party-final/products.jsonl').read_text().splitlines()
              if x.strip()
          ]
          selected = [x for x in rows if str(x.get('product_id') or '') in targets]
          found = {str(x.get('product_id') or '') for x in selected}
          if found != targets or len(selected) != len(targets):
              raise SystemExit(
                  f'exact cohort mismatch: expected={sorted(targets)} '
                  f'found={sorted(found)} rows={len(selected)}'
              )
          for row in selected:
              photos = row.get('photos') if isinstance(row.get('photos'), list) else []
              if not any(
                  isinstance(photo, dict)
                  and str(photo.get('perspective')) == '9'
                  and photo.get('zoom')
                  for photo in photos
              ):
                  raise SystemExit(
                      f"{row.get('product_id')} no longer has a usable perspective=9 label image"
                  )
          selected.sort(key=lambda x: str(x.get('product_id') or ''))
          Path('zero-macro-undercorroborated-products.jsonl').write_text(
              ''.join(
                  json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n'
                  for row in selected
              )
          )
          Path('zero-macro-undercorroborated-selection.json').write_text(
              json.dumps(
                  {
                      'selection_basis': (
                          'Current raw-live REVIEW audit: complete plausible 100g/100ml diagnostics, '
                          'exactly 3 corroborated core fields, at least one diagnostic zero-valued core '
                          'macro, and latest raw-live observation predating the v1.4.8 EasyOCR 0g->09 repair.'
                      ),
                      'selected': len(selected),
                      'product_ids': sorted(targets),
                      'parser_required': '1.4.8',
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + '\n'
          )
          PY
      - name: Verify integrated parser version
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import nutrition_label_reader
          if nutrition_label_reader.READER_VERSION != '1.4.8':
              raise SystemExit(
                  f'expected integrated reader 1.4.8, got {nutrition_label_reader.READER_VERSION}'
              )
          PY
      - name: Install OCR engines
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow
      - name: Run zero-glyph and conservative OCR regressions
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_easyocr_zero_glyph.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_ocr_safety_regressions.py \
            test_mercadona_neural_ocr_tesseract_preprocess_rescue.py
          python -m py_compile \
            nutrition_label_reader.py \
            nutrition_ocr_ensemble.py \
            mercadona_neural_ocr_tesseract_preprocess_rescue.py
      - name: Reprocess exact regression cohort
        working-directory: tools/catalog
        run: |
          python mercadona_neural_ocr_tesseract_preprocess_rescue.py \
            --products zero-macro-undercorroborated-products.jsonl \
            --out mercadona-zero-macro-undercorroborated-regression \
            --shard-index ${{ matrix.shard }} --shard-count 4 --limit 0 --delay 0.25
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-zero-macro-undercorroborated-regression-${{ matrix.shard }}
          path: |
            tools/catalog/mercadona-zero-macro-undercorroborated-regression/
            tools/catalog/zero-macro-undercorroborated-selection.json
          retention-days: 30
          if-no-files-found: error

  merge:
    runs-on: ubuntu-24.04
    needs: ocr
    if: ${{ always() && needs.ocr.result == 'success' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: mercadona-zero-macro-undercorroborated-regression-*
          path: input
          merge-multiple: true
      - name: Merge and enforce conservative contract
        run: |
          python - <<'PY'
          import glob
          import json
          import sqlite3
          from collections import Counter
          from pathlib import Path

          expected = {
              '16314', '27321', '2781', '2817', '28575', '39191', '39394',
              '4640', '4740', '50483', '67938', '67939', '8309',
          }
          allowed = {'DECLARED', 'REVIEW', 'NO_VISUAL_REGION', 'ERROR'}
          fields = ('calories', 'protein_g', 'carbohydrate_g', 'fat_g')

          paths = sorted(glob.glob('input/**/results-*.jsonl', recursive=True))
          if len(paths) != 4:
              raise SystemExit(f'expected 4 shard result files, got {len(paths)}')
          rows = []
          for path in paths:
              rows.extend(
                  json.loads(x)
                  for x in Path(path).read_text().splitlines()
                  if x.strip()
              )

          ids = [str(row.get('product_id') or '') for row in rows]
          observed = set(ids)
          duplicates = sorted(pid for pid, n in Counter(ids).items() if n > 1)
          missing = sorted(expected - observed)
          unexpected = sorted(observed - expected)
          counts = Counter(str(row.get('status') or 'UNKNOWN') for row in rows)
          bad_statuses = sorted(set(counts) - allowed)
          provenance_errors = []
          unsafe_declared = []
          audited = []

          for row in sorted(rows, key=lambda r: str(r.get('product_id') or '')):
              pid = str(row.get('product_id') or '')
              if (
                  row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE'
                  or row.get('source') != 'MERCADONA_FIRST_PARTY'
                  or row.get('source_record_kind') != 'label image'
                  or row.get('redistribution_allowed') is not False
                  or str(row.get('perspective')) != '9'
              ):
                  provenance_errors.append(pid)

              status = str(row.get('status') or '')
              nutrition = row.get('nutrition')
              if status != 'DECLARED':
                  if nutrition is not None:
                      unsafe_declared.append(f'{pid}:non_declared_carries_nutrition')
              else:
                  if not isinstance(nutrition, dict) or any(nutrition.get(f) is None for f in fields):
                      unsafe_declared.append(f'{pid}:incomplete_declared')
                  accepted = next(
                      (
                          attempt
                          for attempt in row.get('attempts') or []
                          if isinstance(attempt.get('ensemble'), dict)
                          and attempt['ensemble'].get('status') == 'DECLARED'
                      ),
                      None,
                  )
                  ensemble = (accepted or {}).get('ensemble') or {}
                  if (
                      int(ensemble.get('independent_engine_families') or 0) < 2
                      or int(ensemble.get('corroborated_fields') or 0) < 4
                  ):
                      unsafe_declared.append(f'{pid}:insufficient_corroboration')

              audited.append(
                  {
                      'product_id': pid,
                      'ean': row.get('ean'),
                      'name': row.get('name'),
                      'status': status,
                      'basis': row.get('basis'),
                      'nutrition': nutrition if status == 'DECLARED' else None,
                      'image_url': row.get('image_url'),
                      'image_perspective': str(row.get('perspective') or ''),
                      'source': 'MERCADONA_FIRST_PARTY/label image',
                      'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
                      'redistribution_allowed': False,
                  }
              )

          image_ext = {'.jpg', '.jpeg', '.png', '.webp', '.bmp', '.tif', '.tiff'}
          persisted_images = [
              str(path)
              for path in Path('input').rglob('*')
              if path.is_file() and path.suffix.lower() in image_ext
          ]
          ok = (
              len(rows) == len(expected)
              and len(observed) == len(expected)
              and not duplicates
              and not missing
              and not unexpected
              and not bad_statuses
              and not provenance_errors
              and not unsafe_declared
              and not persisted_images
          )
          declared_ids = sorted(
              row['product_id'] for row in audited if row['status'] == 'DECLARED'
          )

          Path('merged').mkdir(exist_ok=True)
          summary = {
              'cohort': 'zero-macro under-corroborated current REVIEW regression',
              'selection_basis': (
                  '13 current near-safe REVIEW products with exactly three corroborated core fields, '
                  'a zero-valued diagnostic core macro, and latest raw-live OCR predating parser v1.4.8.'
              ),
              'processed': len(rows),
              'distinct_products_processed': len(observed),
              'status_counts': dict(sorted(counts.items())),
              'new_live_declared_product_ids': declared_ids,
              'new_live_declared_count': len(declared_ids),
              'unsafe_declared': unsafe_declared,
              'provenance_errors': provenance_errors,
              'duplicate_product_ids': duplicates,
              'missing_product_ids': missing,
              'unexpected_product_ids': unexpected,
              'unexpected_statuses': bad_statuses,
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'redistribution_allowed': False,
              'images_persisted': False,
              'missing_values_inferred': False,
              'REVIEW_promoted_without_new_live_OCR': 0,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
              'safety_assessment': 'VALIDATED' if ok else 'FAILED',
          }
          Path('merged/results.jsonl').write_text(
              ''.join(
                  json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n'
                  for row in sorted(rows, key=lambda r: str(r.get('product_id') or ''))
              )
          )
          Path('merged/audited-products.json').write_text(
              json.dumps(audited, ensure_ascii=False, indent=2) + '\n'
          )
          Path('merged/summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + '\n'
          )

          con = sqlite3.connect('merged/results.sqlite')
          con.execute(
              'create table results(product_id text primary key,status text not null,payload_json text not null)'
          )
          for row in rows:
              con.execute(
                  'insert into results values(?,?,?)',
                  (
                      str(row.get('product_id') or ''),
                      str(row.get('status') or ''),
                      json.dumps(row, ensure_ascii=False, sort_keys=True),
                  ),
              )
          con.commit()
          con.close()

          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if not ok:
              raise SystemExit('zero-macro regression cohort failed conservative safety contract')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mercadona-zero-macro-undercorroborated-regression-merged
          path: merged/
          retention-days: 30
