name: Catalog patch nutrition numeric boundary

on:
  push:
    branches:
      - agent/catalog-phase1
    paths:
      - .github/workflows/catalog-patch-nutrition-number-boundary.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: tools/catalog
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
          fetch-depth: 0

      - name: Apply narrow numeric-token boundary fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/catalog/nutrition_label_reader.py")
          text = path.read_text(encoding="utf-8")
          old = 'number = re.search(r"([<>]?)\\s*(\\d{1,4}(?:\\.\\d{1,2})?)\\s*(?:g\\b|gramos?\\b)?", tail)'
          new = 'number = re.search(r"([<>]?)\\s*(\\d{1,4}(?:\\.\\d{1,2})?)(?![\\d.])\\s*(?:g\\b|gramos?\\b)?", tail)'
          if old not in text:
              raise SystemExit("expected _number_after numeric regex not found exactly once")
          if text.count(old) != 1:
              raise SystemExit(f"expected one regex occurrence, found {text.count(old)}")
          text = text.replace(old, new, 1)
          text = text.replace('READER_VERSION = "1.4.25"', 'READER_VERSION = "1.4.26"', 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Run parser regression suite
        run: python -m unittest tools/catalog/test_nutrition_label_reader.py

      - name: Commit tested fix
        shell: bash
        run: |
          if git diff --quiet -- tools/catalog/nutrition_label_reader.py; then
            echo "No parser change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/catalog/nutrition_label_reader.py
          git commit -m "catalog: reject partial dotted numeric tokens"
          git push origin HEAD:agent/catalog-phase1
