name: Catalog Mercadona Tesseract preprocess rescue wave2 merge repair

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-tesseract-preprocess-rescue-wave2-merge-repair.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download completed wave2 OCR shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mercadona-tesseract-preprocess-rescue-wave2-*
          path: input
          merge-multiple: true
          repository: frandavid100/rumbo
          github-token: ${{ github.token }}
          run-id: 33634915517
      - name: Download audited candidate baseline
        uses: actions/download-artifact@v4
        with:
          name: mercadona-p9-review-failure-audit
          path: baseline
          repository: frandavid100/rumbo
          github-token: ${{ github.token }}
          run-id: 33613875008
      - name: Download validated pilot baseline
        uses: actions/download-artifact@v4
        with:
          name: mercadona-tesseract-preprocess-rescue-pilot-merged
          path: pilot
          repository: frandavid100/rumbo
          github-token: ${{ github.token }}
          run-id: 33628159557
      - name: Merge existing shards and enforce conservative promotion contract
        run: |
          python - <<'PY'
          from collections import Counter
          import glob, json
          from pathlib import Path

          FIELDS = ('calories', 'protein_g', 'carbohydrate_g', 'fat_g')
          ALLOWED_STATUSES = {'DECLARED', 'REVIEW', 'NO_VISUAL_REGION'}

          def close(field, a, b):
              a, b = float(a), float(b)
              tolerance = max(5.0, .04 * max(abs(a), abs(b), 1.0)) if field == 'calories' else max(.6, .10 * max(abs(a), abs(b), 1.0))
              return abs(a - b) <= tolerance

          result_paths = sorted(glob.glob('input/**/results-*.jsonl', recursive=True))
          if len(result_paths) != 8:
              raise SystemExit(f'expected 8 wave2 shard result files, found {len(result_paths)}: {result_paths}')
          rows = []
          for path in result_paths:
              rows.extend(json.loads(line) for line in Path(path).read_text(encoding='utf-8').splitlines() if line.strip())

          selection_paths = sorted(glob.glob('input/**/wave2-selection.json', recursive=True))
          if not selection_paths:
              raise SystemExit('wave2-selection.json not found in downloaded artifacts')
          selections = [json.loads(Path(path).read_text(encoding='utf-8')) for path in selection_paths]
          selection = selections[0]
          if any(candidate != selection for candidate in selections[1:]):
              raise SystemExit('wave2 shard selection manifests disagree')
          expected_ids = set(selection['product_ids'])

          baseline = {
              str(row['product_id']): row
              for row in (
                  json.loads(line)
                  for line in Path('baseline/priority-near-complete.jsonl').read_text(encoding='utf-8').splitlines()
                  if line.strip()
              )
          }
          pilot_summary = json.loads(Path('pilot/summary.json').read_text(encoding='utf-8'))
          pilot_promotions = json.loads(Path('pilot/safe-promotions.json').read_text(encoding='utf-8'))
          if pilot_summary.get('safety_assessment') != 'VALIDATED' or len(pilot_promotions) != 5:
              raise SystemExit('validated pilot baseline mismatch')

          counts = Counter(str(row.get('status') or 'UNKNOWN') for row in rows)
          ids = [str(row.get('product_id') or '') for row in rows]
          duplicate_ids = sorted(pid for pid, count in Counter(ids).items() if count > 1)
          provenance_errors = []
          unsafe_declared = []
          value_conflicts = []
          safe_promotions = []

          for row in rows:
              pid = str(row.get('product_id') or '')
              prior = baseline.get(pid)
              if prior is None or pid not in expected_ids:
                  provenance_errors.append(f'{pid}:not_in_wave2_baseline')
                  continue
              if (
                  row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE'
                  or row.get('source') != 'MERCADONA_FIRST_PARTY'
                  or row.get('source_record_kind') != 'label image'
                  or row.get('redistribution_allowed') is not False
                  or str(row.get('perspective')) != '9'
              ):
                  provenance_errors.append(f'{pid}:provenance')
              if row.get('status') != 'DECLARED':
                  continue

              accepted = next((a for a in row.get('attempts') or [] if (a.get('ensemble') or {}).get('status') == 'DECLARED'), None)
              ensemble = (accepted or {}).get('ensemble') or {}
              nutrition = row.get('nutrition') or {}
              if (
                  int(ensemble.get('independent_engine_families') or 0) < 2
                  or int(ensemble.get('corroborated_fields') or 0) < 4
                  or any(nutrition.get(field) is None for field in FIELDS)
              ):
                  unsafe_declared.append(pid)
                  continue

              conflicts = []
              if row.get('basis') != prior.get('basis'):
                  conflicts.append(f"basis:{prior.get('basis')}!={row.get('basis')}")
              prior_nutrition = prior.get('nutrition') or {}
              for field in FIELDS:
                  if prior_nutrition.get(field) is None or not close(field, nutrition[field], prior_nutrition[field]):
                      conflicts.append(f"{field}:{prior_nutrition.get(field)}!~{nutrition[field]}")
              if conflicts:
                  value_conflicts.append({'product_id': pid, 'conflicts': conflicts})
                  continue

              safe_promotions.append({
                  'product_id': pid,
                  'ean': row.get('ean'),
                  'name': row.get('name'),
                  'basis': row.get('basis'),
                  'nutrition': nutrition,
                  'independent_engine_families': ensemble.get('independent_engine_families'),
                  'corroborated_fields': ensemble.get('corroborated_fields'),
                  'source': 'MERCADONA_FIRST_PARTY/label image',
                  'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
                  'redistribution_allowed': False,
              })

          observed_ids = set(ids)
          missing_ids = sorted(expected_ids - observed_ids)
          unexpected_ids = sorted(observed_ids - expected_ids)
          unexpected_statuses = sorted(set(counts) - ALLOWED_STATUSES)
          cumulative_promotions = pilot_promotions + safe_promotions
          cumulative_ids = [str(row['product_id']) for row in cumulative_promotions]
          cumulative_duplicate_ids = sorted(pid for pid, count in Counter(cumulative_ids).items() if count > 1)

          safety_ok = (
              len(rows) == 32
              and len(observed_ids) == 32
              and not duplicate_ids
              and not missing_ids
              and not unexpected_ids
              and not provenance_errors
              and not unsafe_declared
              and not value_conflicts
              and not cumulative_duplicate_ids
              and not unexpected_statuses
          )
          summary = {
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'redistribution_allowed': False,
              'candidate_universe': len(baseline),
              'pilot_processed': 16,
              'wave2_expected': 32,
              'wave2_processed': len(rows),
              'wave2_distinct_products_processed': len(observed_ids),
              'cumulative_sample_processed': 16 + len(rows),
              'wave2_status_counts': dict(sorted(counts.items())),
              'wave2_safe_promotion_products': len(safe_promotions),
              'wave2_safe_promotion_product_ids': sorted(item['product_id'] for item in safe_promotions),
              'cumulative_safe_promotion_products': len(cumulative_promotions),
              'cumulative_safe_promotion_product_ids': sorted(cumulative_ids),
              'value_conflicts': value_conflicts,
              'unsafe_declared': unsafe_declared,
              'duplicate_product_ids': duplicate_ids,
              'missing_product_ids': missing_ids,
              'unexpected_product_ids': unexpected_ids,
              'unexpected_statuses': unexpected_statuses,
              'cumulative_duplicate_promotion_ids': cumulative_duplicate_ids,
              'provenance_errors': provenance_errors,
              'source_ocr_run_id': 33634915517,
              'merge_repair': 'recursive_artifact_path_discovery',
              'images_persisted': False,
              'missing_values_inferred': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
              'safety_assessment': 'VALIDATED' if safety_ok else 'FAILED',
          }

          Path('merged').mkdir(exist_ok=True)
          Path('merged/results.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in sorted(rows, key=lambda row: str(row.get('product_id') or ''))),
              encoding='utf-8',
          )
          Path('merged/safe-promotions.json').write_text(json.dumps(safe_promotions, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('merged/cumulative-safe-promotions.json').write_text(json.dumps(cumulative_promotions, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('merged/selection.json').write_text(json.dumps(selection, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('merged/summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if not safety_ok:
              raise SystemExit('wave2 repaired safety contract failed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mercadona-tesseract-preprocess-rescue-wave2-merged
          path: merged/
          retention-days: 30
          if-no-files-found: error
