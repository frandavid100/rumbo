name: Catalog Mercadona OCR exact-consensus precision fix

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-ensemble-consensus-fix.yml'

permissions:
  contents: write

tasks: {}

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Add regression first
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('test_nutrition_ocr_ensemble.py')
          text = path.read_text(encoding='utf-8')
          marker = "\n\nif __name__ == '__main__': unittest.main()\n"
          assert marker in text
          test = r'''

    def test_exact_cross_family_consensus_beats_higher_confidence_nearby_layout_value(self):
        """A glyph outlier inside one family must not choose the stored numeric value.

        This reproduces Mercadona 39191: two independent families contain an exact
        11.3 reading, while one higher-confidence Tesseract layout reads the trailing
        `g` as `9` and yields 11.39. The ordinary loose tolerance may corroborate the
        field, but the persisted value must use the exact cross-family consensus.
        """
        doctr = reading('DECLARED', '100_ml', {
            'calories': 50.0, 'fat_g': 0.0, 'carbohydrate_g': 11.3, 'protein_g': 0.5
        }, .88)
        tess_nearby_high = reading('REVIEW', '100_ml', {
            'calories': 50.0, 'fat_g': 0.0, 'carbohydrate_g': 11.39, 'protein_g': 0.5
        }, .95, 'LOW_EXTRACTION_CONFIDENCE')
        tess_exact = reading('DECLARED', '100_ml', {
            'calories': 50.0, 'fat_g': 0.0, 'carbohydrate_g': 11.3, 'protein_g': 0.5
        }, .90)
        result = fuse_ocr_readings([
            ParsedOCRReading('doctr-crop-left', doctr, engine_family='doctr'),
            ParsedOCRReading('tesseract-psm11', tess_nearby_high, engine_family='tesseract'),
            ParsedOCRReading('tesseract-psm4', tess_exact, engine_family='tesseract'),
        ])
        self.assertEqual(result.status, 'DECLARED', result)
        self.assertEqual(result.corroborated_fields, 4)
        self.assertEqual(result.nutrition['carbohydrate_g'], 11.3)
'''
          path.write_text(text.replace(marker, test + marker), encoding='utf-8')
          PY

      - name: Prove the regression fails before code change
        working-directory: tools/catalog
        shell: bash
        run: |
          set +e
          python -m unittest -v \
            test_nutrition_ocr_ensemble.OCREnsembleTest.test_exact_cross_family_consensus_beats_higher_confidence_nearby_layout_value
          rc=$?
          set -e
          if [[ $rc -eq 0 ]]; then
            echo 'Regression unexpectedly passed before the precision fix; refusing to patch blindly.' >&2
            exit 1
          fi

      - name: Patch exact cross-family consensus selection
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('nutrition_ocr_ensemble.py')
          text = path.read_text(encoding='utf-8')
          old_version = 'ENSEMBLE_VERSION = "1.3.2"'
          assert text.count(old_version) == 1
          text = text.replace(old_version, 'ENSEMBLE_VERSION = "1.3.3"')

          marker = '\n\ndef _choose_field(field: str, candidates):\n'
          assert text.count(marker) == 1
          helper = r'''


def _exact_cross_family_consensus(candidates, representative_families):
    """Pick an exact numeric value seen by at least two independent OCR families.

    `_close` intentionally remains fairly tolerant so tiny OCR glyph noise does not
    block corroboration. That tolerance must not let a higher-confidence near value
    become the persisted macro when two independent families also contain the same
    exact numeric reading. Same-family layouts never add independent support.

    If no unique exact cross-family consensus exists, keep the historical
    confidence-based representative; this function changes value selection only,
    never the acceptance/corroboration thresholds.
    """
    eligible = tuple(x for x in candidates if x[3] in representative_families)
    if not eligible:
        return None

    support = {}
    for candidate in eligible:
        value = candidate[0]
        support.setdefault(value, set()).add(candidate[3])
    max_families = max((len(families) for families in support.values()), default=0)
    if max_families < 2:
        return None
    winners = [value for value, families in support.items() if len(families) == max_families]
    if len(winners) != 1:
        return None
    value = winners[0]
    matching = [candidate for candidate in eligible if candidate[0] == value]
    return max(matching, key=lambda x: x[1])
'''
          text = text.replace(marker, helper + marker)

          old = '''    representative_families = {x[3] for x in representatives}\n    if ambiguous_families and len(representative_families) < 2:\n        return None, f"OCR_SAME_ENGINE_CONFLICT:{field}:{','.join(sorted(ambiguous_families))}"\n\n    agreeing = [\n'''
          new = '''    representative_families = {x[3] for x in representatives}\n    if ambiguous_families and len(representative_families) < 2:\n        return None, f"OCR_SAME_ENGINE_CONFLICT:{field}:{','.join(sorted(ambiguous_families))}"\n\n    exact_consensus = _exact_cross_family_consensus(candidates, representative_families)\n    if exact_consensus is not None:\n        selected = exact_consensus\n\n    agreeing = [\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run conservative regression suite
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_ocr_safety_regressions.py \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_label_reader_row_tokens.py \
            test_mercadona_near_safe_variant_rescue.py \
            test_mercadona_bounded_doctr_rescue.py \
            test_mercadona_ambiguous_primary_column_rescue.py

      - name: Commit tested fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/catalog-mercadona-ensemble-consensus-fix.yml
          git add tools/catalog/nutrition_ocr_ensemble.py tools/catalog/test_nutrition_ocr_ensemble.py
          git commit -m 'catalog: prefer exact cross-family OCR value consensus'
          git push origin HEAD:agent/catalog-phase1
