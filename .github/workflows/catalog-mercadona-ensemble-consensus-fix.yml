name: Catalog Mercadona OCR exact-consensus precision fix

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-ensemble-consensus-fix.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Add failing regression
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('test_nutrition_ocr_ensemble.py')
          s = p.read_text()
          marker = "\n\nif __name__ == '__main__': unittest.main()\n"
          assert marker in s
          test = '''

    def test_exact_cross_family_consensus_beats_higher_confidence_nearby_layout_value(self):
        doctr = reading('DECLARED', '100_ml', {'calories': 50.0, 'fat_g': 0.0, 'carbohydrate_g': 11.3, 'protein_g': 0.5}, .88)
        tess_nearby = reading('REVIEW', '100_ml', {'calories': 50.0, 'fat_g': 0.0, 'carbohydrate_g': 11.39, 'protein_g': 0.5}, .95, 'LOW_EXTRACTION_CONFIDENCE')
        tess_exact = reading('DECLARED', '100_ml', {'calories': 50.0, 'fat_g': 0.0, 'carbohydrate_g': 11.3, 'protein_g': 0.5}, .90)
        r = fuse_ocr_readings([
            ParsedOCRReading('doctr-crop-left', doctr, engine_family='doctr'),
            ParsedOCRReading('tesseract-psm11', tess_nearby, engine_family='tesseract'),
            ParsedOCRReading('tesseract-psm4', tess_exact, engine_family='tesseract'),
        ])
        self.assertEqual(r.status, 'DECLARED', r)
        self.assertEqual(r.corroborated_fields, 4)
        self.assertEqual(r.nutrition['carbohydrate_g'], 11.3)
'''
          p.write_text(s.replace(marker, test + marker))
          PY
      - name: Prove regression fails before patch
        working-directory: tools/catalog
        shell: bash
        run: |
          set +e
          python -m unittest -v test_nutrition_ocr_ensemble.OCREnsembleTest.test_exact_cross_family_consensus_beats_higher_confidence_nearby_layout_value
          rc=$?
          set -e
          test "$rc" -ne 0
      - name: Patch exact cross-family value selection
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('nutrition_ocr_ensemble.py')
          s = p.read_text()
          assert s.count('ENSEMBLE_VERSION = "1.3.2"') == 1
          s = s.replace('ENSEMBLE_VERSION = "1.3.2"', 'ENSEMBLE_VERSION = "1.3.3"')
          marker = '\n\ndef _choose_field(field: str, candidates):\n'
          assert s.count(marker) == 1
          helper = '''


def _exact_cross_family_consensus(candidates, representative_families):
    eligible = tuple(x for x in candidates if x[3] in representative_families)
    support = {}
    for candidate in eligible:
        support.setdefault(candidate[0], set()).add(candidate[3])
    max_families = max((len(families) for families in support.values()), default=0)
    if max_families < 2:
        return None
    winners = [value for value, families in support.items() if len(families) == max_families]
    if len(winners) != 1:
        return None
    matching = [candidate for candidate in eligible if candidate[0] == winners[0]]
    return max(matching, key=lambda x: x[1])
'''
          s = s.replace(marker, helper + marker)
          old = '''    representative_families = {x[3] for x in representatives}\n    if ambiguous_families and len(representative_families) < 2:\n        return None, f"OCR_SAME_ENGINE_CONFLICT:{field}:{','.join(sorted(ambiguous_families))}"\n\n    agreeing = [\n'''
          new = '''    representative_families = {x[3] for x in representatives}\n    if ambiguous_families and len(representative_families) < 2:\n        return None, f"OCR_SAME_ENGINE_CONFLICT:{field}:{','.join(sorted(ambiguous_families))}"\n\n    exact_consensus = _exact_cross_family_consensus(candidates, representative_families)\n    if exact_consensus is not None:\n        selected = exact_consensus\n\n    agreeing = [\n'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
      - name: Run conservative regression suite
        working-directory: tools/catalog
        run: |
          python -m unittest -v test_nutrition_ocr_ensemble.py test_mercadona_ocr_safety_regressions.py test_nutrition_label_reader.py test_nutrition_label_reader_ocr_typos.py test_nutrition_label_reader_row_tokens.py test_mercadona_near_safe_variant_rescue.py test_mercadona_bounded_doctr_rescue.py test_mercadona_ambiguous_primary_column_rescue.py
      - name: Commit tested fix and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/catalog-mercadona-ensemble-consensus-fix.yml
          git add tools/catalog/nutrition_ocr_ensemble.py tools/catalog/test_nutrition_ocr_ensemble.py
          git commit -m 'catalog: prefer exact cross-family OCR value consensus'
          git push origin HEAD:agent/catalog-phase1
