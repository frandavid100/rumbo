name: Catalog Mercadona OCR row token regression

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-ocr-row-token-regression.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: catalog-mercadona-ocr-row-token-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Mercadona first-party inventory
        uses: actions/download-artifact@v4
        with:
          name: mercadona-first-party-final
          path: tools/catalog/mercadona-first-party-final
          repository: frandavid100/rumbo
          github-token: ${{ github.token }}
          run-id: 33046950149

      - name: Apply row-token parser patch in workspace only
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('nutrition_label_reader.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('READER_VERSION = "1.4.10"', 'READER_VERSION = "1.4.11"'),
              (
                  'r"(?:^|\\n)\\s*[\\[|]?\\s*grasas?(?:\\s*/\\s*(?:lipidos?|fat|graisses?))?\\b",',
                  'r"(?:^|\\n)\\s*[\\[|]?\\s*grasas?(?:\\s*/?\\s*(?:lipidos?|ilipidos?|lapidos?|ipidos?|fat|graisses?))?\\b",',
              ),
              (
                  'r"(?:^|\\n)\\s*[\\[|]?\\s*proteinas?(?:\\s*/\\s*(?:protein|proteines?))?\\b",',
                  'r"(?:^|\\n)\\s*[\\[|]?\\s*(?:proteinas?|prote_nas?)(?:\\s*/\\s*(?:protein|proteines?))?(?=[\\s._:;|]|$)",',
              ),
              (
                  'r"\\s*[:;|]?\\s*([<>]?)\\s*0\\s*9(?:\\s*\\(\\s*\\d{1,3}(?:\\.\\d+)?\\s*%\\s*\\))?\\s*(?:\\n|$)",',
                  'r"\\s*[:;|]?\\s*([<>]?)\\s*(?:0\\s*9|o\\s*g)(?:\\s*\\(\\s*\\d{1,3}(?:\\.\\d+)?\\s*%\\s*\\))?\\s*(?:\\n|$)",',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'patch anchor drift: expected 1, got {count}: {old!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Write exact parser regressions before live OCR
        working-directory: tools/catalog
        run: |
          cat > test_nutrition_label_reader_row_tokens.py <<'PY'
          import unittest
          from nutrition_label_reader import read_nutrition_label

          class RowTokenRegressionTest(unittest.TestCase):
              def test_observed_fat_translation_tokens(self):
                  variants = ('Grasas Lipidos', 'GRASASILíPIDOS', 'GRASAS/LÁPIDOS', 'Grasas/ípidos')
                  for row in variants:
                      with self.subTest(row=row):
                          text = (
                              'INFORMACIÓN NUTRICIONAL\npor 100 ml\n'
                              'VALOR ENERGÉTICO 1382 kJ/335 kcal\n' + row + '\n35 g\n'
                              'de las cuales saturadas 24 g\nHIDRATOS DE CARBONO\n3.1 g\n'
                              'PROTEINAS\n2.0 g\nSAL 0.10 g\n'
                          )
                          r = read_nutrition_label(text, extraction_confidence=.96)
                          self.assertEqual(r.status, 'DECLARED', (row, r))
                          self.assertEqual(r.nutrition['fat_g'], 35.0)

              def test_observed_protein_underscore_tokens(self):
                  for row in ('PROTEINAS_', 'PROTE_NAS .'):
                      with self.subTest(row=row):
                          text = (
                              'INFORMACIÓN NUTRICIONAL\npor 100 g\nValor energético 110 kJ / 26 kcal\n'
                              'Grasas 0.6 g\nHidratos de carbono 2.4 g\n' + row + '\n2.1 g\nSal 0.08 g\n'
                          )
                          r = read_nutrition_label(text, extraction_confidence=.96)
                          self.assertEqual(r.status, 'DECLARED', (row, r))
                          self.assertEqual(r.nutrition['protein_g'], 2.1)

              def test_letter_o_g_is_zero_only_as_complete_macro_cell(self):
                  text = (
                      'INFORMACIÓN NUTRICIONAL\npor 100 g\nValor energético 878 kJ / 211 kcal\n'
                      'Grasas 15 g\nHidratos de carbono\nOg\nProteínas 19 g\nSal 0.18 g\n'
                  )
                  r = read_nutrition_label(text, extraction_confidence=.96)
                  self.assertEqual(r.status, 'DECLARED', r)
                  self.assertEqual(r.nutrition['carbohydrate_g'], 0.0)
                  bounded = text.replace('Og\nProteínas', '<Og\nProteínas')
                  rb = read_nutrition_label(bounded, extraction_confidence=.96)
                  self.assertEqual(rb.status, 'REVIEW', rb)
                  self.assertIn('MISSING_CORE:carbohydrate_g', rb.reasons)

              def test_protein_prose_guard_is_preserved(self):
                  text = (
                      'INFORMACIÓN NUTRICIONAL\npor 100 g\nValor energético 100 kcal\n'
                      'Grasas 4 g\nHidratos de carbono 10 g\n'
                      'Proteínas de leche E-331\nSal 0.2 g\n'
                  )
                  r = read_nutrition_label(text, extraction_confidence=.96)
                  self.assertEqual(r.status, 'REVIEW', r)
                  self.assertIn('MISSING_CORE:protein_g', r.reasons)

          if __name__ == '__main__':
              unittest.main()
          PY

      - name: Run parser and safety tests first
        run: |
          python -m pip install --disable-pip-version-check Pillow opencv-python-headless
          cd tools/catalog
          python -m unittest -v \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_row_tokens.py \
            test_nutrition_label_reader_easyocr_zero_glyph.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_nutrition_label_reader.py \
            test_mercadona_ocr_safety_regressions.py
          python -c "import nutrition_label_reader as n; assert n.READER_VERSION == '1.4.11'"

      - name: Install OCR engines after tests pass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8'

      - name: Build exact p9 live validation cohort
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          target_ids = {'10276','14221','2817','60652','69670','69697','69741','69757'}
          control_ids = {'18615','21988'}
          wanted = target_ids | control_ids
          products = [json.loads(x) for x in Path('mercadona-first-party-final/products.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          by_id = {str(r.get('product_id') or ''): r for r in products}
          if not wanted.issubset(by_id):
              raise SystemExit(f'missing inventory IDs: {sorted(wanted-set(by_id))}')
          selected = [by_id[pid] for pid in sorted(wanted)]
          def has_p9(row):
              return any(isinstance(p, dict) and str(p.get('perspective')) == '9' and p.get('zoom') for p in (row.get('photos') or []))
          no_p9 = [str(r.get('product_id')) for r in selected if not has_p9(r)]
          if no_p9:
              raise SystemExit(f'validation p9 boundary drift: {no_p9}')
          priority = [r for r in selected if r.get('ingredients')]
          no_ingredients = [r for r in selected if not r.get('ingredients')]
          def dump(path, data):
              Path(path).write_text(''.join(json.dumps(r, ensure_ascii=False, sort_keys=True)+'\n' for r in data), encoding='utf-8')
          dump('row-token-priority.jsonl', priority)
          dump('row-token-no-ingredients.jsonl', no_ingredients)
          Path('row-token-selection.json').write_text(json.dumps({
              'targets': sorted(target_ids), 'controls': sorted(control_ids),
              'priority_count': len(priority), 'no_ingredients_count': len(no_ingredients),
              'total': len(selected), 'perspective': '9',
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'redistribution_allowed': False, 'CLASSIFIED': 0, 'MENU_ELIGIBLE': 0,
          }, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(f'cohort priority={len(priority)} no_ingredients={len(no_ingredients)}')
          PY

      - name: Reprocess structured-ingredients slice
        working-directory: tools/catalog
        shell: bash
        run: |
          set +e
          python mercadona_neural_ocr_tesseract_preprocess_rescue.py \
            --products row-token-priority.jsonl --out mercadona-row-token-priority \
            --shard-index 0 --shard-count 1 --limit 0 --delay 0.25 --eligibility-mode priority
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi

      - name: Reprocess no-ingredients slice
        working-directory: tools/catalog
        shell: bash
        run: |
          set +e
          python mercadona_neural_ocr_tesseract_preprocess_rescue.py \
            --products row-token-no-ingredients.jsonl --out mercadona-row-token-no-ingredients \
            --shard-index 0 --shard-count 1 --limit 0 --delay 0.25 --eligibility-mode p9-no-ingredients-all
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi

      - name: Audit live result against current evidence
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          paths = [Path('mercadona-row-token-priority/results-00.jsonl'), Path('mercadona-row-token-no-ingredients/results-00.jsonl')]
          rows = [json.loads(x) for p in paths if p.is_file() for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
          by_id = {str(r.get('product_id') or ''): r for r in rows}
          targets = {'10276','14221','2817','60652','69670','69697','69741','69757'}
          controls = {'18615','21988'}
          if set(by_id) != targets | controls or len(rows) != 10:
              raise SystemExit(f'cohort drift rows={len(rows)} ids={sorted(by_id)}')
          expected = {
              '10276': (335,35,3.1,2), '14221': (560,39,40,7), '2817': (211,15,0,19),
              '60652': (186,10,16,7), '69670': (19,.1,3,.9), '69697': (26,.6,2.4,2.1),
              '69741': (26,.3,3.1,1.4), '69757': (24,.3,2.8,1.8),
          }
          fields = ('calories','fat_g','carbohydrate_g','protein_g')
          def close(field,a,b):
              tol = max(5.0,.04*max(abs(a),abs(b),1.0)) if field=='calories' else max(.6,.10*max(abs(a),abs(b),1.0))
              return abs(a-b) <= tol
          provenance=[]; unsafe=[]; drift=[]
          for pid,row in by_id.items():
              if not (row.get('evidence_level')=='OCR_DERIVED_FROM_MERCADONA_IMAGE' and row.get('source')=='MERCADONA_FIRST_PARTY' and row.get('source_record_kind')=='label image' and row.get('redistribution_allowed') is False and str(row.get('perspective'))=='9'):
                  provenance.append(pid)
              if row.get('status') == 'DECLARED':
                  n=row.get('nutrition') or {}
                  accepted=next((a for a in (row.get('attempts') or []) if isinstance(a.get('ensemble'),dict) and a['ensemble'].get('status')=='DECLARED'),None)
                  ens=(accepted or {}).get('ensemble') or {}
                  if row.get('basis') not in {'100_g','100_ml'} or any(n.get(f) is None for f in fields):
                      unsafe.append(f'{pid}:incomplete')
                  if int(ens.get('independent_engine_families') or 0)<2 or int(ens.get('corroborated_fields') or 0)<4:
                      unsafe.append(f'{pid}:corroboration')
                  if pid in expected:
                      for field,want in zip(fields,expected[pid]):
                          if not close(field,float(n[field]),float(want)):
                              drift.append(f'{pid}:{field}:{n[field]}!~{want}')
          declared_targets=sorted(pid for pid in targets if by_id[pid].get('status')=='DECLARED')
          control_promotions=sorted(pid for pid in controls if by_id[pid].get('status')=='DECLARED')
          counts=Counter(str(r.get('status') or 'UNKNOWN') for r in rows)
          image_ext={'.jpg','.jpeg','.png','.webp','.bmp','.tif','.tiff'}
          persisted=[str(p) for root in ('mercadona-row-token-priority','mercadona-row-token-no-ingredients') for p in Path(root).rglob('*') if p.is_file() and p.suffix.lower() in image_ext]
          ok = len(declared_targets)>=5 and not control_promotions and not provenance and not unsafe and not drift and not persisted and set(counts)<={'DECLARED','REVIEW','NO_VISUAL_REGION','ERROR'}
          summary = {
              'processed': len(rows), 'status_counts': dict(sorted(counts.items())),
              'target_declared_product_ids': declared_targets, 'target_declared_count': len(declared_targets),
              'safety_control_promotions': control_promotions, 'provenance_errors': provenance,
              'unsafe_declared': unsafe, 'value_drift': drift,
              'images_persisted': False if not persisted else persisted,
              'missing_values_inferred': False, 'REVIEW_promoted_without_new_live_OCR': 0,
              'nutrition_reader_version': '1.4.11',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'redistribution_allowed': False, 'CLASSIFIED': 0, 'MENU_ELIGIBLE': 0,
              'safety_assessment': 'VALIDATED' if ok else 'FAILED',
          }
          out=Path('row-token-validation'); out.mkdir(exist_ok=True)
          (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (out/'results.jsonl').write_text(''.join(json.dumps(r,ensure_ascii=False,sort_keys=True)+'\n' for r in sorted(rows,key=lambda x:str(x.get('product_id') or ''))),encoding='utf-8')
          (out/'nutrition_label_reader.py').write_text(Path('nutrition_label_reader.py').read_text(encoding='utf-8'),encoding='utf-8')
          (out/'test_nutrition_label_reader_row_tokens.py').write_text(Path('test_nutrition_label_reader_row_tokens.py').read_text(encoding='utf-8'),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          if not ok:
              raise SystemExit('row-token regression safety contract failed')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-ocr-row-token-regression
          path: tools/catalog/row-token-validation/
          retention-days: 30
          if-no-files-found: error
