name: Catalog Mercadona current-image 2-of-4 rescue

# Provenance bridge for the narrow case where a clean canonical REVIEW row refers
# to a label image that Mercadona has since replaced. The new perspective=9 image
# is a new raw-live observation and must satisfy the normal DECLARED contract by
# itself. Historical OCR values from the old image are never fused into it.
on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - 'tools/catalog/mercadona_near_safe_current_image_rescue.py'
      - 'tools/catalog/test_mercadona_near_safe_current_image_rescue.py'
      - '.github/workflows/catalog-mercadona-current-image-two-of-four-rescue.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: catalog-mercadona-current-image-two-of-four-rescue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rescue:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      PADDLE_PDX_MODEL_SOURCE: BOS

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run selection tests first
        working-directory: tools/catalog
        run: |
          python -m unittest -v test_mercadona_near_safe_current_image_rescue.py
          python -m py_compile mercadona_near_safe_current_image_rescue.py

      - name: Resolve latest successful canonical OCR audit
        id: canonical-audit
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            '/repos/frandavid100/rumbo/actions/workflows/catalog-mercadona-current-ocr-residual-audit.yml/runs?branch=agent%2Fcatalog-phase1&per_page=20' \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id')
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo "No successful canonical OCR audit run found" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using canonical audit run $run_id"

      - name: Download latest canonical OCR audit
        uses: actions/download-artifact@v4
        with:
          name: mercadona-current-ocr-residual-audit
          path: tools/catalog/mercadona-current-ocr-residual-audit
          github-token: ${{ github.token }}
          run-id: ${{ steps.canonical-audit.outputs.run_id }}

      - name: Build targeted live rehydration inventory
        id: targets
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          diagnostic_path = Path(
              "mercadona-current-ocr-residual-audit/current-review-failure-modes/near-safe-complete-review.jsonl"
          )
          targets = []
          for line in diagnostic_path.read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              row = json.loads(line)
              values = row.get("diagnostic_candidate_values") or {}
              pid = str(row.get("product_id") or "")
              if (
                  row.get("canonical_status") == "REVIEW"
                  and int(row.get("corroborated_fields") or 0) == 2
                  and int(row.get("independent_engine_families") or 0) >= 2
                  and row.get("basis") in {"100_g", "100_ml"}
                  and all(values.get(field) is not None for field in ("calories", "fat_g", "carbohydrate_g", "protein_g"))
                  and not (row.get("safety_blockers") or [])
                  and pid
                  and row.get("image_url")
              ):
                  targets.append({"product_id": pid})
          targets.sort(key=lambda row: (len(row["product_id"]), row["product_id"]))
          Path("current-image-rescue-live-targets.jsonl").write_text(
              "".join(json.dumps(row, sort_keys=True) + "\n" for row in targets),
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"count={len(targets)}\n")
          print(json.dumps({"target_count": len(targets), "product_ids": [r["product_id"] for r in targets]}, sort_keys=True))
          PY

      - name: Rehydrate current official first-party details
        if: steps.targets.outputs.count != '0'
        working-directory: tools/catalog
        run: |
          set -euo pipefail
          rm -rf mercadona-first-party-current-image-rescue
          python mercadona_first_party_details.py \
            --inventory current-image-rescue-live-targets.jsonl \
            --out mercadona-first-party-current-image-rescue \
            --shard-index 0 \
            --shard-count 1 \
            --timeout 20 \
            --delay 0.2

          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("mercadona-first-party-current-image-rescue/summary-00.json").read_text(encoding="utf-8"))
          errors = [
              json.loads(line)
              for line in Path("mercadona-first-party-current-image-rescue/errors-00.jsonl").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          if errors or summary.get("fetched") != summary.get("requested"):
              raise SystemExit(f"Targeted first-party rehydration incomplete: summary={summary} errors={errors}")
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY

      - name: Select safe replaced-image cohort
        id: selection
        if: steps.targets.outputs.count != '0'
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mercadona-current-image-two-of-four-rescue-input
          python mercadona_near_safe_current_image_rescue.py \
            --diagnostic mercadona-current-ocr-residual-audit/current-review-failure-modes/near-safe-complete-review.jsonl \
            --products mercadona-first-party-current-image-rescue/details-00.jsonl \
            --out mercadona-current-image-two-of-four-rescue-input \
            --corroborated-fields 2 \
            --limit 8
          selected=$(python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("mercadona-current-image-two-of-four-rescue-input/selection-summary.json").read_text(encoding="utf-8"))
          print(int(summary.get("selected") or 0))
          PY
          )
          echo "selected=$selected" >> "$GITHUB_OUTPUT"

      - name: Install OCR engines
        if: steps.selection.outputs.selected != '' && steps.selection.outputs.selected != '0'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check \
            'paddleocr>=3.7,<3.8' \
            'easyocr>=1.7,<1.8' \
            opencv-python-headless Pillow

      - name: Run conservative OCR safety regressions
        if: steps.selection.outputs.selected != '' && steps.selection.outputs.selected != '0'
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_mercadona_near_safe_current_image_rescue.py \
            test_label_easyocr_extractor.py \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_label_reader_row_tokens.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_ocr_safety_regressions.py

      - name: OCR current replacement images as independent raw-live observations
        if: steps.selection.outputs.selected != '' && steps.selection.outputs.selected != '0'
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mercadona-current-image-two-of-four-rescue
          mkdir -p \
            mercadona-current-image-two-of-four-rescue/with-ingredients \
            mercadona-current-image-two-of-four-rescue/without-ingredients

          run_group() {
            local products="$1"
            local out="$2"
            local mode="$3"
            if [[ ! -s "$products" ]]; then
              return 0
            fi
            set +e
            python mercadona_neural_ocr_wave.py \
              --products "$products" \
              --out "$out" \
              --shard-index 0 \
              --shard-count 1 \
              --limit 0 \
              --delay 0.25 \
              --eligibility-mode "$mode"
            rc=$?
            set -e
            if [[ $rc -ne 0 && $rc -ne 2 ]]; then
              return "$rc"
            fi
          }

          run_group \
            mercadona-current-image-two-of-four-rescue-input/with-ingredients.jsonl \
            mercadona-current-image-two-of-four-rescue/with-ingredients \
            priority
          run_group \
            mercadona-current-image-two-of-four-rescue-input/without-ingredients.jsonl \
            mercadona-current-image-two-of-four-rescue/without-ingredients \
            p9-no-ingredients-all

      - name: Validate and stage raw-live result
        if: steps.selection.outputs.selected != '' && steps.selection.outputs.selected != '0'
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from collections import Counter
          import glob
          import json
          from pathlib import Path
          import sqlite3

          CORE = ("calories", "fat_g", "carbohydrate_g", "protein_g")
          input_dir = Path("mercadona-current-image-two-of-four-rescue-input")
          selection = json.loads((input_dir / "selection-summary.json").read_text(encoding="utf-8"))
          meta = {}
          for path in (input_dir / "with-ingredients.jsonl", input_dir / "without-ingredients.jsonl"):
              for line in path.read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  pid = str(row.get("product_id") or "")
                  meta[pid] = row.get("_current_image_rescue_meta") or {}

          rows = []
          seen = set()
          invalid = []
          for result_path in sorted(glob.glob("mercadona-current-image-two-of-four-rescue/**/results-*.jsonl", recursive=True)):
              patched = []
              for line in Path(result_path).read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  pid = str(row.get("product_id") or "")
                  if not pid or pid in seen:
                      raise SystemExit(f"missing/duplicate product in current-image rescue: {pid}")
                  seen.add(pid)
                  image_meta = meta.get(pid)
                  if image_meta is None:
                      raise SystemExit(f"missing current-image rescue metadata for {pid}")
                  current_url = str(image_meta.get("current_image_url") or "")
                  prior_url = str(image_meta.get("canonical_prior_image_url") or "")
                  if not current_url or not prior_url or current_url == prior_url:
                      raise SystemExit(f"invalid current/prior image boundary for {pid}")
                  if str(row.get("image_url") or "") != current_url:
                      raise SystemExit(f"OCR used unexpected current image for {pid}")

                  row["image_index"] = image_meta.get("current_photo_index")
                  row["perspective"] = image_meta.get("current_photo_perspective")
                  row["image_selection_basis"] = (
                      "REPLACED_CANONICAL_IMAGE_ABSENT; EXACTLY_ONE_CURRENT_FIRST_PARTY_PERSPECTIVE_9_IMAGE"
                  )
                  row["canonical_prior_image_url"] = prior_url
                  row["live_detail_source_url"] = image_meta.get("live_detail_source_url")
                  row["live_detail_observed_at"] = image_meta.get("live_detail_observed_at")
                  row["canonical_prior_latest_raw_run_id"] = image_meta.get("canonical_latest_raw_run_id")
                  row["canonical_prior_corroborated_fields"] = image_meta.get("canonical_corroborated_fields")
                  row["canonical_prior_engine_families"] = image_meta.get("canonical_engine_families")
                  row["observation_policy"] = "CURRENT_IMAGE_IS_A_NEW_RAW_LIVE_OBSERVATION"
                  row["cross_image_fusion"] = False
                  row["current_observation_must_satisfy_declared_contract_independently"] = True
                  row["acceptance_policy_changed"] = False

                  if (
                      row.get("source") != "MERCADONA_FIRST_PARTY"
                      or row.get("source_record_kind") != "label image"
                      or row.get("evidence_level") != "OCR_DERIVED_FROM_MERCADONA_IMAGE"
                      or row.get("redistribution_allowed") is not False
                      or str(row.get("perspective") or "") != "9"
                      or not str(row.get("live_detail_source_url") or "").startswith(
                          "https://tienda.mercadona.es/api/v1_1/products/"
                      )
                      or row.get("cross_image_fusion") is not False
                      or row.get("acceptance_policy_changed") is not False
                  ):
                      invalid.append(pid)

                  if row.get("status") == "DECLARED":
                      nutrition = row.get("nutrition") or {}
                      if any(nutrition.get(field) is None for field in CORE):
                          invalid.append(pid)
                      accepted = next(
                          (a for a in (row.get("attempts") or []) if (a.get("ensemble") or {}).get("status") == "DECLARED"),
                          None,
                      )
                      ensemble = (accepted or {}).get("ensemble") or {}
                      if (
                          int(ensemble.get("independent_engine_families") or 0) < 2
                          or int(ensemble.get("corroborated_fields") or 0) < 4
                          or ensemble.get("basis") not in {"100_g", "100_ml"}
                      ):
                          invalid.append(pid)

                  patched.append(row)
                  rows.append(row)
              Path(result_path).write_text(
                  "".join(json.dumps(row, ensure_ascii=False, sort_keys=True) + "\n" for row in patched),
                  encoding="utf-8",
              )

          expected = set(selection.get("selected_product_ids") or [])
          if seen != expected:
              raise SystemExit(f"result coverage mismatch: expected={sorted(expected)} seen={sorted(seen)}")
          if invalid:
              raise SystemExit("unsafe current-image result rows: " + ",".join(sorted(set(invalid))))

          image_ext = {".jpg", ".jpeg", ".png", ".webp", ".bmp", ".tif", ".tiff"}
          persisted_images = [
              str(path)
              for path in Path("mercadona-current-image-two-of-four-rescue").rglob("*")
              if path.is_file() and path.suffix.lower() in image_ext
          ]
          if persisted_images:
              raise SystemExit(f"image bytes persisted: {persisted_images}")

          counts = Counter(str(row.get("status") or "UNKNOWN") for row in rows)
          no_visual_region = sum(int(row.get("visual_regions_detected") or 0) == 0 for row in rows)
          summary = {
              "inventory_products": 4280,
              "canonical_audit_run_id": int("${{ steps.canonical-audit.outputs.run_id }}"),
              "processed": len(rows),
              "distinct_products_processed": len(seen),
              "status_counts": dict(sorted(counts.items())),
              "DECLARED": counts.get("DECLARED", 0),
              "REVIEW": counts.get("REVIEW", 0),
              "NO_VISUAL_REGION": no_visual_region,
              "ERROR": counts.get("ERROR", 0),
              "declared_product_ids": sorted(
                  str(row.get("product_id") or "") for row in rows if row.get("status") == "DECLARED"
              ),
              "review_product_ids": sorted(
                  str(row.get("product_id") or "") for row in rows if row.get("status") == "REVIEW"
              ),
              "selection_policy": selection.get("selection_policy"),
              "observation_policy": "CURRENT_IMAGE_IS_A_NEW_RAW_LIVE_OBSERVATION",
              "cross_image_fusion": False,
              "current_observation_must_satisfy_declared_contract_independently": True,
              "acceptance_policy_changed": False,
              "evidence_level": "OCR_DERIVED_FROM_MERCADONA_IMAGE",
              "source": "MERCADONA_FIRST_PARTY/label image",
              "redistribution_allowed": False,
              "images_persisted": False,
              "missing_values_inferred": False,
              "structured_api_macros_claimed": False,
              "CLASSIFIED": 0,
              "MENU_ELIGIBLE": 0,
          }

          staged = Path("mercadona-current-image-two-of-four-rescue-merged")
          staged.mkdir(exist_ok=True)
          (staged / "results.jsonl").write_text(
              "".join(json.dumps(row, ensure_ascii=False, sort_keys=True) + "\n" for row in rows),
              encoding="utf-8",
          )
          (staged / "summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          (staged / "selection-summary.json").write_text(
              json.dumps(selection, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )

          db = sqlite3.connect(staged / "staging.sqlite")
          try:
              db.execute(
                  """CREATE TABLE ocr_results (
                      product_id TEXT PRIMARY KEY,
                      status TEXT NOT NULL,
                      image_url TEXT NOT NULL,
                      canonical_prior_image_url TEXT NOT NULL,
                      evidence_level TEXT NOT NULL,
                      source TEXT NOT NULL,
                      redistribution_allowed INTEGER NOT NULL,
                      row_json TEXT NOT NULL
                  )"""
              )
              db.executemany(
                  "INSERT INTO ocr_results VALUES (?, ?, ?, ?, ?, ?, ?, ?)",
                  [
                      (
                          str(row.get("product_id") or ""),
                          str(row.get("status") or "UNKNOWN"),
                          str(row.get("image_url") or ""),
                          str(row.get("canonical_prior_image_url") or ""),
                          str(row.get("evidence_level") or ""),
                          "MERCADONA_FIRST_PARTY/label image",
                          0,
                          json.dumps(row, ensure_ascii=False, sort_keys=True),
                      )
                      for row in rows
                  ],
              )
              db.commit()
          finally:
              db.close()

          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Stage no-op result when there are no clean 2-of-4 targets
        if: steps.targets.outputs.count == '0'
        working-directory: tools/catalog
        run: |
          mkdir -p mercadona-current-image-two-of-four-rescue-merged
          printf '' > mercadona-current-image-two-of-four-rescue-merged/results.jsonl
          cat > mercadona-current-image-two-of-four-rescue-merged/summary.json <<'JSON'
          {
            "processed": 0,
            "reason": "NO_CLEAN_CANONICAL_TWO_OF_FOUR_TARGETS",
            "cross_image_fusion": false,
            "images_persisted": false,
            "missing_values_inferred": false,
            "CLASSIFIED": 0,
            "MENU_ELIGIBLE": 0
          }
          JSON

      - name: Stage no-op result when no safe replacement image exists
        if: steps.targets.outputs.count != '0' && steps.selection.outputs.selected == '0'
        working-directory: tools/catalog
        run: |
          mkdir -p mercadona-current-image-two-of-four-rescue-merged
          printf '' > mercadona-current-image-two-of-four-rescue-merged/results.jsonl
          cp mercadona-current-image-two-of-four-rescue-input/selection-summary.json \
            mercadona-current-image-two-of-four-rescue-merged/selection-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          selection = json.loads(
              Path("mercadona-current-image-two-of-four-rescue-input/selection-summary.json").read_text(encoding="utf-8")
          )
          summary = {
              "processed": 0,
              "reason": "NO_SAFE_SINGLE_CURRENT_P9_REPLACEMENT_IMAGE",
              "selection": selection,
              "cross_image_fusion": False,
              "images_persisted": False,
              "missing_values_inferred": False,
              "CLASSIFIED": 0,
              "MENU_ELIGIBLE": 0,
          }
          Path("mercadona-current-image-two-of-four-rescue-merged/summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-current-image-two-of-four-rescue-merged
          path: tools/catalog/mercadona-current-image-two-of-four-rescue-merged/
          retention-days: 90
          if-no-files-found: warn

      - name: Reconcile canonical OCR after new raw-live evidence
        if: steps.selection.outputs.selected != '' && steps.selection.outputs.selected != '0'
        continue-on-error: true
        run: |
          gh workflow run catalog-mercadona-current-ocr-residual-audit.yml \
            --repo frandavid100/rumbo \
            --ref agent/catalog-phase1
