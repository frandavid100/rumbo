name: Catalog Mercadona bounded docTR raw-meat rescue pilot

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-raw-meat-doctr-rescue-pilot.yml'
      - 'tools/catalog/mercadona-raw-meat-pilot-anchors-2026-09-14.json'
      - 'tools/catalog/mercadona_first_party_details.py'
      - 'tools/catalog/mercadona_bounded_doctr_rescue.py'
      - 'tools/catalog/mercadona_near_safe_doctr_retry.py'
      - 'tools/catalog/label_doctr_extractor.py'
      - 'tools/catalog/label_easyocr_extractor.py'
      - 'tools/catalog/nutrition_label_reader.py'
      - 'tools/catalog/nutrition_ocr_ensemble.py'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: catalog-mercadona-raw-meat-doctr-rescue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve latest successful strict historical OCR audit
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            '/repos/frandavid100/rumbo/actions/workflows/catalog-mercadona-current-ocr-residual-audit.yml/runs?branch=agent%2Fcatalog-phase1&per_page=30' \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id')
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo 'No successful strict historical audit found' >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using strict historical audit run $run_id"

      - name: Download strict historical canonical audit
        uses: actions/download-artifact@v4
        with:
          name: mercadona-current-ocr-residual-audit
          path: tools/catalog/raw-meat-doctr-strict-audit
          github-token: ${{ github.token }}
          run-id: ${{ steps.audit.outputs.run_id }}

      - name: Select bounded clean raw-meat rescue target
        id: target
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          target_id = '86395'
          manifest = json.loads(Path('mercadona-raw-meat-pilot-anchors-2026-09-14.json').read_text(encoding='utf-8'))
          anchors = {
              str(row.get('product_id') or ''): row
              for row in manifest.get('anchors') or []
              if str(row.get('product_id') or '')
          }
          source_artifacts = {
              int(row.get('workflow_run_id') or 0): row.get('artifact_sha256')
              for row in manifest.get('source_artifacts') or []
          }
          expected_provenance = {
              33278134827: '131f6f87ac8880a378418fdae51c2ec9e9531c74065fbcfb48660b7769663e7f',
              33282798370: '04be21baca3c89af03f1030a1e6487440fa32a88b99bb29cb1e50a1efdaac8b1',
          }
          if source_artifacts != expected_provenance:
              raise SystemExit(f'raw-meat anchor provenance drifted: {source_artifacts}')
          anchor = anchors.get(target_id)
          if anchor is None:
              raise SystemExit(f'missing raw-meat anchor {target_id}')

          canonical = None
          for line in Path('raw-meat-doctr-strict-audit/canonical-ocr.jsonl').read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              row = json.loads(line)
              if str(row.get('product_id') or '') == target_id:
                  canonical = row
                  break
          if canonical is None:
              raise SystemExit(f'target {target_id} absent from strict historical canonical OCR')

          selected = canonical.get('status') == 'REVIEW'
          selection = {
              'historical_inventory_products': 4280,
              'strict_audit_run_id': '${{ steps.audit.outputs.run_id }}',
              'target_product_id': target_id,
              'target_name': anchor.get('name'),
              'canonical_status': canonical.get('status'),
              'selected': selected,
              'selection_policy': 'BOUNDED_RAW_MEAT_REVIEW_WITH_CLEAN_INCOMPLETE_CURRENT_EXTRACTION; TARGET_86395_ONLY; EXACT_CURRENT_EAN; EXACT_SAME_FIRST_PARTY_PERSPECTIVE_9_IMAGE_URL',
              'rationale': 'Prior current OCR recovered 182 kcal, 8.9 g fat and 0 g carbohydrate with explicit 100 g basis but missed protein; bounded docTR/EasyOCR may add independent evidence without changing acceptance rules.',
              'cross_run_value_fusion': False,
              'current_observation_must_satisfy_declared_contract_independently': True,
              'acceptance_policy_changed': False,
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'redistribution_allowed': False,
              'images_persisted': False,
              'missing_values_inferred': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          Path('raw-meat-doctr-selection-summary.json').write_text(json.dumps(selection, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          if selected:
              Path('raw-meat-doctr-target.jsonl').write_text(json.dumps(anchor, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8')
              Path('raw-meat-doctr-inventory.jsonl').write_text(json.dumps({'product_id': target_id}) + '\n', encoding='utf-8')
          else:
              Path('raw-meat-doctr-target.jsonl').write_text('', encoding='utf-8')
              Path('raw-meat-doctr-inventory.jsonl').write_text('', encoding='utf-8')
          print(json.dumps(selection, ensure_ascii=False, sort_keys=True))
          PY
          selected=$(python - <<'PY'
          import json
          print('1' if json.load(open('raw-meat-doctr-selection-summary.json', encoding='utf-8'))['selected'] else '0')
          PY
          )
          echo "selected=$selected" >> "$GITHUB_OUTPUT"

      - name: Rehydrate current official first-party detail
        if: steps.target.outputs.selected == '1'
        working-directory: tools/catalog
        run: |
          set -euo pipefail
          rm -rf mercadona-first-party-raw-meat-doctr-live
          python mercadona_first_party_details.py \
            --inventory raw-meat-doctr-inventory.jsonl \
            --out mercadona-first-party-raw-meat-doctr-live \
            --shard-index 0 \
            --shard-count 1 \
            --timeout 20 \
            --delay 0.2
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('mercadona-first-party-raw-meat-doctr-live')
          summary = json.loads((root / 'summary-00.json').read_text(encoding='utf-8'))
          errors = [json.loads(line) for line in (root / 'errors-00.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          if errors or summary.get('fetched') != 1 or summary.get('requested') != 1:
              raise SystemExit(f'Targeted first-party rehydration incomplete: summary={summary} errors={errors}')
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY

      - name: Require exact current EAN and exact current first-party perspective=9 image
        id: live
        if: steps.target.outputs.selected == '1'
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mercadona-raw-meat-doctr-input
          mkdir -p mercadona-raw-meat-doctr-input
          python - <<'PY'
          import json
          from pathlib import Path

          anchor = json.loads(Path('raw-meat-doctr-target.jsonl').read_text(encoding='utf-8').strip())
          product = json.loads(next(line for line in Path('mercadona-first-party-raw-meat-doctr-live/details-00.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()))
          pid = str(product.get('product_id') or '').strip()
          if pid != str(anchor.get('product_id') or ''):
              raise SystemExit(f'product identity drift: {pid}')
          anchor_ean = str(anchor.get('ean') or '').strip()
          current_ean = str(product.get('ean') or '').strip()
          if not current_ean or current_ean != anchor_ean:
              raise SystemExit(f'current EAN mismatch for {pid}: anchor={anchor_ean} current={current_ean}')
          anchor_url = str(anchor.get('image_url') or '').strip()
          photos = product.get('photos') if isinstance(product.get('photos'), list) else []
          matches = [
              (idx, photo)
              for idx, photo in enumerate(photos)
              if isinstance(photo, dict)
              and str(photo.get('perspective') or '') == '9'
              and str(photo.get('zoom') or '') == anchor_url
          ]
          if len(matches) != 1:
              raise SystemExit(f'exact perspective=9 image URL mismatch for {pid}: matches={len(matches)}')
          image_index, photo = matches[0]
          candidate = dict(product)
          candidate['photos'] = [dict(photo)]
          candidate['ingredients'] = None
          candidate['_raw_meat_doctr_meta'] = {
              'anchor_ean': anchor_ean,
              'current_ean': current_ean,
              'image_url': anchor_url,
              'image_index': image_index,
              'perspective': 9,
              'source_run_id': anchor.get('source_run_id'),
              'identity_basis': 'EXACT_CURRENT_EAN_MATCH',
              'image_basis': 'EXACT_HISTORICAL_ANCHOR_URL_EQUALS_CURRENT_FIRST_PARTY_PERSPECTIVE_9_URL',
          }
          out = Path('mercadona-raw-meat-doctr-input')
          (out / 'candidate.jsonl').write_text(json.dumps(candidate, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8')
          summary = {
              'historical_inventory_products': 4280,
              'selected': 1,
              'selected_product_ids': [pid],
              'identity_policy': 'EXACT_CURRENT_EAN_MATCH',
              'image_policy': 'EXACT_HISTORICAL_ANCHOR_URL_EQUALS_CURRENT_FIRST_PARTY_PERSPECTIVE_9_URL',
              'cross_run_value_fusion': False,
              'current_observation_must_satisfy_declared_contract_independently': True,
              'acceptance_policy_changed': False,
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'redistribution_allowed': False,
              'images_persisted': False,
              'missing_values_inferred': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          (out / 'live-validation-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY
          echo 'count=1' >> "$GITHUB_OUTPUT"

      - name: Install OCR and detector dependencies
        if: steps.live.outputs.count == '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check \
            'paddleocr>=3.7,<3.8' \
            'easyocr>=1.7,<1.8' \
            'python-doctr==1.1.0' \
            opencv-python-headless Pillow

      - name: Run conservative routing and OCR safety regressions
        if: steps.live.outputs.count == '1'
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_mercadona_bounded_doctr_rescue.py \
            test_mercadona_near_safe_doctr_retry.py \
            test_label_doctr_extractor.py \
            test_label_easyocr_extractor.py \
            test_mercadona_ocr_safety_regressions.py \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_label_reader_row_tokens.py \
            test_nutrition_ocr_ensemble.py \
            test_label_image_preprocess.py

      - name: Run bounded docTR then EasyOCR rescue under unchanged acceptance contract
        if: steps.live.outputs.count == '1'
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mercadona-raw-meat-doctr-rescue-pilot
          set +e
          python mercadona_bounded_doctr_rescue.py \
            --products mercadona-raw-meat-doctr-input/candidate.jsonl \
            --out mercadona-raw-meat-doctr-rescue-pilot \
            --shard-index 0 \
            --shard-count 1 \
            --limit 0 \
            --eligibility-mode p9-no-ingredients-all
          rc=$?
          set -e
          if [[ $rc -ne 0 && $rc -ne 2 ]]; then
            exit "$rc"
          fi

      - name: Persist auditable merged JSONL and SQLite staging
        if: steps.live.outputs.count == '1'
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from collections import Counter
          import json
          import sqlite3
          from pathlib import Path

          src = Path('mercadona-raw-meat-doctr-rescue-pilot/results-00.jsonl')
          rows = [json.loads(line) for line in src.read_text(encoding='utf-8').splitlines() if line.strip()]
          if len(rows) != 1 or str(rows[0].get('product_id') or '') != '86395':
              raise SystemExit(f'unexpected bounded pilot results: {[str(r.get("product_id") or "") for r in rows]}')
          candidate = json.loads(Path('mercadona-raw-meat-doctr-input/candidate.jsonl').read_text(encoding='utf-8').strip())
          meta = candidate.get('_raw_meat_doctr_meta') or {}
          row = rows[0]
          if str(row.get('ean') or '') != str(meta.get('current_ean') or ''):
              raise SystemExit('OCR result EAN differs from exact live-validated EAN')
          if str(row.get('image_url') or '') != str(meta.get('image_url') or ''):
              raise SystemExit('OCR result image differs from exact live-validated perspective=9 image')
          row['image_index'] = meta.get('image_index')
          row['perspective'] = 9
          row['image_selection_basis'] = meta.get('image_basis')
          row['cross_run_value_fusion'] = False
          row['current_observation_must_satisfy_declared_contract_independently'] = True
          row['acceptance_policy_changed'] = False

          provenance_errors = []
          if row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE':
              provenance_errors.append('evidence_level')
          if row.get('source') != 'MERCADONA_FIRST_PARTY' or row.get('source_record_kind') != 'label image':
              provenance_errors.append('source')
          if row.get('redistribution_allowed') is not False:
              provenance_errors.append('redistribution_allowed')
          if provenance_errors:
              raise SystemExit(f'provenance contract violated: {provenance_errors}')

          declared_attempt = next((a for a in row.get('attempts', []) if (a.get('ensemble') or {}).get('status') == 'DECLARED'), None)
          if row.get('status') == 'DECLARED':
              if declared_attempt is None:
                  raise SystemExit('DECLARED row has no independently DECLARED current attempt')
              ensemble = declared_attempt.get('ensemble') or {}
              nutrition = ensemble.get('nutrition') or {}
              core = ('calories', 'fat_g', 'carbohydrate_g', 'protein_g')
              if ensemble.get('basis') not in {'100_g', '100_ml'}:
                  raise SystemExit('DECLARED row lacks explicit per-100 basis')
              if int(ensemble.get('independent_engine_families') or 0) < 2 or int(ensemble.get('corroborated_fields') or 0) != 4:
                  raise SystemExit('DECLARED row does not satisfy unchanged independent-family corroboration contract')
              if any(nutrition.get(field) is None for field in core):
                  raise SystemExit('DECLARED row is missing a core macro')
              hard_prefixes = (
                  'OCR_FIELD_CONFLICT', 'OCR_SAME_ENGINE_CONFLICT', 'OCR_BASIS_CONFLICT',
                  'ENERGY_MACRO_MISMATCH', 'MULTIPLE_NUTRITION_COLUMNS', 'IMPOSSIBLE_',
              )
              reasons = [str(reason) for reason in ensemble.get('reasons') or []]
              if bool(ensemble.get('values_conflict')) or any(reason.startswith(prefix) for reason in reasons for prefix in hard_prefixes):
                  raise SystemExit(f'DECLARED row contains hard safety blocker: {reasons}')

          out = Path('mercadona-raw-meat-doctr-rescue-pilot/merged')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'results-merged.jsonl').write_text(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8')
          selection = json.loads(Path('raw-meat-doctr-selection-summary.json').read_text(encoding='utf-8'))
          live = json.loads(Path('mercadona-raw-meat-doctr-input/live-validation-summary.json').read_text(encoding='utf-8'))
          (out / 'selection-summary.json').write_text(json.dumps({'selection': selection, 'live_validation': live}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          counts = Counter([str(row.get('status') or 'UNKNOWN')])
          summary = {
              'inventory_products': 4280,
              'processed': 1,
              'status_counts': dict(counts),
              'declared': counts.get('DECLARED', 0),
              'review': counts.get('REVIEW', 0),
              'error': counts.get('ERROR', 0),
              'no_visual_region': int(row.get('visual_regions_detected') == 0),
              'declared_product_ids': ['86395'] if row.get('status') == 'DECLARED' else [],
              'selection': selection,
              'live_validation': live,
              'cross_run_value_fusion': False,
              'acceptance_policy_changed': False,
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'redistribution_allowed': False,
              'images_persisted': False,
              'missing_values_inferred': False,
              'structured_api_macros_claimed': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          (out / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          ensemble = (declared_attempt or {}).get('ensemble') or {}
          nutrition = (ensemble.get('nutrition') or {}) if row.get('status') == 'DECLARED' else {}
          db = sqlite3.connect(out / 'staging.sqlite')
          db.execute('''
              CREATE TABLE mercadona_ocr_staging (
                  product_id TEXT PRIMARY KEY, product_name TEXT, status TEXT NOT NULL, basis TEXT,
                  calories REAL, fat_g REAL, carbohydrate_g REAL, protein_g REAL, image_url TEXT,
                  evidence_level TEXT NOT NULL, source TEXT NOT NULL, source_record_kind TEXT NOT NULL,
                  redistribution_allowed INTEGER NOT NULL, parser_engine TEXT, observed_at TEXT, raw_json TEXT NOT NULL
              )
          ''')
          db.execute(
              'INSERT INTO mercadona_ocr_staging VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)',
              (
                  str(row.get('product_id')), row.get('product_name') or row.get('name'), row.get('status'),
                  ensemble.get('basis') if row.get('status') == 'DECLARED' else None,
                  nutrition.get('calories'), nutrition.get('fat_g'), nutrition.get('carbohydrate_g'), nutrition.get('protein_g'),
                  row.get('image_url'), row.get('evidence_level'), row.get('source'), row.get('source_record_kind'), 0,
                  row.get('parser_engine') or row.get('engine') or row.get('ocr_engine'),
                  row.get('observed_at') or row.get('fetched_at') or row.get('created_at'),
                  json.dumps(row, ensure_ascii=False, sort_keys=True),
              ),
          )
          db.commit()
          db.close()

          forbidden = [
              str(path) for path in out.rglob('*')
              if path.is_file() and path.suffix.lower() in {'.jpg', '.jpeg', '.png', '.webp', '.avif', '.gif'}
          ]
          if forbidden:
              raise SystemExit(f'image files must not be persisted: {forbidden}')
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: steps.live.outputs.count == '1'
        with:
          name: mercadona-raw-meat-doctr-rescue-pilot-merged
          path: tools/catalog/mercadona-raw-meat-doctr-rescue-pilot/merged/
          retention-days: 90
          if-no-files-found: error

      - name: Reconcile strict historical canonical OCR after pilot evidence
        if: steps.live.outputs.count == '1'
        run: |
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            '/repos/frandavid100/rumbo/actions/workflows/catalog-mercadona-current-ocr-residual-audit.yml/dispatches' \
            -f ref='agent/catalog-phase1'
