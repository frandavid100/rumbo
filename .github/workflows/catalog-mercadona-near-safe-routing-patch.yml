name: Catalog Mercadona near-safe routing patch

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-near-safe-routing-patch.yml'

permissions:
  actions: write
  contents: write

jobs:
  patch-and-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal test dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Run existing bounded-rescue routing regressions first
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_mercadona_bounded_doctr_rescue.py \
            test_mercadona_near_safe_doctr_retry.py \
            test_mercadona_ocr_safety_regressions.py \
            test_nutrition_ocr_ensemble.py

      - name: Widen only historical target routing from exactly 3-of-4 to 2-or-3-of-4
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/catalog-mercadona-near-safe-fourth-family-pilot.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'Select clean complete 3-of-4 REVIEW targets already carrying at least three OCR families':
                  'Select clean complete 2-or-3-of-4 REVIEW targets already carrying at least three OCR families',
              "and int(row.get('corroborated_fields') or 0) == 3":
                  "and 2 <= int(row.get('corroborated_fields') or 0) <= 3",
              'STRICT_HISTORICAL_CANONICAL_CLEAN_COMPLETE_3_OF_4_REVIEW_WITH_AT_LEAST_THREE_OCR_FAMILIES':
                  'STRICT_HISTORICAL_CANONICAL_CLEAN_COMPLETE_2_OR_3_OF_4_REVIEW_WITH_AT_LEAST_THREE_OCR_FAMILIES',
              "or row.get('pilot_canonical_corroborated_fields') != 3":
                  "or int(row.get('pilot_canonical_corroborated_fields') or 0) not in {2, 3}",
          }
          for old, new in replacements.items():
              count = text.count(old)
              expected = 2 if old.startswith('STRICT_HISTORICAL_') else 1
              if count != expected:
                  raise SystemExit(f'fail-closed patch mismatch for {old!r}: expected {expected}, found {count}')
              text = text.replace(old, new)
          if "2 <= int(row.get('corroborated_fields') or 0) <= 3" not in text:
              raise SystemExit('routing patch did not materialize')
          if "int(row.get('pilot_canonical_corroborated_fields') or 0) not in {2, 3}" not in text:
              raise SystemExit('quality gate patch did not materialize')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Persist patch and remove one-shot patch workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/catalog-mercadona-near-safe-routing-patch.yml
          git add .github/workflows/catalog-mercadona-near-safe-fourth-family-pilot.yml
          git diff --cached --check
          git commit -m 'catalog: widen Mercadona near-safe fourth-family routing'
          git push origin HEAD:agent/catalog-phase1

      - name: Dispatch patched bounded pilot
        run: |
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            '/repos/frandavid100/rumbo/actions/workflows/catalog-mercadona-near-safe-fourth-family-pilot.yml/dispatches' \
            -f ref='agent/catalog-phase1'
