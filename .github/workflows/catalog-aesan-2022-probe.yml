name: Catalog AESAN 2022 historical match probe

on:
  workflow_dispatch:
  push:
    branches:
      - agent/catalog-phase1
    paths:
      - '.github/workflows/catalog-aesan-2022-probe.yml'
      - 'tools/catalog/aesan_2022_match_probe.py'
      - 'tools/catalog/test_aesan_2022_match_probe.py'

jobs:
  probe-aesan-2022:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl xlrd pytest requests opencv-python-headless

      - name: Test matcher helpers
        working-directory: tools/catalog
        run: pytest -q test_aesan_2022_match_probe.py

      - name: Probe official workbook URL
        run: |
          curl -sSIL --retry 3 --retry-all-errors --max-redirs 5 \
            https://www.aesan.gob.es/AECOSAN/docs/documentos/seguridad_alimentaria/bases_datos/BasedatosWeb.xlsx \
            | grep -iE '^(HTTP/|content-type:|content-length:|last-modified:)' || true

      - name: Run AESAN 2022 probe
        working-directory: tools/catalog
        env:
          AESAN_2022_EXCEL_URL: https://www.aesan.gob.es/AECOSAN/docs/documentos/seguridad_alimentaria/bases_datos/BasedatosWeb.xlsx
        run: python aesan_2022_match_probe.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: catalog-aesan-2022-probe-report
          path: tools/catalog/aesan-2022-probe-output/
          if-no-files-found: error
