name: Catalog AESAN 2022 historical match probe

on:
  workflow_dispatch:
  push:
    branches:
      - agent/catalog-phase1
    paths:
      - '.github/workflows/catalog-aesan-2022-probe.yml'
      - 'tools/catalog/aesan_2022_match_probe.py'
      - 'tools/catalog/test_aesan_2022_match_probe.py'

jobs:
  probe-aesan-2022:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl xlrd pytest requests opencv-python-headless

      - name: Test matcher helpers
        working-directory: tools/catalog
        run: pytest -q test_aesan_2022_match_probe.py

      - name: Run AESAN 2022 probe
        working-directory: tools/catalog
        env:
          AESAN_2022_PAGE_URL: https://www.aesan.gob.es/AECOSAN/web/datos_abiertos/bases_datos_AESAN.htm
        run: |
          sed -i 's#https://www.aesan.gob.es/AECOSAN/web/seguridad_alimentaria/subseccion/alimentosBebidas.htm#${{ env.AESAN_2022_PAGE_URL }}#' aesan_2022_match_probe.py
          sed -i 's#RumboCatalogProbe/1.0 (+https://github.com/frandavid100/rumbo)#Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36#' aesan_2022_match_probe.py
          python aesan_2022_match_probe.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: catalog-aesan-2022-probe-report
          path: tools/catalog/aesan-2022-probe-output/
          if-no-files-found: error
