name: Catalog AESAN 2022 historical match probe

on:
  workflow_dispatch:
  push:
    branches:
      - agent/catalog-phase1
    paths:
      - '.github/workflows/catalog-aesan-2022-probe.yml'
      - 'tools/catalog/aesan_2022_match_probe.py'
      - 'tools/catalog/test_aesan_2022_match_probe.py'

jobs:
  probe-aesan-2022:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl xlrd pytest requests opencv-python-headless

      - name: Test matcher helpers
        working-directory: tools/catalog
        run: pytest -q test_aesan_2022_match_probe.py

      - name: Resolve archived official workbook
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL='https://www.aesan.gob.es/AECOSAN/docs/documentos/seguridad_alimentaria/bases_datos/BasedatosWeb.xlsx'
          CDX="https://web.archive.org/cdx/search/cdx?url=${ORIGINAL}&output=json&fl=timestamp,original,statuscode,mimetype&filter=statuscode:200&collapse=digest&from=2022&to=2026"
          curl -fsSL --retry 3 --retry-all-errors "$CDX" -o /tmp/cdx.json
          TS=$(python -c "import json; r=json.load(open('/tmp/cdx.json')); print(r[-1][0] if len(r)>1 else '')")
          if [ -z "$TS" ]; then
            echo 'No archived workbook snapshot found' >&2
            exit 2
          fi
          ARCHIVE="https://web.archive.org/web/${TS}id_/${ORIGINAL}"
          echo "archive_url=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "archive_timestamp=$TS" >> "$GITHUB_OUTPUT"
          echo "Using archived official AESAN workbook snapshot: $TS"

      - name: Run AESAN 2022 probe
        working-directory: tools/catalog
        env:
          AESAN_2022_EXCEL_URL: ${{ steps.archive.outputs.archive_url }}
        run: |
          python -c "p='aesan_2022_match_probe.py'; s=open(p, encoding='utf-8').read(); s=s.replace('return pd.concat(frames, ignore_index=True, sort=False), diagnostics', 'return frames[-1], diagnostics'); open(p,'w',encoding='utf-8').write(s)"
          python aesan_2022_match_probe.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: catalog-aesan-2022-probe-report
          path: tools/catalog/aesan-2022-probe-output/
          if-no-files-found: error
