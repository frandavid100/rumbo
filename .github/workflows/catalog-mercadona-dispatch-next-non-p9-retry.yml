name: Dispatch next Mercadona exact-current non-P9 retry

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-dispatch-next-non-p9-retry.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch bounded exact-current non-P9 retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run catalog-mercadona-current-unique-non-p9-safe-canary.yml --repo frandavid100/rumbo --ref agent/catalog-phase1
