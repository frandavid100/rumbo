name: Catalog one-shot fix REVIEW replay checkout pin

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-fix-review-replay-checkout-pin.yml'

permissions:
  actions: write
  contents: write

jobs:
  patch-and-relaunch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Pin REVIEW replay jobs to the triggering SHA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/catalog-mercadona-review-replay-pilot.yml')
          text = path.read_text(encoding='utf-8')
          old = '          ref: agent/catalog-phase1'
          replacement = '          ref: $' + '{{ github.sha }}'
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'Expected exactly 3 branch-floating checkouts, found {count}')
          updated = text.replace(old, replacement)
          if updated.count(replacement) != 3:
              raise SystemExit('Pinned checkout count mismatch after replacement')
          path.write_text(updated, encoding='utf-8')
          PY
          git diff --check
          git diff -- .github/workflows/catalog-mercadona-review-replay-pilot.yml

      - name: Commit auditability fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/catalog-mercadona-review-replay-pilot.yml
          git diff --cached --quiet && { echo 'No change to commit' >&2; exit 1; }
          git commit -m 'fix(catalog): pin Mercadona REVIEW replay to trigger SHA'
          git push origin HEAD:agent/catalog-phase1

      - name: Relaunch deterministic REVIEW replay
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run catalog-mercadona-review-replay-pilot.yml \
            --repo frandavid100/rumbo \
            --ref agent/catalog-phase1
