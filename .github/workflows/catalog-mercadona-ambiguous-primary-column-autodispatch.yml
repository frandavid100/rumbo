name: Catalog Mercadona targeted autodispatch

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-ambiguous-primary-column-autodispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch bounded 64705 ambiguous-column rescue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run catalog-mercadona-64705-ambiguous-primary-column-rescue.yml \
            --repo frandavid100/rumbo \
            --ref agent/catalog-phase1
