name: Catalog Mercadona targeted autodispatch

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-ambiguous-primary-column-autodispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch strict current 3-of-4 docTR revalidation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run catalog-mercadona-current-three-of-four-doctr-revalidation.yml \
            --repo frandavid100/rumbo \
            --ref agent/catalog-phase1
