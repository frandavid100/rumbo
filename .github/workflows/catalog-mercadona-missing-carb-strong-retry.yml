name: Catalog Mercadona missing-carb strong retry

# Bounded follow-up after the balanced missing-one-core pilot and the fat/protein
# scale. This deliberately targets only the strongest still-untried carbohydrate
# residuals, ranking OCR evidence quality ahead of ingredient availability. It
# changes routing only: acceptance still requires one fresh observation of the
# exact current first-party perspective=9 image to recover all four core macros,
# explicit 100 g/100 ml basis, energy coherence and independent OCR corroboration.
on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-missing-carb-strong-retry.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: catalog-mercadona-missing-carb-strong-retry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rescue:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download latest canonical OCR audit
        id: canonical
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api \
            '/repos/frandavid100/rumbo/actions/workflows/catalog-mercadona-current-ocr-residual-audit.yml/runs?branch=agent%2Fcatalog-phase1&per_page=20' \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id')
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/audit
          gh run download "$run_id" -n mercadona-current-ocr-residual-audit -D /tmp/audit

      - name: Download balanced-pilot selection to exclude prior attempts
        id: prior
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api \
            '/repos/frandavid100/rumbo/actions/workflows/catalog-mercadona-current-three-of-four-live-verified-variants.yml/runs?branch=agent%2Fcatalog-phase1&per_page=20' \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id')
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/prior
          gh run download "$run_id" -n mercadona-current-three-of-four-live-verified-variants -D /tmp/prior

      - name: Build exact-EAN exact-image strong missing-carb cohort
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from mercadona_first_party_details import _get_json, normalize, _now

          CORE = ('calories', 'fat_g', 'carbohydrate_g', 'protein_g')
          diagnostic = Path('/tmp/audit/current-review-failure-modes/three-of-four-explicit-basis-unblocked-review.jsonl')
          prior_attempted = set()
          prior_summary = Path('/tmp/prior/selection-summary.json')
          if prior_summary.exists():
              prior = json.loads(prior_summary.read_text(encoding='utf-8'))
              prior_attempted.update(str(x) for x in prior.get('pilot_selected_product_ids', []))

          candidates = []
          excluded_prior = []
          for line in diagnostic.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              row = json.loads(line)
              values = row.get('diagnostic_candidate_values') or {}
              missing = [field for field in CORE if values.get(field) is None]
              pid = str(row.get('product_id') or '')
              safe = (
                  row.get('canonical_status') == 'REVIEW'
                  and row.get('basis') in {'100_g', '100_ml'}
                  and not (row.get('safety_blockers') or [])
                  and missing == ['carbohydrate_g']
                  and row.get('missing_core_fields') == missing
                  and len([field for field in CORE if values.get(field) is not None]) == 3
                  and int(row.get('independent_engine_families') or 0) >= 2
                  and int(row.get('corroborated_fields') or 0) >= 2
                  and pid and str(row.get('ean') or '') and str(row.get('image_url') or '')
              )
              if not safe:
                  continue
              if pid in prior_attempted:
                  excluded_prior.append(pid)
                  continue
              candidates.append(row)

          verified = []
          identity_mismatches = []
          no_exact_current_p9_match = []
          live_errors = []
          for old in candidates:
              pid = str(old['product_id'])
              canonical_ean = str(old['ean']).strip()
              image_url = str(old['image_url'])
              observed_at = _now()
              try:
                  payload, source_url = _get_json(pid, timeout=20.0)
                  current = normalize(payload, source_url=source_url, observed_at=observed_at)
              except Exception as exc:
                  live_errors.append({'product_id': pid, 'error': f'{type(exc).__name__}:{exc}'})
                  continue
              current_ean = str(current.get('ean') or '').strip()
              if not current_ean or current_ean != canonical_ean:
                  identity_mismatches.append({'product_id': pid, 'canonical_ean': canonical_ean, 'current_ean': current_ean})
                  continue
              photos = current.get('photos') if isinstance(current.get('photos'), list) else []
              match = next(((i, p) for i, p in enumerate(photos)
                            if isinstance(p, dict)
                            and str(p.get('perspective') or '') == '9'
                            and str(p.get('zoom') or '') == image_url), None)
              if match is None:
                  no_exact_current_p9_match.append(pid)
                  continue
              image_index, photo = match
              routed = dict(photo)
              routed['perspective'] = 9
              current = dict(current)
              current['photos'] = [routed]
              current['_retry_meta'] = {
                  'image_url': image_url,
                  'current_photo_index': image_index,
                  'current_photo_perspective': photo.get('perspective'),
                  'canonical_ean': canonical_ean,
                  'current_ean': current_ean,
                  'identity_basis': 'EXACT_NONEMPTY_CANONICAL_EAN_EQUALS_CURRENT_FIRST_PARTY_EAN',
                  'live_detail_source_url': source_url,
                  'live_detail_observed_at': observed_at,
                  'historical_missing_core_fields': old.get('missing_core_fields'),
                  'historical_corroborated_fields': old.get('corroborated_fields'),
                  'historical_engine_families': old.get('independent_engine_families'),
                  'historical_partial_values_diagnostic_only': old.get('diagnostic_candidate_values'),
              }
              verified.append(current)

          # Evidence quality first. The prior balanced pilot ranked structured
          # ingredients first and therefore did not exercise the strongest 3-family
          # bread/cracker rows. Ingredients are only a final routing tiebreaker.
          verified.sort(key=lambda row: (
              -int(row['_retry_meta'].get('historical_engine_families') or 0),
              -int(row['_retry_meta'].get('historical_corroborated_fields') or 0),
              0 if row.get('ingredients') else 1,
              str(row.get('product_id') or ''),
          ))
          selected = verified[:8]
          with_i = [row for row in selected if row.get('ingredients')]
          without_i = [row for row in selected if not row.get('ingredients')]

          def write(path, rows):
              Path(path).write_text(''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in rows), encoding='utf-8')
          write('missing-carb-with-ingredients.jsonl', with_i)
          write('missing-carb-without-ingredients.jsonl', without_i)

          root = Path('mercadona-current-three-of-four-live-verified-variants')
          root.mkdir(exist_ok=True)
          summary = {
              'canonical_audit_run_id': int('${{ steps.canonical.outputs.run_id }}'),
              'prior_balanced_pilot_run_id': int('${{ steps.prior.outputs.run_id }}'),
              'target_missing_field': 'carbohydrate_g',
              'safe_untried_candidates': len(candidates),
              'excluded_prior_attempted_product_ids': sorted(excluded_prior),
              'live_verified_exact_ean_exact_p9': len(verified),
              'identity_mismatches': identity_mismatches,
              'no_exact_current_p9_match': no_exact_current_p9_match,
              'live_errors': live_errors,
              'selected': len(selected),
              'selected_product_ids': [str(row.get('product_id')) for row in selected],
              'selected_historical_engine_family_counts': dict(sorted(Counter(int(row['_retry_meta'].get('historical_engine_families') or 0) for row in selected).items())),
              'with_structured_ingredients': len(with_i),
              'without_structured_ingredients': len(without_i),
              'selection_policy': 'CURRENT_REVIEW_EXACTLY_3_OBSERVED_CORE; MISSING_CARBOHYDRATE_G; EXPLICIT_100G_100ML; NO_HARD_BLOCKER; >=2_HISTORICAL_FAMILIES; >=2_CORROBORATED; PRIOR_BALANCED_PILOT_ATTEMPTS_EXCLUDED; EVIDENCE_QUALITY_RANKED_BEFORE_INGREDIENTS; EXACT_EAN; EXACT_CURRENT_FIRST_PARTY_P9_IMAGE',
              'historical_partial_values_usable': False,
              'cross_run_value_fusion': False,
              'fresh_observation_must_recover_all_four': True,
              'acceptance_policy_changed': False,
              'images_persisted': False,
              'missing_values_inferred': False,
          }
          (root / 'selection-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if not selected:
              raise SystemExit('No safe exact-current-p9 strong missing-carb target remains')
          PY

      - name: Install OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow

      - name: Run conservative rescue tests first
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_mercadona_preselected_three_of_four_variant_rescue.py \
            test_mercadona_near_safe_variant_rescue.py \
            test_mercadona_ocr_safety_regressions.py \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_label_reader_row_tokens.py \
            test_nutrition_ocr_ensemble.py \
            test_label_image_preprocess.py

      - name: OCR fresh cohort with bounded temporary variants
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          root=mercadona-current-three-of-four-live-verified-variants
          mkdir -p "$root/with-ingredients" "$root/without-ingredients"
          run_group() {
            local products="$1" out="$2" mode="$3"
            [[ -s "$products" ]] || return 0
            set +e
            python mercadona_preselected_three_of_four_variant_rescue.py \
              --products "$products" --out "$out" --shard-index 0 --shard-count 1 --limit 0 --eligibility-mode "$mode"
            rc=$?
            set -e
            [[ $rc -eq 0 || $rc -eq 2 ]]
          }
          run_group missing-carb-with-ingredients.jsonl "$root/with-ingredients" priority
          run_group missing-carb-without-ingredients.jsonl "$root/without-ingredients" p9-no-ingredients-all

      - name: Validate and persist auditable results
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, json, sqlite3
          from collections import Counter
          from pathlib import Path
          CORE = ('calories', 'fat_g', 'carbohydrate_g', 'protein_g')
          root = Path('mercadona-current-three-of-four-live-verified-variants')
          meta = {}
          for source in ('missing-carb-with-ingredients.jsonl', 'missing-carb-without-ingredients.jsonl'):
              for line in Path(source).read_text(encoding='utf-8').splitlines():
                  if line.strip():
                      row = json.loads(line)
                      meta[str(row['product_id'])] = row['_retry_meta']

          rows = []
          for result_path in glob.glob(str(root / '**/results-*.jsonl'), recursive=True):
              patched = []
              for line in Path(result_path).read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  pid = str(row.get('product_id') or '')
                  m = meta.get(pid)
                  if m is None:
                      raise SystemExit(f'missing selection metadata for {pid}')
                  if str(row.get('image_url') or '') != str(m.get('image_url') or ''):
                      raise SystemExit(f'unexpected image for {pid}')
                  if str(m.get('current_photo_perspective') or '') != '9':
                      raise SystemExit(f'non-p9 source for {pid}')
                  row.update({
                      'image_index': m.get('current_photo_index'),
                      'perspective': 9,
                      'image_selection_basis': 'EXACT_HISTORICAL_REVIEW_IMAGE_URL_MATCHED_CURRENT_MERCADONA_API_PERSPECTIVE_9',
                      'identity_basis': m.get('identity_basis'),
                      'canonical_ean': m.get('canonical_ean'),
                      'current_ean': m.get('current_ean'),
                      'live_detail_source_url': m.get('live_detail_source_url'),
                      'live_detail_observed_at': m.get('live_detail_observed_at'),
                      'pilot_historical_missing_core_fields': m.get('historical_missing_core_fields'),
                      'pilot_historical_corroborated_fields': m.get('historical_corroborated_fields'),
                      'pilot_historical_engine_families': m.get('historical_engine_families'),
                      'cross_run_value_fusion': False,
                      'historical_partial_values_usable': False,
                      'current_observation_must_satisfy_declared_contract_independently': True,
                      'acceptance_policy_changed': False,
                      'missing_values_inferred': False,
                  })
                  if row.get('canonical_ean') != row.get('current_ean') or row.get('identity_basis') != 'EXACT_NONEMPTY_CANONICAL_EAN_EQUALS_CURRENT_FIRST_PARTY_EAN':
                      raise SystemExit(f'identity verification failed for {pid}')
                  if row.get('status') == 'DECLARED':
                      nutrition = row.get('nutrition') or {}
                      if row.get('basis') not in {'100_g', '100_ml'} or any(nutrition.get(field) is None for field in CORE):
                          raise SystemExit(f'incomplete DECLARED row {pid}')
                      ensemble = next(((a.get('ensemble') or {}) for a in row.get('attempts', []) if (a.get('ensemble') or {}).get('status') == 'DECLARED'), {})
                      if int(ensemble.get('independent_engine_families') or 0) < 2 or int(ensemble.get('corroborated_fields') or 0) < 4:
                          raise SystemExit(f'uncorroborated DECLARED row {pid}')
                  patched.append(row)
                  rows.append(row)
              Path(result_path).write_text(''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in patched), encoding='utf-8')
          if not rows:
              raise SystemExit('No OCR rows produced')

          counts = Counter(str(row.get('status') or 'UNKNOWN') for row in rows)
          selection = json.loads((root / 'selection-summary.json').read_text(encoding='utf-8'))
          summary = {
              'inventory_products': 4280,
              'processed': len(rows),
              'status_counts': dict(sorted(counts.items())),
              'declared_product_ids': [str(row['product_id']) for row in rows if row.get('status') == 'DECLARED'],
              'selection': selection,
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'redistribution_allowed': False,
              'acceptance_policy_changed': False,
              'cross_run_value_fusion': False,
              'historical_partial_values_usable': False,
              'fresh_observation_must_recover_all_four': True,
              'images_persisted': False,
              'missing_values_inferred': False,
              'classified': 0,
              'menu_eligible': 0,
          }
          (root / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (root / 'results-merged.jsonl').write_text(''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in rows), encoding='utf-8')

          db = sqlite3.connect(root / 'staging.sqlite')
          db.execute('CREATE TABLE ocr_results (product_id TEXT PRIMARY KEY, status TEXT NOT NULL, basis TEXT, calories REAL, fat_g REAL, carbohydrate_g REAL, protein_g REAL, evidence_level TEXT NOT NULL, source TEXT NOT NULL, image_url TEXT NOT NULL, canonical_ean TEXT NOT NULL, current_ean TEXT NOT NULL, redistribution_allowed INTEGER NOT NULL, raw_json TEXT NOT NULL)')
          for row in rows:
              n = row.get('nutrition') or {}
              db.execute('INSERT INTO ocr_results VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?)', (
                  str(row.get('product_id') or ''), str(row.get('status') or ''), row.get('basis'), n.get('calories'), n.get('fat_g'), n.get('carbohydrate_g'), n.get('protein_g'), str(row.get('evidence_level') or ''), 'MERCADONA_FIRST_PARTY/label image', str(row.get('image_url') or ''), str(row.get('canonical_ean') or ''), str(row.get('current_ean') or ''), 0, json.dumps(row, ensure_ascii=False, sort_keys=True)))
          db.commit(); db.close()
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-current-three-of-four-live-verified-variants
          path: tools/catalog/mercadona-current-three-of-four-live-verified-variants/
          retention-days: 90
          if-no-files-found: error

      - name: Reconcile canonical OCR after successful retry
        if: success()
        run: gh workflow run catalog-mercadona-current-ocr-residual-audit.yml --ref agent/catalog-phase1
