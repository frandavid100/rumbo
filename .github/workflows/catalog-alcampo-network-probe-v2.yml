name: Catalog Alcampo network probe v2

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - 'tools/catalog/alcampo_network_probe_v2.py'
      - '.github/workflows/catalog-alcampo-network-probe-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - name: Probe Alcampo API payloads
        working-directory: tools/catalog
        run: python alcampo_network_probe_v2.py
      - name: Persist API diagnostics
        if: always()
        run: |
          if [ -f tools/catalog/alcampo-network-probe-v2/summary.json ]; then
            cp tools/catalog/alcampo-network-probe-v2/summary.json tools/catalog/fixtures/alcampo_network_probe_v2_latest.json
          fi
          if [ -f tools/catalog/alcampo-network-probe-v2/recipes.json ]; then
            cp tools/catalog/alcampo-network-probe-v2/recipes.json tools/catalog/fixtures/alcampo_network_recipes_v2_latest.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/catalog/fixtures/alcampo_network_probe_v2_latest.json tools/catalog/fixtures/alcampo_network_recipes_v2_latest.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "catalog: persist Alcampo API payload probe v2"
            git pull --rebase origin agent/catalog-phase1
            git push origin HEAD:agent/catalog-phase1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alcampo-network-probe-v2
          path: tools/catalog/alcampo-network-probe-v2/
          retention-days: 7
