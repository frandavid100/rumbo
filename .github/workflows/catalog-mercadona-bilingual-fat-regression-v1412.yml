name: Catalog Mercadona bilingual fat regression v1.4.12

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-bilingual-fat-regression-v1412.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: catalog-mercadona-bilingual-fat-regression-v1412-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate parser regressions first
        run: |
          python -m pip install --disable-pip-version-check Pillow opencv-python-headless
          cd tools/catalog
          python -m unittest -v \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_row_tokens.py \
            test_nutrition_label_reader_easyocr_zero_glyph.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_nutrition_label_reader.py \
            test_mercadona_ocr_safety_regressions.py
          python -c "import nutrition_label_reader as n; assert n.READER_VERSION == '1.4.12'"

      - name: Download Mercadona first-party inventory
        uses: actions/download-artifact@v4
        with:
          name: mercadona-first-party-final
          path: tools/catalog/mercadona-first-party-final
          repository: frandavid100/rumbo
          github-token: ${{ github.token }}
          run-id: 33046950149

      - name: Build exact target and safety control
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          wanted = {'63238', '21432'}
          products = [json.loads(x) for x in Path('mercadona-first-party-final/products.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          by_id = {str(r.get('product_id') or ''): r for r in products}
          if not wanted.issubset(by_id):
              raise SystemExit(f'missing inventory IDs: {sorted(wanted-set(by_id))}')
          selected = [by_id[pid] for pid in sorted(wanted)]
          for row in selected:
              if not row.get('ingredients'):
                  raise SystemExit(f"structured-ingredients boundary drift: {row.get('product_id')}")
              if not any(isinstance(p, dict) and str(p.get('perspective')) == '9' and p.get('zoom') for p in (row.get('photos') or [])):
                  raise SystemExit(f"missing perspective=9: {row.get('product_id')}")
          Path('bilingual-fat-regression-products.jsonl').write_text(
              ''.join(json.dumps(r, ensure_ascii=False, sort_keys=True)+'\n' for r in selected), encoding='utf-8')
          PY

      - name: Install OCR engines after tests pass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8'

      - name: Reprocess target and control from first-party p9 images
        working-directory: tools/catalog
        shell: bash
        run: |
          set +e
          python mercadona_neural_ocr_tesseract_preprocess_rescue.py \
            --products bilingual-fat-regression-products.jsonl \
            --out mercadona-bilingual-fat-regression-v1412 \
            --shard-index 0 --shard-count 1 --limit 0 --delay 0.25 \
            --eligibility-mode priority
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi

      - name: Audit live regression conservatively
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = [json.loads(x) for x in Path('mercadona-bilingual-fat-regression-v1412/results-00.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          by_id = {str(r.get('product_id') or ''): r for r in rows}
          if set(by_id) != {'63238', '21432'} or len(rows) != 2:
              raise SystemExit(f'cohort drift: {sorted(by_id)}')
          target = by_id['63238']
          control = by_id['21432']
          expected = {'calories':224.0,'fat_g':7.4,'carbohydrate_g':33.0,'protein_g':5.6}
          errors = []
          if target.get('status') != 'DECLARED' or target.get('basis') != '100_g':
              errors.append(f"target status={target.get('status')} basis={target.get('basis')}")
          nutrition = target.get('nutrition') or {}
          for field, want in expected.items():
              got = nutrition.get(field)
              tol = max(5.0, .04*max(abs(want),1.0)) if field == 'calories' else max(.6, .10*max(abs(want),1.0))
              if got is None or abs(float(got)-want) > tol:
                  errors.append(f'target drift {field}={got} expected={want}')
          accepted = next((a for a in (target.get('attempts') or []) if isinstance(a.get('ensemble'),dict) and a['ensemble'].get('status') == 'DECLARED'), None)
          ens = (accepted or {}).get('ensemble') or {}
          if int(ens.get('independent_engine_families') or 0) < 2 or int(ens.get('corroborated_fields') or 0) < 4:
              errors.append(f'target corroboration={ens}')
          if control.get('status') == 'DECLARED':
              errors.append('safety control 21432 promoted')
          for pid, row in by_id.items():
              if not (
                  row.get('evidence_level') == 'OCR_DERIVED_FROM_MERCADONA_IMAGE'
                  and row.get('source') == 'MERCADONA_FIRST_PARTY'
                  and row.get('source_record_kind') == 'label image'
                  and row.get('redistribution_allowed') is False
                  and str(row.get('perspective')) == '9'
              ):
                  errors.append(f'provenance {pid}')
          image_ext={'.jpg','.jpeg','.png','.webp','.bmp','.tif','.tiff'}
          persisted=[str(p) for p in Path('mercadona-bilingual-fat-regression-v1412').rglob('*') if p.is_file() and p.suffix.lower() in image_ext]
          if persisted:
              errors.append(f'persisted images: {persisted}')
          summary = {
              'processed': 2,
              'target_product_id': '63238',
              'target_status': target.get('status'),
              'target_basis': target.get('basis'),
              'target_nutrition': nutrition,
              'target_independent_engine_families': ens.get('independent_engine_families'),
              'target_corroborated_fields': ens.get('corroborated_fields'),
              'control_product_id': '21432',
              'control_status': control.get('status'),
              'reader_version': '1.4.12',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'redistribution_allowed': False,
              'images_persisted': False if not persisted else persisted,
              'missing_values_inferred': False,
              'REVIEW_promoted_without_new_live_OCR': 0,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
              'safety_assessment': 'VALIDATED' if not errors else 'FAILED',
              'errors': errors,
          }
          out = Path('mercadona-bilingual-fat-regression-v1412-audit')
          out.mkdir(exist_ok=True)
          (out/'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          (out/'results.jsonl').write_text(''.join(json.dumps(r, ensure_ascii=False, sort_keys=True)+'\n' for r in rows), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if errors:
              raise SystemExit('bilingual fat regression audit failed')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-bilingual-fat-regression-v1412
          path: tools/catalog/mercadona-bilingual-fat-regression-v1412-audit/
          retention-days: 30
          if-no-files-found: warn
