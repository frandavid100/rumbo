name: Catalog Carrefour first-party fresh inventory

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-carrefour-first-party-fresh-inventory.yml'
      - 'tools/catalog/carrefour_first_party_inventory.py'
      - 'tools/catalog/carrefour_first_party_browser_inventory.py'
      - 'tools/catalog/carrefour_first_party_category_frontier.py'
      - 'tools/catalog/merge_carrefour_first_party_cumulative.py'
      - 'tools/catalog/sanitize_carrefour_first_party_output.py'
      - 'tools/catalog/extract_carrefour_public_gtin.py'
      - 'tools/catalog/fixtures/carrefour_candidate_urls_radarsuper.jsonl'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: carrefour-first-party-fresh-inventory
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Align browser context with validated probe
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('carrefour_first_party_browser_inventory.py')
          text = path.read_text(encoding='utf-8')
          old = 'context = await browser.new_context(locale="es-ES", viewport={"width": 1365, "height": 900})'
          new = '''context = await browser.new_context(
              locale="es-ES",
              user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36",
              viewport={"width": 1365, "height": 900},
          )'''
          if old not in text:
              raise SystemExit('expected browser context line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Discover first-party category frontier
        working-directory: tools/catalog
        run: |
          python carrefour_first_party_category_frontier.py \
            --out carrefour-first-party-category-frontier \
            --max-depth 3 \
            --max-categories 160 \
            --timeout 18 \
            --attempts 1 \
            --delay 0.2 \
            --browser
      - name: Inventory before any other Carrefour request
        working-directory: tools/catalog
        run: |
          EXTRA=(--seed-jsonl carrefour-first-party-category-frontier/product_candidates.jsonl)
          if [ -s fixtures/carrefour_candidate_urls_radarsuper.jsonl ]; then
            EXTRA+=(--seed-jsonl fixtures/carrefour_candidate_urls_radarsuper.jsonl)
          fi
          python carrefour_first_party_browser_inventory.py \
            --out carrefour-first-party-fresh-inventory \
            --delay 15 \
            --stop-after-blocks 2 \
            --max-products 60 \
            --rotate \
            "${EXTRA[@]}"
          python extract_carrefour_public_gtin.py carrefour-first-party-fresh-inventory
          python sanitize_carrefour_first_party_output.py carrefour-first-party-fresh-inventory
      - name: Validate and persist successful first-party observations
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          out=pathlib.Path('tools/catalog/carrefour-first-party-fresh-inventory')
          summary=out/'summary.json'
          if not summary.exists():
              raise SystemExit('missing fresh inventory summary')
          d=json.loads(summary.read_text(encoding='utf-8'))
          if d.get('source_policy') != 'FIRST_PARTY_CARREFOUR_ONLY':
              raise SystemExit('bad source policy')
          if str(d.get('classification_performed')).lower() != 'false':
              raise SystemExit('unexpected classification')
          fixtures=pathlib.Path('tools/catalog/fixtures')
          fixtures.mkdir(parents=True, exist_ok=True)
          (fixtures/'carrefour_first_party_fresh_inventory_latest.json').write_text(
              json.dumps(d, ensure_ascii=False, indent=2), encoding='utf-8')

          frontier=pathlib.Path('tools/catalog/carrefour-first-party-category-frontier')
          frontier_summary=frontier/'summary.json'
          if frontier_summary.exists():
              fd=json.loads(frontier_summary.read_text(encoding='utf-8'))
              if fd.get('source_policy') != 'FIRST_PARTY_CARREFOUR_ONLY':
                  raise SystemExit('bad category frontier source policy')
              if str(fd.get('classification_performed')).lower() != 'false':
                  raise SystemExit('unexpected category frontier classification')
              (fixtures/'carrefour_first_party_category_frontier_latest_summary.json').write_text(
                  json.dumps(fd, ensure_ascii=False, indent=2), encoding='utf-8')
              for src_name, dst_name in (
                  ('category_audit.jsonl','carrefour_first_party_category_frontier_latest_audit.jsonl'),
                  ('product_candidates.jsonl','carrefour_first_party_category_frontier_latest_candidates.jsonl'),
              ):
                  src=frontier/src_name
                  if src.exists():
                      (fixtures/dst_name).write_text(src.read_text(encoding='utf-8'),encoding='utf-8')
          PY
          # The validated-probe step intentionally patches this tracked script only for this run.
          # Restore it before persisting so the data commit contains observations only.
          git restore tools/catalog/carrefour_first_party_browser_inventory.py
          cd tools/catalog
          python merge_carrefour_first_party_cumulative.py \
            --fixtures fixtures \
            --fresh carrefour-first-party-fresh-inventory \
            --frontier carrefour-first-party-category-frontier \
            --sqlite carrefour-first-party-cumulative/carrefour_first_party.sqlite
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/catalog/fixtures/carrefour_first_party_fresh_inventory_latest.json \
            tools/catalog/fixtures/carrefour_first_party_category_frontier_latest_summary.json \
            tools/catalog/fixtures/carrefour_first_party_category_frontier_latest_audit.jsonl \
            tools/catalog/fixtures/carrefour_first_party_category_frontier_latest_candidates.jsonl \
            tools/catalog/fixtures/carrefour_first_party_products_cumulative.jsonl \
            tools/catalog/fixtures/carrefour_first_party_field_evidence_cumulative.jsonl \
            tools/catalog/fixtures/carrefour_first_party_cumulative_summary.json
          if ! git diff --cached --quiet; then
            git commit -m "catalog: persist fresh Carrefour first-party inventory"
            git pull --rebase origin agent/catalog-phase1
            git push origin HEAD:agent/catalog-phase1
          fi
      - name: Upload auditable inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrefour-first-party-fresh-inventory
          path: |
            tools/catalog/carrefour-first-party-fresh-inventory/
            tools/catalog/carrefour-first-party-category-frontier/
            tools/catalog/carrefour-first-party-cumulative/
          retention-days: 7
          if-no-files-found: warn

# Lossless cumulative Carrefour first-party refresh marker: 2026-08-25T06:06Z.
