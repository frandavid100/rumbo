name: Catalog Mercadona alternate-photo OCR pilot

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - 'tools/catalog/mercadona_neural_ocr_alternate_photo_wave.py'
      - 'tools/catalog/mercadona-no-p9-packaged-food-pilot-selection.json'
      - 'tools/catalog/test_mercadona_neural_ocr_alternate_photo_wave.py'
      - '.github/workflows/catalog-mercadona-alternate-photo-ocr-pilot.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-alternate-photo-ocr-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download consolidated Mercadona first-party cut
        uses: actions/download-artifact@v4
        with:
          name: mercadona-first-party-final
          path: tools/catalog/mercadona-first-party-final
          github-token: ${{ github.token }}
          run-id: 33046950149
      - name: Install independent OCR engines and visual detector dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow
      - name: Run provenance and conservative OCR regression tests
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_mercadona_neural_ocr_alternate_photo_wave.py \
            test_label_easyocr_extractor.py \
            test_nutrition_label_reader.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_ocr_safety_regressions.py
      - name: OCR bounded no-p9 packaged-food pilot
        working-directory: tools/catalog
        run: |
          python mercadona_neural_ocr_alternate_photo_wave.py \
            --selection mercadona-no-p9-packaged-food-pilot-selection.json \
            --products mercadona-first-party-final/products.jsonl \
            --out mercadona-alternate-photo-ocr-pilot \
            --shard-index 0 \
            --shard-count 1 \
            --limit 0 \
            --eligibility-mode p9-no-ingredients-all
      - name: Validate and stage auditable pilot
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          from collections import Counter
          import json
          from pathlib import Path
          import sqlite3

          out = Path('mercadona-alternate-photo-ocr-pilot')
          selection = json.loads(Path('mercadona-no-p9-packaged-food-pilot-selection.json').read_text(encoding='utf-8'))
          expected = {str(row['product_id']) for row in selection['products']}
          rows = []
          for path in sorted(out.glob('results-*.jsonl')):
              rows.extend(json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip())

          actual = {str(row.get('product_id')) for row in rows}
          if actual != expected:
              raise SystemExit(f'pilot coverage mismatch: expected={sorted(expected)} actual={sorted(actual)}')
          if len(rows) != len(expected):
              raise SystemExit(f'duplicate pilot rows: rows={len(rows)} unique={len(actual)}')

          invalid = []
          for row in rows:
              if row.get('perspective') == 9:
                  invalid.append(f"{row.get('product_id')}:fake_p9")
              if row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE':
                  invalid.append(f"{row.get('product_id')}:evidence")
              if row.get('source') != 'MERCADONA_FIRST_PARTY':
                  invalid.append(f"{row.get('product_id')}:source")
              if row.get('source_record_kind') != 'label image':
                  invalid.append(f"{row.get('product_id')}:source_record_kind")
              if row.get('redistribution_allowed') is not False:
                  invalid.append(f"{row.get('product_id')}:redistribution")
              photo = row.get('photo_selection') or {}
              if str(photo.get('actual_perspective')) != str(row.get('perspective')):
                  invalid.append(f"{row.get('product_id')}:perspective_provenance")
              if row.get('status') == 'DECLARED':
                  accepted = next(
                      (attempt for attempt in row.get('attempts') or []
                       if (attempt.get('ensemble') or {}).get('status') == 'DECLARED'),
                      None,
                  )
                  ensemble = (accepted or {}).get('ensemble') or {}
                  if ensemble.get('independent_engine_families', 0) < 2:
                      invalid.append(f"{row.get('product_id')}:independent_engines")
                  if ensemble.get('corroborated_fields', 0) < 4:
                      invalid.append(f"{row.get('product_id')}:corroborated_fields")
          if invalid:
              raise SystemExit('unsafe pilot rows: ' + ','.join(invalid))

          counts = Counter(str(row.get('status') or 'UNKNOWN') for row in rows)
          previous_exact_processed = 2936
          inventory = 4280
          summary = {
              'inventory_products': inventory,
              'selection_products': len(expected),
              'processed': len(rows),
              'status_counts': dict(sorted(counts.items())),
              'declared': counts.get('DECLARED', 0),
              'review': counts.get('REVIEW', 0),
              'no_visual_region': counts.get('NO_VISUAL_REGION', 0),
              'error': counts.get('ERROR', 0),
              'unsafe_rows': 0,
              'previous_exact_processed': previous_exact_processed,
              'prospective_exact_processed_if_reconciled': previous_exact_processed + len(rows),
              'prospective_exact_processed_rate': round((previous_exact_processed + len(rows)) / inventory, 6),
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'photo_selection_policy': 'EXPLICIT_NON_P9_FIRST_PARTY_PHOTO',
              'redistribution_allowed': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          staged = Path('mercadona-alternate-photo-ocr-pilot-staged')
          staged.mkdir(exist_ok=True)
          (staged / 'results.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in rows),
              encoding='utf-8',
          )
          (staged / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')

          db = sqlite3.connect(staged / 'results.sqlite')
          try:
              db.execute(
                  'CREATE TABLE ocr_results (product_id TEXT PRIMARY KEY, status TEXT NOT NULL, '
                  'perspective TEXT NOT NULL, image_url TEXT NOT NULL, evidence_level TEXT NOT NULL, '
                  'source TEXT NOT NULL, redistribution_allowed INTEGER NOT NULL, row_json TEXT NOT NULL)'
              )
              db.executemany(
                  'INSERT INTO ocr_results VALUES (?, ?, ?, ?, ?, ?, ?, ?)',
                  [
                      (
                          str(row['product_id']),
                          str(row['status']),
                          str(row['perspective']),
                          str(row['image_url']),
                          str(row['evidence_level']),
                          f"{row['source']}/{row['source_record_kind']}",
                          1 if row['redistribution_allowed'] else 0,
                          json.dumps(row, ensure_ascii=False, sort_keys=True),
                      )
                      for row in rows
                  ],
              )
              db.commit()
          finally:
              db.close()
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-alternate-photo-ocr-pilot
          path: |
            tools/catalog/mercadona-alternate-photo-ocr-pilot/
            tools/catalog/mercadona-alternate-photo-ocr-pilot-staged/
          retention-days: 30
          if-no-files-found: warn
