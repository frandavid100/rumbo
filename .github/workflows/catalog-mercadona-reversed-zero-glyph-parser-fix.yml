name: Catalog Mercadona reversed zero-glyph parser fix

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-reversed-zero-glyph-parser-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply narrow parser patch
        run: git apply --check tools/catalog/mercadona-reversed-zero-glyph-parser-v149.patch && git apply tools/catalog/mercadona-reversed-zero-glyph-parser-v149.patch
      - name: Run parser regressions
        working-directory: tools/catalog
        run: |
          python -m unittest -v test_nutrition_label_reader.py test_nutrition_label_reader_easyocr_zero_glyph.py test_nutrition_label_reader_easyocr_reversed_zero_glyph.py test_nutrition_ocr_ensemble.py test_mercadona_ocr_safety_regressions.py
          python -m py_compile nutrition_label_reader.py nutrition_ocr_ensemble.py
      - name: Commit validated parser fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/catalog/nutrition_label_reader.py
          git commit -m 'fix(catalog): parse reversed EasyOCR zero-glyph fat row'
          git push origin HEAD:agent/catalog-phase1
