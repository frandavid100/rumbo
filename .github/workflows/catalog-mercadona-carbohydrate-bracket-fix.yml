name: Catalog Mercadona carbohydrate bracket parser fix v4

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-carbohydrate-bracket-fix.yml'
      - 'tools/catalog/apply_mercadona_carbohydrate_bracket_fix.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-mercadona-carbohydrate-bracket-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-test-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install regression dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless Pillow

      - name: Add regression before parser change
        run: python tools/catalog/apply_mercadona_carbohydrate_bracket_fix.py insert-test

      - name: Prove current parser fails the new regression
        working-directory: tools/catalog
        shell: bash
        run: |
          set +e
          python -m unittest -v test_nutrition_label_reader_row_tokens.RowTokenRegressionTest.test_observed_easyocr_bracketed_split_carbohydrate_label > /tmp/prepatch.log 2>&1
          rc=$?
          set -e
          cat /tmp/prepatch.log
          if [[ $rc -eq 0 ]]; then
            echo 'Regression unexpectedly passed before parser patch' >&2
            exit 1
          fi
          grep -q 'FAIL: test_observed_easyocr_bracketed_split_carbohydrate_label' /tmp/prepatch.log

      - name: Apply narrow parser fix in working tree
        run: python tools/catalog/apply_mercadona_carbohydrate_bracket_fix.py apply

      - name: Run conservative parser regressions
        working-directory: tools/catalog
        run: |
          python -m unittest -v test_nutrition_label_reader.py test_nutrition_label_reader_ocr_typos.py test_nutrition_label_reader_row_tokens.py test_mercadona_ocr_safety_regressions.py test_nutrition_ocr_ensemble.py test_mercadona_near_safe_doctr_input.py
          python -m py_compile nutrition_label_reader.py

      - name: Commit only tested parser and regression
        shell: bash
        run: |
          set -euo pipefail
          git restore .github/workflows/catalog-mercadona-near-safe-doctr-pilot.yml
          git config user.name 'David Prieto'
          git config user.email 'frandavid100@gmail.com'
          git add tools/catalog/nutrition_label_reader.py tools/catalog/test_nutrition_label_reader_row_tokens.py
          git diff --cached --check
          git commit -m 'fix(catalog): parse bracketed split carbohydrate row'
          git push origin HEAD:agent/catalog-phase1
