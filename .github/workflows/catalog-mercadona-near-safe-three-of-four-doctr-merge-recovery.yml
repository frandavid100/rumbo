name: Catalog Mercadona near-safe 3-of-4 merge recovery

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-near-safe-three-of-four-doctr-merge-recovery.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: catalog-mercadona-near-safe-three-of-four-merge-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '35417093808'
      SHARD0_ARTIFACT_ID: '10577771611'
      SHARD0_SHA256: '4440a4dcfa04c81b672929aac627061f9cb35534ba39389083ba425718697d70'
      SHARD1_ARTIFACT_ID: '10577352013'
      SHARD1_SHA256: 'b606c6798d2f749a60104babb7ca4e33fcf7ffbf0102966fad4f3f7772520564'
    steps:
      - name: Download exact fresh shard artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mercadona-near-safe-recovery/shard-0 /tmp/mercadona-near-safe-recovery/shard-1

          download_exact() {
            local artifact_id="$1"
            local expected_name="$2"
            local expected_digest="$3"
            local dest="$4"
            local meta
            meta=$(gh api -H 'Accept: application/vnd.github+json' "/repos/frandavid100/rumbo/actions/artifacts/${artifact_id}")
            local name expired digest run_id
            name=$(jq -r '.name' <<<"$meta")
            expired=$(jq -r '.expired' <<<"$meta")
            digest=$(jq -r '.digest // ""' <<<"$meta")
            run_id=$(jq -r '.workflow_run.id // 0' <<<"$meta")
            [[ "$name" == "$expected_name" ]] || { echo "unexpected artifact name: $name" >&2; exit 1; }
            [[ "$expired" == 'false' ]] || { echo "artifact expired: $artifact_id" >&2; exit 1; }
            [[ "$digest" == "sha256:${expected_digest}" ]] || { echo "artifact digest mismatch: $artifact_id $digest" >&2; exit 1; }
            [[ "$run_id" == "$SOURCE_RUN_ID" ]] || { echo "artifact source-run mismatch: $artifact_id run=$run_id" >&2; exit 1; }
            gh api -H 'Accept: application/vnd.github+json' "/repos/frandavid100/rumbo/actions/artifacts/${artifact_id}/zip" > "/tmp/${artifact_id}.zip"
            printf '%s  %s\n' "$expected_digest" "/tmp/${artifact_id}.zip" | sha256sum -c -
            unzip -q "/tmp/${artifact_id}.zip" -d "$dest"
            rm "/tmp/${artifact_id}.zip"
          }

          download_exact "$SHARD0_ARTIFACT_ID" 'mercadona-near-safe-three-of-four-doctr-pilot-0' "$SHARD0_SHA256" /tmp/mercadona-near-safe-recovery/shard-0
          download_exact "$SHARD1_ARTIFACT_ID" 'mercadona-near-safe-three-of-four-doctr-pilot-1' "$SHARD1_SHA256" /tmp/mercadona-near-safe-recovery/shard-1

      - name: Merge and validate exact fresh observations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from collections import Counter
          import glob
          import json
          import os
          from pathlib import Path
          import sqlite3

          root = Path('/tmp/mercadona-near-safe-recovery')
          out = Path('merged')
          out.mkdir(parents=True, exist_ok=True)

          rows = []
          seen = set()
          for shard in ('shard-0', 'shard-1'):
              paths = sorted(glob.glob(str(root / shard / '**' / 'results-*.jsonl'), recursive=True))
              if len(paths) != 1:
                  raise SystemExit(f'expected exactly one result JSONL for {shard}, got {paths}')
              for line in Path(paths[0]).read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  pid = str(row.get('product_id') or '')
                  if not pid or pid in seen:
                      raise SystemExit(f'missing/duplicate product in recovery merge: {pid}')
                  seen.add(pid)
                  rows.append(row)

          selection_paths = sorted(glob.glob(str(root / 'shard-*' / 'selection-summary.json')))
          if len(selection_paths) != 2:
              raise SystemExit(f'expected two selection summaries, got {selection_paths}')
          selections = [json.loads(Path(p).read_text(encoding='utf-8')) for p in selection_paths]
          if selections[0] != selections[1]:
              raise SystemExit('shard selection summaries differ')
          selection = selections[0]
          expected = {str(pid) for pid in selection.get('selected_product_ids', [])}
          if expected != {'7878', '84638'}:
              raise SystemExit(f'unexpected selected cohort: {sorted(expected)}')
          if seen != expected:
              raise SystemExit(f'recovery result IDs differ from selected cohort: missing={sorted(expected-seen)} unexpected={sorted(seen-expected)}')

          invalid = []
          declared = []
          for row in rows:
              pid = str(row.get('product_id'))
              if (
                  row.get('source') != 'MERCADONA_FIRST_PARTY'
                  or row.get('source_record_kind') != 'label image'
                  or row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE'
                  or row.get('redistribution_allowed') is not False
                  or row.get('image_selection_basis') != 'EXACT_CANONICAL_THREE_OF_FOUR_IMAGE_URL_MATCHED_CURRENT_FIRST_PARTY_PERSPECTIVE_9_PHOTO'
                  or row.get('pilot_canonical_corroborated_fields') != 3
                  or row.get('pilot_canonical_engine_families') != 2
                  or row.get('perspective') != 9
                  or row.get('retry_independent_ocr_family') != 'doctr'
                  or row.get('cross_run_value_fusion') is not False
                  or row.get('current_observation_must_satisfy_declared_contract_independently') is not True
                  or row.get('acceptance_policy_changed') is not False
                  or row.get('status') != 'DECLARED'
              ):
                  invalid.append(pid)
                  continue
              attempt = next(
                  (a for a in row.get('attempts', []) if (a.get('ensemble') or {}).get('status') == 'DECLARED'),
                  None,
              )
              ensemble = (attempt or {}).get('ensemble') or {}
              nutrition = ensemble.get('nutrition') or {}
              if (
                  int(ensemble.get('independent_engine_families') or 0) < 2
                  or int(ensemble.get('corroborated_fields') or 0) != 4
                  or ensemble.get('basis') not in {'100_g', '100_ml'}
                  or any(nutrition.get(field) is None for field in ('calories', 'fat_g', 'carbohydrate_g', 'protein_g'))
              ):
                  invalid.append(pid)
                  continue
              declared.append(row)
          if invalid:
              raise SystemExit(f'invalid recovery rows: {sorted(set(invalid))}')
          if len(declared) != 2:
              raise SystemExit(f'expected 2 independently DECLARED rows, got {len(declared)}')

          counts = Counter(str(row.get('status') or 'UNKNOWN') for row in rows)
          (out / 'results-merged.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in rows),
              encoding='utf-8',
          )
          (out / 'selection-summary.json').write_text(
              json.dumps(selection, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          summary = {
              'inventory_products': 4280,
              'source_failed_run_id': int(os.environ['SOURCE_RUN_ID']),
              'source_artifacts': [
                  {'artifact_id': int(os.environ['SHARD0_ARTIFACT_ID']), 'sha256': os.environ['SHARD0_SHA256']},
                  {'artifact_id': int(os.environ['SHARD1_ARTIFACT_ID']), 'sha256': os.environ['SHARD1_SHA256']},
              ],
              'recovery_reason': 'RERUN_MERGE_PATTERN_INCLUDED_PRIOR_MERGED_ARTIFACT; RECOVER_EXACT_FRESH_SHARD_ARTIFACTS_ONLY',
              'processed': len(rows),
              'status_counts': dict(sorted(counts.items())),
              'declared': len(declared),
              'declared_product_ids': sorted(str(row.get('product_id')) for row in declared),
              'cross_run_value_fusion': False,
              'current_observation_must_satisfy_declared_contract_independently': True,
              'acceptance_policy_changed': False,
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'redistribution_allowed': False,
              'images_persisted': False,
              'missing_values_inferred': False,
              'structured_api_macros_claimed': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          (out / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')

          db = sqlite3.connect(out / 'staging.sqlite')
          db.execute('''
              CREATE TABLE mercadona_ocr_staging (
                  product_id TEXT PRIMARY KEY, product_name TEXT, status TEXT NOT NULL, basis TEXT,
                  calories REAL, fat_g REAL, carbohydrate_g REAL, protein_g REAL, image_url TEXT,
                  evidence_level TEXT NOT NULL, source TEXT NOT NULL, source_record_kind TEXT NOT NULL,
                  redistribution_allowed INTEGER NOT NULL, parser_engine TEXT, observed_at TEXT, raw_json TEXT NOT NULL
              )
          ''')
          for row in rows:
              declared_attempt = next(
                  (a for a in row.get('attempts', []) if (a.get('ensemble') or {}).get('status') == 'DECLARED'),
                  None,
              )
              ensemble = (declared_attempt or {}).get('ensemble') or {}
              nutrition = ensemble.get('nutrition') or {}
              db.execute(
                  'INSERT INTO mercadona_ocr_staging VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)',
                  (
                      str(row.get('product_id')), row.get('product_name') or row.get('name'), row.get('status'),
                      ensemble.get('basis'), nutrition.get('calories'), nutrition.get('fat_g'),
                      nutrition.get('carbohydrate_g'), nutrition.get('protein_g'), row.get('image_url'),
                      row.get('evidence_level'), row.get('source'), row.get('source_record_kind'), 0,
                      ensemble.get('engine') or row.get('parser_engine') or row.get('engine') or row.get('ocr_engine'),
                      row.get('observed_at') or row.get('fetched_at') or row.get('created_at'),
                      json.dumps(row, ensure_ascii=False, sort_keys=True),
                  ),
              )
          db.commit()
          db.close()

          forbidden = [
              str(path) for path in out.rglob('*')
              if path.is_file() and path.suffix.lower() in {'.jpg', '.jpeg', '.png', '.webp', '.avif', '.gif'}
          ]
          if forbidden:
              raise SystemExit(f'image files must not be persisted: {forbidden}')
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: mercadona-near-safe-three-of-four-doctr-recovery-merged
          path: merged/
          retention-days: 90
          if-no-files-found: error

      - name: Reconcile canonical OCR after recovered evidence
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            '/repos/frandavid100/rumbo/actions/workflows/catalog-mercadona-current-ocr-residual-audit.yml/dispatches' \
            -f ref='agent/catalog-phase1'
