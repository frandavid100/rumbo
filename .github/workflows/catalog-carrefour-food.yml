name: Catalog Carrefour food

on:
  workflow_dispatch:
    inputs:
      full:
        description: Import full food catalog
        required: false
        default: 'false'
  push:
    branches: [agent/catalog-phase1]
    paths:
      - 'tools/catalog/carrefour_radar_catalog_importer.py'
      - '.github/workflows/catalog-carrefour-food.yml'

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Smoke import
        if: ${{ github.event_name == 'push' || github.event.inputs.full != 'true' }}
        working-directory: tools/catalog
        run: python carrefour_radar_catalog_importer.py --max-pages 1 --max-products 90 --workers 12
      - name: Full import
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full == 'true' }}
        working-directory: tools/catalog
        run: python carrefour_radar_catalog_importer.py --workers 24
      - name: Upload catalog
        uses: actions/upload-artifact@v4
        with:
          name: carrefour-food-catalog
          path: tools/catalog/carrefour-catalog-output/
          retention-days: 7
          if-no-files-found: error
