name: Catalog Mercadona ambiguous primary-column pilot

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-ambiguous-primary-column-pilot.yml'
      - 'tools/catalog/mercadona_ambiguous_primary_column_rescue.py'
      - 'tools/catalog/test_mercadona_ambiguous_primary_column_rescue.py'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: catalog-mercadona-ambiguous-primary-column-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve latest successful strict OCR audit
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            '/repos/frandavid100/rumbo/actions/workflows/catalog-mercadona-current-ocr-residual-audit.yml/runs?branch=agent%2Fcatalog-phase1&per_page=30' \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id')
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo 'No successful strict OCR audit found' >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using strict OCR audit run $run_id"

      - name: Download strict canonical audit
        uses: actions/download-artifact@v4
        with:
          name: mercadona-current-ocr-residual-audit
          path: /tmp/mercadona-audit
          github-token: ${{ github.token }}
          run-id: ${{ steps.audit.outputs.run_id }}

      - name: Select ambiguity-only complete 3-of-4 REVIEW targets
        id: targets
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from mercadona_ambiguous_primary_column_rescue import select_ambiguous_primary_column_targets

          src = Path('/tmp/mercadona-audit/current-review-failure-modes/complete-but-safety-blocked.jsonl')
          rows = [
              json.loads(line)
              for line in src.read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          selected = select_ambiguous_primary_column_targets(rows)
          Path('ambiguous-primary-targets.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in selected),
              encoding='utf-8',
          )
          summary = {
              'canonical_audit_run_id': int('${{ steps.audit.outputs.run_id }}'),
              'target_count': len(selected),
              'product_ids': [str(row['product_id']) for row in selected],
              'selection_policy': 'CANONICAL_REVIEW_COMPLETE_3_OF_4; >=3 OCR FAMILIES; SOLE NORMALIZED SAFETY BLOCKER=AMBIGUOUS_TABLE; MULTIPLE_NUTRITION_COLUMNS PRESENT; EXPLICIT PER-100 BASIS; NONEMPTY EAN+IMAGE',
              'historical_values_promotion_allowed': False,
              'cross_run_value_fusion': False,
              'cross_crop_value_fusion': False,
              'acceptance_policy_changed': False,
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'redistribution_allowed': False,
              'images_persisted': False,
              'missing_values_inferred': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          out = Path('mercadona-ambiguous-primary-column-pilot')
          out.mkdir(exist_ok=True)
          (out / 'target-selection-summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          Path('ambiguous-primary-target-count.txt').write_text(str(len(selected)), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY
          count=$(cat ambiguous-primary-target-count.txt)
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Rehydrate official first-party details and require exact historical identity/image
        id: live
        if: steps.targets.outputs.count != '0'
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from mercadona_first_party_details import _get_json, normalize, _now

          targets = [
              json.loads(line)
              for line in Path('ambiguous-primary-targets.jsonl').read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          selected = []
          errors = []
          missing_current_ean = []
          reassigned = []
          unmatched_p9 = []

          for old in targets:
              pid = str(old.get('product_id') or '').strip()
              anchor_ean = str(old.get('ean') or '').strip()
              anchor_url = str(old.get('image_url') or '').strip()
              observed_at = _now()
              try:
                  payload, source_url = _get_json(pid, timeout=20.0)
                  current = normalize(payload, source_url=source_url, observed_at=observed_at)
              except Exception as exc:
                  errors.append({'product_id': pid, 'error': f'{type(exc).__name__}:{exc}'})
                  continue

              current_ean = str(current.get('ean') or '').strip()
              if not current_ean:
                  missing_current_ean.append(pid)
                  continue
              if current_ean != anchor_ean:
                  reassigned.append(pid)
                  continue

              photos = current.get('photos') if isinstance(current.get('photos'), list) else []
              matches = [
                  (index, photo)
                  for index, photo in enumerate(photos)
                  if isinstance(photo, dict)
                  and str(photo.get('perspective') or '') == '9'
                  and str(photo.get('zoom') or '') == anchor_url
              ]
              if len(matches) != 1:
                  unmatched_p9.append(pid)
                  continue

              image_index, photo = matches[0]
              routed = dict(photo)
              routed['perspective'] = 9
              candidate = dict(current)
              candidate['photos'] = [routed]
              candidate['_ambiguous_primary_meta'] = {
                  'canonical_ean': anchor_ean,
                  'current_ean': current_ean,
                  'image_url': anchor_url,
                  'image_index': image_index,
                  'perspective': 9,
                  'canonical_latest_raw_run_id': old.get('latest_raw_run_id'),
                  'canonical_corroborated_fields': int(old.get('corroborated_fields') or 0),
                  'canonical_engine_families': int(old.get('independent_engine_families') or 0),
                  'canonical_safety_blockers': list(old.get('safety_blockers') or []),
                  'canonical_reason_prefixes': list(old.get('reason_prefixes') or []),
                  'canonical_candidate_values_diagnostic_only': old.get('diagnostic_candidate_values'),
                  'identity_basis': 'EXACT_CURRENT_EAN_MATCH',
                  'image_basis': 'EXACT_CANONICAL_IMAGE_URL_EQUALS_CURRENT_FIRST_PARTY_PERSPECTIVE_9_URL',
                  'live_detail_source_url': source_url,
                  'live_detail_observed_at': observed_at,
              }
              selected.append(candidate)

          selected.sort(key=lambda row: str(row.get('product_id') or ''))
          with_ingredients = [row for row in selected if row.get('ingredients')]
          without_ingredients = [row for row in selected if not row.get('ingredients')]
          Path('ambiguous-primary-with-ingredients.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in with_ingredients),
              encoding='utf-8',
          )
          Path('ambiguous-primary-without-ingredients.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in without_ingredients),
              encoding='utf-8',
          )
          summary = {
              'canonical_targets': len(targets),
              'selected': len(selected),
              'selected_product_ids': [str(row.get('product_id')) for row in selected],
              'selected_with_structured_ingredients': len(with_ingredients),
              'selected_without_structured_ingredients': len(without_ingredients),
              'rehydration_errors': errors,
              'missing_current_ean': sorted(set(missing_current_ean)),
              'reassigned_current_product_ids': sorted(set(reassigned)),
              'unmatched_exact_current_first_party_p9': sorted(set(unmatched_p9)),
              'identity_policy': 'PRODUCT_ID_IS_LOOKUP_ONLY; EXACT NONEMPTY HISTORICAL EAN MUST EQUAL CURRENT OFFICIAL EAN',
              'image_policy': 'EXACT HISTORICAL FIRST-PARTY IMAGE URL MUST STILL BE UNIQUE CURRENT PERSPECTIVE=9 PHOTO',
              'historical_values_promotion_allowed': False,
              'current_crop_must_satisfy_declared_contract_independently': True,
              'cross_run_value_fusion': False,
              'cross_crop_value_fusion': False,
              'acceptance_policy_changed': False,
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'redistribution_allowed': False,
              'images_persisted': False,
              'missing_values_inferred': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          root = Path('mercadona-ambiguous-primary-column-pilot')
          (root / 'live-selection-summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          Path('ambiguous-primary-selected-count.txt').write_text(str(len(selected)), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY
          count=$(cat ambiguous-primary-selected-count.txt)
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Install OCR dependencies
        if: steps.live.outputs.count != '' && steps.live.outputs.count != '0'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check \
            'paddleocr>=3.7,<3.8' \
            'easyocr>=1.7,<1.8' \
            'python-doctr==1.1.0' \
            opencv-python-headless Pillow

      - name: Run conservative tests before OCR
        if: steps.live.outputs.count != '' && steps.live.outputs.count != '0'
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_mercadona_ambiguous_primary_column_rescue.py \
            test_mercadona_bounded_doctr_rescue.py \
            test_mercadona_near_safe_doctr_retry.py \
            test_label_doctr_extractor.py \
            test_mercadona_ocr_safety_regressions.py \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_label_reader_row_tokens.py \
            test_nutrition_ocr_ensemble.py \
            test_label_image_preprocess.py

      - name: Run independent primary-column OCR rescue
        if: steps.live.outputs.count != '' && steps.live.outputs.count != '0'
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          root=mercadona-ambiguous-primary-column-pilot
          mkdir -p "$root/with-ingredients" "$root/without-ingredients"

          run_group() {
            local products="$1" out="$2" mode="$3"
            if [[ ! -s "$products" ]]; then
              return 0
            fi
            set +e
            python mercadona_ambiguous_primary_column_rescue.py \
              --products "$products" \
              --out "$out" \
              --shard-index 0 \
              --shard-count 1 \
              --limit 0 \
              --eligibility-mode "$mode"
            rc=$?
            set -e
            [[ $rc -eq 0 || $rc -eq 2 ]]
          }

          run_group ambiguous-primary-with-ingredients.jsonl "$root/with-ingredients" priority
          run_group ambiguous-primary-without-ingredients.jsonl "$root/without-ingredients" p9-no-ingredients-all

      - name: Validate and materialize auditable pilot output
        if: steps.live.outputs.count != '' && steps.live.outputs.count != '0'
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from collections import Counter
          import glob
          import json
          from pathlib import Path
          import sqlite3

          CORE = ('calories', 'fat_g', 'carbohydrate_g', 'protein_g')
          root = Path('mercadona-ambiguous-primary-column-pilot')
          live_summary = json.loads((root / 'live-selection-summary.json').read_text(encoding='utf-8'))
          expected = set(live_summary.get('selected_product_ids') or [])
          meta = {}
          for products_path in (
              'ambiguous-primary-with-ingredients.jsonl',
              'ambiguous-primary-without-ingredients.jsonl',
          ):
              for line in Path(products_path).read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  product = json.loads(line)
                  meta[str(product.get('product_id'))] = product.get('_ambiguous_primary_meta') or {}

          rows = []
          seen = set()
          for result_path in sorted(glob.glob(str(root / '**/results-*.jsonl'), recursive=True)):
              patched = []
              for line in Path(result_path).read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  pid = str(row.get('product_id') or '')
                  if not pid or pid in seen:
                      raise SystemExit(f'missing/duplicate product in ambiguity merge: {pid}')
                  seen.add(pid)
                  m = meta.get(pid)
                  if m is None:
                      raise SystemExit(f'missing exact-image metadata for {pid}')
                  if str(row.get('ean') or '') != str(m.get('current_ean') or ''):
                      raise SystemExit(f'OCR result EAN changed for {pid}')
                  if str(m.get('current_ean') or '') != str(m.get('canonical_ean') or ''):
                      raise SystemExit(f'identity mismatch for {pid}')
                  if str(row.get('image_url') or '') != str(m.get('image_url') or ''):
                      raise SystemExit(f'OCR used unexpected first-party image for {pid}')
                  row['image_index'] = m.get('image_index')
                  row['perspective'] = 9
                  row['image_selection_basis'] = m.get('image_basis')
                  row['live_detail_source_url'] = m.get('live_detail_source_url')
                  row['live_detail_observed_at'] = m.get('live_detail_observed_at')
                  row['pilot_canonical_latest_raw_run_id'] = m.get('canonical_latest_raw_run_id')
                  row['pilot_canonical_corroborated_fields'] = m.get('canonical_corroborated_fields')
                  row['pilot_canonical_engine_families'] = m.get('canonical_engine_families')
                  row['pilot_canonical_safety_blockers'] = m.get('canonical_safety_blockers')
                  row['historical_values_promotion_allowed'] = False
                  row['cross_run_value_fusion'] = False
                  row['cross_crop_value_fusion'] = False
                  row['current_crop_must_satisfy_declared_contract_independently'] = True
                  row['acceptance_policy_changed'] = False
                  patched.append(row)
                  rows.append(row)
              Path(result_path).write_text(
                  ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in patched),
                  encoding='utf-8',
              )

          if seen != expected:
              raise SystemExit(f'pilot result coverage mismatch: expected={sorted(expected)} seen={sorted(seen)}')

          invalid = []
          declared = []
          for row in rows:
              pid = str(row.get('product_id') or '')
              if (
                  row.get('source') != 'MERCADONA_FIRST_PARTY'
                  or row.get('source_record_kind') != 'label image'
                  or row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE'
                  or row.get('redistribution_allowed') is not False
                  or row.get('perspective') != 9
                  or row.get('pilot_canonical_corroborated_fields') != 3
                  or set(row.get('pilot_canonical_safety_blockers') or []) != {'AMBIGUOUS_TABLE'}
                  or row.get('historical_values_promotion_allowed') is not False
                  or row.get('cross_run_value_fusion') is not False
                  or row.get('cross_crop_value_fusion') is not False
                  or row.get('acceptance_policy_changed') is not False
                  or not str(row.get('live_detail_source_url') or '').startswith('https://tienda.mercadona.es/api/v1_1/products/')
              ):
                  invalid.append(pid)

              if row.get('status') == 'DECLARED':
                  declared.append(row)
                  nutrition = row.get('nutrition') or {}
                  if any(field not in nutrition for field in CORE):
                      invalid.append(pid)
                  attempt = next(
                      (
                          attempt for attempt in row.get('attempts', [])
                          if (attempt.get('ensemble') or {}).get('status') == 'DECLARED'
                      ),
                      None,
                  )
                  ensemble = (attempt or {}).get('ensemble') or {}
                  if (
                      ensemble.get('basis') not in {'100_g', '100_ml'}
                      or int(ensemble.get('independent_engine_families') or 0) < 2
                      or int(ensemble.get('corroborated_fields') or 0) < 4
                  ):
                      invalid.append(pid)

          if invalid:
              raise SystemExit('unsafe pilot rows: ' + ','.join(sorted(set(invalid))))

          counts = Counter(str(row.get('status') or 'UNKNOWN') for row in rows)
          summary = {
              'inventory_products': 4280,
              'canonical_audit_run_id': int('${{ steps.audit.outputs.run_id }}'),
              'eligible_historical_ambiguity_targets': int('${{ steps.targets.outputs.count }}'),
              'live_exact_identity_image_targets': len(expected),
              'processed': len(rows),
              'status_counts': dict(sorted(counts.items())),
              'declared_product_ids': [str(row.get('product_id')) for row in declared],
              'review_product_ids': [str(row.get('product_id')) for row in rows if row.get('status') == 'REVIEW'],
              'no_visual_region_product_ids': [str(row.get('product_id')) for row in rows if row.get('status') == 'NO_VISUAL_REGION'],
              'error_product_ids': [str(row.get('product_id')) for row in rows if row.get('status') == 'ERROR'],
              'invalid_product_ids': [],
              'selection_policy': 'AMBIGUITY_ONLY_COMPLETE_3_OF_4_CANONICAL_REVIEW_WITH_EXACT_LIVE_EAN_AND_EXACT_SAME_FIRST_PARTY_P9_IMAGE',
              'rescue_policy': 'EACH TEMPORARY PRIMARY-COLUMN CROP MUST INDEPENDENTLY SATISFY UNCHANGED DECLARED CONTRACT; NO CROSS-CROP OR CROSS-RUN VALUE FUSION',
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'redistribution_allowed': False,
              'acceptance_policy_changed': False,
              'historical_values_promotion_allowed': False,
              'cross_run_value_fusion': False,
              'cross_crop_value_fusion': False,
              'images_persisted': False,
              'missing_values_inferred': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          (root / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          (root / 'results-merged.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in rows),
              encoding='utf-8',
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))

          db = sqlite3.connect(root / 'staging.sqlite')
          db.execute(
              'CREATE TABLE ocr_results ('
              'product_id TEXT PRIMARY KEY, status TEXT NOT NULL, basis TEXT, '
              'calories REAL, fat_g REAL, carbohydrate_g REAL, protein_g REAL, '
              'evidence_level TEXT NOT NULL, source TEXT NOT NULL, image_url TEXT NOT NULL, '
              'redistribution_allowed INTEGER NOT NULL, raw_json TEXT NOT NULL)'
          )
          for row in rows:
              nutrition = row.get('nutrition') or {}
              db.execute('INSERT INTO ocr_results VALUES (?,?,?,?,?,?,?,?,?,?,?,?)', (
                  str(row.get('product_id') or ''), str(row.get('status') or ''), row.get('basis'),
                  nutrition.get('calories'), nutrition.get('fat_g'),
                  nutrition.get('carbohydrate_g'), nutrition.get('protein_g'),
                  str(row.get('evidence_level') or ''), 'MERCADONA_FIRST_PARTY/label image',
                  str(row.get('image_url') or ''), 0,
                  json.dumps(row, ensure_ascii=False, sort_keys=True),
              ))
          db.commit()
          db.close()
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-ambiguous-primary-column-pilot
          path: tools/catalog/mercadona-ambiguous-primary-column-pilot/
          retention-days: 30
          if-no-files-found: error

      - name: Trigger strict canonical reconciliation after this pilot
        if: steps.live.outputs.count != '' && steps.live.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run catalog-mercadona-current-ocr-residual-audit.yml --ref agent/catalog-phase1
