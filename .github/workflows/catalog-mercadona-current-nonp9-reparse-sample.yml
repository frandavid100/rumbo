name: Catalog Mercadona current non-P9 parser reparse sample

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-current-nonp9-reparse-sample.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: catalog-mercadona-current-nonp9-reparse-sample-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reparse:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download prior verified current-image selection
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/source-canary
          mkdir -p /tmp/source-canary
          gh run download 35745857558 -n mercadona-current-unique-non-p9-safe-canary -D /tmp/source-canary

      - name: Revalidate exact current EAN and image identity
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          root=mercadona-current-nonp9-reparse-sample
          rm -rf "$root"
          python mercadona_current_nonp9_reparse_prepare.py \
            --selection /tmp/source-canary/selection-summary.json \
            --out "$root" \
            --source-run-id 35745857558 \
            --targets 59101 59280
          test "$(wc -l < "$root/products.jsonl" | tr -d ' ')" = '2'

      - name: Install OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow

      - name: Run conservative OCR safety tests
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_label_image_preprocess.py \
            test_mercadona_current_canary_finalize.py \
            test_mercadona_preselected_current_image_routing.py \
            test_mercadona_preselected_three_of_four_variant_rescue.py \
            test_mercadona_ocr_safety_regressions.py \
            test_nutrition_label_reader.py \
            test_nutrition_ocr_ensemble.py

      - name: Fresh OCR with patched parser
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          root=mercadona-current-nonp9-reparse-sample
          set +e
          python mercadona_preselected_current_image_variant_rescue.py \
            --products "$root/products.jsonl" \
            --out "$root/ocr" \
            --shard-index 0 \
            --shard-count 1 \
            --limit 0
          rc=$?
          set -e
          [[ $rc -eq 0 || $rc -eq 2 ]]
          python mercadona_current_canary_finalize.py --root "$root"

      - name: Assert provenance and parser-regression contract
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('mercadona-current-nonp9-reparse-sample')
          rows = [json.loads(line) for line in (root / 'results-merged.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          if {str(row.get('product_id')) for row in rows} != {'59101', '59280'}:
              raise SystemExit('unexpected product set')
          for row in rows:
              if row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE':
                  raise SystemExit('wrong evidence level')
              if row.get('source') != 'MERCADONA_FIRST_PARTY' or row.get('source_record_kind') != 'label image':
                  raise SystemExit('wrong source provenance')
              if row.get('redistribution_allowed') is not False:
                  raise SystemExit('redistribution must remain false')
              if row.get('canonical_ean') != row.get('current_ean') or not row.get('canonical_ean'):
                  raise SystemExit('EAN identity not revalidated')
              if row.get('image_identity_rule') != 'EXACT_CURRENT_ONLY_NON_P9_ZOOM_SAME_URL_RETRY':
                  raise SystemExit('unexpected image identity rule')
              if row.get('missing_values_inferred') is not False:
                  raise SystemExit('missing values must never be inferred')
          print(json.dumps({'products': len(rows), 'statuses': [row.get('status') for row in rows]}, indent=2))
          PY

      - name: Upload auditable fresh reparse sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercadona-current-nonp9-reparse-sample
          path: |
            tools/catalog/mercadona-current-nonp9-reparse-sample/selection-summary.json
            tools/catalog/mercadona-current-nonp9-reparse-sample/results-merged.jsonl
            tools/catalog/mercadona-current-nonp9-reparse-sample/summary.json
            tools/catalog/mercadona-current-nonp9-reparse-sample/ocr/results-*.jsonl
            tools/catalog/mercadona-current-nonp9-reparse-sample/ocr/summary-*.json
          retention-days: 90
          if-no-files-found: error

      - name: Reconcile canonical OCR after successful reparse
        if: success()
        run: gh workflow run catalog-mercadona-current-ocr-residual-audit.yml --ref agent/catalog-phase1
