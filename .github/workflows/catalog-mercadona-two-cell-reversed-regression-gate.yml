name: Catalog Mercadona two-cell reversed parser regression gate

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-two-cell-reversed-regression-gate.yml'
      - 'tools/catalog/mercadona_nutrition_label_structural_repair.py'
      - 'tools/catalog/test_mercadona_nutrition_label_structural_repair.py'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: catalog-mercadona-two-cell-reversed-regression-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run parser and ensemble safety regressions
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_mercadona_nutrition_label_structural_repair.py \
            test_nutrition_label_reader.py \
            test_nutrition_ocr_ensemble.py

      - name: Relaunch bounded non-contradictory REVIEW sample
        run: |
          gh workflow run catalog-mercadona-review-regression-doctr-pilot.yml \
            --repo frandavid100/rumbo \
            --ref agent/catalog-phase1
