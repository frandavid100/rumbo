name: Catalog Alcampo direct v2

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - 'tools/catalog/alcampo_direct_catalog_v2.py'
      - '.github/workflows/catalog-alcampo-direct-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-alcampo-direct-v2
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - name: Crawl Alcampo smoke
        working-directory: tools/catalog
        run: python alcampo_direct_catalog_v2.py --out alcampo-direct-v2-smoke --workers 8 --max-products 120 --min-discovered 50
      - name: Persist smoke summary
        run: |
          cp tools/catalog/alcampo-direct-v2-smoke/summary.json tools/catalog/fixtures/alcampo_direct_v2_smoke_summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/catalog/fixtures/alcampo_direct_v2_smoke_summary.json
          git diff --cached --quiet || git commit -m "catalog: persist Alcampo direct v2 smoke"
          git push origin HEAD:agent/catalog-phase1
      - uses: actions/upload-artifact@v4
        with:
          name: alcampo-direct-v2-smoke
          path: tools/catalog/alcampo-direct-v2-smoke/
          retention-days: 7

  full:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - name: Crawl complete Alcampo food catalog
        working-directory: tools/catalog
        run: python alcampo_direct_catalog_v2.py --out alcampo-direct-v2-full --workers 20 --min-discovered 1000
      - name: Persist final summary
        run: |
          cp tools/catalog/alcampo-direct-v2-full/summary.json tools/catalog/fixtures/alcampo_direct_v2_latest_summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/catalog/fixtures/alcampo_direct_v2_latest_summary.json
          git diff --cached --quiet || git commit -m "catalog: persist Alcampo direct v2 full summary"
          git push origin HEAD:agent/catalog-phase1
      - uses: actions/upload-artifact@v4
        with:
          name: alcampo-direct-v2-full
          path: |
            tools/catalog/alcampo-direct-v2-full/alcampo_food_catalog.sqlite
            tools/catalog/alcampo-direct-v2-full/observations.jsonl
            tools/catalog/alcampo-direct-v2-full/summary.json
          retention-days: 7
          if-no-files-found: error
