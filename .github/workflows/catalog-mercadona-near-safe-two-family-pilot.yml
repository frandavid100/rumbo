name: Catalog Mercadona near-safe two-family pilot

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-near-safe-two-family-pilot.yml'
      - 'tools/catalog/mercadona_bounded_doctr_rescue.py'
      - 'tools/catalog/test_mercadona_bounded_doctr_rescue.py'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: catalog-mercadona-near-safe-two-family-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve latest successful strict OCR audit
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            '/repos/frandavid100/rumbo/actions/workflows/catalog-mercadona-current-ocr-residual-audit.yml/runs?branch=agent%2Fcatalog-phase1&per_page=20' \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id')
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo 'No successful strict OCR audit found' >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download strict OCR audit
        uses: actions/download-artifact@v4
        with:
          name: mercadona-current-ocr-residual-audit
          path: tools/catalog/two-family-audit
          github-token: ${{ github.token }}
          run-id: ${{ steps.audit.outputs.run_id }}

      - name: Select clean complete 0/1-of-4 two-family REVIEW targets
        id: targets
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          core = ('calories', 'fat_g', 'carbohydrate_g', 'protein_g')
          src = Path('two-family-audit/current-review-failure-modes/near-safe-complete-review.jsonl')
          rows = []
          for line in src.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              row = json.loads(line)
              values = row.get('diagnostic_candidate_values') or {}
              pid = str(row.get('product_id') or '').strip()
              corroborated = int(row.get('corroborated_fields') or 0)
              families = int(row.get('independent_engine_families') or 0)
              if (
                  row.get('canonical_status') == 'REVIEW'
                  and corroborated in {0, 1}
                  and families == 2
                  and row.get('basis') in {'100_g', '100_ml'}
                  and all(values.get(field) is not None for field in core)
                  and not (row.get('safety_blockers') or [])
                  and pid
                  and str(row.get('ean') or '').strip()
                  and str(row.get('image_url') or '').strip()
              ):
                  rows.append(row)
          rows.sort(key=lambda row: (-int(row.get('corroborated_fields') or 0), len(str(row['product_id'])), str(row['product_id'])))
          Path('two-family-targets.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in rows), encoding='utf-8'
          )
          Path('two-family-inventory.jsonl').write_text(
              ''.join(json.dumps({'product_id': str(row['product_id'])}, sort_keys=True) + '\n' for row in rows), encoding='utf-8'
          )
          print(json.dumps({
              'target_count': len(rows),
              'product_ids': [str(row['product_id']) for row in rows],
              'corroborated_fields': [int(row.get('corroborated_fields') or 0) for row in rows],
              'selection': 'CLEAN_COMPLETE_CURRENT_REVIEW; 0_OR_1_OF_4_CORROBORATED; EXACTLY_TWO_OCR_FAMILIES; EXPLICIT_PER_100_BASIS; NO_HARD_BLOCKER',
          }, sort_keys=True))
          Path('two-family-target-count.txt').write_text(str(len(rows)), encoding='utf-8')
          PY
          echo "count=$(cat two-family-target-count.txt)" >> "$GITHUB_OUTPUT"

      - name: Rehydrate current official first-party details
        if: steps.targets.outputs.count != '0'
        working-directory: tools/catalog
        run: |
          set -euo pipefail
          rm -rf mercadona-first-party-two-family-live
          python mercadona_first_party_details.py \
            --inventory two-family-inventory.jsonl \
            --out mercadona-first-party-two-family-live \
            --shard-index 0 \
            --shard-count 1 \
            --timeout 20 \
            --delay 0.2
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('mercadona-first-party-two-family-live')
          summary = json.loads((root / 'summary-00.json').read_text(encoding='utf-8'))
          errors = [json.loads(line) for line in (root / 'errors-00.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          if errors or summary.get('fetched') != summary.get('requested'):
              raise SystemExit(f'Targeted first-party rehydration incomplete: summary={summary} errors={errors}')
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY

      - name: Require exact EAN and exact first-party perspective=9 image
        id: live
        if: steps.targets.outputs.count != '0'
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mercadona-two-family-input
          mkdir -p mercadona-two-family-input
          python - <<'PY'
          import json
          from pathlib import Path

          targets = {
              str(row['product_id']): row
              for row in (json.loads(line) for line in Path('two-family-targets.jsonl').read_text(encoding='utf-8').splitlines() if line.strip())
          }
          selected = []
          rejected = {'missing_current_ean': [], 'reassigned': [], 'unmatched_p9': []}
          for line in Path('mercadona-first-party-two-family-live/details-00.jsonl').read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              product = json.loads(line)
              pid = str(product.get('product_id') or '').strip()
              target = targets.get(pid)
              if target is None:
                  continue
              anchor_ean = str(target.get('ean') or '').strip()
              current_ean = str(product.get('ean') or '').strip()
              if not current_ean:
                  rejected['missing_current_ean'].append(pid); continue
              if current_ean != anchor_ean:
                  rejected['reassigned'].append(pid); continue
              anchor_url = str(target.get('image_url') or '').strip()
              photos = product.get('photos') if isinstance(product.get('photos'), list) else []
              matches = [(idx, photo) for idx, photo in enumerate(photos)
                         if isinstance(photo, dict)
                         and str(photo.get('perspective') or '') == '9'
                         and str(photo.get('zoom') or '') == anchor_url]
              if len(matches) != 1:
                  rejected['unmatched_p9'].append(pid); continue
              image_index, photo = matches[0]
              candidate = dict(product)
              candidate['photos'] = [dict(photo)]
              candidate['_two_family_meta'] = {
                  'anchor_ean': anchor_ean,
                  'current_ean': current_ean,
                  'image_url': anchor_url,
                  'image_index': image_index,
                  'perspective': 9,
                  'prior_corroborated_fields': int(target.get('corroborated_fields') or 0),
                  'prior_engine_families': int(target.get('independent_engine_families') or 0),
                  'latest_raw_run_id': target.get('latest_raw_run_id'),
              }
              selected.append(candidate)

          selected.sort(key=lambda row: (0 if row.get('ingredients') else 1, -int((row.get('_two_family_meta') or {}).get('prior_corroborated_fields') or 0), str(row.get('product_id') or '')))
          out = Path('mercadona-two-family-input')
          with_ingredients = [row for row in selected if row.get('ingredients')]
          without_ingredients = [row for row in selected if not row.get('ingredients')]
          for name, rows in [('with-ingredients', with_ingredients), ('without-ingredients', without_ingredients)]:
              (out / f'{name}.jsonl').write_text(
                  ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in rows), encoding='utf-8'
              )
          summary = {
              'historical_inventory_products': 4280,
              'audit_targets': len(targets),
              'selected': len(selected),
              'selected_product_ids': [str(row.get('product_id')) for row in selected],
              'selected_with_structured_ingredients': len(with_ingredients),
              'selected_without_structured_ingredients': len(without_ingredients),
              **{k: sorted(set(v)) for k, v in rejected.items()},
              'selection_policy': 'CLEAN_COMPLETE_CURRENT_REVIEW_0_OR_1_OF_4; EXACTLY_TWO_OCR_FAMILIES; EXACT_CURRENT_EAN; EXACT_SAME_FIRST_PARTY_PERSPECTIVE_9_IMAGE_URL',
              'cross_run_value_fusion': False,
              'acceptance_policy_changed': False,
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'redistribution_allowed': False,
              'images_persisted': False,
              'missing_values_inferred': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          (out / 'selection-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('two-family-selected-count.txt').write_text(str(len(selected)), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY
          echo "count=$(cat two-family-selected-count.txt)" >> "$GITHUB_OUTPUT"

      - name: Install OCR dependencies
        if: steps.live.outputs.count != '' && steps.live.outputs.count != '0'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check \
            'paddleocr>=3.7,<3.8' \
            'easyocr>=1.7,<1.8' \
            'python-doctr==1.1.0' \
            opencv-python-headless Pillow

      - name: Run conservative OCR safety regressions
        if: steps.live.outputs.count != '' && steps.live.outputs.count != '0'
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_mercadona_bounded_doctr_rescue.py \
            test_mercadona_near_safe_doctr_retry.py \
            test_label_doctr_extractor.py \
            test_label_easyocr_extractor.py \
            test_mercadona_ocr_safety_regressions.py \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_label_reader_row_tokens.py \
            test_nutrition_ocr_ensemble.py \
            test_label_image_preprocess.py

      - name: Run bounded docTR and EasyOCR rescue under unchanged acceptance contract
        if: steps.live.outputs.count != '' && steps.live.outputs.count != '0'
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mercadona-near-safe-two-family-pilot
          mkdir -p mercadona-near-safe-two-family-pilot/with-ingredients mercadona-near-safe-two-family-pilot/without-ingredients
          run_group() {
            local products="$1"; local out="$2"; local mode="$3"
            [[ -s "$products" ]] || return 0
            set +e
            python mercadona_bounded_doctr_rescue.py \
              --products "$products" --out "$out" \
              --shard-index 0 --shard-count 1 --limit 0 \
              --eligibility-mode "$mode"
            rc=$?
            set -e
            [[ $rc -eq 0 || $rc -eq 2 ]] || return "$rc"
          }
          run_group mercadona-two-family-input/with-ingredients.jsonl mercadona-near-safe-two-family-pilot/with-ingredients priority
          run_group mercadona-two-family-input/without-ingredients.jsonl mercadona-near-safe-two-family-pilot/without-ingredients p9-no-ingredients-all

          python - <<'PY'
          from collections import Counter
          import glob, json, sqlite3
          from pathlib import Path

          selection = json.loads(Path('mercadona-two-family-input/selection-summary.json').read_text(encoding='utf-8'))
          expected = set(selection.get('selected_product_ids') or [])
          meta = {}
          for path in ('mercadona-two-family-input/with-ingredients.jsonl', 'mercadona-two-family-input/without-ingredients.jsonl'):
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  if line.strip():
                      product = json.loads(line)
                      meta[str(product.get('product_id'))] = product.get('_two_family_meta') or {}

          rows, seen = [], set()
          for path in sorted(glob.glob('mercadona-near-safe-two-family-pilot/**/results-*.jsonl', recursive=True)):
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  if not line.strip(): continue
                  row = json.loads(line); pid = str(row.get('product_id') or '')
                  if not pid or pid in seen: raise SystemExit(f'missing/duplicate pilot product: {pid}')
                  seen.add(pid)
                  image_meta = meta.get(pid)
                  if image_meta is None or str(row.get('image_url') or '') != str(image_meta.get('image_url') or ''):
                      raise SystemExit(f'pilot image provenance mismatch: {pid}')
                  row['image_index'] = image_meta.get('image_index')
                  row['perspective'] = 9
                  row['pilot_prior_corroborated_fields'] = image_meta.get('prior_corroborated_fields')
                  row['pilot_prior_engine_families'] = image_meta.get('prior_engine_families')
                  row['cross_run_value_fusion'] = False
                  row['acceptance_policy_changed'] = False
                  rows.append(row)
          if seen != expected:
              raise SystemExit(f'pilot result IDs differ from selected cohort: missing={sorted(expected-seen)} unexpected={sorted(seen-expected)}')

          invalid = []
          for row in rows:
              pid = str(row.get('product_id'))
              if (row.get('source') != 'MERCADONA_FIRST_PARTY'
                  or row.get('source_record_kind') != 'label image'
                  or row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE'
                  or row.get('redistribution_allowed') is not False
                  or row.get('perspective') != 9
                  or int(row.get('pilot_prior_corroborated_fields') or 0) not in {0, 1}
                  or int(row.get('pilot_prior_engine_families') or 0) != 2
                  or row.get('cross_run_value_fusion') is not False
                  or row.get('acceptance_policy_changed') is not False):
                  invalid.append(pid)
              if row.get('status') == 'DECLARED':
                  attempt = next((a for a in row.get('attempts', []) if (a.get('ensemble') or {}).get('status') == 'DECLARED'), None)
                  ensemble = (attempt or {}).get('ensemble') or {}
                  nutrition = ensemble.get('nutrition') or {}
                  if (ensemble.get('basis') not in {'100_g','100_ml'}
                      or int(ensemble.get('independent_engine_families') or 0) < 2
                      or int(ensemble.get('corroborated_fields') or 0) != 4
                      or any(nutrition.get(field) is None for field in ('calories','fat_g','carbohydrate_g','protein_g'))):
                      invalid.append(pid)
          if invalid: raise SystemExit(f'invalid two-family pilot rows: {sorted(set(invalid))}')

          counts = Counter(str(row.get('status') or 'UNKNOWN') for row in rows)
          out = Path('mercadona-near-safe-two-family-pilot/merged'); out.mkdir(parents=True, exist_ok=True)
          (out / 'results-merged.jsonl').write_text(''.join(json.dumps(row, ensure_ascii=False, sort_keys=True)+'\n' for row in rows), encoding='utf-8')
          (out / 'selection-summary.json').write_text(json.dumps(selection, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          summary = {
              'inventory_products': 4280,
              'processed': len(rows),
              'status_counts': dict(sorted(counts.items())),
              'declared': counts.get('DECLARED',0), 'review': counts.get('REVIEW',0), 'error': counts.get('ERROR',0),
              'no_visual_region': sum(row.get('visual_regions_detected') == 0 for row in rows),
              'declared_product_ids': [str(row.get('product_id')) for row in rows if row.get('status') == 'DECLARED'],
              'selection': selection,
              'cross_run_value_fusion': False, 'acceptance_policy_changed': False,
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE', 'source': 'MERCADONA_FIRST_PARTY/label image',
              'redistribution_allowed': False, 'images_persisted': False, 'missing_values_inferred': False,
              'structured_api_macros_claimed': False, 'CLASSIFIED': 0, 'MENU_ELIGIBLE': 0,
          }
          (out / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          db = sqlite3.connect(out / 'staging.sqlite')
          db.execute('''CREATE TABLE mercadona_ocr_staging (
              product_id TEXT PRIMARY KEY, product_name TEXT, status TEXT NOT NULL, basis TEXT,
              calories REAL, fat_g REAL, carbohydrate_g REAL, protein_g REAL, image_url TEXT,
              evidence_level TEXT NOT NULL, source TEXT NOT NULL, source_record_kind TEXT NOT NULL,
              redistribution_allowed INTEGER NOT NULL, parser_engine TEXT, observed_at TEXT, raw_json TEXT NOT NULL)''')
          for row in rows:
              attempt = next((a for a in row.get('attempts', []) if (a.get('ensemble') or {}).get('status') == 'DECLARED'), None)
              ensemble = (attempt or {}).get('ensemble') or {}
              nutrition = (ensemble.get('nutrition') or {}) if row.get('status') == 'DECLARED' else {}
              db.execute('INSERT INTO mercadona_ocr_staging VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)', (
                  str(row.get('product_id')), row.get('product_name') or row.get('name'), row.get('status'),
                  ensemble.get('basis') if row.get('status') == 'DECLARED' else None,
                  nutrition.get('calories'), nutrition.get('fat_g'), nutrition.get('carbohydrate_g'), nutrition.get('protein_g'),
                  row.get('image_url'), row.get('evidence_level'), row.get('source'), row.get('source_record_kind'), 0,
                  row.get('parser_engine') or row.get('engine') or row.get('ocr_engine'),
                  row.get('observed_at') or row.get('fetched_at') or row.get('created_at'), json.dumps(row, ensure_ascii=False, sort_keys=True)))
          db.commit(); db.close()
          forbidden = [str(path) for path in out.rglob('*') if path.is_file() and path.suffix.lower() in {'.jpg','.jpeg','.png','.webp','.avif','.gif'}]
          if forbidden: raise SystemExit(f'image files must not be persisted: {forbidden}')
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: steps.live.outputs.count != '' && steps.live.outputs.count != '0'
        with:
          name: mercadona-near-safe-two-family-pilot
          path: tools/catalog/mercadona-near-safe-two-family-pilot/merged/
          retention-days: 90
          if-no-files-found: error

      - name: Reconcile strict historical canonical OCR after pilot evidence
        if: steps.live.outputs.count != '' && steps.live.outputs.count != '0'
        run: |
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            '/repos/frandavid100/rumbo/actions/workflows/catalog-mercadona-current-ocr-residual-audit.yml/dispatches' \
            -f ref='agent/catalog-phase1'
