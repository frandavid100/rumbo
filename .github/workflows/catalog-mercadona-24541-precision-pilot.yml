name: Catalog Mercadona 24541 precision pilot

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-24541-precision-pilot.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: catalog-mercadona-24541-precision-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Revalidate exact first-party identity and perspective-9 image
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from mercadona_first_party_details import _get_json, normalize, _now

          product_id = '24541'
          expected_ean = '8402001050428'
          expected_image = 'https://prod-mercadona.imgix.net/images/778d340daab64031f191ec5cac1b87ab.jpg?fit=crop&h=3600&w=3600'
          observed_at = _now()
          payload, source_url = _get_json(product_id, timeout=20.0)
          current = normalize(payload, source_url=source_url, observed_at=observed_at)
          if str(current.get('ean') or '').strip() != expected_ean:
              raise SystemExit(f'Current EAN mismatch for {product_id}')
          photos = current.get('photos') if isinstance(current.get('photos'), list) else []
          matches = [
              (index, photo) for index, photo in enumerate(photos)
              if isinstance(photo, dict)
              and str(photo.get('perspective') or '') == '9'
              and str(photo.get('zoom') or '') == expected_image
          ]
          if len(matches) != 1:
              raise SystemExit(f'Exact anchored first-party p9 image is not uniquely current: {len(matches)} matches')
          image_index, photo = matches[0]
          routed = dict(photo)
          routed['perspective'] = 9
          current['photos'] = [routed]
          current['_targeted_revalidation_meta'] = {
              'canonical_ean': expected_ean,
              'image_url': expected_image,
              'image_index': image_index,
              'historical_diagnostic_tuple_only': {
                  'calories': 369.0,
                  'fat_g': 1.5,
                  'carbohydrate_g': 85.0,
                  'protein_g': 2.1,
              },
              'historical_values_promotion_allowed': False,
              'cross_run_value_fusion': False,
              'cross_crop_value_fusion': False,
              'live_detail_source_url': source_url,
              'live_detail_observed_at': observed_at,
          }
          Path('target-24541-precision.jsonl').write_text(
              json.dumps(current, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8'
          )
          Path('target-24541-precision-identity.json').write_text(
              json.dumps({
                  'product_id': product_id,
                  'ean_exact': True,
                  'image_exact_unique_p9': True,
                  'image_index': image_index,
                  'image_url': expected_image,
                  'images_persisted': False,
                  'redistribution_allowed': False,
              }, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Install OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check \
            'paddleocr>=3.7,<3.8' \
            'easyocr>=1.7,<1.8' \
            'python-doctr==1.1.0' \
            opencv-python-headless Pillow

      - name: Run conservative routing and precision-raster regressions
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_mercadona_primary_precision_variants.py \
            test_mercadona_ambiguous_primary_column_rescue.py \
            test_mercadona_bounded_doctr_rescue.py \
            test_mercadona_near_safe_doctr_retry.py \
            test_label_doctr_extractor.py \
            test_mercadona_nutrition_label_percentage_guard.py \
            test_mercadona_ocr_safety_regressions.py \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_label_reader_row_tokens.py \
            test_nutrition_ocr_ensemble.py \
            test_label_image_preprocess.py

      - name: Run isolated lossless precision observations without cross-crop fusion
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mercadona-24541-precision-pilot
          mkdir -p mercadona-24541-precision-pilot/raw
          mode=$(python - <<'PY'
          import json
          row=json.loads(open('target-24541-precision.jsonl',encoding='utf-8').read())
          print('priority' if row.get('ingredients') else 'p9-no-ingredients-all')
          PY
          )
          set +e
          python mercadona_ambiguous_precision_rescue.py \
            --products target-24541-precision.jsonl \
            --out mercadona-24541-precision-pilot/raw \
            --shard-index 0 --shard-count 1 --limit 0 --eligibility-mode "$mode"
          rc=$?
          set -e
          [[ $rc -eq 0 || $rc -eq 2 ]]

      - name: Validate fresh observation and materialize auditable bundle
        id: validate
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, json, os, sqlite3
          from pathlib import Path

          CORE=('calories','fat_g','carbohydrate_g','protein_g')
          HARD=('OCR_FIELD_CONFLICT','OCR_SAME_ENGINE_CONFLICT','OCR_BASIS_CONFLICT',
                'ENERGY_MACRO_MISMATCH','MULTIPLE_NUTRITION_COLUMNS',
                'UNCORROBORATED_CORE_FIELDS','UNCORROBORATED_BASIS')
          root=Path('mercadona-24541-precision-pilot')
          target=json.loads(Path('target-24541-precision.jsonl').read_text(encoding='utf-8'))
          meta=target['_targeted_revalidation_meta']
          rows=[]
          for path in sorted(glob.glob(str(root/'raw'/'results-*.jsonl'))):
              rows.extend(json.loads(x) for x in Path(path).read_text(encoding='utf-8').splitlines() if x.strip())
          if len(rows) != 1 or str(rows[0].get('product_id') or '') != '24541':
              raise SystemExit(f'Unexpected result coverage: {[(r.get("product_id"),r.get("status")) for r in rows]}')
          row=rows[0]
          if str(row.get('ean') or '') != meta['canonical_ean']:
              raise SystemExit('Fresh OCR EAN differs from exact current anchor')
          if str(row.get('image_url') or '') != meta['image_url']:
              raise SystemExit('Fresh OCR image differs from exact current p9 anchor')
          if row.get('source')!='MERCADONA_FIRST_PARTY' or row.get('source_record_kind')!='label image':
              raise SystemExit('Source provenance changed unexpectedly')
          if row.get('evidence_level')!='OCR_DERIVED_FROM_MERCADONA_IMAGE' or row.get('redistribution_allowed') is not False:
              raise SystemExit('Evidence/redistribution contract changed unexpectedly')

          status=str(row.get('status') or '')
          if status not in {'DECLARED','REVIEW'}:
              raise SystemExit(f'Unexpected bounded OCR status {status!r}')
          promotion=False
          accepted_ensemble=None
          diagnostic_match=None
          nutrition=None
          if status=='DECLARED':
              if row.get('basis') not in {'100_g','100_ml'}:
                  raise SystemExit('DECLARED lacks explicit per-100 basis')
              nutrition=row.get('nutrition') or {}
              if any(not isinstance(nutrition.get(f),(int,float)) for f in CORE):
                  raise SystemExit('DECLARED lacks complete four-field tuple')
              expected=meta['historical_diagnostic_tuple_only']
              diagnostic_match=all(abs(float(nutrition[f])-float(expected[f])) <= 1e-9 for f in CORE)
              candidates=[]
              for attempt in row.get('attempts',[]):
                  ensemble=attempt.get('ensemble') or {}
                  reasons=tuple(str(x) for x in ensemble.get('reasons') or [])
                  hard=[r for r in reasons if r.startswith(HARD)]
                  fields={str(field.get('name') or ''):field for field in (ensemble.get('fields') or []) if isinstance(field,dict)}
                  per_field_ok=all(
                      bool((fields.get(f) or {}).get('corroborated'))
                      and len(set((fields.get(f) or {}).get('engine_families') or [])) >= 2
                      for f in CORE
                  )
                  if (ensemble.get('status')=='DECLARED'
                      and ensemble.get('basis') in {'100_g','100_ml'}
                      and int(ensemble.get('independent_engine_families') or 0)>=2
                      and int(ensemble.get('corroborated_fields') or 0)>=4
                      and per_field_ok
                      and (ensemble.get('nutrition') or {})==nutrition
                      and not hard):
                      candidates.append(ensemble)
              if not candidates:
                  raise SystemExit('Fresh DECLARED does not independently satisfy unchanged 4/4 >=2-family safety contract')
              accepted_ensemble=candidates[0]
              promotion=True

          row['image_index']=meta['image_index']
          row['perspective']=9
          row['live_detail_source_url']=meta['live_detail_source_url']
          row['live_detail_observed_at']=meta['live_detail_observed_at']
          row['precision_pilot']={
              'fresh_tuple_matches_historical_diagnostic':diagnostic_match,
              'historical_values_promotion_allowed':False,
              'historical_tuple_match_required_for_promotion':False,
              'cross_run_value_fusion':False,
              'cross_crop_value_fusion':False,
              'acceptance_policy_changed':False,
              'promotion_allowed':promotion,
              'fresh_corroborated_fields':int((accepted_ensemble or {}).get('corroborated_fields') or 0),
              'fresh_independent_engine_families':int((accepted_ensemble or {}).get('independent_engine_families') or 0),
              'preprocessing':'lossless_png_3x_lanczos_autocontrast_light_unsharp',
          }
          (root/'results-merged.jsonl').write_text(json.dumps(row,ensure_ascii=False,sort_keys=True)+'\n',encoding='utf-8')
          summary={
              'inventory_products':4280,
              'processed':1,
              'status':status,
              'fresh_declared':promotion,
              'fresh_tuple_matches_historical_diagnostic':diagnostic_match,
              'nutrition':nutrition if promotion else None,
              'basis':row.get('basis') if promotion else None,
              'fresh_corroborated_fields':int((accepted_ensemble or {}).get('corroborated_fields') or 0),
              'fresh_independent_engine_families':int((accepted_ensemble or {}).get('independent_engine_families') or 0),
              'evidence_level':'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source':'MERCADONA_FIRST_PARTY/label image',
              'redistribution_allowed':False,
              'images_persisted':False,
              'missing_values_inferred':False,
              'structured_api_macros_claimed':False,
              'acceptance_policy_changed':False,
              'historical_values_promotion_allowed':False,
              'historical_tuple_match_required_for_promotion':False,
              'cross_run_value_fusion':False,
              'cross_crop_value_fusion':False,
              'preprocessing':'lossless_png_3x_lanczos_autocontrast_light_unsharp',
              'CLASSIFIED':0,
              'MENU_ELIGIBLE':0,
          }
          (root/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          db=sqlite3.connect(root/'staging.sqlite')
          db.execute('CREATE TABLE IF NOT EXISTS ocr_rows (product_id TEXT PRIMARY KEY, ean TEXT, status TEXT, basis TEXT, calories REAL, fat_g REAL, carbohydrate_g REAL, protein_g REAL, evidence_level TEXT, source TEXT, source_record_kind TEXT, image_url TEXT, redistribution_allowed INTEGER, raw_json TEXT NOT NULL)')
          values=nutrition if promotion else {}
          db.execute('INSERT OR REPLACE INTO ocr_rows VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?)',(
              '24541',row.get('ean'),status,row.get('basis') if promotion else None,
              values.get('calories'),values.get('fat_g'),values.get('carbohydrate_g'),values.get('protein_g'),
              row.get('evidence_level'),row.get('source'),row.get('source_record_kind'),row.get('image_url'),0,
              json.dumps(row,ensure_ascii=False,sort_keys=True)))
          db.commit(); db.close()
          with open(Path(os.environ['GITHUB_OUTPUT']),'a',encoding='utf-8') as fh:
              fh.write(f'fresh_declared={str(promotion).lower()}\n')
          print(json.dumps(summary,sort_keys=True))
          PY

      - name: Upload auditable precision pilot
        uses: actions/upload-artifact@v4
        with:
          name: mercadona-24541-precision-pilot
          path: |
            tools/catalog/mercadona-24541-precision-pilot/results-merged.jsonl
            tools/catalog/mercadona-24541-precision-pilot/summary.json
            tools/catalog/mercadona-24541-precision-pilot/staging.sqlite
            tools/catalog/mercadona-24541-precision-pilot/raw/**/*.jsonl
            tools/catalog/mercadona-24541-precision-pilot/raw/**/*.json
            tools/catalog/target-24541-precision-identity.json
          if-no-files-found: error
          retention-days: 30

      - name: Trigger strict residual reconciliation after a fresh promotion only
        if: steps.validate.outputs.fresh_declared == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run catalog-mercadona-current-ocr-residual-audit.yml --ref agent/catalog-phase1
