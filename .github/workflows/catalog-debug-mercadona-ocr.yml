name: Catalog debug Mercadona OCR

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - 'tools/catalog/debug_mercadona_ocr.py'
      - '.github/workflows/catalog-debug-mercadona-ocr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - name: Leer cuatro etiquetas reales
        working-directory: tools/catalog
        run: python debug_mercadona_ocr.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-mercadona-ocr
          path: tools/catalog/debug-mercadona-ocr.json
          if-no-files-found: warn
          retention-days: 1
