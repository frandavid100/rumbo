name: Catalog Mercadona neural OCR p9 alternative pilot

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-neural-ocr-p9-alternative-pilot.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-neural-ocr-p9-alternative-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        perspective: [1, 2, 3, 10]
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download consolidated Mercadona first-party cut
        uses: actions/download-artifact@v4
        with:
          name: mercadona-first-party-final
          path: tools/catalog/mercadona-first-party-final
          github-token: ${{ github.token }}
          run-id: 33046950149
      - name: Download persisted p9 replay evidence
        uses: actions/download-artifact@v4
        with:
          name: mercadona-ocr-replay-2630
          path: tools/catalog/mercadona-ocr-replay-2630
          github-token: ${{ github.token }}
          run-id: 33256669736
      - name: Install independent OCR engines and visual detector dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow
      - name: Run conservative OCR regression tests
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_mercadona_ocr_image_candidates.py \
            test_label_easyocr_extractor.py \
            test_nutrition_label_reader.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_ocr_safety_regressions.py
          python -m py_compile mercadona_neural_ocr_p9_alternative.py
      - name: OCR deterministic still-REVIEW alternative-view sample
        working-directory: tools/catalog
        run: |
          python mercadona_neural_ocr_p9_alternative.py \
            --products mercadona-first-party-final/products.jsonl \
            --p9-replay-results mercadona-ocr-replay-2630/results-replayed.jsonl \
            --out mercadona-neural-ocr-p9-alternative-pilot \
            --required-perspective ${{ matrix.perspective }} \
            --shard-index 0 \
            --shard-count 1 \
            --limit 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-neural-ocr-p9-alternative-pilot-p${{ matrix.perspective }}
          path: tools/catalog/mercadona-neural-ocr-p9-alternative-pilot/
          retention-days: 30
          if-no-files-found: warn

  merge:
    runs-on: ubuntu-24.04
    needs: ocr
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mercadona-neural-ocr-p9-alternative-pilot-p*
          path: input
          merge-multiple: true
      - name: Merge, compare with p9 REVIEW evidence, and stage safe promotions
        run: |
          python - <<'PY'
          from collections import Counter, defaultdict
          import glob, json, sqlite3
          from pathlib import Path

          FIELDS = ('calories', 'fat_g', 'carbohydrate_g', 'protein_g')
          expected_eligible = {'1': 1047, '2': 1395, '3': 123, '10': 52}

          def close(field, a, b):
              a = float(a); b = float(b)
              if field == 'calories':
                  tolerance = max(5.0, 0.04 * max(abs(a), abs(b), 1.0))
              else:
                  tolerance = max(0.6, 0.10 * max(abs(a), abs(b), 1.0))
              return abs(a - b) <= tolerance

          rows = []
          summaries = []
          for path in sorted(glob.glob('input/results-*.jsonl')):
              rows.extend(json.loads(line) for line in Path(path).read_text(encoding='utf-8').splitlines() if line.strip())
          for path in sorted(glob.glob('input/summary-*.json')):
              summaries.append(json.loads(Path(path).read_text(encoding='utf-8')))

          observed_eligible = {str(s.get('required_perspective')): int(s.get('eligible_products', -1)) for s in summaries}
          by_perspective = Counter(str(row.get('perspective')) for row in rows)
          statuses = Counter(str(row.get('status') or 'UNKNOWN') for row in rows)
          keys = [(str(row.get('product_id') or ''), str(row.get('perspective'))) for row in rows]
          duplicates = sorted(key for key, count in Counter(keys).items() if count > 1)
          provenance_errors = []
          baseline_errors = []
          invalid_declared = []
          p9_conflicts = []
          safe_promotions = []

          for row in rows:
              pid = str(row.get('product_id') or '')
              perspective = str(row.get('perspective'))
              if (
                  row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE'
                  or row.get('source') != 'MERCADONA_FIRST_PARTY'
                  or row.get('source_record_kind') != 'label image'
                  or row.get('redistribution_allowed') is not False
                  or perspective == '9'
                  or perspective != str(row.get('required_perspective'))
              ):
                  provenance_errors.append(f'{pid}:p{perspective}')
              if row.get('p9_baseline_status') != 'REVIEW' or row.get('p9_replay_status') != 'REVIEW':
                  baseline_errors.append(f'{pid}:p{perspective}')
              if row.get('status') != 'DECLARED':
                  continue

              accepted = next(
                  (attempt for attempt in row.get('attempts') or [] if (attempt.get('ensemble') or {}).get('status') == 'DECLARED'),
                  None,
              )
              ensemble = (accepted or {}).get('ensemble') or {}
              nutrition = row.get('nutrition') or {}
              if (
                  int(ensemble.get('independent_engine_families') or 0) < 2
                  or int(ensemble.get('corroborated_fields') or 0) < 4
                  or any(nutrition.get(field) is None for field in FIELDS)
              ):
                  invalid_declared.append(f'{pid}:p{perspective}')
                  continue

              conflicts = []
              old_basis = row.get('p9_replay_basis')
              new_basis = row.get('basis')
              if old_basis and new_basis and old_basis != new_basis:
                  conflicts.append(f'basis:{old_basis}!={new_basis}')
              old_nutrition = row.get('p9_replay_nutrition') or {}
              for field in FIELDS:
                  old_value = old_nutrition.get(field)
                  new_value = nutrition.get(field)
                  if old_value is not None and new_value is not None and not close(field, old_value, new_value):
                      conflicts.append(f'{field}:{old_value}!~{new_value}')
              if conflicts:
                  p9_conflicts.append({
                      'product_id': pid,
                      'perspective': perspective,
                      'conflicts': conflicts,
                      'p9_replay_basis': old_basis,
                      'p9_replay_nutrition': old_nutrition,
                      'alternative_basis': new_basis,
                      'alternative_nutrition': nutrition,
                  })
                  continue

              safe_promotions.append({
                  'product_id': pid,
                  'ean': row.get('ean'),
                  'name': row.get('name'),
                  'alternative_perspective': perspective,
                  'basis': new_basis,
                  'nutrition': nutrition,
                  'independent_engine_families': ensemble.get('independent_engine_families'),
                  'corroborated_fields': ensemble.get('corroborated_fields'),
                  'source': 'MERCADONA_FIRST_PARTY/label image',
                  'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
                  'redistribution_allowed': False,
              })

          promotion_values = defaultdict(list)
          for promo in safe_promotions:
              promotion_values[promo['product_id']].append(promo)
          cross_alt_conflicts = []
          for pid, observations in promotion_values.items():
              if len(observations) < 2:
                  continue
              first = observations[0]
              for other in observations[1:]:
                  bad = []
                  if first.get('basis') != other.get('basis'):
                      bad.append('basis')
                  for field in FIELDS:
                      if not close(field, first['nutrition'][field], other['nutrition'][field]):
                          bad.append(field)
                  if bad:
                      cross_alt_conflicts.append({'product_id': pid, 'fields': bad})
          conflicted_ids = {item['product_id'] for item in cross_alt_conflicts}
          safe_promotions = [p for p in safe_promotions if p['product_id'] not in conflicted_ids]
          safe_product_ids = sorted({p['product_id'] for p in safe_promotions})

          summary = {
              'inventory_products': 4280,
              'baseline_p9_still_review_products': 2500,
              'pilot': 'official alternative views for products that remained REVIEW in both original p9 OCR and safe replay',
              'sample_order': 'SHA256_PRODUCT_ID_EAN; first 8 independently per perspective stratum',
              'perspectives': ['1','2','3','10'],
              'expected_eligible_by_perspective': expected_eligible,
              'observed_eligible_by_perspective': observed_eligible,
              'processed': len(rows),
              'distinct_products_processed': len({str(row.get('product_id') or '') for row in rows}),
              'processed_by_perspective': dict(sorted(by_perspective.items())),
              'status_counts': dict(sorted(statuses.items())),
              'raw_alternative_DECLARED': statuses.get('DECLARED', 0),
              'safe_new_promotion_observations': len(safe_promotions),
              'safe_new_promotion_products': len(safe_product_ids),
              'safe_new_promotion_product_ids': safe_product_ids,
              'p9_partial_conflicts': p9_conflicts,
              'cross_alternative_conflicts': cross_alt_conflicts,
              'duplicate_product_perspective_keys': duplicates,
              'provenance_errors': provenance_errors,
              'baseline_membership_errors': baseline_errors,
              'invalid_declared': invalid_declared,
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'redistribution_allowed': False,
              'images_persisted': False,
              'missing_values_inferred': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }

          out = Path('merged')
          out.mkdir(exist_ok=True)
          (out / 'results.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in rows), encoding='utf-8'
          )
          (out / 'safe-promotions.json').write_text(
              json.dumps(safe_promotions, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          (out / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')

          db = sqlite3.connect(out / 'staging.sqlite')
          try:
              db.execute('CREATE TABLE ocr_result (product_id TEXT NOT NULL, perspective TEXT NOT NULL, status TEXT NOT NULL, calories REAL, protein_g REAL, carbohydrate_g REAL, fat_g REAL, evidence_level TEXT NOT NULL, source TEXT NOT NULL, redistribution_allowed INTEGER NOT NULL, payload_json TEXT NOT NULL, PRIMARY KEY(product_id, perspective))')
              for row in rows:
                  nutrition = row.get('nutrition') or {}
                  db.execute(
                      'INSERT INTO ocr_result VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)',
                      (
                          str(row.get('product_id') or ''), str(row.get('perspective')), row.get('status'),
                          nutrition.get('calories'), nutrition.get('protein_g'), nutrition.get('carbohydrate_g'), nutrition.get('fat_g'),
                          row.get('evidence_level'), row.get('source'), 0,
                          json.dumps(row, ensure_ascii=False, sort_keys=True),
                      ),
                  )
              db.commit()
          finally:
              db.close()

          print('P9_ALTERNATIVE_PILOT_SUMMARY=' + json.dumps(summary, ensure_ascii=False, sort_keys=True))
          failures = []
          if observed_eligible != expected_eligible: failures.append(f'eligible census mismatch: {observed_eligible}')
          if len(rows) != 32: failures.append(f'processed {len(rows)} != 32')
          if any(by_perspective.get(p, 0) != 8 for p in expected_eligible): failures.append(f'perspective sample mismatch: {by_perspective}')
          if duplicates: failures.append('duplicate product/perspective keys')
          if provenance_errors: failures.append('provenance/perspective errors')
          if baseline_errors: failures.append('non-REVIEW baseline rows entered pilot')
          if invalid_declared: failures.append('unsafe raw DECLARED rows')
          if statuses.get('ERROR', 0): failures.append('product-level OCR errors')
          if cross_alt_conflicts: failures.append('conflicting DECLARED alternative views')
          if failures:
              raise SystemExit('; '.join(failures))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-neural-ocr-p9-alternative-pilot-merged
          path: merged/
          retention-days: 30
          if-no-files-found: error
