name: Catalog Alcampo network probe

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - 'tools/catalog/alcampo_network_probe.py'
      - '.github/workflows/catalog-alcampo-network-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - name: Probe Alcampo network
        working-directory: tools/catalog
        run: python alcampo_network_probe.py
      - name: Persist probe candidates
        if: always()
        run: |
          mkdir -p tools/catalog/fixtures
          if [ -f tools/catalog/alcampo-network-probe/candidates.json ]; then
            cp tools/catalog/alcampo-network-probe/candidates.json tools/catalog/fixtures/alcampo_network_probe_latest.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/catalog/fixtures/alcampo_network_probe_latest.json
            git diff --cached --quiet || git commit -m "catalog: persist Alcampo network probe"
            git push origin HEAD:agent/catalog-phase1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alcampo-network-probe
          path: tools/catalog/alcampo-network-probe/
          retention-days: 7
