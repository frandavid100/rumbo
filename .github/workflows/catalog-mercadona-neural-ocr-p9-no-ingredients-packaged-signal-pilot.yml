name: Catalog Mercadona neural OCR p9 no-ingredients packaged-signal pilot

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-neural-ocr-p9-no-ingredients-packaged-signal-pilot.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-neural-ocr-p9-no-ingredients-packaged-signal-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1]
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download consolidated Mercadona first-party cut
        uses: actions/download-artifact@v4
        with:
          name: mercadona-first-party-final
          path: tools/catalog/mercadona-first-party-final
          repository: frandavid100/rumbo
          github-token: ${{ github.token }}
          run-id: 33046950149

      - name: Install independent OCR engines and visual detector dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow

      - name: Run conservative regression tests
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_audit_mercadona_p9_no_ingredients_food_signal_candidates.py \
            test_label_easyocr_extractor.py \
            test_nutrition_label_reader.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_ocr_safety_regressions.py
          python -m py_compile \
            audit_mercadona_p9_no_ingredients_food_signal_candidates.py \
            mercadona_neural_ocr_wave.py

      - name: Audit p9 no-ingredients food-signal cohort
        working-directory: tools/catalog
        run: |
          python audit_mercadona_p9_no_ingredients_food_signal_candidates.py \
            --products mercadona-first-party-final/products.jsonl \
            --out mercadona-p9-no-ingredients-food-signal-audit

      - name: Select remaining packaged-label-friendly routing tranche
        working-directory: tools/catalog
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          source = Path('mercadona-p9-no-ingredients-food-signal-audit/candidates.jsonl')
          rows = [json.loads(line) for line in source.read_text(encoding='utf-8').splitlines() if line.strip()]

          def stable_key(row):
              product_id = str(row.get('product_id') or '')
              ean = str(row.get('ean') or '')
              digest = hashlib.sha256(f'{product_id}\0{ean}'.encode('utf-8')).hexdigest()
              return digest, product_id

          ordered = sorted(rows, key=stable_key)

          # Pilot + wave2 consumed the first 8 rows of each original 4-way shard.
          already_processed = set()
          for original_shard in range(4):
              shard_rows = [row for i, row in enumerate(ordered) if i % 4 == original_shard]
              already_processed.update(str(row.get('product_id') or '') for row in shard_rows[:8])

          raw_or_alcohol_heavy_top_levels = {
              'Bodega',
              'Carne',
              'Fruta y verdura',
              'Marisco y pescado',
          }
          packaged = [
              row for row in ordered
              if str(row.get('product_id') or '') not in already_processed
              and str(row.get('top_level_category') or '') not in raw_or_alcohol_heavy_top_levels
          ]
          packaged.sort(key=stable_key)
          if len(packaged) != 10:
              raise SystemExit(f'expected 10 packaged-label-friendly candidates, got {len(packaged)}')

          shard = int(os.environ['SHARD_INDEX'])
          selected = [row for i, row in enumerate(packaged) if i % 2 == shard]
          if len(selected) != 5:
              raise SystemExit(f'expected 5 packaged candidates for shard {shard}, got {len(selected)}')

          out = Path(f'mercadona-p9-no-ingredients-packaged-signal-pilot-candidates-{shard}')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'candidates.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in selected),
              encoding='utf-8',
          )
          (out / 'summary.json').write_text(
              json.dumps({
                  'parent_candidate_universe': len(rows),
                  'already_processed': len(already_processed),
                  'packaged_label_friendly_remaining': len(packaged),
                  'global_shard_count': 2,
                  'global_shard_index': shard,
                  'selected': len(selected),
                  'product_ids': [str(row.get('product_id') or '') for row in selected],
                  'excluded_top_levels': sorted(raw_or_alcohol_heavy_top_levels),
                  'routing_only': True,
                  'CLASSIFIED': 0,
                  'MENU_ELIGIBLE': 0,
              }, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: OCR packaged-signal pilot shard
        working-directory: tools/catalog
        run: |
          python mercadona_neural_ocr_wave.py \
            --products mercadona-p9-no-ingredients-packaged-signal-pilot-candidates-${{ matrix.shard }}/candidates.jsonl \
            --out mercadona-neural-ocr-p9-no-ingredients-packaged-signal-pilot-${{ matrix.shard }} \
            --eligibility-mode p9-no-ingredients-all \
            --shard-index 0 \
            --shard-count 1 \
            --limit 0 \
            --delay 0.5

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-neural-ocr-p9-no-ingredients-packaged-signal-pilot-${{ matrix.shard }}
          path: |
            tools/catalog/mercadona-neural-ocr-p9-no-ingredients-packaged-signal-pilot-${{ matrix.shard }}/
            tools/catalog/mercadona-p9-no-ingredients-packaged-signal-pilot-candidates-${{ matrix.shard }}/summary.json
          retention-days: 30
          if-no-files-found: warn

  merge:
    runs-on: ubuntu-24.04
    needs: ocr
    if: ${{ always() && needs.ocr.result == 'success' }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mercadona-neural-ocr-p9-no-ingredients-packaged-signal-pilot-*
          path: input
          merge-multiple: true

      - name: Merge and enforce unchanged DECLARED contract
        run: |
          python - <<'PY'
          from collections import Counter
          import glob
          import json
          import sqlite3
          from pathlib import Path

          rows = []
          for path in sorted(glob.glob('input/**/results-*.jsonl', recursive=True)):
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  if line.strip():
                      rows.append(json.loads(line))

          ids = [str(row.get('product_id') or '') for row in rows]
          duplicate_ids = sorted(pid for pid, count in Counter(ids).items() if pid and count > 1)
          invalid_declared = []
          provenance_errors = []
          for row in rows:
              if row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE':
                  provenance_errors.append(str(row.get('product_id') or ''))
              if row.get('source') != 'MERCADONA_FIRST_PARTY' or row.get('source_record_kind') != 'label image':
                  provenance_errors.append(str(row.get('product_id') or ''))
              if row.get('redistribution_allowed') is not False:
                  provenance_errors.append(str(row.get('product_id') or ''))
              if row.get('status') != 'DECLARED':
                  continue
              accepted = next(
                  (attempt for attempt in (row.get('attempts') or []) if (attempt.get('ensemble') or {}).get('status') == 'DECLARED'),
                  None,
              )
              ensemble = (accepted or {}).get('ensemble') or {}
              if (
                  int(ensemble.get('independent_engine_families') or 0) < 2
                  or int(ensemble.get('corroborated_fields') or 0) < 4
                  or ensemble.get('basis') not in {'100_g', '100_ml'}
              ):
                  invalid_declared.append(str(row.get('product_id') or ''))

          counts = Counter(str(row.get('status') or 'UNKNOWN') for row in rows)
          summary = {
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'redistribution_allowed': False,
              'parent_candidate_universe': 95,
              'prior_food_signal_processed': 32,
              'packaged_label_friendly_remaining': 10,
              'selected': 10,
              'processed': len(rows),
              'distinct_products_processed': len(set(ids)),
              'status_counts': dict(sorted(counts.items())),
              'declared_rate': round(counts['DECLARED'] / len(rows), 4) if rows else 0.0,
              'unsafe_declared': invalid_declared,
              'duplicate_product_ids': duplicate_ids,
              'provenance_errors': sorted(set(provenance_errors)),
              'images_persisted': False,
              'missing_values_inferred': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
              'safety_assessment': 'VALIDATED' if len(rows) == 10 and len(set(ids)) == 10 and not invalid_declared and not duplicate_ids and not provenance_errors else 'FAILED',
          }

          out = Path('merged')
          out.mkdir(exist_ok=True)
          (out / 'results.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in rows),
              encoding='utf-8',
          )
          (out / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          db = sqlite3.connect(out / 'staging.sqlite')
          db.execute('CREATE TABLE ocr_results (product_id TEXT PRIMARY KEY, status TEXT NOT NULL, evidence_level TEXT NOT NULL, source TEXT NOT NULL, redistribution_allowed INTEGER NOT NULL, payload_json TEXT NOT NULL)')
          for row in rows:
              db.execute(
                  'INSERT INTO ocr_results VALUES (?, ?, ?, ?, ?, ?)',
                  (
                      str(row.get('product_id') or ''),
                      str(row.get('status') or 'UNKNOWN'),
                      str(row.get('evidence_level') or ''),
                      'MERCADONA_FIRST_PARTY/label image',
                      0,
                      json.dumps(row, ensure_ascii=False, sort_keys=True),
                  ),
              )
          db.commit()
          db.close()

          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if summary['safety_assessment'] != 'VALIDATED':
              raise SystemExit('packaged-signal pilot safety/coverage checks failed')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-neural-ocr-p9-no-ingredients-packaged-signal-pilot-merged
          path: merged/
          retention-days: 30
          if-no-files-found: warn
