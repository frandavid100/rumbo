name: Dispatch Mercadona 7879 missing-basis rescue

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-7879-missing-basis-rescue-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch bounded rescue on current branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run catalog-mercadona-7879-missing-basis-expanded-crop-rescue.yml \
            --repo frandavid100/rumbo \
            --ref agent/catalog-phase1
