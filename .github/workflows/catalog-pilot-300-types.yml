name: Catalog pilot 300 types

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - 'tools/catalog/classifier.py'
      - 'tools/catalog/mercadona_weekly_catalog_adapter.py'
      - 'tools/catalog/pilot_300_types.py'
      - '.github/workflows/catalog-pilot-300-types.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  types-300:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Medir tipos sobre 300 productos
        working-directory: tools/catalog
        run: python pilot_300_types.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-pilot-300-types-report
          path: tools/catalog/pilot-300-types-report.json
          if-no-files-found: warn
          retention-days: 7
