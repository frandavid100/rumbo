name: Catalog OCR priority batch

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - 'tools/catalog/ocr_priority_batch.py'
      - 'tools/catalog/fixtures/ocr_high_probability_batch.json'
      - '.github/workflows/catalog-ocr-priority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ocr-priority:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar OCR y visión
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' opencv-python-headless Pillow
      - name: Ejecutar lote OCR priorizado
        working-directory: tools/catalog
        run: python ocr_priority_batch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-ocr-priority-report
          path: |
            tools/catalog/ocr-priority-output/summary.json
            tools/catalog/ocr-priority-output/report.json
          if-no-files-found: warn
          retention-days: 7
