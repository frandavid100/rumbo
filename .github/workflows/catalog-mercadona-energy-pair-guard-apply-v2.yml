name: Catalog Mercadona energy-pair guard apply v2

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-energy-pair-guard-apply-v2.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: catalog-mercadona-energy-pair-guard-apply-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-test-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
          fetch-depth: 0

      - name: Apply the already-audited guard transformation
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('../../.github/workflows/catalog-mercadona-energy-pair-guard-fix.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Run parser and ensemble safety tests"
          start = workflow.find(start_marker)
          end = workflow.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit(f'cannot extract audited transform: start={start} end={end}')
          script = textwrap.dedent(workflow[start + len(start_marker):end])
          if 'READER_VERSION = "1.4.31"' not in script or 'ENSEMBLE_VERSION = "1.3.7"' not in script:
              raise SystemExit('audited transform markers missing')
          exec(compile(script, '<energy-pair-guard-transform>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Install focused regression-test dependencies
        run: |
          python -m pip install --disable-pip-version-check opencv-python-headless numpy Pillow

      - name: Run focused parser, ensemble and OCR safety regressions
        working-directory: tools/catalog
        run: |
          set -euo pipefail
          python -m unittest -v \
            test_nutrition_energy_pair_guard.py \
            test_nutrition_label_reader.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_ocr_safety_regressions.py

      - name: Commit tested safety fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'catalog-agent'
          git config user.email 'catalog-agent@users.noreply.github.com'
          git add tools/catalog/nutrition_label_reader.py \
                  tools/catalog/nutrition_ocr_ensemble.py \
                  tools/catalog/test_nutrition_energy_pair_guard.py
          git diff --cached --check
          git diff --cached --quiet && { echo 'No tested guard diff to commit' >&2; exit 1; }
          git commit -m 'catalog: reject incoherent OCR energy unit pairs [skip ci]'
          git push origin HEAD:agent/catalog-phase1

      - name: Dispatch focused 86395 fresh-image canary
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run catalog-mercadona-raw-meat-doctr-rescue-pilot.yml \
            --repo frandavid100/rumbo \
            --ref agent/catalog-phase1
          echo 'Focused 86395 canary dispatched after tested guard commit.'
