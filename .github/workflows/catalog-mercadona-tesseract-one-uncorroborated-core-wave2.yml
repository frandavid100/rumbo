name: Catalog Mercadona Tesseract one-uncorroborated-core rescue wave2

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-tesseract-one-uncorroborated-core-wave2.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-tesseract-one-uncorroborated-core-wave2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6]
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download consolidated Mercadona first-party cut
        uses: actions/download-artifact@v4
        with:
          name: mercadona-first-party-final
          path: tools/catalog/mercadona-first-party-final
          repository: frandavid100/rumbo
          github-token: ${{ github.token }}
          run-id: 33046950149
      - name: Download persisted p9 replay evidence
        uses: actions/download-artifact@v4
        with:
          name: mercadona-ocr-replay-2630
          path: tools/catalog/mercadona-ocr-replay-2630
          repository: frandavid100/rumbo
          github-token: ${{ github.token }}
          run-id: 33331091953
      - name: Audit and build deterministic remaining input
        working-directory: tools/catalog
        run: |
          python audit_mercadona_p9_one_uncorroborated_core_candidates.py \
            --replay-results mercadona-ocr-replay-2630/results-replayed.jsonl \
            --out mercadona-p9-one-uncorroborated-core-audit
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          def key(row):
              pid = str(row.get('product_id') or '')
              ean = str(row.get('ean') or '')
              return hashlib.sha256(f'{pid}\0{ean}'.encode('utf-8')).hexdigest(), pid

          candidates = [json.loads(line) for line in Path('mercadona-p9-one-uncorroborated-core-audit/one-uncorroborated-core-candidates.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          if len(candidates) != 54:
              raise SystemExit(f'expected 54 audited candidates, got {len(candidates)}')
          ordered_candidates = sorted(candidates, key=key)
          pilot = ordered_candidates[:16]
          selected = ordered_candidates[16:]
          pilot_ids = {str(row['product_id']) for row in pilot}
          selected_ids = {str(row['product_id']) for row in selected}
          if len(pilot_ids) != 16 or len(selected_ids) != 38 or pilot_ids & selected_ids:
              raise SystemExit('deterministic pilot/wave2 partition mismatch')
          products = [json.loads(line) for line in Path('mercadona-first-party-final/products.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          joined_by_id = {str(row.get('product_id') or ''): row for row in products if str(row.get('product_id') or '') in selected_ids}
          output = [joined_by_id[str(candidate['product_id'])] for candidate in selected if str(candidate['product_id']) in joined_by_id]
          if len(output) != 38:
              raise SystemExit(f'wave2 join mismatch selected=38 products={len(output)}')
          Path('one-uncorroborated-core-wave2-products.jsonl').write_text(''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in output), encoding='utf-8')
          Path('one-uncorroborated-core-wave2-selection.json').write_text(json.dumps({
              'candidate_universe': 54,
              'candidate_policy': 'stable original+replay REVIEW + all 4 core values + safely explicit 100g/100ml basis + exactly 2 independent OCR families + exactly 3 corroborated core fields + exactly 1 uncorroborated core field + no OCR hard conflict + no energy/macro mismatch',
              'sample_order': 'SHA256_PRODUCT_ID_EAN',
              'excluded_pilot_count': 16,
              'excluded_pilot_product_ids': sorted(pilot_ids),
              'selected': 38,
              'product_ids': [str(row['product_id']) for row in selected],
              'uncorroborated_core_fields': {str(row['product_id']): row['uncorroborated_core_field'] for row in selected},
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Install OCR engines and preprocessing dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow
      - name: Run conservative parser and cohort regression tests
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_audit_mercadona_p9_one_uncorroborated_core_candidates.py \
            test_label_easyocr_extractor.py \
            test_nutrition_label_reader.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_ocr_safety_regressions.py \
            test_mercadona_neural_ocr_tesseract_preprocess_rescue.py
          python -m py_compile \
            audit_mercadona_p9_one_uncorroborated_core_candidates.py \
            mercadona_neural_ocr_tesseract_preprocess_rescue.py
      - name: Run remaining one-uncorroborated-core rescue wave
        working-directory: tools/catalog
        run: |
          python mercadona_neural_ocr_tesseract_preprocess_rescue.py \
            --products one-uncorroborated-core-wave2-products.jsonl \
            --out mercadona-tesseract-one-uncorroborated-core-wave2 \
            --shard-index ${{ matrix.shard }} \
            --shard-count 7 \
            --limit 0 \
            --delay 0.5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-tesseract-one-uncorroborated-core-wave2-${{ matrix.shard }}
          path: |
            tools/catalog/mercadona-tesseract-one-uncorroborated-core-wave2/
            tools/catalog/one-uncorroborated-core-wave2-selection.json
          retention-days: 30
          if-no-files-found: warn

  merge:
    runs-on: ubuntu-24.04
    needs: ocr
    if: ${{ always() && needs.ocr.result == 'success' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: mercadona-tesseract-one-uncorroborated-core-wave2-*
          path: input
          merge-multiple: true
      - name: Download persisted p9 replay evidence for exact baseline audit
        uses: actions/download-artifact@v4
        with:
          name: mercadona-ocr-replay-2630
          path: baseline-replay
          repository: frandavid100/rumbo
          github-token: ${{ github.token }}
          run-id: 33331091953
      - name: Rebuild exact audited baseline
        run: |
          python tools/catalog/audit_mercadona_p9_one_uncorroborated_core_candidates.py \
            --replay-results baseline-replay/results-replayed.jsonl \
            --out baseline-audit
      - name: Merge and enforce conservative promotion contract
        run: |
          python - <<'PY'
          from collections import Counter
          import glob, hashlib, json, sqlite3
          from pathlib import Path

          FIELDS = ('calories', 'protein_g', 'carbohydrate_g', 'fat_g')
          ALLOWED_STATUSES = {'DECLARED', 'REVIEW', 'NO_VISUAL_REGION', 'ERROR'}

          def close(field, a, b):
              a, b = float(a), float(b)
              tolerance = max(5.0, .04 * max(abs(a), abs(b), 1.0)) if field == 'calories' else max(.6, .10 * max(abs(a), abs(b), 1.0))
              return abs(a - b) <= tolerance

          def sample_key(row):
              pid = str(row.get('product_id') or '')
              ean = str(row.get('ean') or '')
              return hashlib.sha256(f'{pid}\0{ean}'.encode('utf-8')).hexdigest(), pid

          baseline_rows = [json.loads(line) for line in Path('baseline-audit/one-uncorroborated-core-candidates.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          if len(baseline_rows) != 54:
              raise SystemExit(f'expected 54 baseline candidates, got {len(baseline_rows)}')
          ordered = sorted(baseline_rows, key=sample_key)
          pilot_rows = ordered[:16]
          expected_rows = ordered[16:]
          pilot_ids = {str(row['product_id']) for row in pilot_rows}
          expected_ids = {str(row['product_id']) for row in expected_rows}
          baseline = {str(row['product_id']): row for row in expected_rows}
          if len(pilot_ids) != 16 or len(expected_ids) != 38 or pilot_ids & expected_ids:
              raise SystemExit('baseline partition mismatch')

          selection_paths = sorted(glob.glob('input/**/one-uncorroborated-core-wave2-selection.json', recursive=True))
          if not selection_paths:
              raise SystemExit('wave2 selection manifest not found')
          selections = [json.loads(Path(path).read_text(encoding='utf-8')) for path in selection_paths]
          selection = selections[0]
          if any(candidate != selection for candidate in selections[1:]):
              raise SystemExit('wave2 shard selection manifests disagree')
          if set(selection.get('product_ids') or []) != expected_ids or set(selection.get('excluded_pilot_product_ids') or []) != pilot_ids:
              raise SystemExit('selection does not match deterministic audited partition')

          result_paths = sorted(glob.glob('input/**/results-*.jsonl', recursive=True))
          if len(result_paths) != 7:
              raise SystemExit(f'expected 7 shard result files, found {len(result_paths)}: {result_paths}')
          rows = []
          for path in result_paths:
              rows.extend(json.loads(line) for line in Path(path).read_text(encoding='utf-8').splitlines() if line.strip())

          counts = Counter(str(row.get('status') or 'UNKNOWN') for row in rows)
          ids = [str(row.get('product_id') or '') for row in rows]
          observed_ids = set(ids)
          duplicate_ids = sorted(pid for pid, count in Counter(ids).items() if count > 1)
          missing_ids = sorted(expected_ids - observed_ids)
          unexpected_ids = sorted(observed_ids - expected_ids)
          pilot_overlap = sorted(observed_ids & pilot_ids)
          unexpected_statuses = sorted(set(counts) - ALLOWED_STATUSES)
          provenance_errors, unsafe_declared, value_conflicts, safe_promotions = [], [], [], []

          for row in rows:
              pid = str(row.get('product_id') or '')
              prior = baseline.get(pid)
              if prior is None:
                  provenance_errors.append(f'{pid}:not_in_wave2_baseline')
                  continue
              if (
                  row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE'
                  or row.get('source') != 'MERCADONA_FIRST_PARTY'
                  or row.get('source_record_kind') != 'label image'
                  or row.get('redistribution_allowed') is not False
                  or str(row.get('perspective')) != '9'
              ):
                  provenance_errors.append(f'{pid}:provenance')
              if row.get('status') != 'DECLARED':
                  continue
              accepted = next((attempt for attempt in row.get('attempts') or [] if (attempt.get('ensemble') or {}).get('status') == 'DECLARED'), None)
              ensemble = (accepted or {}).get('ensemble') or {}
              nutrition = row.get('nutrition') or {}
              if (
                  int(ensemble.get('independent_engine_families') or 0) < 2
                  or int(ensemble.get('corroborated_fields') or 0) < 4
                  or any(nutrition.get(field) is None for field in FIELDS)
              ):
                  unsafe_declared.append(pid)
                  continue
              conflicts = []
              if row.get('basis') != prior.get('basis'):
                  conflicts.append(f"basis:{prior.get('basis')}!={row.get('basis')}")
              prior_nutrition = prior.get('nutrition') or {}
              for field in FIELDS:
                  if prior_nutrition.get(field) is None or not close(field, nutrition[field], prior_nutrition[field]):
                      conflicts.append(f"{field}:{prior_nutrition.get(field)}!~{nutrition[field]}")
              if conflicts:
                  value_conflicts.append({'product_id': pid, 'conflicts': conflicts})
                  continue
              safe_promotions.append({
                  'product_id': pid,
                  'ean': row.get('ean'),
                  'name': row.get('name'),
                  'basis': row.get('basis'),
                  'nutrition': nutrition,
                  'independent_engine_families': ensemble.get('independent_engine_families'),
                  'corroborated_fields': ensemble.get('corroborated_fields'),
                  'source': 'MERCADONA_FIRST_PARTY/label image',
                  'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
                  'redistribution_allowed': False,
              })

          safety_ok = (
              len(rows) == 38
              and len(observed_ids) == 38
              and not duplicate_ids
              and not missing_ids
              and not unexpected_ids
              and not pilot_overlap
              and not provenance_errors
              and not unsafe_declared
              and not value_conflicts
              and not unexpected_statuses
          )
          declared = len(safe_promotions)
          cumulative_declared = 233 + declared
          cumulative_review = 2710 - declared
          summary = {
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'redistribution_allowed': False,
              'candidate_universe': len(baseline_rows),
              'excluded_pilot': len(pilot_ids),
              'selected': len(expected_ids),
              'processed': len(rows),
              'distinct_products_processed': len(observed_ids),
              'remaining_candidates': 0,
              'status_counts': dict(sorted(counts.items())),
              'safe_promotion_products': declared,
              'safe_promotion_product_ids': sorted(item['product_id'] for item in safe_promotions),
              'front_after_wave2': {
                  'universe': 54,
                  'processed': 54,
                  'DECLARED': 7 + declared,
                  'REVIEW': 47 - declared,
                  'promotion_rate_pct': round((7 + declared) * 100 / 54, 4),
                  'status': 'closed'
              },
              'value_conflicts': value_conflicts,
              'unsafe_declared': unsafe_declared,
              'duplicate_product_ids': duplicate_ids,
              'missing_product_ids': missing_ids,
              'unexpected_product_ids': unexpected_ids,
              'pilot_overlap_product_ids': pilot_overlap,
              'unexpected_statuses': unexpected_statuses,
              'provenance_errors': provenance_errors,
              'images_persisted': False,
              'missing_values_inferred': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
              'cumulative_after_wave2': {
                  'catalog_total': 4280,
                  'processed': 2943,
                  'DECLARED_complete': cumulative_declared,
                  'REVIEW': cumulative_review,
                  'complete_usable_coverage_pct': round(cumulative_declared * 100 / 4280, 4),
                  'processed_coverage_pct': round(2943 * 100 / 4280, 4),
              },
              'safety_assessment': 'VALIDATED' if safety_ok else 'FAILED',
          }
          Path('merged').mkdir(exist_ok=True)
          ordered_rows = sorted(rows, key=lambda row: str(row.get('product_id') or ''))
          Path('merged/results.jsonl').write_text(''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in ordered_rows), encoding='utf-8')
          Path('merged/safe-promotions.json').write_text(json.dumps(safe_promotions, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('merged/selection.json').write_text(json.dumps(selection, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('merged/summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          db = sqlite3.connect('merged/results.sqlite')
          db.execute('create table results(product_id text primary key, status text not null, payload_json text not null)')
          db.execute('create table safe_promotions(product_id text primary key, payload_json text not null)')
          db.executemany('insert into results values(?,?,?)', [(str(row.get('product_id') or ''), str(row.get('status') or ''), json.dumps(row, ensure_ascii=False, sort_keys=True)) for row in ordered_rows])
          db.executemany('insert into safe_promotions values(?,?)', [(str(row['product_id']), json.dumps(row, ensure_ascii=False, sort_keys=True)) for row in safe_promotions])
          db.commit(); db.close()
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if not safety_ok:
              raise SystemExit('one-uncorroborated-core wave2 safety contract failed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mercadona-tesseract-one-uncorroborated-core-wave2-merged
          path: merged/
          retention-days: 30
          if-no-files-found: error
