name: Catalog Mercadona non-contradictory REVIEW docTR pilot

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-review-regression-doctr-pilot.yml'
      - 'tools/catalog/mercadona_bounded_doctr_rescue.py'
      - 'tools/catalog/test_mercadona_bounded_doctr_rescue.py'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: catalog-mercadona-review-regression-doctr-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve latest successful strict historical OCR audit
        id: canonical-audit
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            '/repos/frandavid100/rumbo/actions/workflows/catalog-mercadona-current-ocr-residual-audit.yml/runs?branch=agent%2Fcatalog-phase1&per_page=20' \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id')
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo "No successful strict historical OCR audit run found" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using strict historical canonical audit run $run_id"

      - name: Download strict historical canonical audit
        uses: actions/download-artifact@v4
        with:
          name: mercadona-current-ocr-residual-audit
          path: tools/catalog/regression-audit
          github-token: ${{ github.token }}
          run-id: ${{ steps.canonical-audit.outputs.run_id }}

      - name: Select current non-contradictory REVIEW regressions and resolve their latest raw runs
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path('regression-audit/run-union-summary.json').read_text(encoding='utf-8'))
          current_review = set(str(x) for x in summary['latest_status_product_ids']['REVIEW'])
          transition = summary.get('declared_to_review_transition_audit') or {}
          non_contradictory = set(str(x) for x in transition.get('non_contradictory_review_product_ids') or [])
          targets = sorted(current_review & non_contradictory, key=lambda x: (len(x), x))
          if not targets:
              raise SystemExit('No current non-contradictory REVIEW regressions remain')

          latest_run = {}
          target_set = set(targets)
          for run in summary.get('runs') or []:
              run_id = int(run['run_id'])
              seen = set(str(x) for x in (run.get('new_product_ids') or []))
              seen.update(str(x) for x in (run.get('overlap_product_ids') or []))
              for pid in target_set & seen:
                  latest_run[pid] = run_id

          missing = sorted(target_set - set(latest_run))
          if missing:
              raise SystemExit(f'Could not resolve latest raw run for targets: {missing}')

          payload = {
              'selection': 'CURRENT_REVIEW_AFTER_HISTORICAL_DECLARED_NON_CONTRADICTORY_ONLY',
              'target_count': len(targets),
              'product_ids': targets,
              'latest_raw_run_by_product': latest_run,
              'safety_blocking_products_excluded': True,
              'cross_run_value_fusion': False,
              'acceptance_policy_changed': False,
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'redistribution_allowed': False,
              'images_persisted': False,
              'missing_values_inferred': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          Path('review-regression-targets.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8'
          )
          Path('review-regression-run-ids.txt').write_text(
              ''.join(f'{run_id}\n' for run_id in sorted(set(latest_run.values()))), encoding='utf-8'
          )
          print(json.dumps(payload, ensure_ascii=False, sort_keys=True))
          PY

      - name: Download only the latest raw artifact runs needed for identity anchors
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mercadona-review-regression-raw
          mkdir -p /tmp/mercadona-review-regression-raw
          while read -r run_id; do
            [[ -n "$run_id" ]] || continue
            artifact_json=$(gh api -H 'Accept: application/vnd.github+json' \
              "/repos/frandavid100/rumbo/actions/runs/${run_id}/artifacts?per_page=100")
            mapfile -t merged < <(jq -r '.artifacts[] | select(.expired == false) | select(.name | ascii_downcase | contains("mercadona")) | select(.name | endswith("-merged")) | [.id, .name] | @tsv' <<<"$artifact_json")
            if (( ${#merged[@]} > 0 )); then
              selected=("${merged[@]}")
            else
              mapfile -t selected < <(jq -r '.artifacts[] | select(.expired == false) | select(.name | ascii_downcase | contains("mercadona")) | [.id, .name] | @tsv' <<<"$artifact_json")
            fi
            if (( ${#selected[@]} == 0 )); then
              echo "No non-expired Mercadona artifact for run ${run_id}" >&2
              exit 1
            fi
            for item in "${selected[@]}"; do
              IFS=$'\t' read -r artifact_id artifact_name <<<"$item"
              dest="/tmp/mercadona-review-regression-raw/${run_id}-${artifact_id}"
              mkdir -p "$dest/unpacked"
              gh api -H 'Accept: application/vnd.github+json' \
                "/repos/frandavid100/rumbo/actions/artifacts/${artifact_id}/zip" > "$dest/artifact.zip"
              unzip -q "$dest/artifact.zip" -d "$dest/unpacked"
              rm "$dest/artifact.zip"
              echo "Downloaded ${run_id} ${artifact_name} (${artifact_id})"
            done
          done < review-regression-run-ids.txt

      - name: Recover strict latest raw EAN and image anchors
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from summarize_mercadona_ocr_run_union import canonical_exclusion_reason

          selection = json.loads(Path('review-regression-targets.json').read_text(encoding='utf-8'))
          run_by_product = {str(k): int(v) for k, v in selection['latest_raw_run_by_product'].items()}
          anchors = {}
          skipped = {}

          for pid, run_id in sorted(run_by_product.items(), key=lambda item: (len(item[0]), item[0])):
              rows = []
              for path in Path('/tmp/mercadona-review-regression-raw').glob(f'{run_id}-*/unpacked/**/*.jsonl'):
                  try:
                      lines = path.read_text(encoding='utf-8').splitlines()
                  except UnicodeDecodeError:
                      continue
                  for line in lines:
                      if not line.strip():
                          continue
                      try:
                          row = json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      if str(row.get('product_id') or '') != pid:
                          continue
                      if row.get('status') != 'REVIEW':
                          continue
                      if row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE':
                          continue
                      if canonical_exclusion_reason(row):
                          continue
                      rows.append(row)

              pairs = sorted({
                  (str(row.get('ean') or '').strip(), str(row.get('image_url') or '').strip())
                  for row in rows
                  if str(row.get('ean') or '').strip() and str(row.get('image_url') or '').strip()
              })
              if len(pairs) != 1:
                  skipped[pid] = {
                      'reason': 'LATEST_RAW_ANCHOR_PAIR_NOT_UNIQUE',
                      'run_id': run_id,
                      'eligible_rows': len(rows),
                      'pairs': pairs,
                  }
                  continue
              ean, image_url = pairs[0]
              representative = rows[0]
              anchors[pid] = {
                  'product_id': pid,
                  'ean': ean,
                  'image_url': image_url,
                  'latest_raw_run_id': run_id,
                  'name': representative.get('name'),
              }

          if not anchors:
              raise SystemExit(f'No unambiguous latest raw anchors recovered; skipped={skipped}')
          Path('review-regression-anchors.json').write_text(
              json.dumps({'anchors': anchors, 'skipped': skipped}, ensure_ascii=False, indent=2, sort_keys=True),
              encoding='utf-8',
          )
          Path('review-regression-inventory.jsonl').write_text(
              ''.join(json.dumps({'product_id': pid}, sort_keys=True) + '\n' for pid in anchors),
              encoding='utf-8',
          )
          print(json.dumps({
              'requested': len(run_by_product),
              'anchored': len(anchors),
              'skipped': len(skipped),
              'anchored_product_ids': list(anchors),
          }, sort_keys=True))
          PY

      - name: Rehydrate current official first-party details
        working-directory: tools/catalog
        run: |
          set -euo pipefail
          rm -rf mercadona-first-party-review-regression-live
          python mercadona_first_party_details.py \
            --inventory review-regression-inventory.jsonl \
            --out mercadona-first-party-review-regression-live \
            --shard-index 0 \
            --shard-count 1 \
            --timeout 20 \
            --delay 0.2

          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(
              Path('mercadona-first-party-review-regression-live/summary-00.json').read_text(encoding='utf-8')
          )
          errors = [
              json.loads(line)
              for line in Path('mercadona-first-party-review-regression-live/errors-00.jsonl').read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          if errors or summary.get('fetched') != summary.get('requested'):
              raise SystemExit(f'Targeted first-party rehydration incomplete: summary={summary} errors={errors}')
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY

      - name: Require exact current EAN and exact current first-party perspective=9 image
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mercadona-review-regression-doctr-input-src
          mkdir -p mercadona-review-regression-doctr-input-src
          python - <<'PY'
          import json
          from pathlib import Path

          anchor_doc = json.loads(Path('review-regression-anchors.json').read_text(encoding='utf-8'))
          anchors = anchor_doc['anchors']
          product_path = Path('mercadona-first-party-review-regression-live/details-00.jsonl')
          selected = []
          missing_current_ean = []
          reassigned = []
          unmatched_p9 = []

          for line in product_path.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              product = json.loads(line)
              pid = str(product.get('product_id') or '').strip()
              anchor = anchors.get(pid)
              if anchor is None:
                  continue
              current_ean = str(product.get('ean') or '').strip()
              if not current_ean:
                  missing_current_ean.append(pid)
                  continue
              if current_ean != anchor['ean']:
                  reassigned.append(pid)
                  continue
              photos = product.get('photos') if isinstance(product.get('photos'), list) else []
              matches = [
                  (idx, photo)
                  for idx, photo in enumerate(photos)
                  if isinstance(photo, dict)
                  and str(photo.get('perspective') or '') == '9'
                  and str(photo.get('zoom') or '') == anchor['image_url']
              ]
              if len(matches) != 1:
                  unmatched_p9.append(pid)
                  continue
              image_index, photo = matches[0]
              candidate = dict(product)
              candidate['photos'] = [dict(photo)]
              candidate['_bounded_doctr_meta'] = {
                  'canonical_ean': anchor['ean'],
                  'current_ean': current_ean,
                  'image_url': anchor['image_url'],
                  'image_index': image_index,
                  'perspective': 9,
                  'latest_raw_run_id': anchor['latest_raw_run_id'],
                  'identity_basis': 'EXACT_LATEST_RAW_EAN_EQUALS_CURRENT_FIRST_PARTY_EAN',
                  'image_basis': 'EXACT_LATEST_RAW_IMAGE_URL_EQUALS_CURRENT_FIRST_PARTY_PERSPECTIVE_9_URL',
              }
              selected.append(candidate)

          selected.sort(key=lambda row: (0 if row.get('ingredients') else 1, str(row.get('product_id') or '')))
          if not selected:
              raise SystemExit(
                  'No exact-EAN exact-current-p9 regression target remains; '
                  f'missing_ean={missing_current_ean} reassigned={reassigned} unmatched_p9={unmatched_p9}'
              )

          with_ingredients = [row for row in selected if row.get('ingredients')]
          without_ingredients = [row for row in selected if not row.get('ingredients')]
          out = Path('mercadona-review-regression-doctr-input-src')
          for name, data in (
              ('with-ingredients.jsonl', with_ingredients),
              ('without-ingredients.jsonl', without_ingredients),
          ):
              (out / name).write_text(
                  ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in data),
                  encoding='utf-8',
              )

          summary = {
              'historical_inventory_products': 4280,
              'current_non_contradictory_review_regressions': len(anchors),
              'selected': len(selected),
              'selected_product_ids': [str(row.get('product_id')) for row in selected],
              'selected_with_structured_ingredients': len(with_ingredients),
              'selected_without_structured_ingredients': len(without_ingredients),
              'missing_current_ean': sorted(set(missing_current_ean)),
              'reassigned_current_product_ids': sorted(set(reassigned)),
              'unmatched_current_first_party_p9': sorted(set(unmatched_p9)),
              'selection_policy': 'CURRENT_HISTORICAL_DECLARED_TO_REVIEW_NON_CONTRADICTORY; EXACT_LATEST_RAW_EAN; EXACT_CURRENT_FIRST_PARTY_EAN; EXACT_SAME_PERSPECTIVE_9_IMAGE_URL',
              'new_independent_ocr_family': 'doctr',
              'cross_run_value_fusion': False,
              'current_observation_must_satisfy_declared_contract_independently': True,
              'acceptance_policy_changed': False,
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'redistribution_allowed': False,
              'images_persisted': False,
              'missing_values_inferred': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          (out / 'selection-summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8'
          )
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: mercadona-review-regression-doctr-input
          path: tools/catalog/mercadona-review-regression-doctr-input-src/
          retention-days: 30
          if-no-files-found: error

  ocr:
    runs-on: ubuntu-24.04
    needs: prepare
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1]
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v4
        with:
          name: mercadona-review-regression-doctr-input
          path: tools/catalog/retry-input

      - name: Install OCR and detector dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check \
            'paddleocr>=3.7,<3.8' \
            'easyocr>=1.7,<1.8' \
            'python-doctr==1.1.0' \
            opencv-python-headless Pillow

      - name: Run conservative OCR safety regressions before live retry
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_mercadona_bounded_doctr_rescue.py \
            test_label_doctr_extractor.py \
            test_mercadona_near_safe_doctr_retry.py \
            test_mercadona_ocr_safety_regressions.py \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_label_reader_row_tokens.py \
            test_nutrition_ocr_ensemble.py \
            test_label_image_preprocess.py

      - name: Run bounded docTR rescue without changing acceptance gates
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mercadona-review-regression-doctr-pilot/with-ingredients
          mkdir -p mercadona-review-regression-doctr-pilot/without-ingredients

          run_group() {
            local products="$1"
            local out="$2"
            local mode="$3"
            if [[ ! -s "$products" ]]; then
              return 0
            fi
            set +e
            python mercadona_bounded_doctr_rescue.py \
              --products "$products" \
              --out "$out" \
              --shard-index ${{ matrix.shard }} \
              --shard-count 2 \
              --limit 0 \
              --eligibility-mode "$mode"
            rc=$?
            set -e
            if [[ $rc -ne 0 && $rc -ne 2 ]]; then
              return "$rc"
            fi
          }

          cp retry-input/with-ingredients.jsonl .
          cp retry-input/without-ingredients.jsonl .
          cp retry-input/selection-summary.json mercadona-review-regression-doctr-pilot/selection-summary.json

          run_group with-ingredients.jsonl mercadona-review-regression-doctr-pilot/with-ingredients priority
          run_group without-ingredients.jsonl mercadona-review-regression-doctr-pilot/without-ingredients p9-no-ingredients-all

          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('mercadona-review-regression-doctr-pilot')
          summary = json.loads((root / 'selection-summary.json').read_text(encoding='utf-8'))
          summary.update({
              'shard_index': int('${{ matrix.shard }}'),
              'shard_count': 2,
              'parser_version_contract': 'nutrition_label_reader current branch version',
              'new_independent_ocr_family': 'doctr',
              'routing_only_change': True,
          })
          (root / 'pilot-metadata.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8'
          )
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-review-regression-doctr-pilot-${{ matrix.shard }}
          path: tools/catalog/mercadona-review-regression-doctr-pilot/
          retention-days: 90
          if-no-files-found: error

  summarize:
    runs-on: ubuntu-24.04
    needs: ocr
    if: ${{ needs.ocr.result == 'success' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mercadona-review-regression-doctr-pilot-*
          path: pilot-shards

      - name: Summarize pilot statuses without promoting REVIEW
        shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          counts = Counter()
          rows = []
          for path in Path('pilot-shards').rglob('*.jsonl'):
              for line in path.read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  try:
                      row = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if not isinstance(row, dict) or not row.get('product_id') or not row.get('status'):
                      continue
                  rows.append(row)
                  counts[str(row['status'])] += 1

          by_product = {}
          for row in rows:
              by_product[str(row['product_id'])] = row
          product_counts = Counter(str(row.get('status')) for row in by_product.values())
          summary = {
              'raw_result_rows': len(rows),
              'distinct_products': len(by_product),
              'latest_product_status_counts': dict(sorted(product_counts.items())),
              'declared_product_ids': sorted(
                  pid for pid, row in by_product.items() if row.get('status') == 'DECLARED'
              ),
              'review_product_ids': sorted(
                  pid for pid, row in by_product.items() if row.get('status') == 'REVIEW'
              ),
              'no_visual_region_product_ids': sorted(
                  pid for pid, row in by_product.items() if row.get('status') == 'NO_VISUAL_REGION'
              ),
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'redistribution_allowed': False,
              'images_persisted': False,
              'missing_values_inferred': False,
              'REVIEW_promoted_by_summary': 0,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          Path('mercadona-review-regression-doctr-pilot-summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8'
          )
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: mercadona-review-regression-doctr-pilot-summary
          path: mercadona-review-regression-doctr-pilot-summary.json
          retention-days: 90
          if-no-files-found: error

  reconcile:
    runs-on: ubuntu-24.04
    needs: summarize
    if: ${{ needs.summarize.result == 'success' }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Trigger strict historical canonical reconciliation
        run: |
          gh workflow run catalog-mercadona-current-ocr-residual-audit.yml \
            --repo frandavid100/rumbo \
            --ref agent/catalog-phase1
