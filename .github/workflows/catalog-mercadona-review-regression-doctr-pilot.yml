name: Catalog Mercadona non-contradictory REVIEW docTR pilot

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-review-regression-doctr-pilot.yml'
      - 'tools/catalog/mercadona_bounded_doctr_rescue.py'
      - 'tools/catalog/mercadona_review_regression_input.py'
      - 'tools/catalog/test_mercadona_bounded_doctr_rescue.py'
      - 'tools/catalog/test_mercadona_review_regression_input.py'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: catalog-mercadona-review-regression-doctr-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve latest successful strict historical OCR audit
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            '/repos/frandavid100/rumbo/actions/workflows/catalog-mercadona-current-ocr-residual-audit.yml/runs?branch=agent%2Fcatalog-phase1&per_page=20' \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id')
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo 'No successful strict historical audit found' >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using strict historical audit run $run_id"

      - name: Download strict historical canonical audit
        uses: actions/download-artifact@v4
        with:
          name: mercadona-current-ocr-residual-audit
          path: tools/catalog/regression-audit
          github-token: ${{ github.token }}
          run-id: ${{ steps.audit.outputs.run_id }}

      - name: Select canonical-eligible raw runs for non-contradictory regressions
        working-directory: tools/catalog
        run: |
          set -euo pipefail
          python -m unittest -v test_mercadona_review_regression_input.py
          rm -rf review-regression-selection
          python mercadona_review_regression_input.py select \
            --summary regression-audit/run-union-summary.json \
            --out review-regression-selection

      - name: Download only selected raw-live Mercadona artifacts
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mercadona-review-regression-raw
          mkdir -p /tmp/mercadona-review-regression-raw
          while read -r run_id; do
            [[ -n "$run_id" ]] || continue
            artifact_json=$(gh api -H 'Accept: application/vnd.github+json' \
              "/repos/frandavid100/rumbo/actions/runs/${run_id}/artifacts?per_page=100")
            mapfile -t merged < <(jq -r '.artifacts[] | select(.expired == false) | select(.name | ascii_downcase | contains("mercadona")) | select(.name | endswith("-merged")) | [.id, .name] | @tsv' <<<"$artifact_json")
            if (( ${#merged[@]} > 0 )); then
              selected=("${merged[@]}")
            else
              mapfile -t selected < <(jq -r '.artifacts[] | select(.expired == false) | select(.name | ascii_downcase | contains("mercadona")) | [.id, .name] | @tsv' <<<"$artifact_json")
            fi
            (( ${#selected[@]} > 0 )) || { echo "No non-expired Mercadona artifact for raw run $run_id" >&2; exit 1; }
            for item in "${selected[@]}"; do
              IFS=$'\t' read -r artifact_id artifact_name <<<"$item"
              dest="/tmp/mercadona-review-regression-raw/${run_id}-${artifact_id}"
              mkdir -p "$dest/unpacked"
              gh api -H 'Accept: application/vnd.github+json' \
                "/repos/frandavid100/rumbo/actions/artifacts/${artifact_id}/zip" > "$dest/artifact.zip"
              unzip -q "$dest/artifact.zip" -d "$dest/unpacked"
              rm "$dest/artifact.zip"
              echo "Downloaded raw run $run_id artifact $artifact_name ($artifact_id)"
            done
          done < review-regression-selection/run-ids.txt

      - name: Recover exact latest raw EAN and image anchors
        working-directory: tools/catalog
        run: |
          set -euo pipefail
          python mercadona_review_regression_input.py anchors \
            --selection review-regression-selection/selection.json \
            --raw-root /tmp/mercadona-review-regression-raw \
            --out review-regression-selection

      - name: Rehydrate current official first-party details
        working-directory: tools/catalog
        run: |
          set -euo pipefail
          rm -rf mercadona-first-party-review-regression-live
          python mercadona_first_party_details.py \
            --inventory review-regression-selection/inventory.jsonl \
            --out mercadona-first-party-review-regression-live \
            --shard-index 0 \
            --shard-count 1 \
            --timeout 20 \
            --delay 0.2
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('mercadona-first-party-review-regression-live')
          summary = json.loads((root / 'summary-00.json').read_text(encoding='utf-8'))
          errors = [json.loads(line) for line in (root / 'errors-00.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          if errors or summary.get('fetched') != summary.get('requested'):
              raise SystemExit(f'Targeted first-party rehydration incomplete: summary={summary} errors={errors}')
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY

      - name: Build exact-current-EAN exact-perspective-9 OCR input
        working-directory: tools/catalog
        run: |
          set -euo pipefail
          rm -rf mercadona-review-regression-doctr-input
          python mercadona_review_regression_input.py live \
            --anchors review-regression-selection/anchors.json \
            --details mercadona-first-party-review-regression-live/details-00.jsonl \
            --out mercadona-review-regression-doctr-input

      - uses: actions/upload-artifact@v4
        with:
          name: mercadona-review-regression-doctr-input
          path: tools/catalog/mercadona-review-regression-doctr-input/
          retention-days: 30
          if-no-files-found: error

  ocr:
    runs-on: ubuntu-24.04
    needs: prepare
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1]
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v4
        with:
          name: mercadona-review-regression-doctr-input
          path: tools/catalog/retry-input

      - name: Install OCR and detector dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check \
            'paddleocr>=3.7,<3.8' \
            'easyocr>=1.7,<1.8' \
            'python-doctr==1.1.0' \
            opencv-python-headless Pillow

      - name: Run conservative routing and OCR safety regressions
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_mercadona_review_regression_input.py \
            test_mercadona_bounded_doctr_rescue.py \
            test_label_doctr_extractor.py \
            test_mercadona_near_safe_doctr_retry.py \
            test_mercadona_ocr_safety_regressions.py \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_label_reader_row_tokens.py \
            test_nutrition_ocr_ensemble.py \
            test_label_image_preprocess.py

      - name: Run bounded docTR rescue with unchanged acceptance contract
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mercadona-review-regression-doctr-pilot/with-ingredients
          mkdir -p mercadona-review-regression-doctr-pilot/without-ingredients

          run_group() {
            local products="$1"
            local out="$2"
            local mode="$3"
            [[ -s "$products" ]] || return 0
            set +e
            python mercadona_bounded_doctr_rescue.py \
              --products "$products" \
              --out "$out" \
              --shard-index ${{ matrix.shard }} \
              --shard-count 2 \
              --limit 0 \
              --eligibility-mode "$mode"
            rc=$?
            set -e
            [[ $rc -eq 0 || $rc -eq 2 ]] || return "$rc"
          }

          cp retry-input/with-ingredients.jsonl .
          cp retry-input/without-ingredients.jsonl .
          cp retry-input/selection-summary.json mercadona-review-regression-doctr-pilot/selection-summary.json
          run_group with-ingredients.jsonl mercadona-review-regression-doctr-pilot/with-ingredients priority
          run_group without-ingredients.jsonl mercadona-review-regression-doctr-pilot/without-ingredients p9-no-ingredients-all

          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('mercadona-review-regression-doctr-pilot')
          meta = json.loads((root / 'selection-summary.json').read_text(encoding='utf-8'))
          meta.update({
              'shard_index': int('${{ matrix.shard }}'),
              'shard_count': 2,
              'new_independent_ocr_family': 'doctr',
              'routing_only_change': True,
              'parser_version_contract': 'nutrition_label_reader current branch version',
          })
          (root / 'pilot-metadata.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-review-regression-doctr-pilot-${{ matrix.shard }}
          path: tools/catalog/mercadona-review-regression-doctr-pilot/
          retention-days: 90
          if-no-files-found: error

  reconcile:
    runs-on: ubuntu-24.04
    needs: ocr
    if: ${{ needs.ocr.result == 'success' }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Trigger strict historical canonical reconciliation
        run: |
          gh workflow run catalog-mercadona-current-ocr-residual-audit.yml \
            --repo frandavid100/rumbo \
            --ref agent/catalog-phase1
