name: Catalog Carrefour first-party cumulative report

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-carrefour-first-party-cumulative.yml'
      - 'tools/catalog/merge_carrefour_first_party_observations.py'
      - 'tools/catalog/annotate_carrefour_first_party_summary.py'
      - 'tools/catalog/summarize_carrefour_first_party.py'
      - 'tools/catalog/sanitize_carrefour_first_party_output.py'
      - 'tools/catalog/fixtures/carrefour_first_party_products_cumulative.jsonl'
      - 'tools/catalog/fixtures/carrefour_first_party_field_evidence_cumulative.jsonl'
      - 'tools/catalog/fixtures/carrefour_first_party_agent_web_products*.jsonl'
      - 'tools/catalog/fixtures/carrefour_first_party_agent_web_field_evidence*.jsonl'
      - 'catalog/fixtures/carrefour_first_party_agent_web_products*.jsonl'
      - 'catalog/fixtures/carrefour_first_party_agent_web_field_evidence*.jsonl'
      - 'tools/catalog/fixtures/carrefour_candidate_urls_radarsuper.summary.json'
  pull_request:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-carrefour-first-party-cumulative.yml'
      - 'tools/catalog/fixtures/carrefour-first-party-refresh-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: carrefour-first-party-cumulative-report
  cancel-in-progress: true

jobs:
  summarize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependency
        run: pip install playwright
      - name: Repair audited malformed batch typo in workspace
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('fixtures/carrefour_first_party_agent_web_products_batch75_ice_cream.jsonl')
          text = path.read_text(encoding='utf-8')
          old = '"calories_kcal=209.0"'
          new = '"calories_kcal":209.0'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one audited batch75 typo, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          print('Repaired audited batch75 calories_kcal delimiter typo')
          PY
      - name: Validate persisted JSONL observations
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import glob, json
          from pathlib import Path

          patterns = [
              'fixtures/carrefour_first_party_products_cumulative.jsonl',
              'fixtures/carrefour_first_party_field_evidence_cumulative.jsonl',
              'fixtures/carrefour_first_party_agent_web_products*.jsonl',
              'fixtures/carrefour_first_party_agent_web_field_evidence*.jsonl',
              '../../catalog/fixtures/carrefour_first_party_agent_web_products*.jsonl',
              '../../catalog/fixtures/carrefour_first_party_agent_web_field_evidence*.jsonl',
          ]
          seen = set()
          errors = []
          for pattern in patterns:
              for name in sorted(glob.glob(pattern)):
                  if name in seen or not Path(name).is_file():
                      continue
                  seen.add(name)
                  for line_no, line in enumerate(Path(name).read_text(encoding='utf-8').splitlines(), 1):
                      if not line.strip():
                          continue
                      try:
                          json.loads(line)
                      except json.JSONDecodeError as exc:
                          errors.append(f'{name}:{line_no}: {exc}')
          if errors:
              raise SystemExit('INVALID_JSONL\n' + '\n'.join(errors))
          print(f'Validated {len(seen)} JSONL files')
          PY
      - name: Merge every verified first-party observation and build auditable staging
        working-directory: tools/catalog
        run: |
          PRODUCTS=(fixtures/carrefour_first_party_products_cumulative.jsonl)
          EVIDENCE=(fixtures/carrefour_first_party_field_evidence_cumulative.jsonl)
          for f in fixtures/carrefour_first_party_agent_web_products*.jsonl; do
            if [ -s "$f" ]; then PRODUCTS+=("$f"); fi
          done
          for f in fixtures/carrefour_first_party_agent_web_field_evidence*.jsonl; do
            if [ -s "$f" ]; then EVIDENCE+=("$f"); fi
          done
          for f in ../../catalog/fixtures/carrefour_first_party_agent_web_products*.jsonl; do
            if [ -s "$f" ]; then PRODUCTS+=("$f"); fi
          done
          for f in ../../catalog/fixtures/carrefour_first_party_agent_web_field_evidence*.jsonl; do
            if [ -s "$f" ]; then EVIDENCE+=("$f"); fi
          done
          python merge_carrefour_first_party_observations.py \
            --products "${PRODUCTS[@]}" \
            --evidence "${EVIDENCE[@]}" \
            --candidate-summary fixtures/carrefour_candidate_urls_radarsuper.summary.json \
            --out-products fixtures/carrefour_first_party_products_cumulative.jsonl \
            --out-evidence fixtures/carrefour_first_party_field_evidence_cumulative.jsonl \
            --summary fixtures/carrefour_first_party_cumulative_summary.json \
            --sqlite carrefour-first-party-cumulative.sqlite
      - name: Annotate product-page versus listing-only observation scope
        working-directory: tools/catalog
        run: |
          python annotate_carrefour_first_party_summary.py \
            --products fixtures/carrefour_first_party_products_cumulative.jsonl \
            --summary fixtures/carrefour_first_party_cumulative_summary.json
      - name: Keep source inventory status synchronized with cumulative evidence
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary_path = Path('fixtures/carrefour_first_party_cumulative_summary.json')
          inventory_path = Path('fixtures/carrefour_source_inventory.json')
          summary = json.loads(summary_path.read_text(encoding='utf-8'))
          inventory = json.loads(inventory_path.read_text(encoding='utf-8'))
          status = inventory.setdefault('current_first_party_status', {})
          counts = summary.get('counts', {})
          verified = int(counts.get('verified_first_party_products', counts.get('verified_direct_products', 0)) or 0)
          product_pages = int(counts.get('verified_product_page_observations', verified) or 0)
          listing_only = int(counts.get('verified_listing_only_observations', 0) or 0)
          status['inventory_complete'] = bool(summary.get('inventory_complete', False))
          status['verified_first_party_products_cumulative'] = verified
          status['successful_first_party_product_pages_cumulative'] = product_pages
          status['first_party_listing_only_products_cumulative'] = listing_only
          status['first_party_field_evidence_rows_cumulative'] = int(counts.get('evidence_rows', 0) or 0)
          status['candidate_identity_urls_external_only'] = int(
              counts.get('external_candidate_identity_urls_not_counted_as_first_party',
                         status.get('candidate_identity_urls_external_only', 0)) or 0
          )
          status['cumulative_summary_fixture'] = str(summary_path)
          status['notes'] = (
              f'Current cumulative staging contains {verified} products verified from official Carrefour surfaces: '
              f'{product_pages} product-page observations and {listing_only} listing-only observations. '
              'External candidate catalogs remain discovery-only and are never promoted to Carrefour evidence without direct observation.'
          )
          built_at = str(summary.get('built_at') or '')
          if built_at:
              inventory['updated_at'] = built_at[:10]
          inventory_path.write_text(json.dumps(inventory, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Persist compact auditable staging
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/catalog/fixtures/carrefour_first_party_products_cumulative.jsonl \
            tools/catalog/fixtures/carrefour_first_party_field_evidence_cumulative.jsonl \
            tools/catalog/fixtures/carrefour_first_party_cumulative_summary.json \
            tools/catalog/fixtures/carrefour_source_inventory.json \
            tools/catalog/fixtures/carrefour_first_party_agent_web_products_batch75_ice_cream.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "catalog: merge Carrefour first-party observations"
            git pull --rebase origin agent/catalog-phase1
            git push origin HEAD:agent/catalog-phase1
          fi
      - name: Upload auditable cumulative outputs
        uses: actions/upload-artifact@v4
        with:
          name: carrefour-first-party-cumulative
          path: |
            tools/catalog/carrefour-first-party-cumulative.sqlite
            tools/catalog/fixtures/carrefour_first_party_products_cumulative.jsonl
            tools/catalog/fixtures/carrefour_first_party_field_evidence_cumulative.jsonl
            tools/catalog/fixtures/carrefour_first_party_cumulative_summary.json
            tools/catalog/fixtures/carrefour_source_inventory.json
            tools/catalog/fixtures/carrefour_first_party_agent_web_products_batch75_ice_cream.jsonl
          retention-days: 7
          if-no-files-found: error

# Safe manual refresh marker: 2026-08-23T10:15Z. Pull-request execution is a read-only
# fallback that builds and uploads the current cumulative staging when connector-authored
# pushes do not fan out into Actions; it never persists from the PR job.
