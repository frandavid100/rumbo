name: Catalog Mercadona REVIEW replay pilot

# Replays a bounded sample of the current canonical REVIEW set directly from the
# exact first-party perspective=9 image URLs preserved in raw OCR evidence. This
# deliberately does not substitute a later live Mercadona inventory for the
# expired 2026-08-27 first-party snapshot.
on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - 'tools/catalog/build_mercadona_review_replay_seeds.py'
      - 'tools/catalog/test_build_mercadona_review_replay_seeds.py'
      - '.github/workflows/catalog-mercadona-review-replay-pilot.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: catalog-mercadona-review-replay-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test replay seed fail-closed rules
        working-directory: tools/catalog
        run: |
          python -m unittest -v test_build_mercadona_review_replay_seeds.py
          python -m py_compile build_mercadona_review_replay_seeds.py

      - name: Resolve latest successful canonical OCR audit
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            '/repos/frandavid100/rumbo/actions/workflows/catalog-mercadona-current-ocr-residual-audit.yml/runs?branch=agent%2Fcatalog-phase1&per_page=30' \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id')
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo 'No successful Mercadona canonical OCR audit found' >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using canonical audit run $run_id"

      - name: Download canonical OCR audit manifest
        uses: actions/download-artifact@v4
        with:
          name: mercadona-current-ocr-residual-audit
          path: audit
          github-token: ${{ github.token }}
          run-id: ${{ steps.audit.outputs.run_id }}

      - name: Rehydrate only the raw OCR artifacts used by that audit
        shell: bash
        run: |
          set -euo pipefail
          test -s audit/artifacts.tsv
          test -s audit/run-union-summary.json
          mkdir -p /tmp/mercadona-review-replay-raw
          total=$(wc -l < audit/artifacts.tsv | tr -d ' ')
          done_count=0
          while IFS=$'\t' read -r run_id run_name artifact_id artifact_name created_at; do
            [[ -n "$artifact_id" ]] || continue
            dest="/tmp/mercadona-review-replay-raw/${run_id}-${artifact_id}"
            mkdir -p "$dest/unpacked"
            gh api -H 'Accept: application/vnd.github+json' \
              "/repos/frandavid100/rumbo/actions/artifacts/${artifact_id}/zip" \
              > "$dest/artifact.zip"
            unzip -q "$dest/artifact.zip" -d "$dest/unpacked"
            rm "$dest/artifact.zip"
            done_count=$((done_count + 1))
            if (( done_count % 50 == 0 )); then
              echo "Rehydrated $done_count/$total audit artifacts"
            fi
          done < audit/artifacts.tsv
          echo "Rehydrated $done_count/$total audit artifacts"
          test "$done_count" -eq "$total"

      - name: Build strict historical-label REVIEW replay seeds
        id: seeds
        working-directory: tools/catalog
        run: |
          set -euo pipefail
          python build_mercadona_review_replay_seeds.py \
            --root /tmp/mercadona-review-replay-raw \
            --run-union-summary ../../audit/run-union-summary.json \
            --artifacts-tsv ../../audit/artifacts.tsv \
            --out mercadona-review-replay-seeds
          seed_count=$(jq -r '.strict_p9_replay_seeds' mercadona-review-replay-seeds/summary.json)
          review_count=$(jq -r '.canonical_review_products' mercadona-review-replay-seeds/summary.json)
          if ! [[ "$seed_count" =~ ^[0-9]+$ ]] || (( seed_count < 1 )); then
            echo "Invalid replay seed count: $seed_count" >&2
            exit 1
          fi
          echo "seed_count=$seed_count" >> "$GITHUB_OUTPUT"
          echo "review_count=$review_count" >> "$GITHUB_OUTPUT"
          echo "Prepared $seed_count strict p9 replay seeds from $review_count canonical REVIEW products"

      - uses: actions/upload-artifact@v4
        with:
          name: mercadona-review-replay-seeds
          path: tools/catalog/mercadona-review-replay-seeds/
          retention-days: 30
          if-no-files-found: error

  safety-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCR parser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow

      - name: Run conservative OCR and replay-seed regression suite
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_build_mercadona_review_replay_seeds.py \
            test_label_easyocr_extractor.py \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_label_reader_row_tokens.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_ocr_safety_regressions.py

  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [prepare, safety-tests]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v4
        with:
          name: mercadona-review-replay-seeds
          path: tools/catalog/mercadona-review-replay-seeds

      - name: Install independent OCR engines and visual detector dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow

      - name: Replay deterministic canonical REVIEW sample from exact p9 URLs
        working-directory: tools/catalog
        run: |
          python mercadona_neural_ocr_wave.py \
            --products mercadona-review-replay-seeds/products.jsonl \
            --out mercadona-review-replay-pilot \
            --shard-index ${{ matrix.shard }} \
            --shard-count 8 \
            --limit 16 \
            --eligibility-mode p9-no-ingredients-all

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-review-replay-pilot-${{ matrix.shard }}
          path: tools/catalog/mercadona-review-replay-pilot/
          retention-days: 30
          if-no-files-found: warn

  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [prepare, safety-tests, ocr]
    if: ${{ always() && needs.prepare.result == 'success' && needs.safety-tests.result == 'success' && needs.ocr.result == 'success' }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mercadona-review-replay-pilot-*
          path: input
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: mercadona-review-replay-seeds
          path: seeds

      - name: Merge and validate bounded replay evidence
        run: |
          python - <<'PY'
          from collections import Counter
          import glob
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          seeds = {
              str(row['product_id']): row
              for row in (
                  json.loads(line)
                  for line in Path('seeds/products.jsonl').read_text(encoding='utf-8').splitlines()
                  if line.strip()
              )
          }
          rows = []
          for path in sorted(glob.glob('input/results-*.jsonl')):
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  if line.strip():
                      rows.append(json.loads(line))

          counts = Counter(str(row.get('status') or 'UNKNOWN') for row in rows)
          invalid = []
          invalid_declared = []
          seen = set()
          duplicate_ids = []
          for row in rows:
              pid = str(row.get('product_id') or '')
              if pid in seen:
                  duplicate_ids.append(pid)
              seen.add(pid)
              seed = seeds.get(pid)
              host = (urlparse(str(row.get('image_url') or '')).hostname or '').lower()
              if (
                  seed is None
                  or row.get('source') != 'MERCADONA_FIRST_PARTY'
                  or row.get('source_record_kind') != 'label image'
                  or row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE'
                  or row.get('redistribution_allowed') is not False
                  or str(row.get('perspective')) != '9'
                  or host != 'prod-mercadona.imgix.net'
                  or str(row.get('ean') or '') != str(seed.get('ean') or '')
                  or str(row.get('image_url') or '') != str(seed['photos'][0]['zoom'])
                  or row.get('classified') is True
                  or row.get('CLASSIFIED') is True
                  or row.get('menu_eligible') is True
                  or row.get('MENU_ELIGIBLE') is True
              ):
                  invalid.append(pid)

              if row.get('status') == 'DECLARED':
                  accepted = next(
                      (
                          attempt
                          for attempt in (row.get('attempts') or [])
                          if (attempt.get('ensemble') or {}).get('status') == 'DECLARED'
                      ),
                      None,
                  )
                  ensemble = (accepted or {}).get('ensemble') or {}
                  nutrition = ensemble.get('nutrition')
                  if (
                      ensemble.get('independent_engine_families', 0) < 2
                      or ensemble.get('corroborated_fields', 0) < 4
                      or not isinstance(nutrition, dict)
                      or any(nutrition.get(field) is None for field in ('calories', 'fat_g', 'carbohydrate_g', 'protein_g'))
                  ):
                      invalid_declared.append(pid)

          summary = {
              'canonical_review_seed_universe': len(seeds),
              'sample_processed': len(rows),
              'status_counts': dict(sorted(counts.items())),
              'declared': counts.get('DECLARED', 0),
              'review': counts.get('REVIEW', 0),
              'no_visual_region': sum(row.get('visual_regions_detected') == 0 for row in rows),
              'errors': counts.get('ERROR', 0),
              'invalid_provenance_or_identity_product_ids': sorted(set(invalid)),
              'invalid_declared_product_ids': sorted(set(invalid_declared)),
              'duplicate_product_ids': sorted(set(duplicate_ids)),
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'redistribution_allowed': False,
              'images_persisted': False,
              'missing_values_inferred': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          Path('merged').mkdir(exist_ok=True)
          Path('merged/results.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in rows),
              encoding='utf-8',
          )
          Path('merged/summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          failures = []
          if invalid:
              failures.append(f'invalid provenance/identity rows: {len(set(invalid))}')
          if invalid_declared:
              failures.append(f'unsafe DECLARED rows: {len(set(invalid_declared))}')
          if duplicate_ids:
              failures.append(f'duplicate product ids: {len(set(duplicate_ids))}')
          if not rows:
              failures.append('no replay rows produced')
          if failures:
              raise SystemExit('; '.join(failures))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: mercadona-review-replay-pilot-merged
          path: merged/
          retention-days: 30
          if-no-files-found: error

      - name: Request strict canonical reconciliation after replay settles
        run: |
          gh workflow run catalog-mercadona-current-ocr-residual-audit.yml --ref agent/catalog-phase1
