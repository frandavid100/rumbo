name: Catalog Mercadona one-field rescue canary

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-one-field-rescue-canary.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-one-field-rescue-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve latest successful canonical OCR audit
        id: canonical-audit
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            '/repos/frandavid100/rumbo/actions/workflows/catalog-mercadona-current-ocr-residual-audit-efficient.yml/runs?branch=agent%2Fcatalog-phase1&per_page=20' \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id')
          test "$run_id" != "null"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download latest canonical OCR audit
        uses: actions/download-artifact@v4
        with:
          name: mercadona-current-ocr-residual-audit-efficient
          path: tools/catalog/mercadona-current-ocr-residual-audit
          github-token: ${{ github.token }}
          run-id: ${{ steps.canonical-audit.outputs.run_id }}
      - name: Build exact historical residual candidate cut
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          base = Path('mercadona-current-ocr-residual-audit')
          canonical_path = base / 'canonical-ocr.jsonl'
          p9_path = base / 'residual-p9.jsonl'
          no_p9_path = base / 'residual-no-p9.jsonl'
          summary_path = base / 'summary.json'
          for path in (canonical_path, p9_path, no_p9_path, summary_path):
              if not path.exists():
                  raise SystemExit(f'Missing authoritative audit file: {path}')

          def load_jsonl(path):
              return [json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]

          summary = json.loads(summary_path.read_text(encoding='utf-8'))
          canonical = load_jsonl(canonical_path)
          p9 = load_jsonl(p9_path)
          no_p9 = load_jsonl(no_p9_path)

          inventory = int(summary.get('inventory_products', -1))
          processed = int(summary.get('processed_reconstructed', -1))
          residual_total = int(summary.get('residual_total', -1))
          if inventory != 4280:
              raise SystemExit(f'Unexpected historical inventory size: {inventory}')
          if summary.get('historical_membership_parity_verifiable') is not True:
              raise SystemExit('Exact historical membership parity is not verifiable; refusing rescue canary')
          if len(canonical) != processed:
              raise SystemExit(f'Canonical row count {len(canonical)} != processed_reconstructed {processed}')
          if len(p9) + len(no_p9) != residual_total:
              raise SystemExit(f'Residual row count {len(p9) + len(no_p9)} != residual_total {residual_total}')

          def ids(rows, label):
              values = [str(row.get('product_id') or '') for row in rows]
              if any(not value for value in values):
                  raise SystemExit(f'{label} contains missing product_id')
              if len(set(values)) != len(values):
                  raise SystemExit(f'{label} contains duplicate product_id')
              return set(values)

          canonical_ids = ids(canonical, 'canonical')
          p9_ids = ids(p9, 'residual-p9')
          no_p9_ids = ids(no_p9, 'residual-no-p9')
          residual_ids = p9_ids | no_p9_ids
          if p9_ids & no_p9_ids:
              raise SystemExit('Residual P9 and no-P9 partitions overlap')
          if canonical_ids & residual_ids:
              raise SystemExit('Canonical and residual partitions overlap')
          if len(canonical_ids | residual_ids) != inventory:
              raise SystemExit('Canonical + residual partitions do not reconstruct the exact 4,280-product cut')

          # Keep the exact historical residual rows only. This avoids the expired original
          # 4,280-product artifact without substituting a later live inventory. The OCR wave
          # itself still applies the strict P9 + structured-ingredients eligibility filter.
          candidates = p9 + no_p9
          Path('mercadona-one-field-rescue-candidates.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in candidates),
              encoding='utf-8',
          )
          declared = sum(1 for row in canonical if row.get('status') == 'DECLARED' and row.get('usable_complete') is True)
          print(json.dumps({
              'authoritative_audit_run': int('${{ steps.canonical-audit.outputs.run_id }}'),
              'inventory_products': inventory,
              'processed_canonical': processed,
              'canonical_declared': declared,
              'residual_total': residual_total,
              'residual_p9': len(p9),
              'residual_no_p9': len(no_p9),
              'candidate_rows': len(candidates),
              'historical_membership_parity_verifiable': True,
          }, sort_keys=True))
          PY
      - name: Install OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow
      - name: Run conservative OCR regressions
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_label_easyocr_extractor.py \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_label_reader_row_tokens.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_ocr_safety_regressions.py
      - name: Run bounded current-image canary
        working-directory: tools/catalog
        run: |
          python mercadona_neural_ocr_wave.py \
            --products mercadona-one-field-rescue-candidates.jsonl \
            --out mercadona-one-field-rescue-canary \
            --shard-index ${{ matrix.shard }} \
            --shard-count 4 \
            --limit 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-one-field-rescue-canary-${{ matrix.shard }}
          path: tools/catalog/mercadona-one-field-rescue-canary/
          retention-days: 30
          if-no-files-found: warn

  merge:
    runs-on: ubuntu-24.04
    needs: ocr
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mercadona-one-field-rescue-canary-*
          path: input
          merge-multiple: true
      - name: Merge and enforce safety invariants
        run: |
          python - <<'PY'
          from collections import Counter
          import glob, json
          from pathlib import Path
          rows = []
          for path in sorted(glob.glob('input/results-*.jsonl')):
              rows.extend(json.loads(line) for line in Path(path).read_text(encoding='utf-8').splitlines() if line.strip())
          counts = Counter(row.get('status', 'UNKNOWN') for row in rows)
          declared = [row for row in rows if row.get('status') == 'DECLARED']
          unsafe = []
          bad_provenance = []
          flagged = []
          easyocr_rows = []
          for row in rows:
              if row.get('source') != 'MERCADONA_FIRST_PARTY' or row.get('source_record_kind') != 'label image' or row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE' or row.get('redistribution_allowed') is not False:
                  bad_provenance.append(row.get('product_id'))
              if row.get('classified') is True or row.get('CLASSIFIED') is True or row.get('menu_eligible') is True or row.get('MENU_ELIGIBLE') is True:
                  flagged.append(row.get('product_id'))
              if any('easyocr' in (attempt.get('engines') or {}) for attempt in row.get('attempts') or []):
                  easyocr_rows.append(row.get('product_id'))
              if row.get('status') == 'DECLARED':
                  accepted = next((a for a in row.get('attempts') or [] if (a.get('ensemble') or {}).get('status') == 'DECLARED'), None)
                  ensemble = (accepted or {}).get('ensemble') or {}
                  if ensemble.get('independent_engine_families', 0) < 2 or ensemble.get('corroborated_fields', 0) < 4:
                      unsafe.append(row.get('product_id'))
          summary = {
              'processed': len(rows),
              'status_counts': dict(sorted(counts.items())),
              'declared': len(declared),
              'review': counts.get('REVIEW', 0),
              'no_visual_region': sum(1 for row in rows if row.get('visual_regions_detected') == 0),
              'errors': counts.get('ERROR', 0),
              'easyocr_observed_product_ids': sorted(set(easyocr_rows)),
              'declared_product_ids': [row.get('product_id') for row in declared],
              'unsafe_declared_product_ids': unsafe,
              'invalid_provenance_product_ids': bad_provenance,
              'classified_or_menu_eligible_product_ids': flagged,
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'redistribution_allowed': False,
          }
          Path('merged').mkdir(exist_ok=True)
          Path('merged/results.jsonl').write_text(''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in rows), encoding='utf-8')
          Path('merged/summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if unsafe or bad_provenance or flagged:
              raise SystemExit('Canary safety invariant failed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-one-field-rescue-canary-merged
          path: merged/
          retention-days: 30
          if-no-files-found: warn
