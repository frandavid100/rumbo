name: Catalog Mercadona one-field rescue canary

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-one-field-rescue-canary.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-one-field-rescue-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve latest successful canonical OCR audit
        id: canonical-audit
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            '/repos/frandavid100/rumbo/actions/workflows/catalog-mercadona-current-ocr-residual-audit-efficient.yml/runs?branch=agent%2Fcatalog-phase1&per_page=20' \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id')
          test "$run_id" != "null"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download latest canonical OCR audit
        uses: actions/download-artifact@v4
        with:
          name: mercadona-current-ocr-residual-audit-efficient
          path: tools/catalog/mercadona-current-ocr-residual-audit
          github-token: ${{ github.token }}
          run-id: ${{ steps.canonical-audit.outputs.run_id }}
      - name: Build live revalidated bounded-core rescue cut
        env:
          AUTHORITATIVE_AUDIT_RUN: ${{ steps.canonical-audit.outputs.run_id }}
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlparse
          from urllib.request import Request, urlopen

          base = Path('mercadona-current-ocr-residual-audit')
          summary_path = base / 'summary.json'
          bounded_path = base / 'current-review-failure-modes' / 'three-of-four-bounded-core-review.jsonl'
          for path in (summary_path, bounded_path):
              if not path.exists():
                  raise SystemExit(f'Missing authoritative audit file: {path}')

          summary = json.loads(summary_path.read_text(encoding='utf-8'))
          bounded = [
              json.loads(line)
              for line in bounded_path.read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          if int(summary.get('inventory_products', -1)) != 4280:
              raise SystemExit(f"Unexpected inventory size: {summary.get('inventory_products')}")
          if summary.get('historical_membership_parity_verifiable') is not True:
              raise SystemExit('Historical membership parity is not verifiable; refusing rescue canary')

          def norm_scalar(value):
              if value is None:
                  return None
              if isinstance(value, (str, int, float)):
                  text = str(value).strip()
                  return text or None
              return None

          def nested_values(obj, key):
              if isinstance(obj, dict):
                  if key in obj:
                      yield obj[key]
                  for value in obj.values():
                      yield from nested_values(value, key)
              elif isinstance(obj, list):
                  for value in obj:
                      yield from nested_values(value, key)

          def first_scalar(payload, keys):
              for key in keys:
                  direct = norm_scalar(payload.get(key)) if isinstance(payload, dict) else None
                  if direct:
                      return direct
              for key in keys:
                  for value in nested_values(payload, key):
                      scalar = norm_scalar(value)
                      if scalar:
                          return scalar
              return None

          def first_truthy(payload, keys):
              if isinstance(payload, dict):
                  for key in keys:
                      value = payload.get(key)
                      if value:
                          return value
              for key in keys:
                  for value in nested_values(payload, key):
                      if value:
                          return value
              return None

          def live_p9(payload):
              photo_lists = []
              if isinstance(payload, dict) and isinstance(payload.get('photos'), list):
                  photo_lists.append(payload['photos'])
              for value in nested_values(payload, 'photos'):
                  if isinstance(value, list) and value not in photo_lists:
                      photo_lists.append(value)
              hits = []
              for photos in photo_lists:
                  for photo in photos:
                      if not isinstance(photo, dict) or str(photo.get('perspective')) != '9':
                          continue
                      url = norm_scalar(photo.get('zoom')) or norm_scalar(photo.get('regular')) or norm_scalar(photo.get('url'))
                      if not url:
                          continue
                      host = (urlparse(url).hostname or '').lower()
                      if not (host == 'prod-mercadona.imgix.net' or host.endswith('.mercadona.es')):
                          continue
                      adapted = dict(photo)
                      adapted['perspective'] = 9
                      adapted['zoom'] = url
                      hits.append(adapted)
              unique = {}
              for hit in hits:
                  unique[hit['zoom']] = hit
              return list(unique.values())

          def fetch_live(product_id):
              urls = [
                  f'https://tienda.mercadona.es/api/v1_1/products/{product_id}?lang=es&wh=vlc1',
                  f'https://tienda.mercadona.es/api/v1_1/products/{product_id}',
              ]
              errors = []
              for url in urls:
                  request = Request(
                      url,
                      headers={
                          'Accept': 'application/json',
                          'User-Agent': 'Mozilla/5.0 (compatible; rumbo-catalog-audit/1.0)',
                          'Referer': 'https://tienda.mercadona.es/',
                      },
                  )
                  try:
                      with urlopen(request, timeout=20) as response:
                          payload = json.load(response)
                      return payload, url, None
                  except HTTPError as exc:
                      errors.append(f'{url}:HTTP_{exc.code}')
                      if exc.code == 404:
                          continue
                  except (URLError, TimeoutError, json.JSONDecodeError) as exc:
                      errors.append(f'{url}:{type(exc).__name__}:{exc}')
                  time.sleep(0.25)
              return None, None, ';'.join(errors)

          # This canary is intentionally limited to the smallest current REVIEW
          # residual: exactly three core values plus one non-exact bounded value.
          # The bounded value is never promoted or inferred. We only use the row
          # to choose a product, then reacquire product identity, ingredients and
          # P9 from the live official API before running OCR from scratch.
          bounded.sort(key=lambda row: (int(row.get('canonical_rank') or 999999), str(row.get('product_id') or '')))
          candidates = []
          status_rows = []
          seen = set()
          observed_at = datetime.now(timezone.utc).isoformat()
          for audit_row in bounded:
              product_id = str(audit_row.get('product_id') or '').strip()
              if not product_id or product_id in seen:
                  raise SystemExit(f'Invalid/duplicate bounded candidate product_id: {product_id!r}')
              seen.add(product_id)
              status = {
                  'product_id': product_id,
                  'name': audit_row.get('name'),
                  'audit_ean': str(audit_row.get('ean') or ''),
                  'missing_core_fields': audit_row.get('missing_core_fields'),
                  'safety_blockers': audit_row.get('safety_blockers'),
                  'audit_image_url': audit_row.get('image_url'),
                  'authoritative_audit_run': int(os.environ['AUTHORITATIVE_AUDIT_RUN']),
                  'live_api_checked_at': observed_at,
                  'eligible': False,
              }
              if audit_row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE' or audit_row.get('source') != 'MERCADONA_FIRST_PARTY' or audit_row.get('source_record_kind') != 'label image' or audit_row.get('redistribution_allowed') is not False:
                  raise SystemExit(f'Invalid audit provenance for bounded candidate {product_id}')

              payload, api_url, error = fetch_live(product_id)
              status['live_api_url'] = api_url
              if payload is None:
                  status['skip_reason'] = error or 'LIVE_API_UNAVAILABLE'
                  status_rows.append(status)
                  continue

              live_id = first_scalar(payload, ('id', 'product_id'))
              if live_id != product_id:
                  status['skip_reason'] = f'IDENTITY_MISMATCH:{live_id}'
                  status_rows.append(status)
                  continue

              live_ean = first_scalar(payload, ('ean',))
              audit_ean = str(audit_row.get('ean') or '').strip()
              status['live_ean'] = live_ean
              if not live_ean:
                  status['skip_reason'] = 'LIVE_EAN_MISSING'
                  status_rows.append(status)
                  continue
              if audit_ean and live_ean != audit_ean:
                  status['skip_reason'] = f'EAN_CHANGED:{audit_ean}->{live_ean}'
                  status_rows.append(status)
                  continue

              ingredients = first_truthy(payload, ('ingredients',))
              status['has_live_structured_ingredients'] = bool(ingredients)
              if not ingredients:
                  status['skip_reason'] = 'LIVE_STRUCTURED_INGREDIENTS_MISSING'
                  status_rows.append(status)
                  continue

              p9_hits = live_p9(payload)
              status['live_p9_count'] = len(p9_hits)
              if len(p9_hits) != 1:
                  status['skip_reason'] = f'LIVE_P9_COUNT:{len(p9_hits)}'
                  status_rows.append(status)
                  continue

              p9 = p9_hits[0]
              status['live_p9_url'] = p9['zoom']
              status['p9_changed_since_audit'] = p9['zoom'] != audit_row.get('image_url')
              name = first_scalar(payload, ('display_name', 'name')) or str(audit_row.get('name') or product_id)
              candidate = {
                  'product_id': product_id,
                  'id': product_id,
                  'ean': live_ean,
                  'name': name,
                  'display_name': name,
                  'brand': first_scalar(payload, ('brand',)),
                  'category_id': first_scalar(payload, ('category_id',)) or audit_row.get('category_id'),
                  'category_name': first_scalar(payload, ('category_name',)) or audit_row.get('category_name'),
                  'ingredients': ingredients,
                  'photos': [p9],
                  'share_url': first_scalar(payload, ('share_url',)),
                  'observed_at': observed_at,
                  'live_api_url': api_url,
                  'rescue_origin': 'THREE_OF_FOUR_BOUNDED_CORE_REVIEW',
                  'prior_missing_core_fields': audit_row.get('missing_core_fields'),
                  'prior_bounded_value_reused': False,
                  'missing_values_inferred': False,
              }
              candidates.append(candidate)
              status['eligible'] = True
              status['skip_reason'] = None
              status_rows.append(status)

          out_dir = Path('mercadona-one-field-rescue-canary')
          out_dir.mkdir(parents=True, exist_ok=True)
          Path('mercadona-one-field-rescue-candidates.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in candidates),
              encoding='utf-8',
          )
          (out_dir / 'live-candidate-status.json').write_text(
              json.dumps({
                  'authoritative_audit_run': int(os.environ['AUTHORITATIVE_AUDIT_RUN']),
                  'audit_bounded_candidates': len(bounded),
                  'live_eligible_candidates': len(candidates),
                  'candidates': status_rows,
                  'selection_policy': 'THREE_OF_FOUR_BOUNDED_CORE_REVIEW_THEN_LIVE_API_ID_EAN_INGREDIENTS_UNIQUE_P9_REVALIDATION',
                  'bounded_value_reused': False,
                  'missing_values_inferred': False,
                  'image_bytes_persisted': False,
                  'redistribution_allowed': False,
              }, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          print(json.dumps({
              'authoritative_audit_run': int(os.environ['AUTHORITATIVE_AUDIT_RUN']),
              'audit_bounded_candidates': len(bounded),
              'live_eligible_candidates': len(candidates),
              'skipped': len(bounded) - len(candidates),
              'missing_values_inferred': False,
          }, sort_keys=True))
          if not candidates:
              raise SystemExit('No bounded REVIEW candidate remains live with matching EAN, structured ingredients and one current P9')
          PY
      - name: Install OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow
      - name: Run conservative OCR regressions
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_label_easyocr_extractor.py \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_label_reader_row_tokens.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_ocr_safety_regressions.py
      - name: Run bounded current-image canary
        working-directory: tools/catalog
        shell: bash
        run: |
          set +e
          python mercadona_neural_ocr_wave.py \
            --products mercadona-one-field-rescue-candidates.jsonl \
            --out mercadona-one-field-rescue-canary \
            --shard-index ${{ matrix.shard }} \
            --shard-count 4 \
            --limit 8
          rc=$?
          set -e
          # Exit 2 means this deterministic shard is empty after live revalidation.
          # Other non-zero exits remain real failures.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            exit "$rc"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-one-field-rescue-canary-${{ matrix.shard }}
          path: tools/catalog/mercadona-one-field-rescue-canary/
          retention-days: 30
          if-no-files-found: warn

  merge:
    runs-on: ubuntu-24.04
    needs: ocr
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mercadona-one-field-rescue-canary-*
          path: input
          merge-multiple: true
      - name: Merge and enforce safety invariants
        run: |
          python - <<'PY'
          from collections import Counter
          import glob, json
          from pathlib import Path
          rows = []
          for path in sorted(glob.glob('input/results-*.jsonl')):
              rows.extend(json.loads(line) for line in Path(path).read_text(encoding='utf-8').splitlines() if line.strip())
          counts = Counter(row.get('status', 'UNKNOWN') for row in rows)
          declared = [row for row in rows if row.get('status') == 'DECLARED']
          unsafe = []
          bad_provenance = []
          flagged = []
          easyocr_rows = []
          for row in rows:
              if row.get('source') != 'MERCADONA_FIRST_PARTY' or row.get('source_record_kind') != 'label image' or row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE' or row.get('redistribution_allowed') is not False:
                  bad_provenance.append(row.get('product_id'))
              if row.get('classified') is True or row.get('CLASSIFIED') is True or row.get('menu_eligible') is True or row.get('MENU_ELIGIBLE') is True:
                  flagged.append(row.get('product_id'))
              if any('easyocr' in (attempt.get('engines') or {}) for attempt in row.get('attempts') or []):
                  easyocr_rows.append(row.get('product_id'))
              if row.get('status') == 'DECLARED':
                  accepted = next((a for a in row.get('attempts') or [] if (a.get('ensemble') or {}).get('status') == 'DECLARED'), None)
                  ensemble = (accepted or {}).get('ensemble') or {}
                  if ensemble.get('independent_engine_families', 0) < 2 or ensemble.get('corroborated_fields', 0) < 4:
                      unsafe.append(row.get('product_id'))
          summary = {
              'processed': len(rows),
              'status_counts': dict(sorted(counts.items())),
              'declared': len(declared),
              'review': counts.get('REVIEW', 0),
              'no_visual_region': sum(1 for row in rows if row.get('visual_regions_detected') == 0),
              'errors': counts.get('ERROR', 0),
              'easyocr_observed_product_ids': sorted(set(easyocr_rows)),
              'declared_product_ids': [row.get('product_id') for row in declared],
              'unsafe_declared_product_ids': unsafe,
              'invalid_provenance_product_ids': bad_provenance,
              'classified_or_menu_eligible_product_ids': flagged,
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'redistribution_allowed': False,
          }
          Path('merged').mkdir(exist_ok=True)
          Path('merged/results.jsonl').write_text(''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in rows), encoding='utf-8')
          Path('merged/summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if unsafe or bad_provenance or flagged:
              raise SystemExit('Canary safety invariant failed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-one-field-rescue-canary-merged
          path: merged/
          retention-days: 30
          if-no-files-found: warn
