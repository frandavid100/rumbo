name: Catalog Alcampo category HTML fallback probe
on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-alcampo-category-html-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe persistent-202 leaf categories through official short category route
        working-directory: tools/catalog
        run: |
          set +e
          python alcampo_category_html_probe.py --out alcampo-category-html-probe
          code=$?
          set -e
          echo "$code" > alcampo-category-html-probe/exit_code.txt
      - name: Persist result even when fallback is unavailable
        run: |
          cp tools/catalog/alcampo-category-html-probe/summary.json tools/catalog/fixtures/alcampo_category_html_probe_latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/catalog/fixtures/alcampo_category_html_probe_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "catalog: persist Alcampo category HTML fallback probe"
            git pull --rebase origin agent/catalog-phase1
            git push origin HEAD:agent/catalog-phase1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: alcampo-category-html-probe
          path: tools/catalog/alcampo-category-html-probe/
          retention-days: 7
