name: Catalog Carrefour first-party smoke

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-carrefour-first-party-smoke.yml'
      - 'tools/catalog/carrefour_first_party_sitemap.py'
      - 'tools/catalog/carrefour_first_party_inventory.py'
      - 'tools/catalog/carrefour_first_party_browser_probe.py'
      - 'tools/catalog/carrefour_first_party_browser_inventory.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: carrefour-first-party-smoke
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enumerate official Carrefour food sitemap
        continue-on-error: true
        working-directory: tools/catalog
        run: |
          python carrefour_first_party_sitemap.py \
            --out carrefour-first-party-sitemap \
            --max-sitemaps 5000 \
            --delay 0.15
      - name: Install Playwright Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser first-party inventory on a fresh runner
        working-directory: tools/catalog
        run: |
          python carrefour_first_party_browser_inventory.py \
            --out carrefour-first-party-browser-inventory \
            --delay 12 \
            --stop-after-blocks 1
      - name: Validate first-party provenance
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          for p in [
              pathlib.Path('tools/catalog/carrefour-first-party-sitemap/summary.json'),
              pathlib.Path('tools/catalog/carrefour-first-party-browser-inventory/summary.json'),
          ]:
              if not p.exists():
                  print('missing',p)
                  continue
              d=json.load(open(p,encoding='utf-8'))
              print('\n',p)
              print(json.dumps(d.get('counts',{}),ensure_ascii=False,indent=2))
              if d.get('source_policy') != 'FIRST_PARTY_CARREFOUR_ONLY':
                  raise SystemExit(f'Bad Carrefour provenance policy in {p}')
              if str(d.get('classification_performed')).lower() != 'false':
                  raise SystemExit(f'Extraction unexpectedly performed classification in {p}')
          PY
      - name: Persist compact first-party inventory and cumulative successes
        if: always()
        run: |
          mkdir -p tools/catalog/fixtures
          test ! -f tools/catalog/carrefour-first-party-sitemap/summary.json || cp tools/catalog/carrefour-first-party-sitemap/summary.json tools/catalog/fixtures/carrefour_first_party_sitemap_summary.json
          test ! -f tools/catalog/carrefour-first-party-sitemap/products.jsonl || cp tools/catalog/carrefour-first-party-sitemap/products.jsonl tools/catalog/fixtures/carrefour_first_party_sitemap_products.jsonl
          test ! -f tools/catalog/carrefour-first-party-sitemap/diagnostics.json || cp tools/catalog/carrefour-first-party-sitemap/diagnostics.json tools/catalog/fixtures/carrefour_first_party_sitemap_diagnostics.json
          test ! -f tools/catalog/carrefour-first-party-browser-inventory/summary.json || cp tools/catalog/carrefour-first-party-browser-inventory/summary.json tools/catalog/fixtures/carrefour_first_party_browser_inventory_latest.json
          python - <<'PY'
          import json, pathlib
          fixtures=pathlib.Path('tools/catalog/fixtures')
          out=pathlib.Path('tools/catalog/carrefour-first-party-browser-inventory')
          def read_jsonl(path):
              rows=[]
              if path.exists():
                  for line in path.read_text(encoding='utf-8').splitlines():
                      try: rows.append(json.loads(line))
                      except Exception: pass
              return rows
          products_path=fixtures/'carrefour_first_party_products_cumulative.jsonl'
          products={r.get('retailer_sku'):r for r in read_jsonl(products_path) if r.get('retailer_sku')}
          for r in read_jsonl(out/'products.jsonl'):
              if r.get('retailer_sku') and not r.get('fetch_error'):
                  products[r['retailer_sku']]=r
          products_path.write_text(''.join(json.dumps(products[k],ensure_ascii=False)+'\n' for k in sorted(products)),encoding='utf-8')
          evidence_path=fixtures/'carrefour_first_party_field_evidence_cumulative.jsonl'
          evidence={}
          for e in read_jsonl(evidence_path)+read_jsonl(out/'field_evidence.jsonl'):
              key=(e.get('retailer_sku'),e.get('field'),e.get('source'),e.get('source_url'))
              if all(key): evidence[key]=e
          evidence_path.write_text(''.join(json.dumps(evidence[k],ensure_ascii=False)+'\n' for k in sorted(evidence)),encoding='utf-8')
          print('cumulative products',len(products),'evidence',len(evidence))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/catalog/fixtures/carrefour_first_party_sitemap_summary.json \
            tools/catalog/fixtures/carrefour_first_party_sitemap_products.jsonl \
            tools/catalog/fixtures/carrefour_first_party_sitemap_diagnostics.json \
            tools/catalog/fixtures/carrefour_first_party_browser_inventory_latest.json \
            tools/catalog/fixtures/carrefour_first_party_products_cumulative.jsonl \
            tools/catalog/fixtures/carrefour_first_party_field_evidence_cumulative.jsonl 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "catalog: persist Carrefour first-party inventory"
            git pull --rebase origin agent/catalog-phase1
            git push origin HEAD:agent/catalog-phase1
          fi
      - name: Upload auditable first-party inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrefour-first-party-browser-inventory
          path: |
            tools/catalog/carrefour-first-party-sitemap/
            tools/catalog/carrefour-first-party-browser-inventory/
          retention-days: 7
          if-no-files-found: warn

  direct-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Direct HTTP first-party probe on a separate runner
        continue-on-error: true
        working-directory: tools/catalog
        run: |
          python carrefour_first_party_inventory.py \
            --out carrefour-first-party-smoke \
            --max-pages 1 \
            --max-products 8 \
            --workers 2 \
            --seed-url 'https://www.carrefour.es/supermercado/limonada-carrefour-botella-1-l/R-530362942/p' \
            --seed-url 'https://www.carrefour.es/supermercado/bocaditos-carrefour-370-g/R-682401711/p' \
            --seed-url 'https://www.carrefour.es/supermercado/leche-condensada-carrefour-397-g/R-521003205/p' \
            --seed-url 'https://www.carrefour.es/supermercado/pizza-de-jamon-y-queso-carrefour-580-g/R-prod600097/p' \
            --seed-url 'https://www.carrefour.es/supermercado/gofre-azucarado-carrefour-classic-pack-de-6-unidades-de-55-g/R-544101780/p' \
            --seed-url 'https://www.carrefour.es/supermercado/mayonesa-carrefour-envase-500-ml-475g/R-VC4AECOMM-013524/p' \
            --seed-url 'https://www.carrefour.es/supermercado/palitos-de-mar-carrefour-450-g/R-521034877/p' \
            --seed-url 'https://www.carrefour.es/supermercado/pappardelle-al-ragu-findus-300-g/R-VC4AECOMM-701721/p'
      - name: Upload HTTP diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrefour-first-party-http-diagnostics
          path: tools/catalog/carrefour-first-party-smoke/
          retention-days: 7
          if-no-files-found: warn
