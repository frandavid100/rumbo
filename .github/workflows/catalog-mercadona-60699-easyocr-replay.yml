name: Catalog Mercadona 60699 EasyOCR replay

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - 'tools/catalog/label_easyocr_extractor.py'
      - 'tools/catalog/test_label_easyocr_extractor.py'
      - '.github/workflows/catalog-mercadona-60699-easyocr-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-mercadona-60699-easyocr-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow

      - name: Run conservative OCR regression tests
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_label_easyocr_extractor.py \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_label_reader_row_tokens.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_ocr_safety_regressions.py

      - name: Build exact historical p9 replay seed
        working-directory: tools/catalog
        run: |
          cat > mercadona-60699-products.jsonl <<'JSONL'
          {"brand":"La Hacienda del ibérico","category_id":"824","category_name":"Chorizo","ean":"8480000606990","name":"Chorizo ibérico extra La Hacienda del ibérico lonchas","observed_at":null,"photos":[{"perspective":9,"zoom":"https://prod-mercadona.imgix.net/images/391989af1bcb3500680abd06af586b01.jpg?fit=crop&h=3600&w=3600"}],"product_id":"60699","replay_seed_source":{"canonical_status":"REVIEW","evidence_level":"OCR_DERIVED_FROM_MERCADONA_IMAGE","image_persisted":false,"latest_raw_artifact_created_at":"2026-09-03T14:30:22Z","latest_raw_artifact_id":9898026069,"latest_raw_run_id":33765691763,"nutrition_copied":false,"redistribution_allowed":false,"source":"MERCADONA_FIRST_PARTY","source_record_kind":"label image"},"share_url":null}
          JSONL

      - name: Replay exact first-party label
        working-directory: tools/catalog
        run: |
          python mercadona_neural_ocr_wave.py \
            --products mercadona-60699-products.jsonl \
            --out mercadona-60699-easyocr-replay \
            --shard-index 0 \
            --shard-count 1 \
            --limit 1 \
            --eligibility-mode p9-no-ingredients-all

      - name: Validate provenance and acceptance contract
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import glob
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          paths = glob.glob('mercadona-60699-easyocr-replay/results-*.jsonl')
          rows = [json.loads(line) for path in paths for line in Path(path).read_text(encoding='utf-8').splitlines() if line.strip()]
          if len(rows) != 1:
              raise SystemExit(f'expected exactly one result row, got {len(rows)}')
          row = rows[0]
          expected_url = 'https://prod-mercadona.imgix.net/images/391989af1bcb3500680abd06af586b01.jpg?fit=crop&h=3600&w=3600'
          if (
              str(row.get('product_id')) != '60699'
              or str(row.get('ean')) != '8480000606990'
              or str(row.get('perspective')) != '9'
              or str(row.get('image_url')) != expected_url
              or (urlparse(str(row.get('image_url') or '')).hostname or '').lower() != 'prod-mercadona.imgix.net'
              or row.get('source') != 'MERCADONA_FIRST_PARTY'
              or row.get('source_record_kind') != 'label image'
              or row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE'
              or row.get('redistribution_allowed') is not False
              or row.get('classified') is True
              or row.get('CLASSIFIED') is True
              or row.get('menu_eligible') is True
              or row.get('MENU_ELIGIBLE') is True
          ):
              raise SystemExit('provenance/identity contract failed')
          if row.get('status') == 'DECLARED':
              accepted = next((a for a in (row.get('attempts') or []) if (a.get('ensemble') or {}).get('status') == 'DECLARED'), None)
              ensemble = (accepted or {}).get('ensemble') or {}
              nutrition = ensemble.get('nutrition') or {}
              if (
                  ensemble.get('independent_engine_families', 0) < 2
                  or ensemble.get('corroborated_fields', 0) < 4
                  or any(nutrition.get(k) is None for k in ('calories','fat_g','carbohydrate_g','protein_g'))
              ):
                  raise SystemExit('unsafe DECLARED result')
          summary = {
              'product_id': row.get('product_id'),
              'ean': row.get('ean'),
              'status': row.get('status'),
              'image_url': row.get('image_url'),
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'redistribution_allowed': False,
              'images_persisted': False,
              'missing_values_inferred': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          Path('mercadona-60699-easyocr-replay/validation-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-60699-easyocr-replay
          path: tools/catalog/mercadona-60699-easyocr-replay/
          retention-days: 30
          if-no-files-found: warn
