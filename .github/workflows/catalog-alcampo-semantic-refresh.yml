name: Catalog Alcampo semantic review refresh
on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - 'tools/catalog/manual/alcampo_semantic_reviews.jsonl'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: catalog-alcampo-semantic-refresh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find newest usable canonical snapshot
        id: base
        run: |
          # Prefer the immediate-salvage snapshot because it keeps the complete
          # 13,877-SKU listing baseline while accepting whatever first-party detail
          # has already finished. Fall back to the strict complete pipeline when a
          # salvage snapshot is not available.
          live_run=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/catalog-alcampo-live-salvage.yml/runs?branch=agent%2Fcatalog-phase1&status=completed&per_page=20" \
            --jq '.workflow_runs[] | select(.conclusion=="success") | .id' | head -n 1)
          if [ -n "$live_run" ]; then
            echo "run_id=$live_run" >> "$GITHUB_OUTPUT"
            echo "artifact=alcampo-live-salvage-snapshot" >> "$GITHUB_OUTPUT"
            echo "kind=live_salvage" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run_id=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/catalog-alcampo-sharded-enumeration.yml/runs?branch=agent%2Fcatalog-phase1&status=completed&per_page=30" \
            --jq '.workflow_runs[] | select(.conclusion=="success") | .id' | head -n 1)
          if [ -z "$run_id" ]; then
            echo "No usable Alcampo canonical snapshot exists yet" >&2
            exit 2
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact=alcampo-food-catalog-classified-snapshot" >> "$GITHUB_OUTPUT"
          echo "kind=complete_pipeline" >> "$GITHUB_OUTPUT"
      - name: Download canonical snapshot
        run: |
          mkdir -p alcampo-reviewed
          gh run download "${{ steps.base.outputs.run_id }}" -n "${{ steps.base.outputs.artifact }}" -D alcampo-reviewed
          test -s alcampo-reviewed/alcampo_catalog.sqlite
          test -s alcampo-reviewed/source_products.jsonl
      - name: Apply persisted semantic model reviews
        working-directory: tools/catalog
        run: python alcampo_semantic_gate.py ../../alcampo-reviewed/alcampo_catalog.sqlite --reviews manual/alcampo_semantic_reviews.jsonl
      - name: Prepare next review batch
        working-directory: tools/catalog
        run: |
          python alcampo_prepare_semantic_review_v2.py ../../alcampo-reviewed/alcampo_catalog.sqlite \
            --observations ../../alcampo-reviewed/source_products.jsonl \
            --reviews manual/alcampo_semantic_reviews.jsonl \
            --output ../../alcampo-reviewed/semantic_review_next.jsonl \
            --progress ../../alcampo-reviewed/semantic_review_progress.json \
            --limit 1000
      - name: Re-export reviewed snapshot
        working-directory: tools/catalog
        run: |
          args=(../../alcampo-reviewed/alcampo_catalog.sqlite --jsonl ../../alcampo-reviewed/alcampo_catalog.jsonl --summary ../../alcampo-reviewed/summary.json)
          if [ -f ../../alcampo-reviewed/detail_merge_summary.json ]; then args+=(--detail-summary ../../alcampo-reviewed/detail_merge_summary.json); fi
          if [ -f ../../alcampo-reviewed/enumeration_report.json ]; then args+=(--enumeration-report ../../alcampo-reviewed/enumeration_report.json); fi
          python alcampo_export_final.py "${args[@]}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('../../alcampo-reviewed/summary.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['semantic_review_base_kind']=os.environ['BASE_KIND']
          d['semantic_review_base_run']=os.environ['BASE_RUN']
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
        env:
          BASE_KIND: ${{ steps.base.outputs.kind }}
          BASE_RUN: ${{ steps.base.outputs.run_id }}
      - name: Persist reviewed coverage and next queue
        run: |
          cp alcampo-reviewed/summary.json tools/catalog/fixtures/alcampo_final_summary_latest.json
          cp alcampo-reviewed/semantic_review_next.jsonl tools/catalog/fixtures/alcampo_semantic_review_next.jsonl
          cp alcampo-reviewed/semantic_review_progress.json tools/catalog/fixtures/alcampo_semantic_review_progress_latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/catalog/fixtures/alcampo_final_summary_latest.json \
                  tools/catalog/fixtures/alcampo_semantic_review_next.jsonl \
                  tools/catalog/fixtures/alcampo_semantic_review_progress_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "catalog: persist reviewed Alcampo semantic progress"
            git pull --rebase origin agent/catalog-phase1
            git push origin HEAD:agent/catalog-phase1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: alcampo-food-catalog-classified-snapshot-reviewed
          path: alcampo-reviewed/
          retention-days: 14
