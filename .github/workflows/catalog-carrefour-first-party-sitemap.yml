name: Carrefour first-party official sitemap inventory

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-carrefour-first-party-sitemap.yml'
      - 'tools/catalog/carrefour_first_party_sitemap.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: carrefour-first-party-sitemap
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enumerate official Carrefour food sitemap
        continue-on-error: true
        working-directory: tools/catalog
        run: |
          python carrefour_first_party_sitemap.py \
            --out carrefour-first-party-sitemap \
            --max-sitemaps 5000 \
            --delay 0.15
      - name: Persist official first-party candidate inventory and diagnostics
        if: always()
        run: |
          mkdir -p tools/catalog/fixtures
          if test -f tools/catalog/carrefour-first-party-sitemap/summary.json; then
            cp tools/catalog/carrefour-first-party-sitemap/summary.json tools/catalog/fixtures/carrefour_first_party_sitemap_summary.json
          fi
          if test -f tools/catalog/carrefour-first-party-sitemap/products.jsonl; then
            cp tools/catalog/carrefour-first-party-sitemap/products.jsonl tools/catalog/fixtures/carrefour_first_party_sitemap_products.jsonl
          fi
          if test -f tools/catalog/carrefour-first-party-sitemap/diagnostics.json; then
            cp tools/catalog/carrefour-first-party-sitemap/diagnostics.json tools/catalog/fixtures/carrefour_first_party_sitemap_diagnostics.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/catalog/fixtures/carrefour_first_party_sitemap_summary.json \
            tools/catalog/fixtures/carrefour_first_party_sitemap_products.jsonl \
            tools/catalog/fixtures/carrefour_first_party_sitemap_diagnostics.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "catalog: persist Carrefour official sitemap inventory"
            git pull --rebase origin agent/catalog-phase1
            git push origin HEAD:agent/catalog-phase1
          fi
      - name: Validate first-party inventory
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('tools/catalog/carrefour-first-party-sitemap/summary.json')
          if not p.exists():
              raise SystemExit('Sitemap inventory produced no summary')
          d=json.load(open(p,encoding='utf-8'))
          print(json.dumps(d,ensure_ascii=False,indent=2))
          if d.get('source_policy') != 'FIRST_PARTY_CARREFOUR_ONLY':
              raise SystemExit('Bad provenance policy')
          if str(d.get('classification_performed')).lower() != 'false':
              raise SystemExit('Sitemap inventory performed classification')
          if d['counts']['product_urls'] < 1:
              raise SystemExit('Official sitemap yielded no Carrefour product URLs')
          if d['counts']['remaining_sitemaps']:
              raise SystemExit('Sitemap traversal was incomplete')
          PY
      - name: Upload auditable sitemap inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrefour-first-party-official-sitemap
          path: tools/catalog/carrefour-first-party-sitemap/
          retention-days: 7
          if-no-files-found: warn
