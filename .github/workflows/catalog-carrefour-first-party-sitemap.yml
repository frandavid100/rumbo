name: Carrefour first-party official sitemap inventory

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-carrefour-first-party-sitemap.yml'
      - 'tools/catalog/carrefour_first_party_sitemap.py'
      - 'tools/catalog/carrefour_first_party_sitemap_browser.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: carrefour-first-party-sitemap
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Try all robots-declared non-bodega Carrefour sitemap roots over direct HTTP
        working-directory: tools/catalog
        run: |
          declare -A ROOTS=(
            [food]='https://www.carrefour.es/crs/cdn-static/sitemap-food/index.xml'
            [includes]='https://www.carrefour.es/_includes/sitemap.xml'
            [media]='https://www.carrefour.es/tecno/dyn/MEDIA/siteindex.xml'
          )
          for key in food includes media; do
            python carrefour_first_party_sitemap.py \
              --index-url "${ROOTS[$key]}" \
              --out "carrefour-first-party-sitemap-http-$key" \
              --max-sitemaps 1200 \
              --delay 0.05 || true
          done
      - name: Decide whether browser fallback is needed
        id: sitemap_http
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          products=0
          for p in pathlib.Path('tools/catalog').glob('carrefour-first-party-sitemap-http-*/summary.json'):
              try:
                  products += int(json.load(open(p,encoding='utf-8')).get('counts',{}).get('product_urls',0) or 0)
              except Exception:
                  pass
          print(f'product_urls={products}')
          print('browser_needed=' + ('true' if products < 1 else 'false'))
          PY
      - name: Install Playwright browser for same-origin official sitemap fallback
        if: always() && steps.sitemap_http.outputs.browser_needed == 'true'
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Try all official sitemap roots in a normal same-origin browser session
        if: always() && steps.sitemap_http.outputs.browser_needed == 'true'
        working-directory: tools/catalog
        run: |
          declare -A ROOTS=(
            [food]='https://www.carrefour.es/crs/cdn-static/sitemap-food/index.xml'
            [includes]='https://www.carrefour.es/_includes/sitemap.xml'
            [media]='https://www.carrefour.es/tecno/dyn/MEDIA/siteindex.xml'
          )
          for key in food includes media; do
            python carrefour_first_party_sitemap_browser.py \
              --index-url "${ROOTS[$key]}" \
              --out "carrefour-first-party-sitemap-browser-$key" \
              --max-sitemaps 1200 \
              --delay 0.05 \
              --timeout 45 || true
          done
      - name: Select strongest official sitemap observation
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, shutil
          root=pathlib.Path('tools/catalog')
          candidates=[]
          for d in sorted(root.glob('carrefour-first-party-sitemap-*-*')):
              if d.name == 'carrefour-first-party-sitemap':
                  continue
              p=d/'summary.json'
              if not p.exists():
                  continue
              try:
                  summary=json.load(open(p,encoding='utf-8'))
              except Exception:
                  continue
              count=int(summary.get('counts',{}).get('product_urls',0) or 0)
              errors=int(summary.get('counts',{}).get('sitemap_fetch_errors',0) or 0)
              remaining=int(summary.get('counts',{}).get('remaining_sitemaps',0) or 0)
              candidates.append((count, -remaining, -errors, d))
          if not candidates:
              raise SystemExit('No sitemap attempt produced a summary')
          _,_,_,src=max(candidates, key=lambda x:(x[0],x[1],x[2],x[3].name))
          dst=root/'carrefour-first-party-sitemap'
          if dst.exists():
              shutil.rmtree(dst)
          shutil.copytree(src,dst)
          print(f'Selected {src.name}')
          print((dst/'summary.json').read_text(encoding='utf-8'))
          PY
      - name: Persist official first-party candidate inventory and diagnostics
        if: always()
        run: |
          mkdir -p tools/catalog/fixtures
          if test -f tools/catalog/carrefour-first-party-sitemap/summary.json; then
            cp tools/catalog/carrefour-first-party-sitemap/summary.json tools/catalog/fixtures/carrefour_first_party_sitemap_summary.json
          fi
          if test -f tools/catalog/carrefour-first-party-sitemap/products.jsonl; then
            cp tools/catalog/carrefour-first-party-sitemap/products.jsonl tools/catalog/fixtures/carrefour_first_party_sitemap_products.jsonl
          fi
          if test -f tools/catalog/carrefour-first-party-sitemap/diagnostics.json; then
            cp tools/catalog/carrefour-first-party-sitemap/diagnostics.json tools/catalog/fixtures/carrefour_first_party_sitemap_diagnostics.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/catalog/fixtures/carrefour_first_party_sitemap_summary.json \
            tools/catalog/fixtures/carrefour_first_party_sitemap_products.jsonl \
            tools/catalog/fixtures/carrefour_first_party_sitemap_diagnostics.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "catalog: persist Carrefour official sitemap inventory"
            git pull --rebase origin agent/catalog-phase1
            git push origin HEAD:agent/catalog-phase1
          fi
      - name: Validate first-party inventory
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('tools/catalog/carrefour-first-party-sitemap/summary.json')
          if not p.exists():
              raise SystemExit('Sitemap inventory produced no summary')
          d=json.load(open(p,encoding='utf-8'))
          print(json.dumps(d,ensure_ascii=False,indent=2))
          if d.get('source_policy') != 'FIRST_PARTY_CARREFOUR_ONLY':
              raise SystemExit('Bad provenance policy')
          if str(d.get('classification_performed')).lower() != 'false':
              raise SystemExit('Sitemap inventory performed classification')
          if d['counts']['product_urls'] < 1:
              raise SystemExit('All three official non-bodega sitemap roots yielded no Carrefour supermarket product URLs through direct HTTP or a normal same-origin browser session')
          if d['counts']['remaining_sitemaps']:
              raise SystemExit('Selected sitemap traversal was incomplete')
          PY
      - name: Upload auditable sitemap inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrefour-first-party-official-sitemap
          path: |
            tools/catalog/carrefour-first-party-sitemap/
            tools/catalog/carrefour-first-party-sitemap-http-*/
            tools/catalog/carrefour-first-party-sitemap-browser-*/
          retention-days: 7
          if-no-files-found: warn
