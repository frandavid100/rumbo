name: Catalog Mercadona no-p9 food residual OCR

# Bounded follow-up after the perspective=9 food route reached zero actionable
# residuals. Processes only the exact first-party food-route products from the
# latest residual audit that lack p9 and have one unambiguous selected alternate
# first-party photo. Images remain temporary; only OCR evidence/results persist.
on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - 'tools/catalog/mercadona-no-p9-food-residual-selection-2026-09-07.json'
      - '.github/workflows/catalog-mercadona-no-p9-food-residual-ocr.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-no-p9-food-residual-ocr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download consolidated Mercadona first-party cut
        uses: actions/download-artifact@v4
        with:
          name: mercadona-first-party-final
          path: tools/catalog/mercadona-first-party-final
          github-token: ${{ github.token }}
          run-id: 33046950149
      - name: Install independent OCR engines and visual detector dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow
      - name: Run conservative alternate-photo OCR regressions
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_mercadona_neural_ocr_alternate_photo_wave.py \
            test_label_easyocr_extractor.py \
            test_nutrition_label_reader.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_ocr_safety_regressions.py
      - name: OCR exact no-p9 food residual shard
        working-directory: tools/catalog
        run: |
          python mercadona_neural_ocr_alternate_photo_wave.py \
            --selection mercadona-no-p9-food-residual-selection-2026-09-07.json \
            --products mercadona-first-party-final/products.jsonl \
            --out mercadona-no-p9-food-residual-ocr \
            --shard-index ${{ matrix.shard }} \
            --shard-count 4 \
            --limit 0 \
            --eligibility-mode p9-no-ingredients-all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-no-p9-food-residual-${{ matrix.shard }}
          path: tools/catalog/mercadona-no-p9-food-residual-ocr/
          retention-days: 30
          if-no-files-found: warn

  merge:
    runs-on: ubuntu-24.04
    needs: ocr
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/download-artifact@v4
        with:
          pattern: mercadona-no-p9-food-residual-*
          path: input
          merge-multiple: true
      - name: Merge, normalize metadata and safety-check residual wave
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          from collections import Counter
          import glob, json, sqlite3
          from pathlib import Path

          selection = json.loads(Path('mercadona-no-p9-food-residual-selection-2026-09-07.json').read_text(encoding='utf-8'))
          expected = {str(row['product_id']) for row in selection['products']}
          rows = []
          for path in sorted(glob.glob('../../input/results-*.jsonl')):
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  if line.strip():
                      rows.append(json.loads(line))

          ids = [str(row.get('product_id') or '') for row in rows]
          duplicates = sorted(pid for pid, n in Counter(ids).items() if n > 1)
          missing = sorted(expected - set(ids))
          extra = sorted(set(ids) - expected)
          invalid_declared = []
          provenance_errors = []
          for row in rows:
              row['eligibility_mode'] = 'alternate-photo-no-p9-food-residual-wave'
              if isinstance(row.get('photo_selection'), dict):
                  row['photo_selection']['wave'] = 'NO_P9_FOOD_RESIDUAL_2026_09_07'
              if row.get('perspective') == 9:
                  provenance_errors.append(f"{row.get('product_id')}:fake_p9")
              if row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE':
                  provenance_errors.append(f"{row.get('product_id')}:evidence")
              if row.get('source') != 'MERCADONA_FIRST_PARTY':
                  provenance_errors.append(f"{row.get('product_id')}:source")
              if row.get('source_record_kind') != 'label image':
                  provenance_errors.append(f"{row.get('product_id')}:source_record_kind")
              if row.get('redistribution_allowed') is not False:
                  provenance_errors.append(f"{row.get('product_id')}:redistribution")
              if row.get('status') == 'DECLARED':
                  accepted = next(
                      (a for a in (row.get('attempts') or []) if (a.get('ensemble') or {}).get('status') == 'DECLARED'),
                      None,
                  )
                  ensemble = (accepted or {}).get('ensemble') or {}
                  if ensemble.get('independent_engine_families', 0) < 2 or ensemble.get('corroborated_fields', 0) < 4:
                      invalid_declared.append(str(row.get('product_id')))

          counts = Counter(str(row.get('status') or 'UNKNOWN') for row in rows)
          staged = Path('mercadona-no-p9-food-residual-staged')
          staged.mkdir(exist_ok=True)
          (staged / 'results.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in rows),
              encoding='utf-8',
          )
          summary = {
              'inventory_products': 4280,
              'selection_products': len(expected),
              'processed': len(rows),
              'status_counts': dict(sorted(counts.items())),
              'declared': counts.get('DECLARED', 0),
              'review': counts.get('REVIEW', 0),
              'no_visual_region': counts.get('NO_VISUAL_REGION', 0),
              'error': counts.get('ERROR', 0),
              'declared_product_ids': sorted(str(row.get('product_id')) for row in rows if row.get('status') == 'DECLARED'),
              'invalid_declared_product_ids': sorted(invalid_declared),
              'duplicates': duplicates,
              'missing': missing,
              'extra': extra,
              'provenance_errors': sorted(provenance_errors),
              'source_audit_run_id': selection['source_audit_run_id'],
              'previous_exact_processed': 2941,
              'prospective_exact_processed_if_reconciled': 2941 + len(rows),
              'prospective_exact_processed_pct': round((2941 + len(rows)) * 100 / 4280, 4),
              'remaining_blocked_selector_ambiguity': selection.get('deferred_selector_ambiguity', []),
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'photo_selection_policy': 'EXPLICIT_NON_P9_FIRST_PARTY_PHOTO',
              'eligibility_mode': 'alternate-photo-no-p9-food-residual-wave',
              'redistribution_allowed': False,
              'historical_nutrition_inherited': False,
              'review_auto_promoted': False,
              'images_persisted': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          (staged / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          db = sqlite3.connect(staged / 'results.sqlite')
          try:
              db.execute(
                  'CREATE TABLE ocr_results (product_id TEXT PRIMARY KEY, status TEXT NOT NULL, '
                  'perspective TEXT NOT NULL, image_url TEXT NOT NULL, evidence_level TEXT NOT NULL, '
                  'source TEXT NOT NULL, redistribution_allowed INTEGER NOT NULL, row_json TEXT NOT NULL)'
              )
              db.executemany(
                  'INSERT INTO ocr_results VALUES (?, ?, ?, ?, ?, ?, ?, ?)',
                  [(
                      str(row['product_id']), str(row['status']), str(row['perspective']), str(row['image_url']),
                      str(row['evidence_level']), f"{row['source']}/{row['source_record_kind']}",
                      1 if row['redistribution_allowed'] else 0,
                      json.dumps(row, ensure_ascii=False, sort_keys=True),
                  ) for row in rows],
              )
              db.commit()
          finally:
              db.close()
          print(json.dumps(summary, ensure_ascii=False, indent=2))

          fatal = duplicates or missing or extra or invalid_declared or provenance_errors or len(rows) != len(expected)
          if fatal:
              raise SystemExit('Safety/coverage validation failed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-no-p9-food-residual-merged
          path: tools/catalog/mercadona-no-p9-food-residual-staged/
          retention-days: 30
          if-no-files-found: error
