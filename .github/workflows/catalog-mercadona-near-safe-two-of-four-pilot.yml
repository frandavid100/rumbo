name: Catalog Mercadona near-safe 2-of-4 pilot

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - 'tools/catalog/mercadona_near_safe_two_of_four_pilot.py'
      - 'tools/catalog/test_mercadona_near_safe_two_of_four_pilot.py'
      - '.github/workflows/catalog-mercadona-near-safe-two-of-four-pilot.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-near-safe-two-of-four-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve latest successful first-party cut
        id: first-party
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            '/repos/frandavid100/rumbo/actions/workflows/catalog-mercadona-first-party-probe.yml/runs?branch=agent%2Fcatalog-phase1&per_page=20' \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id')
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo "No successful Mercadona first-party probe run found" >&2
            exit 1
          fi
          usable=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/frandavid100/rumbo/actions/runs/$run_id/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "mercadona-first-party-final" and .expired == false)] | length')
          if [[ "$usable" != "1" ]]; then
            echo "Latest successful first-party run $run_id has no live mercadona-first-party-final artifact" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using first-party run $run_id"

      - name: Download consolidated Mercadona first-party cut
        uses: actions/download-artifact@v4
        with:
          name: mercadona-first-party-final
          path: tools/catalog/mercadona-first-party-final
          github-token: ${{ github.token }}
          run-id: ${{ steps.first-party.outputs.run_id }}

      - name: Resolve latest successful canonical OCR audit
        id: canonical-audit
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            '/repos/frandavid100/rumbo/actions/workflows/catalog-mercadona-current-ocr-residual-audit.yml/runs?branch=agent%2Fcatalog-phase1&per_page=20' \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id')
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo "No successful canonical OCR audit run found" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using canonical audit run $run_id"

      - name: Download latest canonical OCR audit
        uses: actions/download-artifact@v4
        with:
          name: mercadona-current-ocr-residual-audit
          path: tools/catalog/mercadona-current-ocr-residual-audit
          github-token: ${{ github.token }}
          run-id: ${{ steps.canonical-audit.outputs.run_id }}

      - name: Install cohort selection import dependencies
        run: |
          python -m pip install --disable-pip-version-check opencv-python-headless numpy

      - name: Build deterministic deduplicated exact-image cohort
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json
          import mercadona_near_safe_two_of_four_pilot as pilot

          summary = pilot.refresh_workflow_cohort_if_available()
          if not summary or not summary.get("selected"):
              raise SystemExit("No unattempted actionable clean 2-of-4 exact first-party images found")
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY

      - name: Install independent OCR engines and visual detector dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow

      - name: Run conservative pilot tests first
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_mercadona_near_safe_two_of_four_pilot.py \
            test_mercadona_near_safe_variant_rescue.py \
            test_mercadona_ocr_safety_regressions.py \
            test_nutrition_ocr_ensemble.py \
            test_label_image_preprocess.py

      - name: OCR bounded 2-of-4 pilot with temporary variants
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mercadona-near-safe-two-of-four-pilot/with-ingredients
          mkdir -p mercadona-near-safe-two-of-four-pilot/without-ingredients

          run_group() {
            local products="$1"
            local out="$2"
            local mode="$3"
            set +e
            python mercadona_near_safe_two_of_four_pilot.py \
              --products "$products" \
              --out "$out" \
              --shard-index ${{ matrix.shard }} \
              --shard-count 4 \
              --limit 0 \
              --eligibility-mode "$mode"
            rc=$?
            set -e
            if [[ $rc -ne 0 && $rc -ne 2 ]]; then
              return "$rc"
            fi
          }

          run_group two-of-four-with-ingredients.jsonl mercadona-near-safe-two-of-four-pilot/with-ingredients priority
          run_group two-of-four-without-ingredients.jsonl mercadona-near-safe-two-of-four-pilot/without-ingredients p9-no-ingredients-all

          python - <<'PY'
          import glob
          import json
          from pathlib import Path

          meta = {}
          for products_path in ("two-of-four-with-ingredients.jsonl", "two-of-four-without-ingredients.jsonl"):
              for line in Path(products_path).read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  pid = str(row.get("product_id") or "")
                  image_meta = row.get("_near_safe_image_meta") or {}
                  if pid and image_meta:
                      meta[pid] = image_meta

          for result_path in glob.glob("mercadona-near-safe-two-of-four-pilot/**/results-*.jsonl", recursive=True):
              rows = []
              for line in Path(result_path).read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  pid = str(row.get("product_id") or "")
                  image_meta = meta.get(pid)
                  if image_meta is None:
                      raise SystemExit(f"missing pilot image metadata for result {pid}")
                  if str(row.get("image_url") or "") != str(image_meta.get("image_url") or ""):
                      raise SystemExit(f"pilot OCR used unexpected image for {pid}")
                  row["image_index"] = image_meta.get("image_index")
                  row["perspective"] = image_meta.get("perspective")
                  row["image_selection_basis"] = "EXACT_CANONICAL_TWO_OF_FOUR_IMAGE_URL_MATCHED_CURRENT_FIRST_PARTY_PHOTO"
                  row["image_selection_latest_raw_run_id"] = image_meta.get("canonical_latest_raw_run_id")
                  row["pilot_canonical_corroborated_fields"] = image_meta.get("canonical_corroborated_fields")
                  row["pilot_canonical_engine_families"] = image_meta.get("canonical_engine_families")
                  rows.append(row)
              Path(result_path).write_text(
                  "".join(json.dumps(row, ensure_ascii=False, sort_keys=True) + "\n" for row in rows),
                  encoding="utf-8",
              )

          for summary_path in glob.glob("mercadona-near-safe-two-of-four-pilot/**/summary-*.json", recursive=True):
              summary = json.loads(Path(summary_path).read_text(encoding="utf-8"))
              summary["image_selection_policy"] = "EXACT_CANONICAL_TWO_OF_FOUR_IMAGE_URL_MUST_MATCH_CURRENT_FIRST_PARTY_PHOTO"
              summary["synthetic_p9_routing_persisted"] = False
              summary["acceptance_policy_changed"] = False
              Path(summary_path).write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8")

          selection = Path("two-of-four-selection-summary.json")
          if selection.exists():
              (Path("mercadona-near-safe-two-of-four-pilot") / "selection-summary.json").write_text(
                  selection.read_text(encoding="utf-8"),
                  encoding="utf-8",
              )
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-near-safe-two-of-four-pilot-${{ matrix.shard }}
          path: tools/catalog/mercadona-near-safe-two-of-four-pilot/
          retention-days: 30
          if-no-files-found: warn

  merge:
    runs-on: ubuntu-24.04
    needs: ocr
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mercadona-near-safe-two-of-four-pilot-*
          path: input

      - name: Merge, validate, and stage auditable results
        run: |
          python - <<'PY'
          from collections import Counter
          import glob
          import json
          from pathlib import Path
          import sqlite3

          rows = []
          seen = set()
          for path in sorted(glob.glob("input/**/results-*.jsonl", recursive=True)):
              for line in Path(path).read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  pid = str(row.get("product_id") or "")
                  if not pid:
                      raise SystemExit("pilot result without product_id")
                  if pid in seen:
                      raise SystemExit(f"duplicate product in pilot merge: {pid}")
                  seen.add(pid)
                  rows.append(row)

          if not rows:
              raise SystemExit("No OCR result rows produced by pilot")

          invalid = []
          declared = []
          for row in rows:
              pid = str(row.get("product_id"))
              if (
                  row.get("source") != "MERCADONA_FIRST_PARTY"
                  or row.get("source_record_kind") != "label image"
                  or row.get("evidence_level") != "OCR_DERIVED_FROM_MERCADONA_IMAGE"
                  or row.get("redistribution_allowed") is not False
                  or row.get("image_selection_basis") != "EXACT_CANONICAL_TWO_OF_FOUR_IMAGE_URL_MATCHED_CURRENT_FIRST_PARTY_PHOTO"
                  or row.get("pilot_canonical_corroborated_fields") != 2
              ):
                  invalid.append(pid)
              if row.get("status") == "DECLARED":
                  declared.append(row)
                  attempt = next(
                      (a for a in row.get("attempts", []) if (a.get("ensemble") or {}).get("status") == "DECLARED"),
                      None,
                  )
                  ensemble = (attempt or {}).get("ensemble") or {}
                  if (
                      ensemble.get("independent_engine_families", 0) < 2
                      or ensemble.get("corroborated_fields", 0) < 4
                  ):
                      invalid.append(pid)

          if invalid:
              raise SystemExit(f"invalid pilot rows: {sorted(set(invalid))}")

          selection_paths = sorted(glob.glob("input/**/selection-summary.json", recursive=True))
          if not selection_paths:
              raise SystemExit("Missing selection summary")
          selection = json.loads(Path(selection_paths[0]).read_text(encoding="utf-8"))
          expected = {str(pid) for pid in selection.get("selected_product_ids", [])}
          if seen != expected:
              raise SystemExit(
                  f"merged result IDs differ from selected cohort: missing={sorted(expected-seen)} unexpected={sorted(seen-expected)}"
              )

          counts = Counter(str(row.get("status") or "UNKNOWN") for row in rows)
          out = Path("merged")
          out.mkdir(parents=True, exist_ok=True)
          (out / "results-merged.jsonl").write_text(
              "".join(json.dumps(row, ensure_ascii=False, sort_keys=True) + "\n" for row in rows),
              encoding="utf-8",
          )
          (out / "selection-summary.json").write_text(
              json.dumps(selection, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          summary = {
              "inventory_products": 4280,
              "processed": len(rows),
              "status_counts": dict(sorted(counts.items())),
              "declared": len(declared),
              "review": counts.get("REVIEW", 0),
              "error": counts.get("ERROR", 0),
              "no_visual_region": sum(row.get("visual_regions_detected") == 0 for row in rows),
              "declared_product_ids": [str(row.get("product_id")) for row in declared],
              "invalid_product_ids": [],
              "selection": selection,
              "image_selection_policy": "EXACT_CANONICAL_TWO_OF_FOUR_IMAGE_URL_MUST_MATCH_CURRENT_FIRST_PARTY_PHOTO",
              "acceptance_policy_changed": False,
              "evidence_level": "OCR_DERIVED_FROM_MERCADONA_IMAGE",
              "source": "MERCADONA_FIRST_PARTY/label image",
              "redistribution_allowed": False,
              "images_persisted": False,
              "classified": 0,
              "menu_eligible": 0,
          }
          (out / "summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          db = sqlite3.connect(out / "staging.sqlite")
          db.execute(
              """
              CREATE TABLE mercadona_ocr_staging (
                  product_id TEXT PRIMARY KEY,
                  product_name TEXT,
                  status TEXT NOT NULL,
                  basis TEXT,
                  calories REAL,
                  fat_g REAL,
                  carbohydrate_g REAL,
                  protein_g REAL,
                  image_url TEXT,
                  evidence_level TEXT NOT NULL,
                  source TEXT NOT NULL,
                  source_record_kind TEXT NOT NULL,
                  redistribution_allowed INTEGER NOT NULL,
                  parser_engine TEXT,
                  observed_at TEXT,
                  raw_json TEXT NOT NULL
              )
              """
          )
          for row in rows:
              declared_attempt = next(
                  (a for a in row.get("attempts", []) if (a.get("ensemble") or {}).get("status") == "DECLARED"),
                  None,
              )
              declared_ensemble = (declared_attempt or {}).get("ensemble") or {}
              nutrition = declared_ensemble.get("nutrition") if row.get("status") == "DECLARED" else {}
              nutrition = nutrition or {}
              basis = declared_ensemble.get("basis") if row.get("status") == "DECLARED" else None
              engine = declared_ensemble.get("engine") or row.get("parser_engine") or row.get("engine") or row.get("ocr_engine")
              observed_at = row.get("observed_at") or row.get("fetched_at") or row.get("created_at")
              db.execute(
                  """
                  INSERT INTO mercadona_ocr_staging VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
                  """,
                  (
                      str(row.get("product_id")),
                      row.get("product_name") or row.get("name"),
                      row.get("status"),
                      basis,
                      nutrition.get("calories"),
                      nutrition.get("fat_g"),
                      nutrition.get("carbohydrate_g"),
                      nutrition.get("protein_g"),
                      row.get("image_url"),
                      row.get("evidence_level"),
                      row.get("source"),
                      row.get("source_record_kind"),
                      0,
                      engine,
                      observed_at,
                      json.dumps(row, ensure_ascii=False, sort_keys=True),
                  ),
              )
          db.commit()
          db.close()

          forbidden = [
              str(path)
              for path in out.rglob("*")
              if path.is_file() and path.suffix.lower() in {".jpg", ".jpeg", ".png", ".webp", ".avif", ".gif"}
          ]
          if forbidden:
              raise SystemExit(f"image files must not be persisted: {forbidden}")

          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: mercadona-near-safe-two-of-four-pilot-merged
          path: merged/
          retention-days: 90
          if-no-files-found: error
