name: Catalog Mercadona Tesseract two-family three-uncorroborated-core pilot

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-tesseract-two-family-three-uncorroborated-core-pilot.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-tesseract-two-family-three-uncorroborated-core-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download consolidated Mercadona first-party cut
        uses: actions/download-artifact@v4
        with:
          name: mercadona-first-party-final
          path: tools/catalog/mercadona-first-party-final
          repository: frandavid100/rumbo
          github-token: ${{ github.token }}
          run-id: 33046950149
      - name: Download persisted p9 replay evidence
        uses: actions/download-artifact@v4
        with:
          name: mercadona-ocr-replay-2630
          path: tools/catalog/mercadona-ocr-replay-2630
          repository: frandavid100/rumbo
          github-token: ${{ github.token }}
          run-id: 33331091953
      - name: Audit and build deterministic pilot input
        working-directory: tools/catalog
        run: |
          python audit_mercadona_p9_two_family_three_uncorroborated_core_candidates.py \
            --replay-results mercadona-ocr-replay-2630/results-replayed.jsonl \
            --out mercadona-p9-two-family-three-uncorroborated-core-audit
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          def key(row):
              pid = str(row.get('product_id') or '')
              ean = str(row.get('ean') or '')
              return hashlib.sha256(f'{pid}\0{ean}'.encode('utf-8')).hexdigest(), pid

          candidates = [
              json.loads(line)
              for line in Path(
                  'mercadona-p9-two-family-three-uncorroborated-core-audit/'
                  'two-family-three-uncorroborated-core-candidates.jsonl'
              ).read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          if len(candidates) != 41:
              raise SystemExit(f'expected 41 audited candidates, got {len(candidates)}')
          selected = sorted(candidates, key=key)[:16]
          selected_ids = [str(row['product_id']) for row in selected]
          expected = [
              '13709','28197','21537','59160','27559','15112','20709','2632',
              '52592','12347','61416','14212','31504','2817','26997','14031'
          ]
          if selected_ids != expected:
              raise SystemExit(f'deterministic pilot drift: {selected_ids}')
          if len(set(selected_ids)) != 16:
              raise SystemExit('selected product IDs are not unique')

          products = [
              json.loads(line)
              for line in Path('mercadona-first-party-final/products.jsonl')
              .read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          by_id = {
              str(row.get('product_id') or ''): row
              for row in products
              if str(row.get('product_id') or '') in set(selected_ids)
          }
          output = [by_id[str(candidate['product_id'])] for candidate in selected if str(candidate['product_id']) in by_id]
          if len(output) != 16:
              raise SystemExit(f'pilot join mismatch selected=16 products={len(output)}')

          Path('two-family-three-uncorroborated-core-pilot-products.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in output),
              encoding='utf-8',
          )
          Path('two-family-three-uncorroborated-core-pilot-selection.json').write_text(
              json.dumps({
                  'candidate_universe': 41,
                  'candidate_policy': (
                      'stable p9 original+replay REVIEW + all 4 core values + explicit 100g/100ml basis '
                      '+ exactly 2 independent OCR families + exactly 1 corroborated core field '
                      '+ exactly 3 uncorroborated core fields each observed by exactly 1 family '
                      '+ no hard conflict + no energy/macro mismatch'
                  ),
                  'sample_order': 'SHA256_PRODUCT_ID_EAN',
                  'selected': 16,
                  'remaining_after_pilot': 25,
                  'product_ids': selected_ids,
                  'uncorroborated_core_fields': {
                      str(row['product_id']): row['uncorroborated_core_fields'] for row in selected
                  },
                  'uncorroborated_source_families': {
                      str(row['product_id']): row['uncorroborated_source_families'] for row in selected
                  },
                  'source': 'MERCADONA_FIRST_PARTY/label image',
                  'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
                  'redistribution_allowed': False,
                  'images_persisted': False,
                  'CLASSIFIED': 0,
                  'MENU_ELIGIBLE': 0,
              }, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Install OCR engines
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow
      - name: Run routing and conservative OCR tests
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_audit_mercadona_p9_two_family_three_uncorroborated_core_candidates.py \
            test_label_easyocr_extractor.py \
            test_nutrition_label_reader.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_ocr_safety_regressions.py \
            test_mercadona_neural_ocr_tesseract_preprocess_rescue.py
          python -m py_compile \
            audit_mercadona_p9_two_family_three_uncorroborated_core_candidates.py \
            mercadona_neural_ocr_tesseract_preprocess_rescue.py
      - name: Run two-family three-uncorroborated-core rescue pilot
        working-directory: tools/catalog
        run: |
          python mercadona_neural_ocr_tesseract_preprocess_rescue.py \
            --products two-family-three-uncorroborated-core-pilot-products.jsonl \
            --out mercadona-tesseract-two-family-three-uncorroborated-core-pilot \
            --shard-index ${{ matrix.shard }} \
            --shard-count 4 \
            --limit 0 \
            --delay 0.5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-tesseract-two-family-three-uncorroborated-core-pilot-${{ matrix.shard }}
          path: |
            tools/catalog/mercadona-tesseract-two-family-three-uncorroborated-core-pilot/
            tools/catalog/two-family-three-uncorroborated-core-pilot-selection.json
          retention-days: 30
          if-no-files-found: warn

  merge:
    runs-on: ubuntu-24.04
    needs: ocr
    if: ${{ always() && needs.ocr.result == 'success' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: mercadona-tesseract-two-family-three-uncorroborated-core-pilot-*
          path: input
          merge-multiple: true
      - name: Download replay baseline
        uses: actions/download-artifact@v4
        with:
          name: mercadona-ocr-replay-2630
          path: baseline-replay
          repository: frandavid100/rumbo
          github-token: ${{ github.token }}
          run-id: 33331091953
      - name: Rebuild audited baseline
        run: |
          python tools/catalog/audit_mercadona_p9_two_family_three_uncorroborated_core_candidates.py \
            --replay-results baseline-replay/results-replayed.jsonl \
            --out baseline-audit
      - name: Merge and enforce unchanged promotion contract
        run: |
          python - <<'PY'
          from collections import Counter
          import glob, hashlib, json, sqlite3
          from pathlib import Path

          FIELDS = ('calories', 'protein_g', 'carbohydrate_g', 'fat_g')
          ALLOWED = {'DECLARED', 'REVIEW', 'NO_VISUAL_REGION', 'ERROR'}

          def sample_key(row):
              pid = str(row.get('product_id') or '')
              ean = str(row.get('ean') or '')
              return hashlib.sha256(f'{pid}\0{ean}'.encode('utf-8')).hexdigest(), pid

          def close(field, a, b):
              a, b = float(a), float(b)
              tolerance = (
                  max(5.0, .04 * max(abs(a), abs(b), 1.0))
                  if field == 'calories'
                  else max(.6, .10 * max(abs(a), abs(b), 1.0))
              )
              return abs(a - b) <= tolerance

          baseline_rows = [
              json.loads(line)
              for line in Path(
                  'baseline-audit/two-family-three-uncorroborated-core-candidates.jsonl'
              ).read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          if len(baseline_rows) != 41:
              raise SystemExit(f'expected 41 baseline candidates, got {len(baseline_rows)}')
          baseline = {str(row['product_id']): row for row in baseline_rows}
          deterministic_ids = [
              str(row['product_id']) for row in sorted(baseline_rows, key=sample_key)[:16]
          ]

          manifest_paths = sorted(glob.glob(
              'input/**/two-family-three-uncorroborated-core-pilot-selection.json',
              recursive=True,
          ))
          if not manifest_paths:
              raise SystemExit('pilot selection manifest missing')
          manifests = [json.loads(Path(path).read_text(encoding='utf-8')) for path in manifest_paths]
          selection = manifests[0]
          if any(candidate != selection for candidate in manifests[1:]):
              raise SystemExit('pilot shard selection manifests disagree')
          expected_ids = set(selection.get('product_ids') or [])
          if len(expected_ids) != 16 or selection.get('product_ids') != deterministic_ids:
              raise SystemExit('selection mismatch or deterministic sample drift')
          if not expected_ids.issubset(baseline):
              raise SystemExit('selection contains product outside audited universe')

          result_paths = sorted(glob.glob('input/**/results-*.jsonl', recursive=True))
          if len(result_paths) != 4:
              raise SystemExit(f'expected 4 shard result files, got {len(result_paths)}: {result_paths}')
          rows = []
          for path in result_paths:
              rows.extend(
                  json.loads(line)
                  for line in Path(path).read_text(encoding='utf-8').splitlines()
                  if line.strip()
              )

          ids = [str(row.get('product_id') or '') for row in rows]
          observed = set(ids)
          counts = Counter(str(row.get('status') or 'UNKNOWN') for row in rows)
          duplicates = sorted(pid for pid, count in Counter(ids).items() if count > 1)
          missing = sorted(expected_ids - observed)
          unexpected = sorted(observed - expected_ids)
          bad_status = sorted(set(counts) - ALLOWED)
          provenance, unsafe, conflicts, safe = [], [], [], []

          for row in rows:
              pid = str(row.get('product_id') or '')
              prior = baseline.get(pid)
              if prior is None:
                  provenance.append(f'{pid}:not_in_baseline')
                  continue
              if (
                  row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE'
                  or row.get('source') != 'MERCADONA_FIRST_PARTY'
                  or row.get('source_record_kind') != 'label image'
                  or row.get('redistribution_allowed') is not False
                  or str(row.get('perspective')) != '9'
              ):
                  provenance.append(f'{pid}:provenance')
              if row.get('status') != 'DECLARED':
                  continue
              accepted = next(
                  (
                      attempt
                      for attempt in row.get('attempts') or []
                      if (attempt.get('ensemble') or {}).get('status') == 'DECLARED'
                  ),
                  None,
              )
              ensemble = (accepted or {}).get('ensemble') or {}
              nutrition = row.get('nutrition') or {}
              if (
                  int(ensemble.get('independent_engine_families') or 0) < 2
                  or int(ensemble.get('corroborated_fields') or 0) < 4
                  or any(nutrition.get(field) is None for field in FIELDS)
              ):
                  unsafe.append(pid)
                  continue
              bad = []
              if row.get('basis') != prior.get('basis'):
                  bad.append(f"basis:{prior.get('basis')}!={row.get('basis')}")
              prior_nutrition = prior.get('nutrition') or {}
              for field in FIELDS:
                  if prior_nutrition.get(field) is None or not close(
                      field, nutrition[field], prior_nutrition[field]
                  ):
                      bad.append(f"{field}:{prior_nutrition.get(field)}!~{nutrition[field]}")
              if bad:
                  conflicts.append({'product_id': pid, 'conflicts': bad})
                  continue
              safe.append({
                  'product_id': pid,
                  'ean': row.get('ean'),
                  'name': row.get('name'),
                  'basis': row.get('basis'),
                  'nutrition': {field: nutrition[field] for field in FIELDS},
                  'independent_engine_families': ensemble.get('independent_engine_families'),
                  'corroborated_fields': ensemble.get('corroborated_fields'),
                  'source': 'MERCADONA_FIRST_PARTY/label image',
                  'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
                  'redistribution_allowed': False,
                  'CLASSIFIED': 0,
                  'MENU_ELIGIBLE': 0,
              })

          ok = (
              len(rows) == 16
              and len(observed) == 16
              and not duplicates
              and not missing
              and not unexpected
              and not provenance
              and not unsafe
              and not conflicts
              and not bad_status
          )
          declared = len(safe)
          cumulative_declared = 255 + declared
          cumulative_review = 2688 - declared
          summary = {
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'redistribution_allowed': False,
              'candidate_universe': 41,
              'selected': 16,
              'processed': len(rows),
              'distinct_products_processed': len(observed),
              'remaining_candidates': 25,
              'status_counts': dict(sorted(counts.items())),
              'safe_promotion_products': declared,
              'safe_promotion_product_ids': sorted(item['product_id'] for item in safe),
              'front_after_pilot': {
                  'universe': 41,
                  'processed': 16,
                  'DECLARED': declared,
                  'REVIEW_or_other': 16 - declared,
                  'remaining': 25,
                  'promotion_rate_pct': round(declared * 100 / 16, 4),
                  'status': 'pilot_validated' if ok else 'failed',
              },
              'value_conflicts': conflicts,
              'unsafe_declared': unsafe,
              'duplicate_product_ids': duplicates,
              'missing_product_ids': missing,
              'unexpected_product_ids': unexpected,
              'unexpected_statuses': bad_status,
              'provenance_errors': provenance,
              'images_persisted': False,
              'missing_values_inferred': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
              'cumulative_after_pilot': {
                  'catalog_total': 4280,
                  'processed': 2943,
                  'DECLARED_complete': cumulative_declared,
                  'REVIEW': cumulative_review,
                  'complete_usable_coverage_pct': round(cumulative_declared * 100 / 4280, 4),
                  'processed_coverage_pct': round(2943 * 100 / 4280, 4),
              },
          }

          out = Path('merged')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          (out / 'results.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in rows),
              encoding='utf-8',
          )
          (out / 'safe-promotions.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in safe),
              encoding='utf-8',
          )
          (out / 'selection.json').write_text(
              json.dumps(selection, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          db = sqlite3.connect(out / 'staging.sqlite')
          db.execute(
              'CREATE TABLE ocr_results (product_id TEXT PRIMARY KEY, status TEXT NOT NULL, row_json TEXT NOT NULL)'
          )
          db.execute(
              'CREATE TABLE safe_promotions ('
              'product_id TEXT PRIMARY KEY, ean TEXT, name TEXT, basis TEXT, '
              'calories REAL, protein_g REAL, carbohydrate_g REAL, fat_g REAL, '
              'evidence_level TEXT NOT NULL, source TEXT NOT NULL, redistribution_allowed INTEGER NOT NULL, '
              'classified INTEGER NOT NULL, menu_eligible INTEGER NOT NULL)'
          )
          db.executemany(
              'INSERT INTO ocr_results VALUES (?, ?, ?)',
              [
                  (
                      str(row.get('product_id') or ''),
                      str(row.get('status') or 'UNKNOWN'),
                      json.dumps(row, ensure_ascii=False, sort_keys=True),
                  )
                  for row in rows
              ],
          )
          db.executemany(
              'INSERT INTO safe_promotions VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)',
              [
                  (
                      row['product_id'], row.get('ean'), row.get('name'), row.get('basis'),
                      row['nutrition']['calories'], row['nutrition']['protein_g'],
                      row['nutrition']['carbohydrate_g'], row['nutrition']['fat_g'],
                      row['evidence_level'], row['source'], 0, 0, 0,
                  )
                  for row in safe
              ],
          )
          db.commit()
          db.close()

          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if not ok:
              raise SystemExit('pilot safety/audit contract failed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mercadona-tesseract-two-family-three-uncorroborated-core-pilot-merged
          path: merged/
          retention-days: 30
          if-no-files-found: error
