name: Catalog Mercadona two-missing-core hardened regression dispatch

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-two-missing-core-hardened-regression-dispatch.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch existing bounded OCR pilot against hardened routing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            /repos/frandavid100/rumbo/actions/workflows/catalog-mercadona-tesseract-two-family-two-missing-core-pilot.yml/dispatches \
            -f ref='agent/catalog-phase1'
