name: Catalog Mercadona explicit serving-column rescue

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-explicit-serving-column-rescue.yml'
      - 'tools/catalog/mercadona_explicit_serving_column_rescue.py'
      - 'tools/catalog/mercadona_serving_column_rescue_wave.py'
      - 'tools/catalog/test_mercadona_explicit_serving_column_rescue.py'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: catalog-mercadona-explicit-serving-column-rescue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rescue:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve latest successful strict OCR audit
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            '/repos/frandavid100/rumbo/actions/workflows/catalog-mercadona-current-ocr-residual-audit.yml/runs?branch=agent%2Fcatalog-phase1&per_page=30' \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id')
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo 'No successful strict OCR audit found' >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using strict OCR audit run $run_id"

      - name: Download strict canonical audit
        uses: actions/download-artifact@v4
        with:
          name: mercadona-current-ocr-residual-audit
          path: /tmp/mercadona-audit
          github-token: ${{ github.token }}
          run-id: ${{ steps.audit.outputs.run_id }}

      - name: Require product 64499 to remain a strict REVIEW residual
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          pid = '64499'
          src = Path('/tmp/mercadona-audit/current-review-failure-modes/complete-but-safety-blocked.jsonl')
          rows = [json.loads(line) for line in src.read_text(encoding='utf-8').splitlines() if line.strip()]
          matches = [row for row in rows if str(row.get('product_id') or '') == pid]
          if len(matches) != 1:
              raise SystemExit(f'Expected one strict residual row for {pid}; found {len(matches)}')
          row = matches[0]
          blockers = set(row.get('safety_blockers') or [])
          reasons = set(row.get('reason_prefixes') or [])
          if (
              row.get('canonical_status') != 'REVIEW'
              or int(row.get('corroborated_fields') or 0) != 2
              or int(row.get('independent_engine_families') or 0) < 3
              or row.get('basis') not in {'100_g', '100_ml'}
              or blockers != {'HARD_OCR_CONFLICT'}
              or 'OCR_FIELD_CONFLICT' not in reasons
              or 'ENERGY_MACRO_MISMATCH' in reasons
              or 'MULTIPLE_NUTRITION_COLUMNS' in reasons
              or any(reason.startswith('IMPOSSIBLE_') for reason in reasons)
              or not str(row.get('ean') or '').strip()
              or not str(row.get('image_url') or '').strip()
          ):
              raise SystemExit('Product 64499 no longer satisfies the bounded historical anchor contract')
          Path('explicit-serving-anchor.json').write_text(
              json.dumps(row, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'canonical_audit_run_id': int('${{ steps.audit.outputs.run_id }}'),
              'product_id': pid,
              'name': row.get('name'),
              'canonical_status': row.get('canonical_status'),
              'corroborated_fields': row.get('corroborated_fields'),
              'independent_engine_families': row.get('independent_engine_families'),
              'safety_blockers': row.get('safety_blockers'),
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Rehydrate exact current first-party identity and rear image
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from mercadona_first_party_details import _get_json, normalize, _now

          old = json.loads(Path('explicit-serving-anchor.json').read_text(encoding='utf-8'))
          pid = str(old['product_id'])
          anchor_ean = str(old.get('ean') or '').strip()
          anchor_url = str(old.get('image_url') or '').strip()
          observed_at = _now()
          payload, source_url = _get_json(pid, timeout=20.0)
          current = normalize(payload, source_url=source_url, observed_at=observed_at)
          current_ean = str(current.get('ean') or '').strip()
          if current_ean != anchor_ean:
              raise SystemExit(f'Current EAN mismatch: current={current_ean!r} anchor={anchor_ean!r}')
          photos = current.get('photos') if isinstance(current.get('photos'), list) else []
          matches = [
              (index, photo)
              for index, photo in enumerate(photos)
              if isinstance(photo, dict)
              and str(photo.get('perspective') or '') == '9'
              and str(photo.get('zoom') or '') == anchor_url
          ]
          if len(matches) != 1:
              raise SystemExit(f'Canonical perspective=9 image is not uniquely current: {len(matches)} matches')
          image_index, photo = matches[0]
          routed = dict(photo)
          routed['perspective'] = 9
          current['photos'] = [routed]
          current['_explicit_serving_meta'] = {
              'canonical_ean': anchor_ean,
              'image_url': anchor_url,
              'image_index': image_index,
              'canonical_latest_raw_run_id': old.get('latest_raw_run_id'),
              'canonical_corroborated_fields': int(old.get('corroborated_fields') or 0),
              'canonical_engine_families': int(old.get('independent_engine_families') or 0),
              'canonical_safety_blockers': list(old.get('safety_blockers') or []),
              'live_detail_source_url': source_url,
              'live_detail_observed_at': observed_at,
          }
          Path('explicit-serving-product.jsonl').write_text(
              json.dumps(current, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'product_id': pid,
              'ean_exact': True,
              'image_exact_unique_p9': True,
              'image_index': image_index,
              'source_url': source_url,
              'images_persisted': False,
              'redistribution_allowed': False,
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Install OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check \
            'paddleocr>=3.7,<3.8' \
            'easyocr>=1.7,<1.8' \
            opencv-python-headless Pillow

      - name: Run safety regressions before OCR
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_mercadona_explicit_serving_column_rescue.py \
            test_mercadona_ocr_safety_regressions.py \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_label_reader_row_tokens.py \
            test_nutrition_ocr_ensemble.py
          python -m py_compile mercadona_explicit_serving_column_rescue.py mercadona_serving_column_rescue_wave.py

      - name: Run one-product fresh independent serving-column rescue
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mercadona-explicit-serving-column-rescue
          mkdir -p mercadona-explicit-serving-column-rescue/raw
          mode=$(python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('explicit-serving-product.jsonl').read_text(encoding='utf-8'))
          print('priority' if row.get('ingredients') else 'p9-no-ingredients-all')
          PY
          )
          set +e
          python mercadona_serving_column_rescue_wave.py \
            --products explicit-serving-product.jsonl \
            --out mercadona-explicit-serving-column-rescue/raw \
            --shard-index 0 \
            --shard-count 1 \
            --limit 0 \
            --eligibility-mode "$mode"
          rc=$?
          set -e
          [[ $rc -eq 0 || $rc -eq 2 ]]

      - name: Validate and materialize auditable merged artifact
        id: validate
        working-directory: tools/catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import json
          import os
          from pathlib import Path

          CORE = ('calories', 'fat_g', 'carbohydrate_g', 'protein_g')
          root = Path('mercadona-explicit-serving-column-rescue')
          old = json.loads(Path('explicit-serving-anchor.json').read_text(encoding='utf-8'))
          current = json.loads(Path('explicit-serving-product.jsonl').read_text(encoding='utf-8'))
          meta = current.get('_explicit_serving_meta') or {}
          pid = str(old['product_id'])
          rows = []
          for path in sorted(glob.glob(str(root / 'raw/results-*.jsonl'))):
              rows.extend(json.loads(line) for line in Path(path).read_text(encoding='utf-8').splitlines() if line.strip())
          if len(rows) != 1 or str(rows[0].get('product_id') or '') != pid:
              raise SystemExit(f'Unexpected rescue coverage: {[(row.get("product_id"), row.get("status")) for row in rows]}')
          row = rows[0]
          if str(row.get('ean') or '') != str(meta.get('canonical_ean') or ''):
              raise SystemExit('OCR result EAN does not match the canonical/live anchor')
          if str(row.get('image_url') or '') != str(meta.get('image_url') or ''):
              raise SystemExit('OCR used an unexpected image')

          row['image_index'] = meta.get('image_index')
          row['perspective'] = 9
          row['live_detail_source_url'] = meta.get('live_detail_source_url')
          row['live_detail_observed_at'] = meta.get('live_detail_observed_at')
          row['pilot_canonical_latest_raw_run_id'] = meta.get('canonical_latest_raw_run_id')
          row['pilot_canonical_corroborated_fields'] = meta.get('canonical_corroborated_fields')
          row['pilot_canonical_engine_families'] = meta.get('canonical_engine_families')
          row['pilot_canonical_safety_blockers'] = meta.get('canonical_safety_blockers')
          row['historical_values_promotion_allowed'] = False
          row['cross_run_value_fusion'] = False
          row['cross_region_value_fusion'] = False
          row['current_observation_must_satisfy_declared_contract_independently'] = True
          row['acceptance_policy_changed'] = False
          row['missing_values_inferred'] = False
          row['serving_column_projection_policy'] = (
              'EXACT TWO EXPLICIT HEADERS BEFORE CORE ROWS; FIRST 100 G/ML; SECOND SMALLER SAME-UNIT SERVING; '
              'ALL FOUR CORE ROWS HAVE TWO OBSERVED CELLS; EVERY PAIR SCALES TO PRINTED SERVING FRACTION; '
              'EXISTING ENERGY/MACRO COHERENCE; >=2 INDEPENDENT OCR FAMILIES FOR DECLARED'
          )

          invalid = []
          if (
              row.get('source') != 'MERCADONA_FIRST_PARTY'
              or row.get('source_record_kind') != 'label image'
              or row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE'
              or row.get('redistribution_allowed') is not False
              or row.get('perspective') != 9
              or int(row.get('pilot_canonical_corroborated_fields') or 0) != 2
              or int(row.get('pilot_canonical_engine_families') or 0) < 3
              or set(row.get('pilot_canonical_safety_blockers') or []) != {'HARD_OCR_CONFLICT'}
              or not str(row.get('live_detail_source_url') or '').startswith('https://tienda.mercadona.es/api/v1_1/products/')
          ):
              invalid.append('provenance_or_anchor_contract')

          declared_attempt = None
          if row.get('status') == 'DECLARED':
              nutrition = row.get('nutrition') or {}
              if any(nutrition.get(field) is None for field in CORE):
                  invalid.append('missing_declared_core')
              declared_attempts = [
                  attempt for attempt in row.get('attempts', [])
                  if (attempt.get('ensemble') or {}).get('status') == 'DECLARED'
              ]
              if len(declared_attempts) != 1:
                  invalid.append('expected_exactly_one_fresh_declared_attempt')
              else:
                  declared_attempt = declared_attempts[0]
                  ensemble = declared_attempt.get('ensemble') or {}
                  unsafe_reasons = [
                      str(reason) for reason in ensemble.get('reasons') or []
                      if str(reason).startswith((
                          'OCR_FIELD_CONFLICT', 'OCR_SAME_ENGINE_CONFLICT', 'OCR_BASIS_CONFLICT',
                          'ENERGY_MACRO_MISMATCH', 'MULTIPLE_NUTRITION_COLUMNS', 'IMPOSSIBLE_',
                          'UNCORROBORATED_CORE_FIELDS', 'UNCORROBORATED_BASIS',
                      ))
                  ]
                  if (
                      ensemble.get('basis') not in {'100_g', '100_ml'}
                      or int(ensemble.get('independent_engine_families') or 0) < 2
                      or int(ensemble.get('corroborated_fields') or 0) != 4
                      or unsafe_reasons
                  ):
                      invalid.append('fresh_attempt_does_not_meet_unchanged_declared_contract')
                  engine_payloads = declared_attempt.get('engines') or {}
                  projected = [
                      (strategy, payload)
                      for strategy, payload in engine_payloads.items()
                      if any(
                          str(reason).startswith('EXPLICIT_SERVING_COLUMN_PROJECTION')
                          for reason in (payload.get('reasons') or [])
                      )
                  ]
                  if not projected:
                      invalid.append('no_explicit_serving_column_projection_audit_marker')
          if invalid:
              raise SystemExit('Unsafe explicit serving-column rescue row: ' + ','.join(invalid))

          merged = root / 'results-merged.jsonl'
          merged.write_text(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8')
          summary = {
              'inventory_products': 4280,
              'canonical_audit_run_id': int('${{ steps.audit.outputs.run_id }}'),
              'processed': 1,
              'product_id': pid,
              'product_name': old.get('name'),
              'status': row.get('status'),
              'nutrition': row.get('nutrition') if row.get('status') == 'DECLARED' else None,
              'historical_corroborated_fields': int(old.get('corroborated_fields') or 0),
              'historical_engine_families': int(old.get('independent_engine_families') or 0),
              'historical_safety_blockers': list(old.get('safety_blockers') or []),
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY',
              'source_record_kind': 'label image',
              'redistribution_allowed': False,
              'images_persisted': False,
              'missing_values_inferred': False,
              'cross_run_value_fusion': False,
              'cross_region_value_fusion': False,
              'historical_values_promotion_allowed': False,
              'acceptance_policy_changed': False,
              'classified': 0,
              'menu_eligible': 0,
          }
          (root / 'summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          Path(os.environ['GITHUB_OUTPUT']).write_text(
              f"declared={'true' if row.get('status') == 'DECLARED' else 'false'}\n",
              encoding='utf-8',
              append=False,
          )
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY
          rm -rf mercadona-explicit-serving-column-rescue/raw

      - name: Upload auditable merged rescue artifact
        uses: actions/upload-artifact@v4
        with:
          name: mercadona-explicit-serving-column-rescue-merged
          path: |
            tools/catalog/mercadona-explicit-serving-column-rescue/results-merged.jsonl
            tools/catalog/mercadona-explicit-serving-column-rescue/summary.json
          if-no-files-found: error
          retention-days: 90

      - name: Trigger strict residual reconciliation only after fresh DECLARED
        if: steps.validate.outputs.declared == 'true'
        shell: bash
        run: |
          gh workflow run catalog-mercadona-current-ocr-residual-audit.yml --ref agent/catalog-phase1
