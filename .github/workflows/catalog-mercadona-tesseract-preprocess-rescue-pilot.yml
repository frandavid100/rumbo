name: Catalog Mercadona Tesseract preprocess rescue pilot

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-tesseract-preprocess-rescue-pilot.yml'
      - 'tools/catalog/mercadona_neural_ocr_tesseract_preprocess_rescue.py'
      - 'tools/catalog/test_mercadona_neural_ocr_tesseract_preprocess_rescue.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-tesseract-preprocess-rescue-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3]
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download consolidated Mercadona first-party cut
        uses: actions/download-artifact@v4
        with:
          name: mercadona-first-party-final
          path: tools/catalog/mercadona-first-party-final
          github-token: ${{ github.token }}
          run-id: 33046950149
      - name: Download audited near-complete REVIEW candidates
        uses: actions/download-artifact@v4
        with:
          name: mercadona-p9-review-failure-audit
          path: tools/catalog/mercadona-p9-review-failure-audit
          github-token: ${{ github.token }}
          run-id: 33613875008
      - name: Build candidate-only first-party product input
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ids = {
              str(json.loads(line)['product_id'])
              for line in Path('mercadona-p9-review-failure-audit/priority-near-complete.jsonl').read_text(encoding='utf-8').splitlines()
              if line.strip()
          }
          rows = [
              json.loads(line)
              for line in Path('mercadona-first-party-final/products.jsonl').read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          selected = [row for row in rows if str(row.get('product_id') or '') in ids]
          if len(ids) != 86 or len(selected) != 86:
              raise SystemExit(f'candidate join mismatch ids={len(ids)} products={len(selected)}')
          Path('priority-products.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in selected),
              encoding='utf-8',
          )
          PY
      - name: Install independent OCR engines and preprocessing dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow
      - name: Run conservative parser and rescue regression tests
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_label_easyocr_extractor.py \
            test_nutrition_label_reader.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_ocr_safety_regressions.py \
            test_mercadona_neural_ocr_tesseract_preprocess_rescue.py
          python -m py_compile mercadona_neural_ocr_tesseract_preprocess_rescue.py
      - name: Run deterministic 16-product near-complete rescue pilot
        working-directory: tools/catalog
        run: |
          python mercadona_neural_ocr_tesseract_preprocess_rescue.py \
            --products priority-products.jsonl \
            --out mercadona-tesseract-preprocess-rescue-pilot \
            --shard-index ${{ matrix.shard }} \
            --shard-count 4 \
            --limit 4 \
            --delay 0.5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-tesseract-preprocess-rescue-pilot-${{ matrix.shard }}
          path: tools/catalog/mercadona-tesseract-preprocess-rescue-pilot/
          retention-days: 30
          if-no-files-found: warn

  merge:
    runs-on: ubuntu-24.04
    needs: ocr
    if: ${{ always() && needs.ocr.result == 'success' }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mercadona-tesseract-preprocess-rescue-pilot-*
          path: input
          merge-multiple: true
      - name: Download audited candidate baseline
        uses: actions/download-artifact@v4
        with:
          name: mercadona-p9-review-failure-audit
          path: baseline
          github-token: ${{ github.token }}
          run-id: 33613875008
      - name: Merge and enforce conservative promotion contract
        run: |
          python - <<'PY'
          from collections import Counter
          import glob, json
          from pathlib import Path

          FIELDS = ('calories', 'protein_g', 'carbohydrate_g', 'fat_g')
          def close(field, a, b):
              a, b = float(a), float(b)
              tolerance = max(5.0, .04 * max(abs(a), abs(b), 1.0)) if field == 'calories' else max(.6, .10 * max(abs(a), abs(b), 1.0))
              return abs(a - b) <= tolerance

          rows = []
          for path in sorted(glob.glob('input/results-*.jsonl')):
              rows.extend(json.loads(line) for line in Path(path).read_text(encoding='utf-8').splitlines() if line.strip())
          baseline = {
              str(row['product_id']): row
              for row in (
                  json.loads(line)
                  for line in Path('baseline/priority-near-complete.jsonl').read_text(encoding='utf-8').splitlines()
                  if line.strip()
              )
          }
          counts = Counter(str(row.get('status') or 'UNKNOWN') for row in rows)
          ids = [str(row.get('product_id') or '') for row in rows]
          duplicate_ids = sorted(pid for pid, count in Counter(ids).items() if count > 1)
          provenance_errors = []
          unsafe_declared = []
          value_conflicts = []
          safe_promotions = []
          for row in rows:
              pid = str(row.get('product_id') or '')
              prior = baseline.get(pid)
              if prior is None:
                  provenance_errors.append(f'{pid}:not_in_candidate_baseline')
                  continue
              if (
                  row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE'
                  or row.get('source') != 'MERCADONA_FIRST_PARTY'
                  or row.get('source_record_kind') != 'label image'
                  or row.get('redistribution_allowed') is not False
                  or str(row.get('perspective')) != '9'
              ):
                  provenance_errors.append(f'{pid}:provenance')
              if row.get('status') != 'DECLARED':
                  continue
              accepted = next((a for a in row.get('attempts') or [] if (a.get('ensemble') or {}).get('status') == 'DECLARED'), None)
              ensemble = (accepted or {}).get('ensemble') or {}
              nutrition = row.get('nutrition') or {}
              if (
                  int(ensemble.get('independent_engine_families') or 0) < 2
                  or int(ensemble.get('corroborated_fields') or 0) < 4
                  or any(nutrition.get(field) is None for field in FIELDS)
              ):
                  unsafe_declared.append(pid)
                  continue
              conflicts = []
              if row.get('basis') != prior.get('basis'):
                  conflicts.append(f"basis:{prior.get('basis')}!={row.get('basis')}")
              prior_nutrition = prior.get('nutrition') or {}
              for field in FIELDS:
                  if not close(field, nutrition[field], prior_nutrition[field]):
                      conflicts.append(f"{field}:{prior_nutrition[field]}!~{nutrition[field]}")
              if conflicts:
                  value_conflicts.append({'product_id': pid, 'conflicts': conflicts})
                  continue
              safe_promotions.append({
                  'product_id': pid,
                  'ean': row.get('ean'),
                  'name': row.get('name'),
                  'basis': row.get('basis'),
                  'nutrition': nutrition,
                  'independent_engine_families': ensemble.get('independent_engine_families'),
                  'corroborated_fields': ensemble.get('corroborated_fields'),
                  'source': 'MERCADONA_FIRST_PARTY/label image',
                  'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
                  'redistribution_allowed': False,
              })

          summary = {
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'redistribution_allowed': False,
              'candidate_universe': len(baseline),
              'expected_sample': 16,
              'processed': len(rows),
              'distinct_products_processed': len(set(ids)),
              'status_counts': dict(sorted(counts.items())),
              'safe_promotion_products': len(safe_promotions),
              'safe_promotion_product_ids': sorted(item['product_id'] for item in safe_promotions),
              'value_conflicts': value_conflicts,
              'unsafe_declared': unsafe_declared,
              'duplicate_product_ids': duplicate_ids,
              'provenance_errors': provenance_errors,
              'images_persisted': False,
              'missing_values_inferred': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
              'safety_assessment': 'VALIDATED' if (
                  len(rows) == 16 and len(set(ids)) == 16 and not duplicate_ids
                  and not provenance_errors and not unsafe_declared
              ) else 'FAILED',
          }
          Path('merged').mkdir(exist_ok=True)
          Path('merged/results.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in sorted(rows, key=lambda row: str(row.get('product_id') or ''))),
              encoding='utf-8',
          )
          Path('merged/safe-promotions.json').write_text(json.dumps(safe_promotions, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('merged/summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if summary['safety_assessment'] != 'VALIDATED':
              raise SystemExit('pilot safety contract failed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mercadona-tesseract-preprocess-rescue-pilot-merged
          path: merged/
          retention-days: 30
          if-no-files-found: error
