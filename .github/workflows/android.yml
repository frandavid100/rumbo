name: Android

on:
  push:
    branches: [main, feature/0.12.0-dishes]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Restaurar catálogo nutricional de Mercadona
        run: |
          mkdir -p app/src/main/assets
          base64 --decode tools/aesan_foods.dat.b64 > app/src/main/assets/aesan_foods.dat
      - uses: gradle/actions/setup-gradle@v4
      - name: Probar y compilar
        run: |
          ./gradlew test assembleRelease || {
            find app/build/test-results -name '*.xml' -type f -exec cat {} \;
            exit 1
          }
      - name: Leer versión de Rumbo
        run: echo "RUMBO_VERSION=$(sed -n 's/.*versionName = \"\(.*\)\"/\1/p' app/build.gradle)" >> "$GITHUB_ENV"
      - name: Preparar herramientas de firma
        run: |
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p build/signing-tools/lib build/signing-tools/lib64
          cp "$BUILD_TOOLS/apksigner" "$BUILD_TOOLS/zipalign" build/signing-tools/
          cp "$BUILD_TOOLS/lib/apksigner.jar" build/signing-tools/lib/
          cp "$BUILD_TOOLS/lib64/libc++.so" build/signing-tools/lib64/
      - name: Firmar APK con la clave estable de Rumbo
        env:
          RUMBO_SIGNING_KEY_BASE64: ${{ secrets.RUMBO_SIGNING_KEY_BASE64 }}
          RUMBO_SIGNING_PASSWORD: ${{ secrets.RUMBO_SIGNING_PASSWORD }}
        run: |
          mkdir -p build/signed
          test -n "$RUMBO_SIGNING_KEY_BASE64"
          test -n "$RUMBO_SIGNING_PASSWORD"
          printf '%s' "$RUMBO_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/rumbo-release.jks"
          build/signing-tools/zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/Rumbo-$RUMBO_VERSION-aligned.apk"
          build/signing-tools/apksigner sign --ks "$RUNNER_TEMP/rumbo-release.jks" --ks-key-alias rumbo --ks-pass "pass:$RUMBO_SIGNING_PASSWORD" --key-pass "pass:$RUMBO_SIGNING_PASSWORD" --out "build/signed/Rumbo-$RUMBO_VERSION.apk" "$RUNNER_TEMP/Rumbo-$RUMBO_VERSION-aligned.apk"
          build/signing-tools/apksigner verify --verbose --print-certs "build/signed/Rumbo-$RUMBO_VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: rumbo-${{ env.RUMBO_VERSION }}-signed
          path: build/signed/Rumbo-${{ env.RUMBO_VERSION }}.apk
          if-no-files-found: error
          retention-days: 1
