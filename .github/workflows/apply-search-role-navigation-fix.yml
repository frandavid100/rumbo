name: Apply search role navigation fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/fix-search-role-navigation-073'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-search-role-navigation-073
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar corrección
        run: python tools/apply_search_role_navigation_fix.py
      - name: Guardar resultado
        run: |
          rm tools/apply_search_role_navigation_fix.py
          rm .github/workflows/apply-search-role-navigation-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corregir búsqueda y navegación por roles"
          git push origin HEAD:agent/fix-search-role-navigation-073
