name: Catalog Mercadona crop-cap rotate patch

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-crop-cap-rotate-patch.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  patch-and-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
          fetch-depth: 0

      - name: Patch deterministic candidate rotation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/catalog-mercadona-current-crop-cap-canary.yml')
          text = path.read_text(encoding='utf-8')

          anchor = (
              "          selected_products = []\n"
              "          selected_rows = []\n"
              "          live_exclusions = []\n"
          )
          replacement = (
              "          attempted_crop_cap_ids = set()\n"
              "          for cut_path in sorted(Path('.').glob('mercadona-ocr-cut-*-run-*.json')):\n"
              "              try:\n"
              "                  cut = json.loads(cut_path.read_text(encoding='utf-8'))\n"
              "              except Exception:\n"
              "                  continue\n"
              "              if cut.get('kind') != 'MERCADONA_OCR_PARTIAL_CANARY_CUT':\n"
              "                  continue\n"
              "              if 'crop-cap canary' not in str(cut.get('purpose') or '').lower():\n"
              "                  continue\n"
              "              selection = cut.get('selection') if isinstance(cut.get('selection'), dict) else {}\n"
              "              attempted_crop_cap_ids.update(\n"
              "                  str(pid).strip()\n"
              "                  for pid in (selection.get('selected_product_ids') or [])\n"
              "                  if str(pid).strip()\n"
              "              )\n"
              "\n"
              "          selected_products = []\n"
              "          selected_rows = []\n"
              "          live_exclusions = []\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit(f'expected selection anchor exactly once, found {text.count(anchor)}')
          text = text.replace(anchor, replacement, 1)

          loop_anchor = (
              "              for old in group:\n"
              "                  pid = str(old.get('product_id') or '').strip()\n"
              "                  canonical_ean = str(old.get('ean') or '').strip()\n"
          )
          loop_replacement = (
              "              for old in group:\n"
              "                  pid = str(old.get('product_id') or '').strip()\n"
              "                  if pid in attempted_crop_cap_ids:\n"
              "                      live_exclusions.append({'product_id': pid, 'reason': 'PRIOR_CROP_CAP_ATTEMPT'})\n"
              "                      continue\n"
              "                  canonical_ean = str(old.get('ean') or '').strip()\n"
          )
          if text.count(loop_anchor) != 1:
              raise SystemExit(f'expected candidate loop anchor exactly once, found {text.count(loop_anchor)}')
          text = text.replace(loop_anchor, loop_replacement, 1)

          summary_anchor = (
              "              'eligible_simple_single_family_rows': sum(len(group) for group in by_field.values()),\n"
              "              'selected': len(selected_products),\n"
          )
          summary_replacement = (
              "              'eligible_simple_single_family_rows': sum(len(group) for group in by_field.values()),\n"
              "              'prior_crop_cap_attempted_count': len(attempted_crop_cap_ids),\n"
              "              'prior_crop_cap_attempted_ids': sorted(attempted_crop_cap_ids),\n"
              "              'eligible_after_prior_attempt_exclusion_rows': sum(\n"
              "                  1\n"
              "                  for group in by_field.values()\n"
              "                  for row in group\n"
              "                  if str(row.get('product_id') or '').strip() not in attempted_crop_cap_ids\n"
              "              ),\n"
              "              'selected': len(selected_products),\n"
          )
          if text.count(summary_anchor) != 1:
              raise SystemExit(f'expected summary anchor exactly once, found {text.count(summary_anchor)}')
          text = text.replace(summary_anchor, summary_replacement, 1)

          old_policy = 'ONE_LIVE_VERIFIED_CANDIDATE_PER_AVAILABLE_MISSING_FIELD; CURRENT_REVIEW_3_OF_4; EXPLICIT_BASIS; ONE_HISTORICAL_OCR_FAMILY; NO_HARD_BLOCKER; SIMPLE_REASON_PREFIXES_ONLY; EXACT_EAN; EXACT_CURRENT_P9_URL'
          new_policy = old_policy + '; EXCLUDE_PRIOR_CROP_CAP_ATTEMPTS'
          if text.count(old_policy) != 1:
              raise SystemExit(f'expected policy exactly once, found {text.count(old_policy)}')
          text = text.replace(old_policy, new_policy, 1)

          path.write_text(text, encoding='utf-8')
          PY

          grep -q 'EXCLUDE_PRIOR_CROP_CAP_ATTEMPTS' .github/workflows/catalog-mercadona-current-crop-cap-canary.yml
          grep -q 'PRIOR_CROP_CAP_ATTEMPT' .github/workflows/catalog-mercadona-current-crop-cap-canary.yml

      - name: Commit patch and remove one-shot patcher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/catalog-mercadona-current-crop-cap-canary.yml
          git rm .github/workflows/catalog-mercadona-crop-cap-rotate-patch.yml
          git commit -m 'Rotate Mercadona crop-cap canary candidates'
          git push origin HEAD:agent/catalog-phase1

      - name: Dispatch rotated crop-cap canary
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run catalog-mercadona-current-crop-cap-canary.yml --ref agent/catalog-phase1
