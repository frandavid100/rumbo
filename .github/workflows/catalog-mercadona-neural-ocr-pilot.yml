name: Catalog Mercadona neural OCR pilot

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - 'tools/catalog/mercadona_neural_ocr_wave.py'
      - '.github/workflows/catalog-mercadona-neural-ocr-pilot.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-neural-ocr-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download consolidated Mercadona first-party cut
        uses: actions/download-artifact@v4
        with:
          name: mercadona-first-party-final
          path: tools/catalog/mercadona-first-party-final
          github-token: ${{ github.token }}
          run-id: 33046950149
      - name: Install PP-OCRv6 and visual detector dependencies
        run: |
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' opencv-python-headless Pillow
      - name: OCR deterministic food sample
        working-directory: tools/catalog
        run: |
          python mercadona_neural_ocr_wave.py \
            --products mercadona-first-party-final/products.jsonl \
            --out mercadona-neural-ocr-pilot \
            --shard-index ${{ matrix.shard }} \
            --shard-count 8 \
            --limit 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-neural-ocr-pilot-${{ matrix.shard }}
          path: tools/catalog/mercadona-neural-ocr-pilot/
          retention-days: 30
          if-no-files-found: warn
