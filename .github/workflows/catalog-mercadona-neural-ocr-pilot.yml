name: Catalog Mercadona neural OCR pilot

# Bounded regression pilot for parser/layout changes; keep sample deterministic.
on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - 'tools/catalog/mercadona_neural_ocr_wave.py'
      - 'tools/catalog/nutrition_label_reader.py'
      - 'tools/catalog/nutrition_ocr_ensemble.py'
      - 'tools/catalog/nutrition_visual_table_detector.py'
      - 'tools/catalog/mercadona_label_pipeline.py'
      - 'tools/catalog/mercadona_nutrition_reader.py'
      - 'tools/catalog/label_neural_extractor.py'
      - 'tools/catalog/label_text_extractor.py'
      - 'tools/catalog/test_nutrition_label_reader.py'
      - 'tools/catalog/test_nutrition_ocr_ensemble.py'
      - 'tools/catalog/test_mercadona_label_pipeline.py'
      - 'tools/catalog/test_mercadona_ocr_safety_regressions.py'
      - '.github/workflows/catalog-mercadona-neural-ocr-pilot.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-neural-ocr-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download consolidated Mercadona first-party cut
        uses: actions/download-artifact@v4
        with:
          name: mercadona-first-party-final
          path: tools/catalog/mercadona-first-party-final
          github-token: ${{ github.token }}
          run-id: 33046950149
      - name: Install independent OCR engines and visual detector dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' opencv-python-headless Pillow
      - name: Run conservative OCR regression tests
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_nutrition_label_reader.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_ocr_safety_regressions.py
      - name: OCR deterministic food sample
        working-directory: tools/catalog
        run: |
          python mercadona_neural_ocr_wave.py \
            --products mercadona-first-party-final/products.jsonl \
            --out mercadona-neural-ocr-pilot \
            --shard-index ${{ matrix.shard }} \
            --shard-count 8 \
            --limit 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-neural-ocr-pilot-${{ matrix.shard }}
          path: tools/catalog/mercadona-neural-ocr-pilot/
          retention-days: 30
          if-no-files-found: warn

  merge:
    runs-on: ubuntu-24.04
    needs: ocr
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mercadona-neural-ocr-pilot-*
          path: input
          merge-multiple: true
      - name: Merge auditable pilot results
        run: |
          python - <<'PY'
          from collections import Counter
          import glob, json
          from pathlib import Path

          rows = []
          for path in sorted(glob.glob('input/results-*.jsonl')):
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  if line.strip():
                      rows.append(json.loads(line))
          counts = Counter(row.get('status', 'UNKNOWN') for row in rows)
          declared = [row for row in rows if row.get('status') == 'DECLARED']
          invalid_declared = []
          for row in declared:
              attempts = row.get('attempts') or []
              accepted = next((a for a in attempts if (a.get('ensemble') or {}).get('status') == 'DECLARED'), None)
              ensemble = (accepted or {}).get('ensemble') or {}
              if ensemble.get('independent_engine_families', 0) < 2 or ensemble.get('corroborated_fields', 0) < 4:
                  invalid_declared.append(row.get('product_id'))
          summary = {
              'inventory_products': 4280,
              'processed': len(rows),
              'status_counts': dict(sorted(counts.items())),
              'declared_rate': round(len(declared) / len(rows), 4) if rows else 0.0,
              'declared_with_two_independent_engines_and_four_corroborated_fields': len(declared) - len(invalid_declared),
              'invalid_declared_product_ids': invalid_declared,
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'redistribution_allowed': False,
          }
          Path('merged').mkdir(exist_ok=True)
          Path('merged/results.jsonl').write_text(''.join(json.dumps(r, ensure_ascii=False, sort_keys=True) + '\n' for r in rows), encoding='utf-8')
          Path('merged/summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if invalid_declared:
              raise SystemExit('Unsafe DECLARED rows detected: ' + ','.join(map(str, invalid_declared)))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-neural-ocr-pilot-merged
          path: merged/
          retention-days: 30
          if-no-files-found: warn
