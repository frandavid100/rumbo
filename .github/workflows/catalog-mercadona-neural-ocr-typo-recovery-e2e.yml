name: Catalog Mercadona neural OCR typo recovery E2E

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-neural-ocr-typo-recovery-e2e.yml'
      - 'tools/catalog/mercadona-ocr-typo-recovery-probe-fixture.json'
      - 'tools/catalog/mercadona_first_party_details.py'
      - 'tools/catalog/mercadona_neural_ocr_wave.py'
      - 'tools/catalog/nutrition_label_reader.py'
      - 'tools/catalog/test_nutrition_label_reader_ocr_typos.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-mercadona-neural-ocr-typo-recovery-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install independent OCR engines and visual detector dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow

      - name: Run parser safety regressions before OCR
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_ocr_safety_regressions.py
          python - <<'PY'
          import re
          from nutrition_label_reader import READER_VERSION
          assert re.fullmatch(r'\d+\.\d+\.\d+', READER_VERSION), READER_VERSION
          PY

      - name: Fetch exact candidates from official Mercadona API and verify stable identity
        working-directory: tools/catalog
        run: |
          rm -rf /tmp/mercadona-typo-details mercadona-neural-ocr-typo-recovery-e2e
          mkdir -p /tmp/mercadona-typo-details mercadona-neural-ocr-typo-recovery-e2e
          python - <<'PY'
          import json
          from pathlib import Path

          fixture = json.loads(Path('mercadona-ocr-typo-recovery-probe-fixture.json').read_text(encoding='utf-8'))
          products = fixture.get('products') or []
          if len(products) != 4:
              raise SystemExit(f'expected exactly four fixture products, got {len(products)}')
          ids = [str(row.get('product_id') or '') for row in products]
          if len(set(ids)) != 4 or any(not pid for pid in ids):
              raise SystemExit(f'invalid fixture product ids: {ids}')
          Path('/tmp/mercadona-typo-inventory.jsonl').write_text(
              ''.join(
                  json.dumps({'product_id': pid, 'category_id': '', 'category_path': []}, ensure_ascii=False) + '\n'
                  for pid in ids
              ),
              encoding='utf-8',
          )
          PY
          python mercadona_first_party_details.py \
            --inventory /tmp/mercadona-typo-inventory.jsonl \
            --out /tmp/mercadona-typo-details \
            --shard-index 0 \
            --shard-count 1 \
            --timeout 20 \
            --delay 0
          python - <<'PY'
          import json
          from pathlib import Path

          fixture = json.loads(Path('mercadona-ocr-typo-recovery-probe-fixture.json').read_text(encoding='utf-8'))
          expected = {str(row['product_id']): row for row in fixture['products']}
          details_path = Path('/tmp/mercadona-typo-details/details-00.jsonl')
          errors_path = Path('/tmp/mercadona-typo-details/errors-00.jsonl')
          rows = [json.loads(line) for line in details_path.read_text(encoding='utf-8').splitlines() if line.strip()]
          errors = [json.loads(line) for line in errors_path.read_text(encoding='utf-8').splitlines() if line.strip()]
          if errors:
              raise SystemExit(f'first-party API fetch errors: {errors}')
          by_id = {str(row.get('product_id') or ''): row for row in rows}
          if set(by_id) != set(expected):
              raise SystemExit(f'live product universe mismatch: live={sorted(by_id)} expected={sorted(expected)}')

          selected = []
          source_rows = []
          for pid, exp in sorted(expected.items()):
              product = by_id[pid]
              if product.get('source') != 'MERCADONA_FIRST_PARTY' or product.get('evidence_type') != 'OBSERVED_API' or product.get('detail_observed') is not True:
                  raise SystemExit(f'{pid}: invalid first-party API provenance')
              live_ean = str(product.get('ean') or '')
              expected_ean = str(exp.get('ean') or '')
              if not live_ean or live_ean != expected_ean:
                  raise SystemExit(f'{pid}: live first-party identity mismatch EAN={live_ean}; expected={expected_ean}')
              photos = product.get('photos') or []
              p9 = [p for p in photos if str(p.get('perspective')) == '9' and p.get('zoom')]
              if not p9:
                  raise SystemExit(f'{pid}: target no longer has a perspective=9 zoom label candidate')
              p9_url = p9[0]['zoom']
              selected.append(product)
              source_rows.append({
                  'product_id': pid,
                  'ean': live_ean,
                  'name': product.get('name'),
                  'source': product.get('source'),
                  'evidence_type': product.get('evidence_type'),
                  'source_url': product.get('source_url'),
                  'observed_at': product.get('observed_at'),
                  'p9_image_url': p9_url,
                  'redistribution_allowed': False,
              })

          Path('mercadona-typo-recovery-products.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in selected),
              encoding='utf-8',
          )
          Path('mercadona-neural-ocr-typo-recovery-e2e/first-party-live-source.json').write_text(
              json.dumps(source_rows, ensure_ascii=False, indent=2, sort_keys=True),
              encoding='utf-8',
          )
          print(json.dumps(source_rows, ensure_ascii=False, indent=2))
          PY

      - name: Re-run neural OCR end to end on live exact-product label images
        working-directory: tools/catalog
        run: |
          python mercadona_neural_ocr_wave.py \
            --products mercadona-typo-recovery-products.jsonl \
            --out mercadona-neural-ocr-typo-recovery-e2e \
            --shard-index 0 \
            --shard-count 1 \
            --limit 0 \
            --delay 0

      - name: Compare against checked-in regression fixture and enforce safety
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          from collections import Counter
          import json
          from pathlib import Path
          from nutrition_label_reader import READER_VERSION

          out = Path('mercadona-neural-ocr-typo-recovery-e2e')
          rows = []
          for path in sorted(out.glob('results-*.jsonl')):
              rows.extend(
                  json.loads(line)
                  for line in path.read_text(encoding='utf-8').splitlines()
                  if line.strip()
              )

          fixture = json.loads(Path('mercadona-ocr-typo-recovery-probe-fixture.json').read_text(encoding='utf-8'))
          probe = {str(row['product_id']): row for row in fixture['products']}
          expected = set(probe)
          actual = {str(row.get('product_id') or '') for row in rows}
          if actual != expected:
              raise SystemExit(f'Unexpected product universe: actual={sorted(actual)} expected={sorted(expected)}')

          live_source_rows = json.loads((out / 'first-party-live-source.json').read_text(encoding='utf-8'))
          live_source = {str(row['product_id']): row for row in live_source_rows}
          if set(live_source) != expected:
              raise SystemExit(f'Unexpected live source universe: {sorted(live_source)}')

          provenance_errors = []
          unsafe = []
          conflicts = []
          reproduced = []
          review = []
          declared_nutrition = {}

          for row in rows:
              pid = str(row.get('product_id') or '')
              expected_ean = str(probe[pid].get('ean') or '')
              if str(row.get('ean') or '') != expected_ean:
                  provenance_errors.append(f'{pid}:ocr_ean')
              if str(live_source[pid].get('ean') or '') != expected_ean:
                  provenance_errors.append(f'{pid}:live_ean')
              if row.get('image_url') != live_source[pid].get('p9_image_url'):
                  provenance_errors.append(f'{pid}:image_url')
              if row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE':
                  provenance_errors.append(f'{pid}:evidence_level')
              if row.get('source') != 'MERCADONA_FIRST_PARTY' or row.get('source_record_kind') != 'label image':
                  provenance_errors.append(f'{pid}:source')
              if row.get('redistribution_allowed') is not False:
                  provenance_errors.append(f'{pid}:redistribution')
              if any(key in row for key in ('classified', 'menu_eligible', 'CLASSIFIED', 'MENU_ELIGIBLE')):
                  provenance_errors.append(f'{pid}:classification')

              if row.get('status') != 'DECLARED':
                  review.append(pid)
                  continue

              attempts = row.get('attempts') or []
              accepted = next((a for a in attempts if (a.get('ensemble') or {}).get('status') == 'DECLARED'), None)
              ensemble = (accepted or {}).get('ensemble') or {}
              nutrition = row.get('nutrition') or {}
              required = ('calories', 'protein_g', 'carbohydrate_g', 'fat_g')
              if (
                  ensemble.get('independent_engine_families', 0) < 2
                  or ensemble.get('corroborated_fields', 0) < 4
                  or any(nutrition.get(field) is None for field in required)
              ):
                  unsafe.append(pid)
                  continue

              expected_nutrition = probe[pid].get('nutrition') or {}
              if any(float(nutrition[field]) != float(expected_nutrition[field]) for field in required):
                  conflicts.append({
                      'product_id': pid,
                      'ean': expected_ean,
                      'fixture': expected_nutrition,
                      'live_end_to_end': nutrition,
                  })
                  continue

              reproduced.append(pid)
              declared_nutrition[pid] = nutrition

          if provenance_errors:
              raise SystemExit('Provenance/identity contract violated: ' + ','.join(provenance_errors))
          if unsafe:
              raise SystemExit('Unsafe DECLARED rows detected: ' + ','.join(unsafe))
          if conflicts:
              raise SystemExit('End-to-end conflicts against regression fixture: ' + json.dumps(conflicts, ensure_ascii=False))

          counts = Counter(row.get('status', 'UNKNOWN') for row in rows)
          summary = {
              'mode': 'LIVE_END_TO_END_VALIDATION_OF_ISOLATED_OCR_TYPO_RECOVERIES',
              'reader_version': READER_VERSION,
              'processed': len(rows),
              'status_counts': dict(sorted(counts.items())),
              'reproduced_ids': sorted(reproduced),
              'review_ids': sorted(review),
              'declared_nutrition': declared_nutrition,
              'fixture_conflicts': conflicts,
              'unsafe_declared': unsafe,
              'provenance_errors': provenance_errors,
              'identity_policy': 'EXACT_PRODUCT_ID_AND_EAN_WITH_LIVE_FIRST_PARTY_PERSPECTIVE_9_IMAGE',
              'safe_for_trusted_addition': sorted(reproduced),
              'canonical_additions_applied': 0,
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'redistribution_allowed': False,
              'images_persisted': False,
              'missing_values_inferred': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          Path('mercadona-typo-recovery-e2e-summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True),
              encoding='utf-8',
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-neural-ocr-typo-recovery-e2e
          path: |
            tools/catalog/mercadona-neural-ocr-typo-recovery-e2e/
            tools/catalog/mercadona-typo-recovery-e2e-summary.json
          retention-days: 30
          if-no-files-found: warn
