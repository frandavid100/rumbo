name: Catalog Mercadona neural OCR wave 1024 finalize

# Consolidate the 992-row main artifact with the two recovered 16-row shards
# and re-run the full safety, provenance and 512-wave reproducibility contract.
on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-neural-ocr-wave-1024-finalize.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download partial 1024 merged artifact
        uses: actions/download-artifact@v4
        with:
          name: mercadona-neural-ocr-wave-1024-merged
          path: main
          github-token: ${{ github.token }}
          run-id: 33155099676
      - name: Download recovered shard 30
        uses: actions/download-artifact@v4
        with:
          name: mercadona-neural-ocr-wave-1024-recovery-30
          path: recovery-30
          github-token: ${{ github.token }}
          run-id: 33166509642
      - name: Download recovered shard 57
        uses: actions/download-artifact@v4
        with:
          name: mercadona-neural-ocr-wave-1024-recovery-57
          path: recovery-57
          github-token: ${{ github.token }}
          run-id: 33179357598
      - name: Download validated 512-wave baseline
        uses: actions/download-artifact@v4
        with:
          name: mercadona-neural-ocr-wave-512-merged
          path: prior-512
          github-token: ${{ github.token }}
          run-id: 33143994012
      - name: Merge recovered rows and enforce final contract
        run: |
          python - <<'PY'
          from collections import Counter
          import json, sqlite3
          from pathlib import Path

          def read_jsonl(path):
              p = Path(path)
              return [json.loads(line) for line in p.read_text(encoding='utf-8').splitlines() if line.strip()]

          main_rows = read_jsonl('main/results.jsonl')
          recovery_rows = read_jsonl('recovery-30/results-30.jsonl') + read_jsonl('recovery-57/results-57.jsonl')
          prior_rows = read_jsonl('prior-512/results.jsonl')

          rows_by_id = {}
          duplicate_conflicts = []
          for row in main_rows + recovery_rows:
              pid = str(row.get('product_id') or '')
              if not pid:
                  duplicate_conflicts.append('EMPTY_PRODUCT_ID')
                  continue
              prior = rows_by_id.get(pid)
              if prior is not None and prior != row:
                  duplicate_conflicts.append(pid)
              rows_by_id[pid] = row
          rows = list(rows_by_id.values())

          counts = Counter(row.get('status', 'UNKNOWN') for row in rows)
          declared = [row for row in rows if row.get('status') == 'DECLARED']
          invalid_declared = []
          provenance_errors = []
          for row in rows:
              pid = str(row.get('product_id') or '')
              if row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE':
                  provenance_errors.append(f'{pid}:evidence_level')
              if row.get('source') != 'MERCADONA_FIRST_PARTY' or row.get('source_record_kind') != 'label image':
                  provenance_errors.append(f'{pid}:source')
              if row.get('redistribution_allowed') is not False:
                  provenance_errors.append(f'{pid}:redistribution')
              if any(k in row for k in ('classified', 'menu_eligible', 'CLASSIFIED', 'MENU_ELIGIBLE')):
                  provenance_errors.append(f'{pid}:classification')

          for row in declared:
              attempts = row.get('attempts') or []
              accepted = next((a for a in attempts if (a.get('ensemble') or {}).get('status') == 'DECLARED'), None)
              ensemble = (accepted or {}).get('ensemble') or {}
              nutrition = row.get('nutrition') or {}
              required = ('calories', 'protein_g', 'carbohydrate_g', 'fat_g')
              if (
                  ensemble.get('independent_engine_families', 0) < 2
                  or ensemble.get('corroborated_fields', 0) < 4
                  or any(nutrition.get(field) is None for field in required)
              ):
                  invalid_declared.append(str(row.get('product_id') or ''))

          prior_by_id = {str(row.get('product_id') or ''): row for row in prior_rows}
          current_by_id = {str(row.get('product_id') or ''): row for row in rows}
          missing_prior_ids = sorted(set(prior_by_id) - set(current_by_id))
          status_changes = []
          declared_value_conflicts = []
          for pid, prior in prior_by_id.items():
              current = current_by_id.get(pid)
              if current is None:
                  continue
              if prior.get('status') != current.get('status'):
                  status_changes.append({'product_id': pid, 'prior': prior.get('status'), 'current': current.get('status')})
              if prior.get('status') == 'DECLARED' and current.get('status') == 'DECLARED' and prior.get('nutrition') != current.get('nutrition'):
                  declared_value_conflicts.append({'product_id': pid, 'prior': prior.get('nutrition'), 'current': current.get('nutrition')})

          new_rows = [row for row in rows if str(row.get('product_id') or '') not in prior_by_id]
          new_counts = Counter(row.get('status', 'UNKNOWN') for row in new_rows)
          expected = 1024
          summary = {
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'redistribution_allowed': False,
              'source_workflow_runs': {
                  'main_partial': 33155099676,
                  'recovery_shard_30': 33166509642,
                  'recovery_shard_57': 33179357598,
                  'baseline_512': 33143994012,
              },
              'inventory_products': 4280,
              'eligible_products': 2630,
              'sample_order': 'SHA256_PRODUCT_ID_EAN',
              'expected_sample': expected,
              'processed': len(rows),
              'status_counts': {
                  'DECLARED': counts.get('DECLARED', 0),
                  'REVIEW': counts.get('REVIEW', 0),
                  'NO_VISUAL_REGION': counts.get('NO_VISUAL_REGION', 0),
                  'ERROR': counts.get('ERROR', 0),
              },
              'declared_rate': round(len(declared) / len(rows), 4) if rows else 0.0,
              'usable_macro_counts': {
                  'calories': len(declared),
                  'protein_g': len(declared),
                  'carbohydrate_g': len(declared),
                  'fat_g': len(declared),
              },
              'declared_with_two_independent_engines_and_four_corroborated_fields': len(declared) - len(invalid_declared),
              'invalid_declared_product_ids': invalid_declared,
              'duplicate_conflicts': duplicate_conflicts,
              'provenance_errors': provenance_errors,
              'reproducibility_against_512_wave': {
                  'baseline_products': len(prior_rows),
                  'missing_prior_product_ids': missing_prior_ids,
                  'status_changes': status_changes,
                  'declared_value_conflicts': declared_value_conflicts,
              },
              'new_512_status_counts': {
                  'DECLARED': new_counts.get('DECLARED', 0),
                  'REVIEW': new_counts.get('REVIEW', 0),
                  'NO_VISUAL_REGION': new_counts.get('NO_VISUAL_REGION', 0),
                  'ERROR': new_counts.get('ERROR', 0),
              },
              'safety_assessment': 'VALIDATED_CONSERVATIVE_STABLE',
          }

          Path('final').mkdir(exist_ok=True)
          rows = sorted(rows, key=lambda r: str(r.get('product_id') or ''))
          Path('final/results.jsonl').write_text(''.join(json.dumps(r, ensure_ascii=False, sort_keys=True) + '\n' for r in rows), encoding='utf-8')
          Path('final/summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')

          db = sqlite3.connect('final/results.sqlite')
          db.execute('''CREATE TABLE ocr_results (
              product_id TEXT PRIMARY KEY,
              ean TEXT,
              name TEXT,
              brand TEXT,
              category_id TEXT,
              category_name TEXT,
              status TEXT NOT NULL,
              calories REAL,
              protein_g REAL,
              carbohydrate_g REAL,
              fat_g REAL,
              image_url TEXT,
              evidence_level TEXT NOT NULL,
              source TEXT NOT NULL,
              source_record_kind TEXT NOT NULL,
              redistribution_allowed INTEGER NOT NULL,
              json_payload TEXT NOT NULL
          )''')
          for row in rows:
              nutrition = row.get('nutrition') or {}
              db.execute('''INSERT INTO ocr_results VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)''', (
                  str(row.get('product_id') or ''), row.get('ean'), row.get('name'), row.get('brand'),
                  row.get('category_id'), row.get('category_name'), row.get('status'), nutrition.get('calories'),
                  nutrition.get('protein_g'), nutrition.get('carbohydrate_g'), nutrition.get('fat_g'), row.get('image_url'),
                  row.get('evidence_level'), row.get('source'), row.get('source_record_kind'),
                  0 if row.get('redistribution_allowed') is False else 1,
                  json.dumps(row, ensure_ascii=False, sort_keys=True),
              ))
          db.execute('CREATE INDEX idx_ocr_status ON ocr_results(status)')
          db.commit()
          db.close()

          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if len(main_rows) != 992:
              raise SystemExit(f'Unexpected main partial row count: {len(main_rows)}')
          if len(recovery_rows) != 32:
              raise SystemExit(f'Unexpected recovery row count: {len(recovery_rows)}')
          if len(rows) != expected:
              raise SystemExit(f'Incomplete recovered validation wave: processed={len(rows)} expected={expected}')
          if len(prior_rows) != 512:
              raise SystemExit(f'Invalid 512-wave baseline: rows={len(prior_rows)}')
          if duplicate_conflicts:
              raise SystemExit('Conflicting duplicate product ids: ' + ','.join(duplicate_conflicts[:20]))
          if missing_prior_ids:
              raise SystemExit('Recovered 1024 wave is not a strict superset of 512 baseline')
          if status_changes:
              raise SystemExit('OCR reproducibility regression on 512-wave overlap')
          if declared_value_conflicts:
              raise SystemExit('Conflicting DECLARED nutrition on 512-wave overlap')
          if provenance_errors:
              raise SystemExit('Provenance contract violated: ' + ','.join(provenance_errors[:20]))
          if invalid_declared:
              raise SystemExit('Unsafe DECLARED rows detected: ' + ','.join(invalid_declared[:20]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mercadona-neural-ocr-wave-1024-final
          path: final/
          retention-days: 30
          if-no-files-found: error
