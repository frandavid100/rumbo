name: Catalog Mercadona Tesseract two-family four-uncorroborated-core pilot

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-tesseract-two-family-four-uncorroborated-core-pilot.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-tesseract-two-family-four-uncorroborated-core-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download consolidated Mercadona first-party cut
        uses: actions/download-artifact@v4
        with:
          name: mercadona-first-party-final
          path: tools/catalog/mercadona-first-party-final
          repository: frandavid100/rumbo
          github-token: ${{ github.token }}
          run-id: 33046950149
      - name: Download persisted p9 replay evidence
        uses: actions/download-artifact@v4
        with:
          name: mercadona-ocr-replay-2630
          path: tools/catalog/mercadona-ocr-replay-2630
          repository: frandavid100/rumbo
          github-token: ${{ github.token }}
          run-id: 33331091953
      - name: Audit and build bounded full pilot input
        working-directory: tools/catalog
        run: |
          python audit_mercadona_p9_two_family_four_uncorroborated_core_candidates.py \
            --replay-results mercadona-ocr-replay-2630/results-replayed.jsonl \
            --out mercadona-p9-two-family-four-uncorroborated-core-audit
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          def key(row):
              pid = str(row.get('product_id') or '')
              ean = str(row.get('ean') or '')
              return hashlib.sha256(f'{pid}\0{ean}'.encode('utf-8')).hexdigest(), pid

          candidates = [
              json.loads(line)
              for line in Path(
                  'mercadona-p9-two-family-four-uncorroborated-core-audit/'
                  'two-family-four-uncorroborated-core-candidates.jsonl'
              ).read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          if len(candidates) != 3:
              raise SystemExit(f'expected 3 audited candidates, got {len(candidates)}')
          selected = sorted(candidates, key=key)
          selected_ids = [str(row['product_id']) for row in selected]
          expected = ['9887', '64436', '82735']
          if selected_ids != expected:
              raise SystemExit(f'deterministic pilot drift: {selected_ids}')
          if len(set(selected_ids)) != 3:
              raise SystemExit('selected product IDs are not unique')

          products = [
              json.loads(line)
              for line in Path('mercadona-first-party-final/products.jsonl')
              .read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          selected_set = set(selected_ids)
          by_id = {
              str(row.get('product_id') or ''): row
              for row in products
              if str(row.get('product_id') or '') in selected_set
          }
          output = [by_id[str(candidate['product_id'])] for candidate in selected if str(candidate['product_id']) in by_id]
          if len(output) != 3:
              raise SystemExit(f'pilot join mismatch selected=3 products={len(output)}')

          Path('two-family-four-uncorroborated-core-pilot-products.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in output),
              encoding='utf-8',
          )
          Path('two-family-four-uncorroborated-core-pilot-selection.json').write_text(
              json.dumps({
                  'candidate_universe': 3,
                  'candidate_policy': (
                      'stable p9 original+replay REVIEW + all 4 core values + explicit 100g/100ml basis '
                      '+ exactly 2 independent OCR families + zero corroborated core fields '
                      '+ exactly 4 uncorroborated core fields each observed by exactly 1 family '
                      '+ no hard conflict + no energy/macro mismatch'
                  ),
                  'sample_order': 'SHA256_PRODUCT_ID_EAN',
                  'selected': 3,
                  'remaining_after_pilot': 0,
                  'product_ids': selected_ids,
                  'uncorroborated_core_fields': {
                      str(row['product_id']): row['uncorroborated_core_fields'] for row in selected
                  },
                  'uncorroborated_source_families': {
                      str(row['product_id']): row['uncorroborated_source_families'] for row in selected
                  },
                  'source': 'MERCADONA_FIRST_PARTY/label image',
                  'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
                  'redistribution_allowed': False,
                  'images_persisted': False,
                  'CLASSIFIED': 0,
                  'MENU_ELIGIBLE': 0,
              }, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Install OCR engines
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow
      - name: Run routing and conservative OCR tests
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_audit_mercadona_p9_two_family_four_uncorroborated_core_candidates.py \
            test_label_easyocr_extractor.py \
            test_nutrition_label_reader.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_ocr_safety_regressions.py \
            test_mercadona_neural_ocr_tesseract_preprocess_rescue.py
          python -m py_compile \
            audit_mercadona_p9_two_family_four_uncorroborated_core_candidates.py \
            mercadona_neural_ocr_tesseract_preprocess_rescue.py
      - name: Run bounded full rescue pilot
        working-directory: tools/catalog
        run: |
          python mercadona_neural_ocr_tesseract_preprocess_rescue.py \
            --products two-family-four-uncorroborated-core-pilot-products.jsonl \
            --out mercadona-tesseract-two-family-four-uncorroborated-core-pilot \
            --shard-index 0 \
            --shard-count 1 \
            --limit 0 \
            --delay 0.5
      - name: Audit results and build staging
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          from collections import Counter
          import json, sqlite3
          from pathlib import Path

          FIELDS = ('calories', 'protein_g', 'carbohydrate_g', 'fat_g')
          ALLOWED = {'DECLARED', 'REVIEW', 'NO_VISUAL_REGION', 'ERROR'}

          def close(field, a, b):
              a, b = float(a), float(b)
              tolerance = (
                  max(5.0, .04 * max(abs(a), abs(b), 1.0))
                  if field == 'calories'
                  else max(.6, .10 * max(abs(a), abs(b), 1.0))
              )
              return abs(a - b) <= tolerance

          baseline_rows = [
              json.loads(line)
              for line in Path(
                  'mercadona-p9-two-family-four-uncorroborated-core-audit/'
                  'two-family-four-uncorroborated-core-candidates.jsonl'
              ).read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          if len(baseline_rows) != 3:
              raise SystemExit(f'expected 3 baseline candidates, got {len(baseline_rows)}')
          baseline = {str(row['product_id']): row for row in baseline_rows}
          expected_ids = set(baseline)
          selection = json.loads(Path('two-family-four-uncorroborated-core-pilot-selection.json').read_text(encoding='utf-8'))
          if set(selection.get('product_ids') or []) != expected_ids:
              raise SystemExit('pilot selection mismatch')

          result_path = Path('mercadona-tesseract-two-family-four-uncorroborated-core-pilot/results-00.jsonl')
          rows = [json.loads(line) for line in result_path.read_text(encoding='utf-8').splitlines() if line.strip()]
          ids = [str(row.get('product_id') or '') for row in rows]
          observed = set(ids)
          counts = Counter(str(row.get('status') or 'UNKNOWN') for row in rows)
          duplicates = sorted(pid for pid, count in Counter(ids).items() if count > 1)
          missing = sorted(expected_ids - observed)
          unexpected = sorted(observed - expected_ids)
          bad_status = sorted(set(counts) - ALLOWED)
          provenance, unsafe, conflicts, safe = [], [], [], []

          image_suffixes = {'.png', '.jpg', '.jpeg', '.webp', '.bmp', '.tif', '.tiff'}
          persisted_images = sorted(
              str(path)
              for path in Path('mercadona-tesseract-two-family-four-uncorroborated-core-pilot').rglob('*')
              if path.is_file() and path.suffix.lower() in image_suffixes
          )

          for row in rows:
              pid = str(row.get('product_id') or '')
              prior = baseline.get(pid)
              if prior is None:
                  provenance.append(f'{pid}:not_in_baseline')
                  continue
              if (
                  row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE'
                  or row.get('source') != 'MERCADONA_FIRST_PARTY'
                  or row.get('source_record_kind') != 'label image'
                  or row.get('redistribution_allowed') is not False
                  or str(row.get('perspective')) != '9'
              ):
                  provenance.append(f'{pid}:provenance')
              if row.get('status') != 'DECLARED':
                  continue

              accepted = next(
                  (
                      attempt
                      for attempt in row.get('attempts') or []
                      if (attempt.get('ensemble') or {}).get('status') == 'DECLARED'
                  ),
                  None,
              )
              ensemble = (accepted or {}).get('ensemble') or {}
              nutrition = row.get('nutrition') or {}
              reasons = [str(reason) for reason in (ensemble.get('reasons') or [])]
              hard_reason = any(
                  reason.startswith('OCR_FIELD_CONFLICT')
                  or reason.startswith('OCR_SAME_ENGINE_CONFLICT')
                  or reason == 'OCR_BASIS_CONFLICT'
                  or reason.startswith('ENERGY_MACRO_MISMATCH')
                  for reason in reasons
              )
              if (
                  int(ensemble.get('independent_engine_families') or 0) < 2
                  or int(ensemble.get('corroborated_fields') or 0) < 4
                  or any(nutrition.get(field) is None for field in FIELDS)
                  or hard_reason
              ):
                  unsafe.append(pid)
                  continue

              bad = []
              if row.get('basis') != prior.get('basis'):
                  bad.append(f"basis:{prior.get('basis')}!={row.get('basis')}")
              prior_nutrition = prior.get('nutrition') or {}
              for field in FIELDS:
                  if prior_nutrition.get(field) is None or not close(field, nutrition[field], prior_nutrition[field]):
                      bad.append(f"{field}:{prior_nutrition.get(field)}!~{nutrition[field]}")
              if bad:
                  conflicts.append({'product_id': pid, 'conflicts': bad})
                  continue

              safe.append({
                  'product_id': pid,
                  'ean': row.get('ean'),
                  'name': row.get('name'),
                  'basis': row.get('basis'),
                  'nutrition': {field: nutrition[field] for field in FIELDS},
                  'independent_engine_families': ensemble.get('independent_engine_families'),
                  'corroborated_fields': ensemble.get('corroborated_fields'),
                  'source': 'MERCADONA_FIRST_PARTY/label image',
                  'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
                  'redistribution_allowed': False,
                  'CLASSIFIED': 0,
                  'MENU_ELIGIBLE': 0,
              })

          ok = (
              len(rows) == 3
              and len(observed) == 3
              and not duplicates
              and not missing
              and not unexpected
              and not provenance
              and not unsafe
              and not conflicts
              and not bad_status
              and not persisted_images
          )
          declared = len(safe)
          cumulative_declared = 261 + declared
          cumulative_review = 2682 - declared
          out = Path('mercadona-tesseract-two-family-four-uncorroborated-core-pilot-audited')
          out.mkdir(parents=True, exist_ok=True)

          summary = {
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'redistribution_allowed': False,
              'candidate_universe': 3,
              'selected': 3,
              'processed': len(rows),
              'distinct_products_processed': len(observed),
              'remaining_candidates': 0,
              'status_counts': dict(sorted(counts.items())),
              'safe_promotion_products': declared,
              'safe_promotion_product_ids': sorted(item['product_id'] for item in safe),
              'front_after_pilot': {
                  'universe': 3,
                  'processed_total': 3,
                  'DECLARED_total': declared,
                  'REVIEW_or_other_total': 3 - declared,
                  'promotion_rate_pct': round(100.0 * declared / 3, 4),
                  'status': 'closed',
              },
              'value_conflicts': conflicts,
              'unsafe_declared': unsafe,
              'duplicate_product_ids': duplicates,
              'missing_product_ids': missing,
              'unexpected_product_ids': unexpected,
              'unexpected_statuses': bad_status,
              'provenance_errors': provenance,
              'persisted_images': persisted_images,
              'images_persisted': bool(persisted_images),
              'missing_values_inferred': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
              'cumulative_after_pilot': {
                  'catalog_total': 4280,
                  'processed': 2943,
                  'DECLARED_complete': cumulative_declared,
                  'REVIEW': cumulative_review,
                  'complete_usable_coverage_pct': round(100.0 * cumulative_declared / 4280, 4),
                  'processed_coverage_pct': round(100.0 * 2943 / 4280, 4),
              },
              'safety_assessment': 'VALIDATED' if ok else 'FAILED',
          }
          (out / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (out / 'safe-promotions.json').write_text(json.dumps(safe, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (out / 'results.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in rows),
              encoding='utf-8',
          )
          (out / 'selection.json').write_text(
              json.dumps(selection, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          staging_rows = []
          for item in safe:
              staging_rows.append({
                  'product_id': item['product_id'],
                  'ean': item['ean'],
                  'name': item['name'],
                  'basis': item['basis'],
                  'nutrition': item['nutrition'],
                  'independent_engine_families': item['independent_engine_families'],
                  'corroborated_fields': item['corroborated_fields'],
                  'source': item['source'],
                  'evidence_level': item['evidence_level'],
                  'redistribution_allowed': False,
                  'CLASSIFIED': 0,
                  'MENU_ELIGIBLE': 0,
              })
          (out / 'staging.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in staging_rows),
              encoding='utf-8',
          )
          db = sqlite3.connect(out / 'staging.sqlite')
          db.execute('''
              CREATE TABLE nutrition_staging (
                  product_id TEXT PRIMARY KEY,
                  ean TEXT,
                  name TEXT,
                  basis TEXT NOT NULL,
                  calories REAL NOT NULL,
                  protein_g REAL NOT NULL,
                  carbohydrate_g REAL NOT NULL,
                  fat_g REAL NOT NULL,
                  independent_engine_families INTEGER NOT NULL,
                  corroborated_fields INTEGER NOT NULL,
                  source TEXT NOT NULL,
                  evidence_level TEXT NOT NULL,
                  redistribution_allowed INTEGER NOT NULL,
                  CLASSIFIED INTEGER NOT NULL,
                  MENU_ELIGIBLE INTEGER NOT NULL
              )
          ''')
          for item in staging_rows:
              nutrition = item['nutrition']
              db.execute(
                  'INSERT INTO nutrition_staging VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)',
                  (
                      item['product_id'], item['ean'], item['name'], item['basis'],
                      nutrition['calories'], nutrition['protein_g'], nutrition['carbohydrate_g'], nutrition['fat_g'],
                      item['independent_engine_families'], item['corroborated_fields'], item['source'],
                      item['evidence_level'], 0, 0, 0,
                  ),
              )
          db.commit()
          db.close()

          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if not ok:
              raise SystemExit('Mercadona four-uncorroborated-core pilot failed safety audit')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-tesseract-two-family-four-uncorroborated-core-pilot
          path: |
            tools/catalog/mercadona-tesseract-two-family-four-uncorroborated-core-pilot-audited/
          retention-days: 30
          if-no-files-found: warn
