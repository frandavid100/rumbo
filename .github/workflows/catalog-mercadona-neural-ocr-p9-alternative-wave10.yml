name: Catalog Mercadona neural OCR p9 alternative wave 10

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-neural-ocr-p9-alternative-wave10.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-neural-ocr-p9-alternative-wave10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        perspective: [1, 2]
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download consolidated Mercadona first-party cut
        uses: actions/download-artifact@v4
        with:
          name: mercadona-first-party-final
          path: tools/catalog/mercadona-first-party-final
          github-token: ${{ github.token }}
          run-id: 33046950149
      - name: Download current persisted p9 replay evidence
        uses: actions/download-artifact@v4
        with:
          name: mercadona-ocr-replay-2630
          path: tools/catalog/mercadona-ocr-replay-2630
          github-token: ${{ github.token }}
          run-id: 33331091953
      - name: Install independent OCR engines and visual detector dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow
      - name: Run conservative OCR regression tests
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_mercadona_ocr_image_candidates.py \
            test_label_easyocr_extractor.py \
            test_nutrition_label_reader.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_ocr_safety_regressions.py \
            test_merge_mercadona_p9_alternative_wave.py
          python -m py_compile mercadona_neural_ocr_p9_alternative.py merge_mercadona_p9_alternative_wave.py
      - name: OCR deterministic still-REVIEW alternative-view positions 129-160
        working-directory: tools/catalog
        run: |
          python mercadona_neural_ocr_p9_alternative.py \
            --products mercadona-first-party-final/products.jsonl \
            --p9-replay-results mercadona-ocr-replay-2630/results-replayed.jsonl \
            --out mercadona-neural-ocr-p9-alternative-wave10 \
            --required-perspective ${{ matrix.perspective }} \
            --shard-index 0 \
            --shard-count 1 \
            --skip-first 128 \
            --limit 32
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-neural-ocr-p9-alternative-wave10-p${{ matrix.perspective }}
          path: tools/catalog/mercadona-neural-ocr-p9-alternative-wave10/
          retention-days: 30
          if-no-files-found: warn

  merge:
    runs-on: ubuntu-24.04
    needs: ocr
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/download-artifact@v4
        with:
          pattern: mercadona-neural-ocr-p9-alternative-wave10-p*
          path: input
          merge-multiple: true
      - name: Merge and conservatively audit wave
        run: |
          python tools/catalog/merge_mercadona_p9_alternative_wave.py \
            --input input \
            --out merged \
            --skip-first 128 \
            --limit 32 \
            --previous-completed 1-128
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-neural-ocr-p9-alternative-wave10-merged
          path: merged/
          retention-days: 30
          if-no-files-found: error
