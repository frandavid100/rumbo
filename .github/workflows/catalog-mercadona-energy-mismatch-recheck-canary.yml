name: Catalog Mercadona energy-mismatch recheck canary

on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-energy-mismatch-recheck-canary.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-energy-mismatch-recheck-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve latest successful canonical OCR audit
        id: canonical-audit
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            '/repos/frandavid100/rumbo/actions/workflows/catalog-mercadona-current-ocr-residual-audit-efficient.yml/runs?branch=agent%2Fcatalog-phase1&per_page=20' \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id')
          test "$run_id" != "null"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download latest canonical OCR audit
        uses: actions/download-artifact@v4
        with:
          name: mercadona-current-ocr-residual-audit-efficient
          path: tools/catalog/mercadona-current-ocr-residual-audit
          github-token: ${{ github.token }}
          run-id: ${{ steps.canonical-audit.outputs.run_id }}
      - name: Build fresh exact-current recheck cut
        env:
          AUTHORITATIVE_AUDIT_RUN: ${{ steps.canonical-audit.outputs.run_id }}
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json, os, time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlparse
          from urllib.request import Request, urlopen

          base = Path('mercadona-current-ocr-residual-audit')
          summary = json.loads((base / 'summary.json').read_text(encoding='utf-8'))
          blocked_path = base / 'current-review-failure-modes' / 'complete-but-safety-blocked.jsonl'
          blocked = [json.loads(line) for line in blocked_path.read_text(encoding='utf-8').splitlines() if line.strip()]
          if int(summary.get('inventory_products', -1)) != 4280 or summary.get('historical_membership_parity_verifiable') is not True:
              raise SystemExit('Authoritative audit invariants failed')

          # This lane deliberately excludes ambiguous/multiple-column, hard-conflict
          # and bounded-value cases. Historical OCR values are selection metadata
          # only and are never passed into the fresh extractor.
          source_rows = [
              row for row in blocked
              if row.get('safety_blockers') == ['ENERGY_MACRO_INCOHERENCE']
              and not row.get('missing_core_fields')
              and row.get('evidence_level') == 'OCR_DERIVED_FROM_MERCADONA_IMAGE'
              and row.get('source') == 'MERCADONA_FIRST_PARTY'
              and row.get('source_record_kind') == 'label image'
              and row.get('redistribution_allowed') is False
          ]

          def scalar(value):
              if isinstance(value, (str, int, float)):
                  value = str(value).strip()
                  return value or None
              return None

          def values(obj, key):
              if isinstance(obj, dict):
                  if key in obj:
                      yield obj[key]
                  for value in obj.values():
                      yield from values(value, key)
              elif isinstance(obj, list):
                  for value in obj:
                      yield from values(value, key)

          def first_scalar(payload, keys):
              for key in keys:
                  value = scalar(payload.get(key)) if isinstance(payload, dict) else None
                  if value:
                      return value
              for key in keys:
                  for value in values(payload, key):
                      value = scalar(value)
                      if value:
                          return value
              return None

          def first_truthy(payload, key):
              if isinstance(payload, dict) and payload.get(key):
                  return payload[key]
              for value in values(payload, key):
                  if value:
                      return value
              return None

          def p9s(payload):
              hits = {}
              for photos in values(payload, 'photos'):
                  if not isinstance(photos, list):
                      continue
                  for photo in photos:
                      if not isinstance(photo, dict) or str(photo.get('perspective')) != '9':
                          continue
                      url = scalar(photo.get('zoom')) or scalar(photo.get('regular')) or scalar(photo.get('url'))
                      if not url:
                          continue
                      host = (urlparse(url).hostname or '').lower()
                      if host != 'prod-mercadona.imgix.net' and not host.endswith('.mercadona.es'):
                          continue
                      copied = dict(photo)
                      copied['perspective'] = 9
                      copied['zoom'] = url
                      hits[url] = copied
              return list(hits.values())

          def fetch(pid):
              errors = []
              for url in (
                  f'https://tienda.mercadona.es/api/v1_1/products/{pid}?lang=es&wh=vlc1',
                  f'https://tienda.mercadona.es/api/v1_1/products/{pid}',
              ):
                  req = Request(url, headers={
                      'Accept': 'application/json',
                      'User-Agent': 'Mozilla/5.0 (compatible; rumbo-catalog-audit/1.0)',
                      'Referer': 'https://tienda.mercadona.es/',
                  })
                  try:
                      with urlopen(req, timeout=20) as response:
                          return json.load(response), url, None
                  except HTTPError as exc:
                      errors.append(f'{url}:HTTP_{exc.code}')
                  except (URLError, TimeoutError, json.JSONDecodeError) as exc:
                      errors.append(f'{url}:{type(exc).__name__}:{exc}')
                  time.sleep(0.25)
              return None, None, ';'.join(errors)

          observed_at = datetime.now(timezone.utc).isoformat()
          candidates, statuses = [], []
          for audit in sorted(source_rows, key=lambda row: str(row.get('product_id') or '')):
              pid = str(audit.get('product_id') or '').strip()
              status = {
                  'product_id': pid,
                  'name': audit.get('name'),
                  'audit_ean': str(audit.get('ean') or ''),
                  'audit_safety_blockers': audit.get('safety_blockers'),
                  'eligible': False,
              }
              payload, api_url, error = fetch(pid)
              status['live_api_url'] = api_url
              if payload is None:
                  status['skip_reason'] = error or 'LIVE_API_UNAVAILABLE'
                  statuses.append(status)
                  continue
              live_id = first_scalar(payload, ('id', 'product_id'))
              live_ean = first_scalar(payload, ('ean',))
              status['live_ean'] = live_ean
              if live_id != pid:
                  status['skip_reason'] = f'IDENTITY_MISMATCH:{live_id}'
                  statuses.append(status)
                  continue
              if not live_ean or (status['audit_ean'] and live_ean != status['audit_ean']):
                  status['skip_reason'] = f'EAN_MISSING_OR_CHANGED:{live_ean}'
                  statuses.append(status)
                  continue
              ingredients = first_truthy(payload, 'ingredients')
              status['has_live_structured_ingredients'] = bool(ingredients)
              if not ingredients:
                  status['skip_reason'] = 'NO_LIVE_STRUCTURED_INGREDIENTS_USE_SEPARATE_ROUTE'
                  statuses.append(status)
                  continue
              hits = p9s(payload)
              status['live_p9_count'] = len(hits)
              if len(hits) != 1:
                  status['skip_reason'] = f'LIVE_P9_COUNT:{len(hits)}'
                  statuses.append(status)
                  continue
              p9 = hits[0]
              status['live_p9_url'] = p9['zoom']
              status['p9_changed_since_audit'] = p9['zoom'] != audit.get('image_url')
              name = first_scalar(payload, ('display_name', 'name')) or str(audit.get('name') or pid)
              candidates.append({
                  'product_id': pid,
                  'id': pid,
                  'ean': live_ean,
                  'name': name,
                  'display_name': name,
                  'brand': first_scalar(payload, ('brand',)),
                  'ingredients': ingredients,
                  'photos': [p9],
                  'share_url': first_scalar(payload, ('share_url',)),
                  'observed_at': observed_at,
                  'live_api_url': api_url,
                  'rescue_origin': 'COMPLETE_ENERGY_MISMATCH_ONLY_FRESH_RECHECK',
                  'historical_nutrition_values_reused': False,
                  'missing_values_inferred': False,
              })
              status['eligible'] = True
              status['skip_reason'] = None
              statuses.append(status)

          out = Path('mercadona-energy-mismatch-recheck-canary')
          out.mkdir(parents=True, exist_ok=True)
          Path('mercadona-energy-mismatch-recheck-candidates.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in candidates),
              encoding='utf-8',
          )
          (out / 'live-candidate-status.json').write_text(json.dumps({
              'authoritative_audit_run': int(os.environ['AUTHORITATIVE_AUDIT_RUN']),
              'complete_energy_mismatch_only_candidates': len(source_rows),
              'live_eligible_candidates': len(candidates),
              'candidates': statuses,
              'historical_nutrition_values_reused': False,
              'missing_values_inferred': False,
              'image_bytes_persisted': False,
              'redistribution_allowed': False,
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({'source_rows': len(source_rows), 'eligible': len(candidates)}, sort_keys=True))
          if not candidates:
              raise SystemExit('No exact-current structured-ingredients P9 candidates remain')
          PY
      - name: Install OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow
      - name: Run conservative OCR regressions
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_nutrition_label_reader.py \
            test_nutrition_label_reader_ocr_typos.py \
            test_nutrition_label_reader_row_tokens.py \
            test_nutrition_label_reader_basis_precedence.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_nutrition_label_manufacturer_interleave.py \
            test_mercadona_shifted_subrow_guard.py \
            test_mercadona_ocr_safety_regressions.py
      - name: Run exact-current fresh OCR recheck
        working-directory: tools/catalog
        run: |
          python mercadona_neural_ocr_wave.py \
            --products mercadona-energy-mismatch-recheck-candidates.jsonl \
            --out mercadona-energy-mismatch-recheck-canary \
            --shard-index 0 \
            --shard-count 1 \
            --limit 8 \
            --eligibility-mode priority
      - name: Enforce safety invariants and write summary
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('mercadona-energy-mismatch-recheck-canary/results-00.jsonl')
          rows = [json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
          declared, unsafe = [], []
          for row in rows:
              pid = str(row.get('product_id') or '')
              if (
                  row.get('source') != 'MERCADONA_FIRST_PARTY'
                  or row.get('source_record_kind') != 'label image'
                  or row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE'
                  or row.get('redistribution_allowed') is not False
              ):
                  unsafe.append(f'{pid}:PROVENANCE')
              if row.get('classified') is True or row.get('CLASSIFIED') is True or row.get('menu_eligible') is True or row.get('MENU_ELIGIBLE') is True:
                  unsafe.append(f'{pid}:SEMANTIC_FLAG')
              if row.get('status') == 'DECLARED':
                  accepted = next((a for a in row.get('attempts') or [] if (a.get('ensemble') or {}).get('status') == 'DECLARED'), None)
                  ensemble = (accepted or {}).get('ensemble') or {}
                  if ensemble.get('independent_engine_families', 0) < 2 or ensemble.get('corroborated_fields', 0) < 4:
                      unsafe.append(f'{pid}:CORROBORATION')
                  reasons = [str(reason) for reason in ensemble.get('reasons') or []]
                  if any(reason.startswith(('OCR_FIELD_CONFLICT', 'OCR_SAME_ENGINE_CONFLICT', 'OCR_BASIS_CONFLICT', 'ENERGY_MACRO_MISMATCH', 'MULTIPLE_NUTRITION_COLUMNS', 'OCR_BOUNDED_CORE_VALUE')) for reason in reasons):
                      unsafe.append(f'{pid}:BLOCKER_PRESENT')
                  declared.append(pid)

          summary = {
              'processed': len(rows),
              'status_counts': {
                  status: sum(1 for row in rows if row.get('status') == status)
                  for status in ('DECLARED', 'REVIEW', 'NO_VISUAL_REGION', 'ERROR')
              },
              'declared_product_ids': declared,
              'unsafe': unsafe,
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'historical_nutrition_values_reused': False,
              'missing_values_inferred': False,
              'image_bytes_persisted': False,
              'redistribution_allowed': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          Path('mercadona-energy-mismatch-recheck-canary/final-summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if unsafe:
              raise SystemExit('Canary safety invariant failed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-energy-mismatch-recheck-canary
          path: tools/catalog/mercadona-energy-mismatch-recheck-canary/
          retention-days: 30
          if-no-files-found: warn
