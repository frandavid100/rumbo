name: Catalog Mercadona neural OCR audited promotions

# End-to-end verification for the six independently audited replay promotions
# that are outside the deterministic 512-product rerun sample. The two audited
# promotions inside that sample (34194, 63114) already reproduced end-to-end.
on:
  push:
    branches: [agent/catalog-phase1]
    paths:
      - '.github/workflows/catalog-mercadona-neural-ocr-audited-promotions.yml'
      - 'tools/catalog/nutrition_ocr_ensemble.py'
      - 'tools/catalog/mercadona_neural_ocr_wave.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: catalog-mercadona-neural-ocr-audited-promotions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download consolidated Mercadona first-party cut
        uses: actions/download-artifact@v4
        with:
          name: mercadona-first-party-final
          path: tools/catalog/mercadona-first-party-final
          github-token: ${{ github.token }}
          run-id: 33046950149
      - name: Install independent OCR engines and visual detector dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          python -m pip install --disable-pip-version-check paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install --disable-pip-version-check 'paddleocr>=3.7,<3.8' 'easyocr>=1.7,<1.8' opencv-python-headless Pillow
      - name: Run conservative OCR regression tests
        working-directory: tools/catalog
        run: |
          python -m unittest -v \
            test_label_easyocr_extractor.py \
            test_nutrition_label_reader.py \
            test_nutrition_ocr_ensemble.py \
            test_mercadona_label_pipeline.py \
            test_mercadona_ocr_safety_regressions.py
      - name: Select the six audited promotions outside the 512 sample
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          wanted = {'13025', '13568', '33640', '60690', '69757', '86835'}
          source = Path('mercadona-first-party-final/products.jsonl')
          rows = [
              json.loads(line)
              for line in source.read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          selected = [row for row in rows if str(row.get('product_id') or '') in wanted]
          found = {str(row.get('product_id') or '') for row in selected}
          if found != wanted:
              raise SystemExit(f'Missing audited product ids: {sorted(wanted - found)}')
          Path('mercadona-audited-promotions-products.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n' for row in selected),
              encoding='utf-8',
          )
          print('selected', sorted(found))
          PY
      - name: Re-run neural OCR end-to-end on the six products
        working-directory: tools/catalog
        run: |
          python mercadona_neural_ocr_wave.py \
            --products mercadona-audited-promotions-products.jsonl \
            --out mercadona-neural-ocr-audited-promotions \
            --shard-index 0 \
            --shard-count 1 \
            --limit 0
      - name: Enforce safety and write verification summary
        working-directory: tools/catalog
        run: |
          python - <<'PY'
          from collections import Counter
          import json
          from pathlib import Path

          out = Path('mercadona-neural-ocr-audited-promotions')
          result_paths = sorted(out.glob('results-*.jsonl'))
          rows = []
          for path in result_paths:
              rows.extend(
                  json.loads(line)
                  for line in path.read_text(encoding='utf-8').splitlines()
                  if line.strip()
              )
          expected = {'13025', '13568', '33640', '60690', '69757', '86835'}
          actual = {str(row.get('product_id') or '') for row in rows}
          if actual != expected:
              raise SystemExit(f'Unexpected product universe: actual={sorted(actual)} expected={sorted(expected)}')

          unsafe = []
          provenance_errors = []
          for row in rows:
              pid = str(row.get('product_id') or '')
              if row.get('evidence_level') != 'OCR_DERIVED_FROM_MERCADONA_IMAGE':
                  provenance_errors.append(f'{pid}:evidence_level')
              if row.get('source') != 'MERCADONA_FIRST_PARTY' or row.get('source_record_kind') != 'label image':
                  provenance_errors.append(f'{pid}:source')
              if row.get('redistribution_allowed') is not False:
                  provenance_errors.append(f'{pid}:redistribution')
              if 'classified' in row or 'menu_eligible' in row or 'CLASSIFIED' in row or 'MENU_ELIGIBLE' in row:
                  provenance_errors.append(f'{pid}:classification')
              if row.get('status') == 'DECLARED':
                  attempts = row.get('attempts') or []
                  accepted = next((a for a in attempts if (a.get('ensemble') or {}).get('status') == 'DECLARED'), None)
                  ensemble = (accepted or {}).get('ensemble') or {}
                  nutrition = row.get('nutrition') or {}
                  required = ('calories', 'protein_g', 'carbohydrate_g', 'fat_g')
                  if (
                      ensemble.get('independent_engine_families', 0) < 2
                      or ensemble.get('corroborated_fields', 0) < 4
                      or any(nutrition.get(field) is None for field in required)
                  ):
                      unsafe.append(pid)

          if provenance_errors:
              raise SystemExit('Provenance contract violated: ' + ','.join(provenance_errors))
          if unsafe:
              raise SystemExit('Unsafe DECLARED rows detected: ' + ','.join(unsafe))

          counts = Counter(row.get('status', 'UNKNOWN') for row in rows)
          summary = {
              'mode': 'END_TO_END_VERIFICATION_OF_SIX_AUDITED_REPLAY_PROMOTIONS_OUTSIDE_512_SAMPLE',
              'processed': len(rows),
              'status_counts': dict(sorted(counts.items())),
              'product_statuses': {
                  str(row.get('product_id')): row.get('status')
                  for row in sorted(rows, key=lambda row: str(row.get('product_id') or ''))
              },
              'declared_nutrition': {
                  str(row.get('product_id')): row.get('nutrition')
                  for row in rows
                  if row.get('status') == 'DECLARED'
              },
              'unsafe_declared': unsafe,
              'provenance_errors': provenance_errors,
              'evidence_level': 'OCR_DERIVED_FROM_MERCADONA_IMAGE',
              'source': 'MERCADONA_FIRST_PARTY/label image',
              'redistribution_allowed': False,
              'images_persisted': False,
              'CLASSIFIED': 0,
              'MENU_ELIGIBLE': 0,
          }
          Path('mercadona-audited-promotions-verification-summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True),
              encoding='utf-8',
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercadona-neural-ocr-audited-promotions
          path: |
            tools/catalog/mercadona-neural-ocr-audited-promotions/
            tools/catalog/mercadona-audited-promotions-verification-summary.json
          retention-days: 30
          if-no-files-found: warn
